/* ===== main.css - Entry Point ===== */
/* This file imports all modular CSS components */
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 2rem;
  position: relative;
  z-index: 10;
}

.logo {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #fff;
}

.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: rgba(255,255,255,0.15); }
.btn:active { transform: scale(0.96); }
.btn-small { padding: 0.3rem 0.6rem; font-size: 0.85rem; }
.btn-primary {
  background: rgba(70,130,255,0.3);
  border-color: rgba(70,130,255,0.5);
  font-size: 1rem;
  padding: 0.6rem 1.2rem;
}

.location-display {
  margin-left: auto;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.6);
}

#refresh-btn.spinning {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Game toggle button */
#game-btn {
  background: rgba(100, 200, 100, 0.1);
  border-color: rgba(100, 200, 100, 0.2);
}

#game-btn:hover {
  background: rgba(100, 200, 100, 0.2);
}

#game-btn.active {
  background: rgba(100, 200, 100, 0.25);
  border-color: rgba(100, 200, 100, 0.4);
  box-shadow: 0 0 8px rgba(100, 200, 100, 0.2);
}
/* ===== CITY GRID ===== */
.city-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(280px, 1fr));
  gap: 1rem;
  padding: 1rem 2rem 2rem;
  position: relative;
  z-index: 1;
}

@media (max-width: 1400px) {
  .city-grid { grid-template-columns: repeat(3, minmax(280px, 1fr)); }
}
@media (max-width: 900px) {
  .city-grid { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
}
@media (max-width: 600px) {
  .city-grid { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; }
}/* ===== CITY CARD ===== */
.city-card {
  position: relative;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 1.2rem;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
  animation: fadeInUp 0.6s ease forwards;
  opacity: 0;
}
.city-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.city-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.4;
  transition: opacity 2s;
  z-index: -1;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}/* ===== CARD HEADER ===== */
.city-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.4rem;
  position: relative;
}
.city-name-wrap {
  display: flex;
  flex-direction: column;
  gap: 0;
  align-items: flex-end;
}
.city-name {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;
}
.city-state {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
  font-weight: 400;
  letter-spacing: 0.02em;
  text-align: right;
}
.city-meta {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.45);
}
.current-temp-inline {
  font-size: 2.4rem;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  z-index: 1;
}
.current-weather-icon-inline {
  width: 80px;
  height: 80px;
  position: absolute;
  top: -50%;
  left: 100%;
  transform: translate(-50%, -50%);
  opacity: 0.5;
  pointer-events: none;
  z-index: 0;
}

.current-weather {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 0.8rem;
}
.weather-icon {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}
.current-temp {
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1;
}
.current-weather-meta {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.55);
}/* Details row: HIGH / LOW / ☀️ / 🌙 */
.info-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.8rem;
  padding: 0.45rem 0.6rem;
  background: rgba(0,0,0,0.12);
  border-radius: 10px;
}
.info-item {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.info-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.4);
}
.info-val {
  font-size: 1.05rem;
  font-weight: 700;
}
.info-val.hot { color: #ff8c42; }
.info-val.cool { color: #6cb4ee; }

/* Details Grid */
.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
  padding: 0.6rem;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
}
.detail-cell {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.detail-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
}
.detail-value {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.aqi-badge {
  display: inline-block;
  padding: 0.1rem 0.3rem;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
}
.aqi-good { background: rgba(76,175,80,0.3); color: #81c784; }
.aqi-moderate { background: rgba(255,193,7,0.3); color: #ffd54f; }
.aqi-unhealthy { background: rgba(244,67,54,0.3); color: #e57373; }

/* High/Low + Sun */
.high-low-section {
  margin-bottom: 0.8rem;
  padding: 0.5rem;
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
}
.high-low-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.3rem;
}
.high-label { color: #ff8c42; font-weight: 700; }
.low-label  { color: #6cb4ee; font-weight: 700; }
.high-val, .low-val { font-weight: 700; }
.sun-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.55);
}/* Hourly Forecast */
.hourly-section {
  margin-bottom: 0.8rem;
}
.hourly-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.4rem;
}
.hourly-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(6, auto);
  gap: 0.3rem;
}
.hour-slot {
  text-align: center;
  padding: 0.4rem 0.3rem;
  border-radius: 8px;
  background: rgba(0,0,0,0.15);
  border: 1px solid transparent;
  transition: border-color 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hour-slot.current {
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08);
}
.hour-time {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.1rem;
}
.hour-icon {

}

}/* Canvas Charts */

}
.chart-title {

}
.chart-stats-row .stat {

  text-align: center;
  display: flex;
  flex-direction: column;

}
.chart-stats-row .stat-label {

.chart-stats-row .stat-val {

/* Overlaid charts container */
.overlaid-charts {

}

/* Charts group below header */

}
.chart-row {

.chart-row-title {

/* Combined chart */

.combined-chart-stats .stat-label {

/* City compass row */
.city-compass-row {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
}/* ===== SVG WEATHER ICONS - LOUD & ANIMATED ===== */
.weather-svg {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.weather-svg .sun { stroke: #ffd54f; fill: #ffd54f; }
.weather-svg .moon { stroke: #e0e0e0; fill: #e0e0e0; }
.weather-svg .cloud { stroke: #b0bec5; fill: rgba(176,190,197,0.3); }
.weather-svg .rain { stroke: #64b5f6; fill: none; }
.weather-svg .snow { stroke: #e0e0e0; fill: none; }

/* Icon animation classes */
.weather-icon-animated {
  overflow: visible;
}

/* Sun: rotating rays + pulsing glow */
.weather-icon-sun .icon-glow {
  transform-origin: 32px 32px;
}
.weather-icon-sun .icon-rotate {
  transform-origin: 32px 32px;
  animation: icon-rotate 20s linear infinite;
}

@keyframes icon-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Moon: bobbing + twinkling stars */
.weather-icon-moon .icon-bob {
  animation: icon-bob 4s ease-in-out infinite;
}

@keyframes icon-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Cloud: drifting */
.weather-icon-cloud .icon-drift,
.weather-icon-cloud-sun .icon-drift,
.weather-icon-rain .icon-drift,
.weather-icon-snow .icon-drift,
.weather-icon-fog .icon-drift {
  animation: icon-drift 3s ease-in-out infinite;
}

@keyframes icon-drift {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(2px); }
}

/* Thunderstorm: shaking + lightning flash */
.weather-icon-thunder .icon-shake {
  animation: icon-shake 2s ease-in-out infinite;
}

@keyframes icon-shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  10% { transform: translateX(-1px) rotate(-1deg); }
  20% { transform: translateX(1px) rotate(1deg); }
  30% { transform: translateX(0); }
  40% { transform: translateX(-1px) rotate(-0.5deg); }
  50% { transform: translateX(0); }
}

.weather-icon-animated .icon-bolt {
  animation: icon-flash 2s ease-in-out infinite;
}

@keyframes icon-flash {
  0%, 100% { opacity: 1; }
  48% { opacity: 1; }
  50% { opacity: 0.3; }
  52% { opacity: 1; }
  70% { opacity: 1; }
  72% { opacity: 0.4; }
  74% { opacity: 1; }
}

/* Compass heading */
.compass-heading {
  display: inline-block;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.6);
  white-space: nowrap;
}

/* ===== WIND COMPASS ===== */
.wind-compass {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.wind-compass .compass-dial {

  width: 20px;
  height: 20px;

}
.wind-compass .compass-dial svg {
  width: 20px;
  height: 20px;
  display: block;
}
.wind-compass .compass-needle {
  transform-origin: 10px 10px;
  animation: needle-pulse 2s ease-in-out infinite;
}
@keyframes needle-pulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}/* ===== MODAL ===== */
.modal-overlay {

}

/* ===== LOADING ===== */
.loading-state {

}/* ===== FAVORITES ===== */

.fav-dropdown-search {

.fav-section-title {

.fav-dropdown-settings {

.fav-dropdown-settings .setting-val {

}/* ===== NETWORK OUTAGE PANEL ===== */
.outage-panel {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 180;
  display: block;
  background: none;
  backdrop-filter: none;
  opacity: 0;
  pointer-events: none;
  bottom: 20px;
  top: auto;
  transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1), top 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

.outage-panel.outage-visible {
  opacity: 1;
  pointer-events: auto;
  animation: outageSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes outageSlideIn {
  from {
    transform: translateX(-50%) translateY(100vh);
    opacity: 0;
  }
  to {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
}

.outage-panel.outage-hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.outage-glass {
  background: rgba(20, 25, 40, 0.85);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid rgba(255, 100, 100, 0.2);
  border-radius: 24px;
  padding: 2rem 2.5rem;
  width: fit-content;
  min-width: 360px;
  max-width: 460px;
  margin: 0 auto;
  text-align: center;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.5),
    0 0 60px rgba(255, 80, 80, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* Donkey Icon */
.outage-donkey-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 1.2rem;
  animation: donkeyBounce 2s ease-in-out infinite;
}

.outage-donkey-svg {
  width: 100%;
  height: 100%;
}

.outage-donkey-svg .donkey-head {
  fill: rgba(180, 160, 140, 0.6);
  stroke: rgba(140, 120, 100, 0.8);
}

.outage-donkey-svg .donkey-ear {
  stroke: rgba(140, 120, 100, 0.8);
  stroke-width: 2;
}

.outage-donkey-svg .donkey-ear-inner {
  stroke: rgba(200, 140, 140, 0.5);
  stroke-width: 1.5;
}

.outage-donkey-svg .donkey-eye {
  fill: #1a1a2e;
  stroke: none;
}

.outage-donkey-svg .donkey-nostril {
  fill: rgba(100, 80, 70, 0.6);
  stroke: none;
}

.outage-donkey-svg .donkey-mouth {
  stroke: rgba(100, 80, 70, 0.7);
  stroke-width: 1.5;
  fill: none;
}

.outage-donkey-svg .donkey-man {
  stroke: rgba(80, 60, 50, 0.5);
  stroke-width: 2;
}

@keyframes donkeyBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-2deg); }
  75% { transform: translateY(-2px) rotate(2deg); }
}

/* Title */
.outage-title {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin: 0 0 1.5rem;
  animation: glitchText 3s infinite;
  background: linear-gradient(90deg, #ff6b6b, #ffa500, #ff6b6b, #ff4757, #ffa500);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes glitchText {
  0%, 90%, 100% {
    transform: translate(0);
    filter: none;
  }
  91% {
    transform: translate(-2px, 1px);
    filter: hue-rotate(90deg);
  }
  93% {
    transform: translate(2px, -1px);
    filter: hue-rotate(-90deg);
  }
  95% {
    transform: translate(-1px, -1px);
    filter: hue-rotate(0deg);
  }
  97% {
    transform: translate(1px, 1px);
  }
}

/* Glitch text area */
.outage-glitch {
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.2rem;
  position: relative;
}

.glitch-text {
  font-size: 1rem;
  line-height: 1.5;
  color: rgba(255, 200, 180, 0.9);
  font-weight: 500;
  animation: textFlicker 4s infinite;
}

@keyframes textFlicker {
  0%, 100% { opacity: 1; }
  5% { opacity: 0.85; }
  10% { opacity: 1; }
  50% { opacity: 1; }
  52% { opacity: 0.9; }
  54% { opacity: 1; }
}

/* Scanline overlay */
.outage-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
  pointer-events: none;
  border-radius: 24px;
}

/* Status indicator */
.outage-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.5);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4444;
  animation: pulse 1.5s ease-in-out infinite;
}

.status-dot.retrying {
  background: #ffa500;
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}

/* Progress bar */
.outage-progress {
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #ff6b6b, #ffa500);
  border-radius: 2px;
  transition: none;
}/* ===== DONKEY RUNNER MINIGAME ===== */
.donkey-panel {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 640px;
  max-width: 95vw;

.donkey-close-btn {

.donkey-close-btn:hover {

/* Score section (left side) */
.donkey-header-score {

/* Score display - 7-segment look */
.donkey-score {

/* Title (center) */
.donkey-title {
  font-size: 0.7rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.05em;
  text-align: center;
  white-space: nowrap;
  flex-shrink: 0;

.donkey-play-area {

#donkey-canvas {

}

/* Start screen overlay (canvas area only, centered) */
.donkey-startscreen {

.ds-subtitle {

}

.ds-objective {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.25);
  line-height: 1.6;

}

.ds-highscore {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  margin-bottom: 1rem;
  padding: 0.4rem 0.8rem;

  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.ds-highscore-label {
  font-size: 0.6rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.3);

}

.ds-highscore-val {
  font-size: 0.9rem;
  font-weight: 900;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.08em;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
}

.ds-controls {
  margin-bottom: 0.7rem;
}

.ds-ctrl-row {
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.4);
  margin-bottom: 0.25rem;
  letter-spacing: 0.03em;
}

.ds-ctrl-row kbd {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 3px;

  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.55);
}

.ds-prompt {
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.35);

}

@keyframes startPromptBlink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* Game over overlay (canvas area only) */
.donkey-gameover {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(5, 8, 16, 0.85);

  z-index: 10;
  transition: opacity 0.2s ease;
}

.donkey-gameover.hidden {
  opacity: 0;
  pointer-events: none;
}

/* GAME OVER title — the hero of the panel, big and dramatic */
.donkey-gameover-text {
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: 0.22em;
  color: #e05555;
  margin-bottom: 0.3rem;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 20px rgba(224, 85, 85, 0.6), 0 0 40px rgba(224, 85, 85, 0.3), 0 0 60px rgba(224, 85, 85, 0.15);
  animation: gameoverShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, gameoverPulse 2.5s ease-in-out 0.6s infinite;
}

@keyframes gameoverShake {
  0% { transform: scale(2) translateY(-20px); opacity: 0; }
  20% { transform: scale(1.4) translateY(5px); opacity: 0.8; }
  40% { transform: scale(1.1) translateY(-3px); opacity: 1; }
  60% { transform: scale(1.02) translateY(1px); }
  80% { transform: scale(0.99) translateY(-1px); }
  100% { transform: scale(1) translateY(0); }
}

@keyframes gameoverPulse {
  0%, 100% { text-shadow: 0 0 20px rgba(224, 85, 85, 0.6), 0 0 40px rgba(224, 85, 85, 0.3), 0 0 60px rgba(224, 85, 85, 0.15); }
  50% { text-shadow: 0 0 30px rgba(224, 85, 85, 0.8), 0 0 50px rgba(224, 85, 85, 0.4), 0 0 80px rgba(224, 85, 85, 0.2); }
}

/* Score — prominent but not overpowering the GAME OVER text */
.donkey-gameover-score {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 0.6rem;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}

/* New high score badge — clean, compact */
.donkey-gameover-new {

  border-radius: 20px;

  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;

}

.donkey-gameover-new.hidden {

}

.donkey-gameover-new-label {
  letter-spacing: 0.12em;
}

.donkey-gameover-new-score {
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: #4ade80;
  font-family: 'Courier New', monospace;

}

@keyframes newBadgePulse {

}

/* Corner stat blocks — compact, no overlap with center heroes */

.donkey-gameover-stats-top-left {

}

.donkey-gameover-stats-top-right {
  right: 8px;
  top: 8px;
}

.donkey-gameover-stats-bottom-left {
  left: 8px;
  bottom: 8px;
}

.donkey-gameover-stats-bottom-right {
  right: 8px;
  bottom: 8px;
}

/* Corner stat row */
.donkey-gameover-stat-row {

  justify-content: space-between;
  align-items: center;
  gap: 0.4rem;

}

/* Corner stat label — right-aligned for left blocks, left-aligned for right blocks */
.donkey-gameover-stat-label {
  font-size: 0.35rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;

  text-align: right;
}

.donkey-gameover-stats-top-right .donkey-gameover-stat-label,
.donkey-gameover-stats-bottom-right .donkey-gameover-stat-label {
  text-align: left;
}

.donkey-gameover-stat-value {
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.65);
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);

}

/* Restart text — the other hero, big and inviting */
.donkey-restart-text {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.4);
  animation: restartBlink 2s ease-in-out infinite;
  letter-spacing: 0.08em;
  margin-top: 0.5rem;
}

@keyframes restartBlink {
  0%, 100% { opacity: 0.3; transform: translateY(0); }
  50% { opacity: 0.6; transform: translateY(-2px); }
}

/* Score milestone flash */
@keyframes milestoneFlash {
  0% { color: rgba(255, 255, 255, 0.9); }
  30% { color: #4ade80; text-shadow: 0 0 12px rgba(74, 222, 128, 0.5); transform: scale(1.1); }
  100% { color: rgba(255, 255, 255, 0.9); transform: scale(1); }
}

.donkey-score.milestone-flash {
  animation: milestoneFlash 0.3s ease-out;
}

/* Near-miss flash text overlay */
.donkey-near-miss {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.15em;
  color: #4ade80;
  text-shadow: 0 0 12px rgba(74, 222, 128, 0.6), 0 0 24px rgba(74, 222, 128, 0.3);
  z-index: 8;
  pointer-events: none;
  opacity: 0;
  transition: none;
}

.donkey-near-miss.flash {
  animation: nearMissFlash 0.5s ease-out forwards;
}

@keyframes nearMissFlash {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(0.8); }
}

/* Bonus text (e.g., +50 NEAR MISS) */
.donkey-bonus-text {
  position: absolute;
  top: 50%;
  left: 55%;
  transform: translate(-50%, -50%);
  font-size: 0.6rem;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.1em;
  color: #f59e0b;
  text-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
  z-index: 8;
  pointer-events: none;
  opacity: 0;
}

.donkey-bonus-text.flash {
  animation: bonusFlash 0.7s ease-out forwards;
}

@keyframes bonusFlash {
  0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
  100% { opacity: 0; transform: translate(-50%, -50%) translateY(-25px); }
}

/* Property damage bonus text animation — positioned at obstacle, green, prominent */
.property-damage-bonus {
  position: absolute;
  font-size: 0.9rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.1em;
  color: #4ade80;
  text-shadow: 0 0 8px rgba(74, 222, 128, 0.8), 0 0 16px rgba(74, 222, 128, 0.4), 0 0 24px rgba(74, 222, 128, 0.2);
  z-index: 9;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.5);
}

.property-damage-bonus.active {
  animation: propertyDamageBonusAnim 1.2s ease-out forwards;
}

@keyframes propertyDamageBonusAnim {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.5);
  }
  15% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.4);
  }
  35% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) translateY(-40px) scale(0.6);
  }
}

/* Speed lines overlay */
.donkey-speed-lines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.donkey-speed-lines.visible {
  opacity: 1;
}

/* ===== OBSTACLE COUNT TABLE ===== */
.donkey-gameover-obstacle-table {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  padding: 0.3rem 0.5rem;
  margin-bottom: 0.4rem;
  width: 100%;
}

.obstacle-count-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15rem;
  padding: 0.2rem 0.35rem;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 4px;
  min-width: 40px;
  transition: background 0.2s ease;
}

/* Obstacle icon styling */
.obstacle-count-icon {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
}

.obstacle-count-icon svg {
  width: 100%;
  height: 100%;
}

.obstacle-count-item.obstacle-kill-highlight {
  background: rgba(224, 85, 85, 0.25);

}

.obstacle-count-label {
  font-size: 0.3rem;
  font-weight: 700;

}

.obstacle-count-item.obstacle-kill-highlight .obstacle-count-label {

}

.obstacle-count-value {
  font-size: 0.55rem;
  font-weight: 900;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.7);
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
}

.obstacle-count-item.obstacle-kill-highlight .obstacle-count-value {
  color: #e05555;
  text-shadow: 0 0 8px rgba(224, 85, 85, 0.4);
}

/* ===== SNARKY MESSAGE OVERLAY ===== */
.donkey-snarky-message {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.8rem;
  font-weight: 800;
  font-family: 'Courier New', 'Lucida Console', monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;

  white-space: nowrap;
  max-width: 90%;
}

.donkey-snarky-message.active {

}

@keyframes snarkyMessageFlash {

    opacity: 1;
    transform: translateX(-50%) scale(0.7);
  }
  15% {
    opacity: 1;
    transform: translateX(-50%) scale(1.15);
  }
  30% {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  70% {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateX(-50%) scale(0.85);
  }

/* Color variants for snarky messages */
.donkey-snarky-message.snarky-green {

}

.donkey-snarky-message.snarky-red {

  text-shadow: 0 0 12px rgba(224, 85, 85, 0.6), 0 0 24px rgba(224, 85, 85, 0.3);

.donkey-snarky-message.snarky-yellow {

.donkey-snarky-message.snarky-blue {

<script>
// ===== DATA CACHE =====
// Unified cache for ALL API calls with configurable TTL per type and LRU eviction
const DataCache = {
  // Default: max number of cache entries per type before LRU eviction kicks in
  MAX_ENTRIES_PER_TYPE: 500,

  // TTLs in milliseconds
  TTL: {
    weather: 15 * 60 * 1000,      // 15 minutes
    airQuality: 15 * 60 * 1000,   // 15 minutes
    geocode: 24 * 60 * 60 * 1000, // 24 hours
    nearby: 10 * 60 * 1000,       // 10 minutes
    ipLocation: 24 * 60 * 60 * 1000 // 24 hours
  },

  // Round coordinates to 2 decimal places (~1km accuracy) for cache key grouping
  _roundCoord(coord) {
    return Math.round(coord * 100) / 100;
  },

  // Get the LRU list key for a cache type
  _lruKey(type) {
    return `hasw_lru_${type}`;
  },

  // Get the LRU list for a type (array of keys, most-recently-used first)
  _getLruList(type) {
    try {
      const raw = localStorage.getItem(this._lruKey(type));
      if (!raw) return [];
      const list = JSON.parse(raw);
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  },

  // Set the LRU list for a type
  _setLruList(type, list) {
    try {
      localStorage.setItem(this._lruKey(type), JSON.stringify(list));
    } catch (e) {
      // ignore LRU write failures
    }
  },

  // Evict least-recently-used entries when the cache exceeds the limit
  _evictIfNecessary(type) {
    try {
      const maxEntries = this.MAX_ENTRIES_PER_TYPE;
      const lruList = this._getLruList(type);
      if (lruList.length <= maxEntries) return;

      // Remove the oldest entries (they're at the end of the LRU list)
      const toRemove = lruList.splice(0, lruList.length - maxEntries);
      for (const key of toRemove) {
        localStorage.removeItem(`hasw_cache_${key}`);
        console.log(`[DataCache] EVICTED (LRU): ${key}`);
      }
      this._setLruList(type, lruList);
    } catch (e) {
      // ignore eviction failures
    }
  },

  // Move a key to the front of the LRU list (most-recently-used)
  _touchLru(type, key) {
    try {
      const lruList = this._getLruList(type);
      const idx = lruList.indexOf(key);
      if (idx !== -1) {
        lruList.splice(idx, 1); // remove from current position
      }
      lruList.unshift(key); // move to front
      this._setLruList(type, lruList);
    } catch (e) {
      // ignore LRU touch failures
    }
  },

  // Check if a cache entry exists and is not expired
  has(key, type) {
    try {
      const raw = localStorage.getItem(`hasw_cache_${key}`);
      if (!raw) {
        console.log(`[DataCache] MISS (not found): ${key}`);
        return false;
      }
      const entry = JSON.parse(raw);
      // Validate type matches
      if (type && entry.type !== type) {
        console.log(`[DataCache] MISS (type mismatch): ${key} (expected: ${type}, got: ${entry.type})`);
        return false;
      }
      const expired = !entry || (Date.now() - entry.timestamp > this.TTL[entry.type]);
      if (expired) {
        console.log(`[DataCache] MISS (expired): ${key} (type: ${entry.type})`);
        return false;
      }
      console.log(`[DataCache] HIT: ${key} (type: ${entry.type})`);
      return true;
    } catch (e) {
      console.log(`[DataCache] MISS (error): ${key}`);
      return false;
    }
  },

  // Get cached data (returns null if expired/missing)
  get(key, type) {
    try {
      const raw = localStorage.getItem(`hasw_cache_${key}`);
      if (!raw) {
        console.log(`[DataCache] MISS (not found): ${key}`);
        return null;
      }
      const entry = JSON.parse(raw);
      // Validate type and expiration
      if (entry.type !== type) {
        console.log(`[DataCache] MISS (type mismatch): ${key} (expected: ${type}, got: ${entry.type})`);
        return null;
      }
      if (Date.now() - entry.timestamp > this.TTL[entry.type]) {
        console.log(`[DataCache] MISS (expired): ${key} (type: ${type}, age: ${Math.round((Date.now() - entry.timestamp) / 1000)}s, ttl: ${this.TTL[type] / 1000}s)`);
        localStorage.removeItem(`hasw_cache_${key}`);
        return null;
      }
      console.log(`[DataCache] HIT: ${key} (type: ${type}, age: ${Math.round((Date.now() - entry.timestamp) / 1000)}s)`);
      this._touchLru(type, key);
      return entry.data;
    } catch (e) {
      console.log(`[DataCache] MISS (parse error): ${key}`, e);
      return null;
    }
  },

  // Store data with timestamp and type
  set(key, data, type) {
    try {
      const size = new Blob([JSON.stringify({ timestamp: Date.now(), type: type, data: data })]).size;
      console.log(`[DataCache] SET: ${key} (type: ${type}, size: ${Math.round(size / 100)} / 100B)`);
      localStorage.setItem(`hasw_cache_${key}`, JSON.stringify({
        timestamp: Date.now(),
        type: type,
        data: data
      }));
      this._touchLru(type, key);
      this._evictIfNecessary(type);
    } catch (e) {
      console.log(`[DataCache] SET FAILED: ${key} - ${e.message}`);
    }
  },

  // Invalidate a specific cache key
  invalidate(key) {
    console.log(`[DataCache] INVALIDATE: ${key}`);
    localStorage.removeItem(`hasw_cache_${key}`);
  },

};

</script>
<script>
// ===== FAVORITES MANAGER (place_id-based) =====
const FavoritesManager = {
  _idsKey: 'hasW_favorites',
  _detailsKey: 'hasW_favDetails',

  // Get array of favorited place_id strings
  getIds() {
    try { return JSON.parse(localStorage.getItem(this._idsKey) || '[]'); }
    catch { return []; }
  },

  // Get details map { place_id -> {name, state, lat, lon} }
  getDetails() {
    try { return JSON.parse(localStorage.getItem(this._detailsKey) || '{}'); }
    catch { return {}; }
  },

  has(placeId, lat, lon) {
    // Check by place_id first
    if (this.getIds().includes(String(placeId))) return true;

    // If coordinates are provided, also check by coordinate proximity (0.01° tolerance ≈ 1km)
    if (lat != null && lon != null) {
      const latRounded = Math.round(lat * 100) / 100;
      const lonRounded = Math.round(lon * 100) / 100;
      const details = this.getDetails();
      for (const [id, entry] of Object.entries(details)) {
        const existingLat = Math.round(entry.latitude * 100) / 100;
        const existingLon = Math.round(entry.longitude * 100) / 100;
        if (Math.abs(latRounded - existingLat) < 0.01 && Math.abs(lonRounded - existingLon) < 0.01) {
          return true;
        }
      }
    }
    return false;
  },

  add(placeId, name, state, lat, lon) {
    const ids = this.getIds();
    const details = this.getDetails();

    // Check for coordinate-based duplicates before adding (0.01° tolerance ≈ 1km)
    const latRounded = Math.round(lat * 100) / 100;
    const lonRounded = Math.round(lon * 100) / 100;
    for (const [id, entry] of Object.entries(details)) {
      const existingLat = Math.round(entry.latitude * 100) / 100;
      const existingLon = Math.round(entry.longitude * 100) / 100;
      if (Math.abs(latRounded - existingLat) < 0.01 && Math.abs(lonRounded - existingLon) < 0.01) {
        // Same city by coordinates, update the existing entry instead of adding a duplicate
        details[id] = { name, state, latitude: lat, longitude: lon };
        localStorage.setItem(this._idsKey, JSON.stringify(ids));
        localStorage.setItem(this._detailsKey, JSON.stringify(details));
        return;
      }
    }

    // No coordinate match found, add as new
    if (!ids.includes(String(placeId))) {
      ids.push(String(placeId));
      details[String(placeId)] = { name, state, latitude: lat, longitude: lon };
      localStorage.setItem(this._idsKey, JSON.stringify(ids));
      localStorage.setItem(this._detailsKey, JSON.stringify(details));
    }
  },

  remove(placeId) {
    const ids = this.getIds();
    const details = this.getDetails();
    
    // First try to remove by place_id
    const filteredIds = ids.filter(id => id !== String(placeId));
    const filteredDetails = { ...details };
    delete filteredDetails[String(placeId)];
    
    // If nothing was removed, check by coordinate proximity (0.01° tolerance ≈ 1km)
    if (filteredIds.length === ids.length) {
      // Find the city to remove by place_id from details
      const cityToRemove = details[String(placeId)];
      if (cityToRemove && cityToRemove.latitude != null && cityToRemove.longitude != null) {
        const latRounded = Math.round(cityToRemove.latitude * 100) / 100;
        const lonRounded = Math.round(cityToRemove.longitude * 100) / 100;
        for (const [id, entry] of Object.entries(filteredDetails)) {
          const existingLat = Math.round(entry.latitude * 100) / 100;
          const existingLon = Math.round(entry.longitude * 100) / 100;
          if (Math.abs(latRounded - existingLat) < 0.01 && Math.abs(lonRounded - existingLon) < 0.01) {
            // Found coordinate match, remove this entry
            filteredIds.splice(filteredIds.indexOf(id), 1);
            delete filteredDetails[id];
            break;
          }
        }
      }
    }
    
    localStorage.setItem(this._idsKey, JSON.stringify(filteredIds));
    localStorage.setItem(this._detailsKey, JSON.stringify(filteredDetails));
  },

  // Get all favorite city objects (includes place_id)
  getAll() {
    const ids = this.getIds();
    const details = this.getDetails();
    return ids.map(id => {
      const d = details[id];
      return d ? { ...d, place_id: id } : null;
    }).filter(Boolean);
  },
};

<script>
// ===== UTILITY FUNCTIONS =====
function toF(c) { return c * 9 / 5 + 32; }
function toC(f) { return (f - 32) * 5 / 9; }
function convertTemp(celsius) {
  if (celsius == null || celsius !== celsius) return NaN;
  return unit === 'F' ? toF(celsius) : toC(celsius);
}
function tempUnit() { return unit === 'F' ? '°F' : '°C'; }

function escapeHTML(str) {
  if (typeof str !== 'string') return str;
  return str
    .replace(/&/g, '\u0026amp;')
    .replace(/</g, '\u0026lt;')
    .replace(/>/g, '\u0026gt;')
    .replace(/"/g, '\u0026quot;')
    .replace(/'/g, '\u0026#039;');
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = EARTH_RADIUS_MI;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
            Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
  let b = Math.atan2(y, x) * 180 / Math.PI;
  return (b + 360) % 360;
}

function bearingToCompass(deg) {
  const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function aqiLabel(aqi) {
  if (aqi === null || aqi === undefined || aqi === false || aqi !== aqi) return { label: '—', cls: '' };
  if (aqi <= 50) return { label: 'Good', cls: 'aqi-good' };
  if (aqi <= 100) return { label: 'Moderate', cls: 'aqi-moderate' };
  return { label: 'Unhealthy', cls: 'aqi-unhealthy' };
}

<script>
// ===== WIND COMPASS =====
function getWindCompass(deg) {
  const arrow = ['⬆', '↗', '➡', '↘', '⬇', '↙', '⬅', '↖'][Math.round(deg / 45) % 8];
  return `<span class="wind-compass"><span class="compass-dial">${arrow}</span> ${bearingToCompass(deg)} ${deg}°</span>`;
}

// ===== DAY/NIGHT CHECK =====
function isDaytime(hour, sunrise, sunset) {
  return hour >= sunrise && hour < sunset;
}

// ===== FIND NEARBY CITIES =====
function scaleViewbox(lat, lon, radiusDeg) {
  const south = (lat - radiusDeg).toFixed(4);
  const north = (lat + radiusDeg).toFixed(4);
  const west = (lon - radiusDeg).toFixed(4);
  const east = (lon + radiusDeg).toFixed(4);
  return `${west},${north},${east},${south}`;
}

async function findNearbyCities(lat, lon) {
  // Handle _maxCities === 0
  if (_maxCities === 0) return [];

  // Check in-memory cache first
  if (_nearbyCache && Date.now() - _nearbyCacheTime < NEARBY_CACHE_TTL_MS) {
    return _nearbyCache;
  }

  // Check localStorage cache
  const cacheKey = `nearby_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
  const cached = DataCache.get(cacheKey, 'nearby');
  if (cached) {
    _nearbyCache = cached;
    _nearbyCacheTime = Date.now();
    return cached;
  }

  // Fetch a larger set first so we can filter and still have enough
  let viewbox = scaleViewbox(lat, lon, NOMINATIM_CLOSE_RADIUS);
  let url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=30&addressdetails=1`;

  let results;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Nominatim ${resp.status}`);
    results = await resp.json();
  } catch {
    results = [];
  }

  // Filter: keep only towns/cities/villages/hamlets/localities, reject boundary/fuel/street/country
  if (results.length > 0) {
    const acceptableTypes = ['city','town','village','hamlet','suburb','quarter','neighbourhood','locality','isolated_dwelling','farmhouse','county','administrative'];
    results = results.filter(r => {
      const type = (r.type || '').toLowerCase();
      const cls = (r.class || '').toLowerCase();
      // Reject known non-city types
      if (cls === 'boundary' && r.place_rank >= 4) return false;
      if (type === 'country' || type === 'state' || type === 'administrative') return false;
      if (type === 'fuel' || type === 'street' || type === 'residential') return false;
      // Accept if rank 10-16 (typical city/town/village)
      if (r.place_rank >= 10 && r.place_rank <= 16) return true;
      // Accept if type looks like a populated place
      return acceptableTypes.includes(type);
    });
  }

  if (results.length < _maxCities) {
    viewbox = scaleViewbox(lat, lon, NOMINATIM_WIDE_RADIUS);
    url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=50&addressdetails=1`;
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const extra = await resp.json();
        const existingIds = new Set(results.map(r => r.place_id));
        const existingNames = new Set(results.map(r => (r.name || '').toLowerCase().trim()));
        extra.forEach(r => {
          // Skip if same place_id OR same name at same coordinates (dedup by name+coords)
          if (existingIds.has(r.place_id)) return;
          const latMatch = Math.abs(parseFloat(r.lat) - parseFloat(results[0]?.lat || 0)) < 0.01;
          const sameName = existingNames.has((r.name || '').toLowerCase().trim()) && latMatch;
          if (sameName) return;
          const type = (r.type || '').toLowerCase();
          const cls = (r.class || '').toLowerCase();
          if (cls === 'boundary' && r.place_rank >= 4) return;
          if (type === 'country' || type === 'state' || type === 'administrative') return;
          if (type === 'fuel' || type === 'street' || type === 'residential') return;
          if (r.place_rank >= 10 && r.place_rank <= 16) {
            results.push(r);
            existingIds.add(r.place_id);
            existingNames.add((r.name || '').toLowerCase().trim());
          }
        });
      }
    } catch {
      // silently ignore
    }
  }

  if (results.length === 0) {
    if (_maxCities > 0) showLocationPrompt();
    return [];
  }

  const cities = results.map(item => {
    const address = item.address || {};
    let name = item.name || address.city || '';
    // International region fallback chain
    let state = address.state || address.state_district || address.region || address.county || '';
    let country = address.country || '';
    name = name.replace(/^City of\s+/i, '');

    return {
      place_id: String(item.place_id),
      name,
      latitude: parseFloat(item.lat),
      longitude: parseFloat(item.lon),
      state,
      country,
      distance: haversine(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
      bearing: bearing(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
    };
  });

  // Deduplicate by place_id AND by name+coordinate proximity
  const seen = new Set();
  const deduped = cities.filter(c => {
    if (seen.has(c.place_id)) return false;
    // Also check by name + coordinates (within 0.01° ≈ 1km)
    const nameKey = c.name.toLowerCase().trim();
    const coordKey = `${DataCache._roundCoord(c.latitude)},${DataCache._roundCoord(c.longitude)}`;
    for (const existing of seen) {
      if (existing.name === nameKey && existing.coordKey === coordKey) {
        return false;
      }
    }
    seen.add({ name: nameKey, coordKey, place_id: c.place_id });
    return true;
  });

  deduped.sort((a, b) => a.distance - b.distance);

  // Select cities with bearing diversity and min distance
  const selected = [deduped[0]];
  const used = new Set([0]);
  const remaining = deduped.filter((_, i) => !used.has(i));
  remaining.sort((a, b) => {
    const aMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(a.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    const bMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(b.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    return bMinDiff - aMinDiff;
  });

  for (const city of remaining) {
    if (selected.length >= _maxCities) break;
    let tooClose = false;
    for (const sel of selected) {
      const dist = haversine(city.latitude, city.longitude, sel.latitude, sel.longitude);
      if (dist < MIN_CITY_DISTANCE_MI) { tooClose = true; break; }
    }
    if (!tooClose) {
      selected.push(city);
      used.add(deduped.indexOf(city));
    }
  }

  // Fill remaining slots if we still need more
  for (let i = 0; i < deduped.length && selected.length < _maxCities; i++) {
    if (!used.has(i)) selected.push(deduped[i]);
  }

  _nearbyCache = selected;
  _nearbyCacheTime = Date.now();

  // Store in localStorage cache
  DataCache.set(cacheKey, selected, 'nearby');

  return selected;
}

// ===== LOCATION =====
async function getLocation() {
  // Check in-memory cache
  if (userLocation) return userLocation;

  // Check localStorage cache for IP geolocation
  const cachedIP = DataCache.get('ip_location', 'ipLocation');
  if (cachedIP) {
    return cachedIP;
  }

  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: GEOLOCATION_TIMEOUT_MS });
    });
    const { latitude, longitude } = pos.coords;
    const loc = { lat: latitude, lon: longitude };
    // Cache browser geolocation briefly (it's not reliable to cache long-term)
    return loc;
  } catch {
    try {
      const res = await fetch(IP_API);
      const data = await res.json();
      const lat = parseFloat(data.loc?.split(',')[0] ?? data.lat);
      const lon = parseFloat(data.loc?.split(',')[1] ?? data.lon);
      const loc = { lat, lon };
      // Cache IP location for 24 hours
      DataCache.set('ip_location', loc, 'ipLocation');
      return loc;
    } catch {
      showLocationPrompt();
      return { lat: 43.41947, lon: -83.95081 };
    }
  }
}

<script>
// ===== FETCH WEATHER =====
// Helper to build a unique cache key for weather+AQI per city
function weatherCacheKey(lat, lon) {
  return `weather_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// ===== RETRY HELPER =====
// Retry a fetch with exponential backoff
async function retryWithBackoff(fn, maxRetries = 3, baseDelay = 1000) {
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const result = await fn();
      return result;
    } catch (err) {
      if (attempt === maxRetries) throw err;
      const delay = baseDelay * Math.pow(2, attempt);
      console.log(`[retry] Attempt ${attempt + 1}/${maxRetries + 1} failed, retrying in ${delay}ms`);
      await new Promise(r => setTimeout(r, delay));
    }
  }
}

// Known keys that are NOT hourly variable data
const KNOWN_NON_HOURLY_KEYS = new Set([
  'latitude', 'longitude', 'elevation',
  'generationtime_ms', 'utc_offset_seconds',
  'timezone', 'timezone_abbreviation',
  'current', 'hourly'
]);

// Helper: extract hourly variable keys from a raw response object
function extractHourlyKeys(raw) {
  return Object.keys(raw).filter(k =>
    KNOWN_NON_HOURLY_KEYS.has(k) === false &&
    Array.isArray(raw[k]) &&
    raw[k].length > 0 &&
    typeof raw[k][0] !== 'object'
  );
}

// Deduplicate city results by coordinate pair (keep first entry per coordinate pair)
// Prefer entries with a non-null place_id when there's a tie
function deduplicateResults(results) {
  const seenCoords = new Map();
  const deduped = [];
  for (const entry of results) {
    const lat = entry.latitude != null ? DataCache._roundCoord(entry.latitude) : null;
    const lon = entry.longitude != null ? DataCache._roundCoord(entry.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(entry);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    let isDup = false;
    for (const [existingKey, existingEntry] of seenCoords) {
      const [exLat, exLon] = existingKey.split(',').map(Number);
      if (Math.abs(lat - exLat) < 0.01 && Math.abs(lon - exLon) < 0.01) {
        isDup = true;
        // Prefer the entry with a non-null place_id
        if (!existingEntry.place_id && entry.place_id) {
          seenCoords.set(existingKey, entry);
          const dupIdx = deduped.findIndex(d => d === existingEntry);
          if (dupIdx !== -1) deduped[dupIdx] = entry;
        }
        break;
      }
    }
    if (!isDup) {
      seenCoords.set(coordKey, entry);
      deduped.push(entry);
    }
  }
  return deduped;
}

// Deduplicate cities by coordinate pair (for deduplication BEFORE the API call)
function deduplicateCities(cities) {
  const seenCoords = new Set();
  const deduped = [];
  for (const city of cities) {
    const lat = city.latitude != null ? DataCache._roundCoord(city.latitude) : null;
    const lon = city.longitude != null ? DataCache._roundCoord(city.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(city);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    if (!seenCoords.has(coordKey)) {
      seenCoords.add(coordKey);
      deduped.push(city);
    }
  }
  return deduped;
}

async function fetchWeatherForCities(cities) {
  // Check cache for each city individually
  const cachedResults = [];
  const uncachedCities = [];
  const cityCacheMap = []; // map city index to its position in uncachedCities

  for (let i = 0; i < cities.length; i++) {
    const ck = weatherCacheKey(cities[i].latitude, cities[i].longitude);
    const cachedWeather = DataCache.get(ck, 'weather');
    const cachedAqi = DataCache.get(ck, 'airQuality');
    if (cachedWeather) {
      cachedResults.push({ ...cities[i], weather: cachedWeather, aqi: cachedAqi || {} });
    } else {
      cityCacheMap.push(i);
      uncachedCities.push(cities[i]);
    }
  }

  // If all cached, apply deduplication before returning
  if (uncachedCities.length === 0) {
    return deduplicateResults(cachedResults);
  }

  // ===== FIX #1: Deduplicate BEFORE caching =====
  // Only unique coordinate pairs should be fetched from the API
  const dedupedUncached = deduplicateCities(uncachedCities);

  // Build combined weather + AQI URL for deduplicated uncached cities only
  try {
    const weatherUrl = `${WEATHER_API}?latitude=${dedupedUncached.map(c => c.latitude).join(',')}&longitude=${dedupedUncached.map(c => c.longitude).join(',')}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index,visibility&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&forecast_days=2&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=auto`;

    // ===== FIX #5: Retry logic for weather API =====
    const weatherRes = await retryWithBackoff(() => fetch(weatherUrl));

    if (!weatherRes.ok) {
      // Fill uncached with null data
      for (const idx of cityCacheMap) {
        cachedResults[idx] = { ...cities[idx], weather: null, aqi: {} };
      }
      return deduplicateResults(cachedResults);
    }

    const weatherAll = await weatherRes.json();

    const aqiUrl = `${AIR_QUALITY_API}?latitude=${dedupedUncached.map(c => c.latitude).join(',')}&longitude=${dedupedUncached.map(c => c.longitude).join(',')}&current=us_aqi,pm2_5,european_aqi&timezone=auto`;
    // ===== FIX #5: Retry logic for AQI API =====
    const aqiRes = await retryWithBackoff(() => fetch(aqiUrl));
    const aqiData = await aqiRes.json();

    const result = new Array(cities.length);

    // First fill cached results (use get directly — it already handles expiration internally)
    for (let i = 0; i < cities.length; i++) {
      const ck = weatherCacheKey(cities[i].latitude, cities[i].longitude);
      const entryWeather = DataCache.get(ck, 'weather');
      const entryAqi = DataCache.get(ck, 'airQuality');
      if (entryWeather) {
        result[i] = { ...cities[i], weather: entryWeather, aqi: entryAqi || {} };
      }
    }

    // Parse weather response — Open-Meteo returns a flat object when single lat/lon,
    // or an object with 'results' array when multiple lat/lon values are provided.
    const hasResultsArray = weatherAll && Array.isArray(weatherAll.results);

    // Parse AQI response — same pattern: flat for single, 'results' array for multiple
    const hasAqiResultsArray = aqiData && Array.isArray(aqiData.results);

    let wIdx = 0; // index into weatherAll.results / aqiData.results
    for (let i = 0; i < cities.length; i++) {
      // Skip already-cached
      if (result[i]) continue;

      const city = cities[i];
      let cityWeather;
      let aqiResult;

      if (hasResultsArray) {
        const raw = weatherAll.results[wIdx] || {};
        // ===== FIX #4: Clean up hourly variable extraction =====
        const rawHourlyKeys = extractHourlyKeys(raw);
        const mergedHourly = raw.hourly ? { ...raw.hourly } : { time: [] };
        rawHourlyKeys.forEach(k => {
          const val = raw[k];
          if (Array.isArray(val) && val.length > 0 && typeof val[0] !== 'object') {
            mergedHourly[k] = val;
          }
        });
        cityWeather = {
          current: raw.current || {},
          hourly: mergedHourly,
        };

        // AQI from results array
        if (hasAqiResultsArray) {
          const aqiRaw = aqiData.results[wIdx] || {};
          aqiResult = {
            us_aqi: aqiRaw.current?.us_aqi ?? aqiRaw.us_aqi ?? null,
            pm2_5: aqiRaw.current?.pm2_5 ?? aqiRaw.pm2_5 ?? null,
            european_aqi: aqiRaw.current?.european_aqi ?? aqiRaw.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }

        wIdx++;
      } else if (Array.isArray(weatherAll)) {
        // Fallback: weatherAll is an array of individual results
        const raw = weatherAll[i] || {};
        cityWeather = {
          current: raw.current || {},
          hourly: raw.hourly || { time: [] },
        };
        if (Array.isArray(aqiData)) {
          const aqiRaw = aqiData[i] || {};
          aqiResult = {
            us_aqi: aqiRaw.current?.us_aqi ?? aqiRaw.us_aqi ?? null,
            pm2_5: aqiRaw.current?.pm2_5 ?? aqiRaw.pm2_5 ?? null,
            european_aqi: aqiRaw.current?.european_aqi ?? aqiRaw.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }
      } else {
        // Single result (no results array)
        const raw = weatherAll;
        cityWeather = {
          current: raw.current || {},
          hourly: raw.hourly || { time: [] },
        };
        if (aqiData && !hasAqiResultsArray) {
          aqiResult = {
            us_aqi: aqiData.current?.us_aqi ?? aqiData.us_aqi ?? null,
            pm2_5: aqiData.current?.pm2_5 ?? aqiData.pm2_5 ?? null,
            european_aqi: aqiData.current?.european_aqi ?? aqiData.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }
      }

      // ===== FIX #2: Use separate cache types for weather and AQI =====
      const ck = weatherCacheKey(city.latitude, city.longitude);
      DataCache.set(ck, cityWeather, 'weather');
      DataCache.set(ck, aqiResult, 'airQuality');

      result[i] = { ...city, weather: cityWeather, aqi: aqiResult };
    }

    return deduplicateResults(result);
  } catch {
    // Fill uncached with null data
    const result = new Array(cities.length);
    for (let i = 0; i < cities.length; i++) {
      const ck = weatherCacheKey(cities[i].latitude, cities[i].longitude);
      if (DataCache.has(ck, 'weather')) {
        const entryWeather = DataCache.get(ck, 'weather');
        const entryAqi = DataCache.get(ck, 'airQuality');
        result[i] = { ...cities[i], weather: entryWeather, aqi: entryAqi || {} };
      } else {
        result[i] = { ...cities[i], weather: null, aqi: {} };
      }
    }
    return result;
  }
}

<script>
// ===== RENDER =====

// Parse time string as decimal hours so minutes are accounted for (e.g., "18:45" → 18.75)
function parseDecimalTime(timeStr, fallback) {
  if (!timeStr) return fallback;
  const [h, m] = timeStr.split(':').map(Number);
  return h + (m / 60);
}

function renderAll() {
  const grid = document.getElementById('city-grid');
  if (!grid) return;

  // De-duplicate weatherData by coordinates before rendering (keep entry with non-null place_id)
  const seenCoords = new Map();
  const deduped = [];
  for (const entry of weatherData) {
    const lat = entry.latitude != null ? DataCache._roundCoord(entry.latitude) : null;
    const lon = entry.longitude != null ? DataCache._roundCoord(entry.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(entry);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    let isDup = false;
    for (const [existingKey, existingEntry] of seenCoords) {
      const [exLat, exLon] = existingKey.split(',').map(Number);
      if (Math.abs(lat - exLat) < 0.01 && Math.abs(lon - exLon) < 0.01) {
        isDup = true;
        // Prefer the entry with a non-null place_id
        if (!existingEntry.place_id && entry.place_id) {
          seenCoords.set(existingKey, entry);
          const dupIdx = deduped.findIndex(d => d === existingEntry);
          if (dupIdx !== -1) deduped[dupIdx] = entry;
        }
        break;
      }
    }
    if (!isDup) {
      seenCoords.set(coordKey, entry);
      deduped.push(entry);
    }
  }
  weatherData = deduped;

  grid.innerHTML = '';

  weatherData.forEach((data, i) => {
    const card = document.createElement('div');
    card.className = 'city-card';
    card.dataset.cityName = data.name;
    card.dataset.placeid = data.place_id || '';

    card.dataset.citylat = data.latitude != null ? data.latitude : '';
    card.dataset.citylon = data.longitude != null ? data.longitude : '';
    card.style.animationDelay = `${i * 120}ms`;
    card.style.animationFillMode = 'forwards';
    card.style.overflow = 'visible';
    const suffix = data.latitude != null && data.longitude != null ? `${data.latitude}_${data.longitude}` : undefined;
    card.innerHTML = renderCityCard(data, suffix);
    grid.appendChild(card);
  });

  applyBackgrounds();
  setTimeout(() => drawAllCharts(), 400);
}

function applyBackgrounds() {

  style.textContent = '';
  document.querySelectorAll('.city-card').forEach((card, i) => {
    if (weatherData[i]?.weather) {

      card.style.background = `linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04)), ${bg}`;
    }
  });
}

function renderCityCard(data, suffix) {

  const vis = current?.visibility ? (current.visibility / 1609.34).toFixed(1) : '—';
  const pm25 = a.pm2_5 !== undefined && a.pm2_5 !== null ? a.pm2_5 : '—';

  const now = new Date();
  const currentHour = now.getHours();

  const sunriseTime = current?.sunrise ? parseDecimalTime(current.sunrise.split('T')[1]?.split('+')[0], 6) : 6;
  const sunsetTime = current?.sunset ? parseDecimalTime(current.sunset.split('T')[1]?.split('+')[0], 19) : 19;
  const isDay = isDaytime(currentHour, sunriseTime, sunsetTime);

  const curIcon = isDay ? getWeatherIcon(curWeatherCode) : getMoonIcon(curWeatherCode);
  const curIconLarge = isDay ? getWeatherIcon(curWeatherCode, 80) : getMoonIcon(curWeatherCode, 80);

  const timeArr = hourly?.time || [];

    hourlyHTML += `<div class="hour-slot${isCurrent ? ' current' : ''}">

      ${hWind ? `<div class="hour-wind">${hWind}</div>` : ''}
      ${hPrecip ? `<div class="hour-precip">${hPrecip}</div>` : ''}
    </div>`;
  }


  const safeName = data.place_id || suffix;
  const mergedCanvasId = `chart-merged-${safeName}`;
  const combinedCanvasId = `chart-combined-${safeName}`;

  // Slice to 24 hours (current day only) for chart display
  const temps = (hourly?.temperature_2m || []).slice(0, 24);
  const rain = (hourly?.precipitation || []).slice(0, 24);
  const hum = (hourly?.relative_humidity_2m || []).slice(0, 24);
  const wind = (hourly?.wind_speed_10m || []).slice(0, 24);
  const chartStats = (data) => data.length ? {
    min: Math.round(Math.min(...data)),
    max: Math.round(Math.max(...data)),
    avg: Math.round(data.reduce((a, b) => a + b, 0) / data.length),
  } : { min: '—', max: '—', avg: '—' };

  const humStats = chartStats(hum);
  const windStats = chartStats(wind);
  const rainStats = chartStats(rain);

  return `
    <canvas class="chart-canvas chart-merged" id="${mergedCanvasId}" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;"></canvas>
    <div style="position:relative;z-index:2;">
    <div class="city-header">
      <div class="city-name-wrap">
        <span class="city-name">${escapeHTML(data.name)}${FavoritesManager.has(data.place_id, data.latitude, data.longitude) ? '<span class="fav-star">★</span>' : ''}</span>
        <span class="city-state">${escapeHTML(data.state)}</span>
      </div>
      <span class="current-temp-inline">${Math.round(curTemp)}°</span>
      <div class="current-weather-icon-inline">${curIconLarge}</div>
    </div>
    <div class="city-compass-row" style="display:flex;align-items:center;gap:0.4rem;margin-top:0.1rem;">
      <span class="compass-heading">${escapeHTML(bearingToCompass(data.bearing))}</span>
      <span class="compass-heading">${Math.round(data.distance)} mi</span>
    </div>
    <div class="combined-chart-row">
      <canvas class="combined-chart-canvas" id="${combinedCanvasId}"></canvas>
      <div class="combined-chart-stats">
        <div class="stat-group">
          <div class="stat-group-title">Humidity</div>
          <div class="stat"><span class="stat-label">CUR</span><span class="stat-val">${humidity}%</span></div>
          <div class="stat"><span class="stat-label">MIN</span><span class="stat-val">${humStats.min}%</span></div>
          <div class="stat"><span class="stat-label">MAX</span><span class="stat-val">${humStats.max}%</span></div>
          <div class="stat"><span class="stat-label">AVG</span><span class="stat-val">${humStats.avg}%</span></div>

        <div class="divider"></div>
        <div class="stat-group">

          <div class="stat"><span class="stat-label">CUR</span><span class="stat-val">${windSpeed}</span></div>
          <div class="stat"><span class="stat-label">MIN</span><span class="stat-val">${windStats.min}</span></div>
          <div class="stat"><span class="stat-label">MAX</span><span class="stat-val">${windStats.max}</span></div>
          <div class="stat"><span class="stat-label">AVG</span><span class="stat-val">${windStats.avg}</span></div>
        </div>
        <div class="divider"></div>
        <div class="stat-group">

          <div class="stat"><span class="stat-label">MIN</span><span class="stat-val">${rainStats.min}mm</span></div>
          <div class="stat"><span class="stat-label">MAX</span><span class="stat-val">${rainStats.max}mm</span></div>

        </div>

      <div class="detail-cell"><span class="detail-label">Pressure</span><span class="detail-value">${pressure} hPa</span></div>
      <div class="detail-cell"><span class="detail-label">UV Index</span><span class="detail-value">${uv}</span></div>
      <div class="detail-cell"><span class="detail-label">Visibility</span><span class="detail-value">${vis} mi</span></div>

<script>
// ===== CLEAN CANVAS CHART =====
function drawMergedChart(canvasId, cityData, dayHigh, dayLow) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width;
  const h = rect.height;
  const pad = { top: 6, right: 0, bottom: 6, left: 0 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const hourly = cityData.hourly || {};
  // Slice to 24 hours (current day only), convert temps to current unit
  const temps = (hourly.temperature_2m || []).slice(0, 24).map(v => convertTemp(v));
  const rain = (hourly.precipitation || []).slice(0, 24);
  const wind = (hourly.wind_speed_10m || []).slice(0, 24);

  if (temps.length === 0) return;

  const n = temps.length;
  const stepX = plotW / (n - 1 || 1);

  // Temp range - use day high/low when available
  const tempMin = (dayLow != null ? dayLow : Math.min(...temps)) - 2;
  const tempMax = (dayHigh != null ? dayHigh : Math.max(...temps)) + 2;
  const tempRange = tempMax - tempMin || 1;

  // Rain max
  const rainMax = Math.max(...rain, 0.5);

  // Wind max
  const windMax = Math.max(...wind, 1);

  // Draw grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 3; i++) {
    const y = pad.top + (plotH / 3) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + plotW, y);
    ctx.stroke();
  }

  // Temperature area fill
  const tempFillGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  tempFillGrad.addColorStop(0, 'rgba(255,140,66,0.25)');
  tempFillGrad.addColorStop(1, 'rgba(255,140,66,0.02)');

  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + (n - 1) * stepX, pad.top + plotH);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = tempFillGrad;
  ctx.fill();

  // Temperature line
  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#ff8c42';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Temperature dots
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff8c42';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Rain bars (bottom)
  const rainH = plotH * 0.25;
  const rainY = pad.top + plotH - rainH;
  const barW = Math.max(2, stepX * 0.5);
  rain.forEach((v, i) => {
    const x = pad.left + i * stepX + (stepX - barW) / 2;
    const barH = (v / rainMax) * rainH;
    ctx.fillStyle = `rgba(77,166,255,${0.15 + (v / rainMax) * 0.35})`;
    ctx.fillRect(x, rainY + rainH - barH, barW, barH);
  });

  // Wind line (subtle)
  ctx.beginPath();
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * (plotH * 0.15);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(125,217,160,0.3)';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Temp labels on left
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 3; i++) {
    const val = tempMax - (tempRange / 3) * i;
    const y = pad.top + (plotH / 3) * i;
    ctx.fillText(Math.round(val) + '°', pad.left + 17, y + 3);
  }

}

// ===== COMBINED CHART =====
function drawCombinedChart(canvasId, cityData) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width;
  const h = rect.height;
  const pad = { top: 10, right: 10, bottom: 10, left: 10 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const hourly = cityData.hourly || {};
  // Slice to 24 hours (current day only)
  const hum = (hourly.relative_humidity_2m || []).slice(0, 24);
  const wind = (hourly.wind_speed_10m || []).slice(0, 24);
  const rain = (hourly.precipitation || []).slice(0, 24);

  if (hum.length === 0) return;

  const n = hum.length;
  const stepX = plotW / (n - 1 || 1);
  const windMax = Math.max(...wind, 1);
  const rainMax = Math.max(...rain, 0.5);

  // Humidity gradient fill
  const humGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  humGrad.addColorStop(0, 'rgba(77,166,255,0.05)');
  humGrad.addColorStop(1, 'rgba(77,166,255,0.3)');
  ctx.beginPath();
  hum.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / 100) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + (n - 1) * stepX, pad.top + plotH);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = humGrad;
  ctx.fill();

  // Humidity line
  ctx.beginPath();
  hum.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / 100) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(77,166,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Wind line
  ctx.beginPath();
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(125,217,160,0.6)';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Wind dots
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * plotH;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(125,217,160,0.8)';
    ctx.fill();
  });

  // Rain bars (bottom)
  const rainH = plotH * 0.2;
  const rainY = pad.top + plotH - rainH;
  const barW = Math.max(2, stepX * 0.5);
  rain.forEach((v, i) => {
    const x = pad.left + i * stepX + (stepX - barW) / 2;
    const barH = (v / rainMax) * rainH;
    ctx.fillStyle = `rgba(77,166,255,${0.15 + (v / rainMax) * 0.35})`;
    ctx.fillRect(x, rainY + rainH - barH, barW, barH);
  });

  // Labels
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('100%', pad.left + 2, pad.top + 4);
  ctx.fillText('0%', pad.left + 2, pad.top + plotH);
  ctx.fillText(Math.round(windMax) + ' km/h', pad.left + 2, pad.top + plotH - 2);
}

// ===== CANVAS CHARTS =====
function drawAllCharts() {
  weatherData.forEach((data) => {
    if (!data.weather) return;
    const hourly = data.weather.hourly || {};
    const safeName = data.place_id || `${data.latitude || 0}_${data.longitude || 0}`;
    if (Object.keys(hourly).length === 0) return;
    drawMergedChart(`chart-merged-${safeName}`, data.weather, data.highTemp, data.lowTemp);
    drawCombinedChart(`chart-combined-${safeName}`, data.weather);
  });
}

// ===== PARTICLE CANVAS =====
function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      opacity: Math.random() * 0.1 + 0.05,
    });
  }

  // Pause particles when the donkey runner game is active (reduces GPU compositing load)
  let animId = null;

  function animate() {
    if (animId) cancelAnimationFrame(animId);
    animId = null;

    function step() {
      animId = requestAnimationFrame(step);

      // Check if game is active — pause particles when game is running
      const isGameActive = typeof DONKEY_RUNNER !== 'undefined' && DONKEY_RUNNER && DONKEY_RUNNER.gameRunning;
      if (!isGameActive) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y -= p.speed;
          if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
          ctx.fill();
        });
      } else {
        // Clear canvas when paused to keep it clean (no particles drawn)
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    step();
  }
  animate();
}
