<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hasWeather</title>
<link rel="icon" href="hasWeather-low.png" type="image/png">
<link rel="stylesheet" href="css/main.css">
</head>
<body translate="no">

<canvas id="particle-canvas"></canvas>

<header class="header">
  <h1 class="logo">hasWeather</h1>
   <button id="unit-toggle" class="btn btn-small" title="Toggle °F/°C">°F</button>
   <button id="refresh-btn" class="btn btn-small" title="Refresh data">⟳</button>
   <button id="game-btn" class="btn btn-small" title="Donkey Runner Minigame">🫏</button>
   <button id="fullscreen-btn" class="btn btn-small" title="Toggle fullscreen" style="display:none;">⛶</button>
  <span id="user-location" class="location-display"></span>
  <div id="debug-locations" style="display:flex;gap:4px;align-items:center;">
    <span style="font-size:0.65rem;color:rgba(255,255,255,0.3);margin-right:2px;">Test:</span>
    <button class="btn btn-small debug-loc-btn" data-lat="25.2854" data-lon="51.5310" data-name="Qatar" title="Qatar">Qatar</button>
    <button class="btn btn-small debug-loc-btn" data-lat="24.4539" data-lon="54.3773" data-name="Abu Dhabi" title="Abu Dhabi">Abu Dhabi</button>
    <button class="btn btn-small debug-loc-btn" data-lat="50.1109" data-lon="8.6821" data-name="Frankfurt" title="Frankfurt">Frankfurt</button>
    <button class="btn btn-small debug-loc-btn" data-lat="33.4709" data-lon="-81.9648" data-name="Augusta" title="Augusta, GA">Augusta</button>
    <button class="btn btn-small debug-loc-btn" data-lat="42.3601" data-lon="-71.0589" data-name="Boston" title="Boston, MA">Boston</button>
    <button class="btn btn-small debug-loc-btn" data-lat="35.2271" data-lon="-80.8431" data-name="Charlotte" title="Charlotte, NC">Charlotte</button>
  </div>
</header>

<main id="city-grid" class="city-grid">
  <!-- City cards injected here -->
</main>

<!-- Radar card container (outside city grid, centered) -->
<div id="radar-card-container" class="radar-card-wrapper"></div>

<script src="js/constants.js"></script>
<script src="js/cache.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/api-openmeteo.js"></script>
<script src="js/api-openstreetmap.js"></script>
<script src="js/api-nws.js"></script>
<script src="js/api-radar.js"></script>
<script src="js/render.js"></script>
<script src="js/charts.js"></script>
  <script src="js/network-monitor.js"></script>
  <script src="js/donkey-runner.js"></script>
 <script src="js/main.js"></script>
</body>
</html>
