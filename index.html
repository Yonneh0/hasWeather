<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hasW Weather</title>
<style>
  /* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 2rem;
  position: relative;
  z-index: 10;
}

.logo {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #fff;
}

.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: rgba(255,255,255,0.15); }
.btn:active { transform: scale(0.96); }
.btn-small { padding: 0.3rem 0.6rem; font-size: 0.85rem; }
.btn-primary {
  background: rgba(70,130,255,0.3);
  border-color: rgba(70,130,255,0.5);
  font-size: 1rem;
  padding: 0.6rem 1.2rem;
}

.location-display {
  margin-left: auto;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.6);
}

#refresh-btn.spinning {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== CITY GRID ===== */
.city-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(280px, 1fr));
  gap: 1rem;
  padding: 1rem 2rem 2rem;
  position: relative;
  z-index: 1;
}

@media (max-width: 1400px) {
  .city-grid { grid-template-columns: repeat(3, minmax(280px, 1fr)); }
}
@media (max-width: 900px) {
  .city-grid { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
}
@media (max-width: 600px) {
  .city-grid { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; }
}

/* ===== CITY CARD ===== */
.city-card {
  position: relative;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 1.2rem;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
  animation: fadeInUp 0.6s ease forwards;
  opacity: 0;
}
.city-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.city-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.4;
  transition: opacity 2s;
  z-index: -1;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== CARD HEADER ===== */
.city-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.4rem;
  position: relative;
}
.city-name-wrap {
  display: flex;
  flex-direction: column;
  gap: 0;
  align-items: flex-end;
}
.city-name {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;
}
.city-state {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
  font-weight: 400;
  letter-spacing: 0.02em;
  text-align: right;
}
.city-meta {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.45);
}
.current-temp-inline {
  font-size: 2.4rem;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  z-index: 1;
}
.current-weather-icon-inline {
  width: 80px;
  height: 80px;
  position: absolute;
  top: -50%;
  left: 100%;
  transform: translate(-50%, -50%);
  opacity: 0.5;
  pointer-events: none;
  z-index: 0;
}

/* Info row: HIGH / LOW / ☀️ / 🌙 */
.info-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.8rem;
  padding: 0.45rem 0.6rem;
  background: rgba(0,0,0,0.12);
  border-radius: 10px;
}
.info-item {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.info-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.4);
}
.info-val {
  font-size: 1.05rem;
  font-weight: 700;
}
.info-val.hot { color: #ff8c42; }
.info-val.cool { color: #6cb4ee; }

.current-weather {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 0.8rem;
  padding: 0.4rem 0;
}
.weather-icon {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}
.current-temp {
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1;
}
.current-weather-meta {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.55);
}

/* Details Grid */
.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
  padding: 0.6rem;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
}
.detail-cell {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.detail-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
}
.detail-value {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.aqi-badge {
  display: inline-block;
  padding: 0.1rem 0.3rem;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
}
.aqi-good { background: rgba(76,175,80,0.3); color: #81c784; }
.aqi-moderate { background: rgba(255,193,7,0.3); color: #ffd54f; }
.aqi-unhealthy { background: rgba(244,67,54,0.3); color: #e57373; }

/* High/Low + Sun */
.high-low-section {
  margin-bottom: 0.8rem;
  padding: 0.5rem;
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
}
.high-low-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.3rem;
}
.high-label { color: #ff8c42; font-weight: 700; }
.low-label  { color: #6cb4ee; font-weight: 700; }
.high-val, .low-val { font-weight: 700; }
.sun-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.55);
}

/* Hourly Forecast */
.hourly-section {
  margin-bottom: 0.8rem;
}
.hourly-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.4rem;
}
.hourly-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, auto);
  gap: 0.3rem;
}
.hour-slot {
  text-align: center;
  padding: 0.4rem 0.3rem;
  border-radius: 8px;
  background: rgba(0,0,0,0.15);
  border: 1px solid transparent;
  transition: border-color 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hour-slot.current {
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08);
}
.hour-time {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.1rem;
}
.hour-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hour-icon .weather-svg {
  width: 48px;
  height: 48px;
}
.hour-temp {
  font-size: 0.8rem;
  font-weight: 600;
  margin-top: 0.15rem;
}
.hour-precip {
  font-size: 0.55rem;
  color: #6cb4ee;
  margin-top: 0.05rem;
}

/* 7-Day Forecast */
.daily-section {
  margin-bottom: 0.8rem;
}
.daily-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.4rem;
}
.daily-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.6rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  border-radius: 6px;
}
.daily-day {
  font-size: 0.7rem;
  width: 36px;
  flex-shrink: 0;
  color: rgba(255,255,255,0.7);
}
.daily-icon {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.daily-low-val {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.5);
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}
.daily-high-val {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.5);
  width: 32px;
  text-align: left;
  flex-shrink: 0;
}
.daily-bar {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.daily-bar-fill {
  position: absolute;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #6cb4ee, #ff8c42);
}
.daily-precip {
  font-size: 0.6rem;
  color: #6cb4ee;
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}
.daily-wind {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.55);
  width: 40px;
  text-align: right;
  flex-shrink: 0;
}
.hour-wind {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.55);
  margin-top: 0.05rem;
}

/* Canvas Charts */
.charts-section {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-bottom: 0.8rem;
}
.chart-title {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.4);
  margin-bottom: 0.15rem;
}
.chart-canvas {
  width: 100%;
  height: 100px;
  display: block;
  border-radius: 8px;
  background: rgba(0,0,0,0.12);
}

/* Chart stats row */
.chart-stats-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.4rem;
  margin-bottom: 0.3rem;
  background: rgba(0,0,0,0.15);
  border-radius: 6px;
}
.chart-stats-row .stat {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.05rem;
}
.chart-stats-row .stat-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.35);
}
.chart-stats-row .stat-val {
  font-size: 0.8rem;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
}

/* Overlaid charts container */
.overlaid-charts {
  position: relative;
  width: 100%;
  height: 80px;
  margin-bottom: 0.4rem;
}
.overlaid-charts canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 8px;
}

/* Charts group below header */
.charts-group {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  margin-bottom: 0.6rem;
}
.chart-row {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.chart-row-title {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.4);
  padding: 0 0.2rem;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 2rem;
  min-width: 320px;
  animation: fadeInUp 0.3s ease;
}
.modal-card h2 {
  font-size: 1.2rem;
  margin-bottom: 1rem;
}
.modal-card input {
  width: 100%;
  padding: 0.6rem 0.8rem;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 1rem;
  margin-bottom: 0.8rem;
  outline: none;
}
.modal-card input:focus {
  border-color: rgba(70,130,255,0.6);
}
.modal-card .btn {
  width: 100%;
}

/* ===== LOADING ===== */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem;
  color: rgba(255,255,255,0.5);
  font-size: 1rem;
}

/* ===== SVG WEATHER ICONS - LOUD & ANIMATED ===== */
.weather-svg {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.weather-svg .sun { stroke: #ffd54f; fill: #ffd54f; }
.weather-svg .moon { stroke: #e0e0e0; fill: #e0e0e0; }
.weather-svg .cloud { stroke: #b0bec5; fill: rgba(176,190,197,0.3); }
.weather-svg .rain { stroke: #64b5f6; fill: none; }
.weather-svg .snow { stroke: #e0e0e0; fill: none; }

/* Icon animation classes */
.weather-icon-animated {
  overflow: visible;
}

/* Sun: rotating rays + pulsing glow */
.weather-icon-sun .icon-glow {
  transform-origin: 32px 32px;
}
.weather-icon-sun .icon-rotate {
  transform-origin: 32px 32px;
  animation: icon-rotate 20s linear infinite;
}

@keyframes icon-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Moon: bobbing + twinkling stars */
.weather-icon-moon .icon-bob {
  animation: icon-bob 4s ease-in-out infinite;
}

@keyframes icon-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Cloud: drifting */
.weather-icon-cloud .icon-drift,
.weather-icon-cloud-sun .icon-drift,
.weather-icon-rain .icon-drift,
.weather-icon-snow .icon-drift,
.weather-icon-fog .icon-drift {
  animation: icon-drift 3s ease-in-out infinite;
}

@keyframes icon-drift {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(2px); }
}

/* Thunderstorm: shaking + lightning flash */
.weather-icon-thunder .icon-shake {
  animation: icon-shake 2s ease-in-out infinite;
}

@keyframes icon-shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  10% { transform: translateX(-1px) rotate(-1deg); }
  20% { transform: translateX(1px) rotate(1deg); }
  30% { transform: translateX(0); }
  40% { transform: translateX(-1px) rotate(-0.5deg); }
  50% { transform: translateX(0); }
}

.weather-icon-animated .icon-bolt {
  animation: icon-flash 2s ease-in-out infinite;
}

@keyframes icon-flash {
  0%, 100% { opacity: 1; }
  48% { opacity: 1; }
  50% { opacity: 0.3; }
  52% { opacity: 1; }
  70% { opacity: 1; }
  72% { opacity: 0.4; }
  74% { opacity: 1; }
}

/* Compass heading */
.compass-heading {
  display: inline-block;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.6);
  white-space: nowrap;
}

/* ===== WIND COMPASS ===== */
.wind-compass {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.wind-compass .compass-dial {
  display: inline-block;
  width: 20px;
  height: 20px;
  position: relative;
}
.wind-compass .compass-dial svg {
  width: 20px;
  height: 20px;
  display: block;
}
.wind-compass .compass-needle {
  transform-origin: 10px 10px;
  animation: needle-pulse 2s ease-in-out infinite;
}
@keyframes needle-pulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

/* Glow for header text */
.city-name,
.city-state,
.current-temp-inline,
.info-val {
  text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.2);
}

/* Combined chart */
.combined-chart-row {
  position: relative;
  margin-bottom: 0.6rem;
}
.combined-chart-canvas {
  width: 100%;
  height: 80px;
  display: block;
  border-radius: 8px;
  background: rgba(0,0,0,0.12);
}
.combined-chart-stats {
  position: absolute;
  bottom: 4px;
  left: 8px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0.25rem 0.5rem;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  border-radius: 4px;
  z-index: 5;
}
.combined-chart-stats .stat-group {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.05rem;
}
.combined-chart-stats .stat-group-title {
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.05rem;
}
.combined-chart-stats .stat {
  display: flex;
  justify-content: center;
  gap: 0.15rem;
}
.combined-chart-stats .stat-label {
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.45);
  min-width: 12px;
}
.combined-chart-stats .stat-val {
  font-size: 0.7rem;
  font-weight: 700;
  color: rgba(255,255,255,0.95);
}
.combined-chart-stats .divider {
  width: 1px;
  background: rgba(255,255,255,0.1);
}

/* City compass row */
.city-compass-row {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
}
</style>
</head>
<body translate="no">

<canvas id="particle-canvas"></canvas>

<header class="header">
  <h1 class="logo">hasW</h1>
  <button id="unit-toggle" class="btn btn-small" title="Toggle °F/°C">°F</button>
  <button id="refresh-btn" class="btn btn-small" title="Refresh data">⟳</button>
  <span id="user-location" class="location-display"></span>
</header>

<main id="city-grid" class="city-grid">
  <!-- City cards injected here -->
</main>

<div id="location-prompt" class="modal-overlay hidden">
  <div class="modal-card glass">
    <h2>Enter a city name</h2>
    <input type="text" id="city-input" placeholder="e.g. Newark, Boston, Philadelphia..." autofocus>
    <button id="search-btn" class="btn btn-primary">Search</button>
  </div>
</div>

<script>
// ===== API ENDPOINTS =====
const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
const AIR_QUALITY_API = 'https://air-quality-api.open-meteo.com/v1/air-quality';
const IP_API = 'https://ipinfo.io/json';
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';

// ===== WMO WEATHER CODES =====
const WMO_CODES = {
  0: { icon: 'sun', label: 'Clear Sky' },
  1: { icon: 'sun', label: 'Mainly Clear' },
  2: { icon: 'cloud-sun', label: 'Partly Cloudy' },
  3: { icon: 'cloud', label: 'Overcast' },
  45: { icon: 'fog', label: 'Foggy' },
  48: { icon: 'fog', label: 'Rime Fog' },
  51: { icon: 'drizzle', label: 'Light Drizzle' },
  53: { icon: 'drizzle', label: 'Moderate Drizzle' },
  55: { icon: 'drizzle', label: 'Dense Drizzle' },
  56: { icon: 'freezing-rain', label: 'Freezing Drizzle' },
  57: { icon: 'freezing-rain', label: 'Heavy Freezing Drizzle' },
  61: { icon: 'rain', label: 'Light Rain' },
  63: { icon: 'rain', label: 'Moderate Rain' },
  65: { icon: 'rain', label: 'Heavy Rain' },
  66: { icon: 'freezing-rain', label: 'Freezing Rain' },
  67: { icon: 'freezing-rain', label: 'Heavy Freezing Rain' },
  71: { icon: 'snow', label: 'Light Snow' },
  73: { icon: 'snow', label: 'Moderate Snow' },
  75: { icon: 'snow', label: 'Heavy Snow' },
  77: { icon: 'snow-grains', label: 'Snow Grains' },
  80: { icon: 'showers', label: 'Light Showers' },
  81: { icon: 'showers', label: 'Moderate Showers' },
  82: { icon: 'showers', label: 'Violent Showers' },

// ===== UTILITY FUNCTIONS =====
function toF(c) { return c * 9/5 + 32; }
function toC(f) { return (f - 32) * 5/9; }
function convertTemp(celsius) {
  if (celsius == null || celsius !== celsius) return NaN;
  return unit === 'F' ? toF(celsius) : toC(celsius);
}
function tempUnit() { return unit === 'F' ? '°F' : '°C'; }

function haversine(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
            Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
  let b = Math.atan2(y, x) * 180 / Math.PI;
  return (b + 360) % 360;
}

function bearingToCompass(deg) {
  const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function aqiLabel(aqi) {
  if (!aqi && aqi !== 0) return { label: '—', cls: '' };
  if (aqi <= 50) return { label: 'Good', cls: 'aqi-good' };
  if (aqi <= 100) return { label: 'Moderate', cls: 'aqi-moderate' };
  return { label: 'Unhealthy', cls: 'aqi-unhealthy' };
}

function sanitizeId(str) {
  return str.replace(/[^a-zA-Z0-9]/g, '_');
}

// ===== WIND COMPASS =====
function getWindCompass(deg) {
  const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  const idx = Math.round(deg / 22.5) % 16;
  const arrow = ['⬆', '↗', '➡', '↘', '⬇', '↙', '⬅', '↖'][Math.round(deg / 45) % 8];
  return `<span class="wind-compass"><span class="compass-dial">${arrow}</span> ${bearingToCompass(deg)} ${deg}°</span>`;
}

// ===== DAY/NIGHT CHECK =====
function isDaytime(hour, sunrise, sunset) {
  return hour >= sunrise && hour < sunset;
}

// ===== FIND NEARBY CITIES =====
function scaleViewbox(lat, lon, radiusDeg) {
  const south = (lat - radiusDeg).toFixed(4);
  const north = (lat + radiusDeg).toFixed(4);
  const west = (lon - radiusDeg).toFixed(4);
  const east = (lon + radiusDeg).toFixed(4);
  return `${west},${north},${east},${south}`;
}

async function findNearbyCities(lat, lon) {
  console.log('[hasW] findNearbyCities(lat=%s, lon=%s)', lat, lon);

  if (_nearbyCache && Date.now() - _nearbyCacheTime < 600000) {
    console.log('[hasW] findNearbyCities() returning cached (%d cities)', _nearbyCache.length);
    return _nearbyCache;
  }

  let viewbox = scaleViewbox(lat, lon, 0.45);
  let url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=20&addressdetails=1`;
  console.log('[hasW] Nominatim URL (50km):', url);

  let results;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Nominatim ${resp.status}`);
    results = await resp.json();
    console.log('[hasW] Nominatim results (50km):', results.length);
  } catch (e) {
    console.warn('[hasW] Nominatim 50km failed:', e);
    results = [];
  }

  if (results.length < 6) {
    viewbox = scaleViewbox(lat, lon, 1.0);
    url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=30&addressdetails=1`;
    console.log('[hasW] Nominatim URL (100km):', url);
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const extra = await resp.json();
        const existing = new Set(results.map(r => r.place_id));
        extra.forEach(r => { if (!existing.has(r.place_id)) { results.push(r); existing.add(r.place_id); } });
        console.log('[hasW] Nominatim results (100km):', results.length);
      }
    } catch (e) {
      console.warn('[hasW] Nominatim 100km failed:', e);
    }
  }

  if (results.length === 0) {
    console.log('[hasW] Nominatim returned empty, showing prompt');
    showLocationPrompt();
    return [];
  }

  const cities = results.map(item => {
    const address = item.address || {};
    let name = item.name || address.city || '';
    let state = address.state || address.county || '';
    let country = address.country || '';
    name = name.replace(/^City of\s+/i, '');

    return {
      name,
      latitude: parseFloat(item.lat),
      longitude: parseFloat(item.lon),
      state,
      country,
      distance: haversine(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
      bearing: bearing(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
    };
  });

  const seen = new Set();
  const deduped = cities.filter(c => {
    const key = c.name.toLowerCase().trim();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  deduped.sort((a, b) => a.distance - b.distance);

  const selected = [deduped[0]];
  const used = new Set([0]);
  const remaining = deduped.filter((_, i) => !used.has(i));
  remaining.sort((a, b) => {
    const aMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(a.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    const bMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(b.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    return bMinDiff - aMinDiff;
  });

  for (const city of remaining) {
    if (selected.length >= 6) break;
    let tooClose = false;
    for (const sel of selected) {
      const dist = haversine(city.latitude, city.longitude, sel.latitude, sel.longitude);
      if (dist < 8) { tooClose = true; break; }
    }
    if (!tooClose) {
      selected.push(city);
      used.add(deduped.indexOf(city));
    }
  }

  for (let i = 0; i < deduped.length && selected.length < 6; i++) {
    if (!used.has(i)) selected.push(deduped[i]);
  }

  _nearbyCache = selected;
  _nearbyCacheTime = Date.now();
  return selected;
}

// ===== FETCH WEATHER =====
async function fetchWeatherForCities(cities) {
  console.log('[hasW] fetchWeatherForCities(%d cities):', cities.length);
  cities.forEach((c, i) => console.log(`  ${i}: ${c.name} (${c.latitude}, ${c.longitude})`));

  try {
    const weatherUrl = `${WEATHER_API}?latitude=${cities.map(c => c.latitude).join(',')}&longitude=${cities.map(c => c.longitude).join(',')}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index,visibility&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum&forecast_days=8&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=auto`;
    console.log('[hasW] Weather API URL:', weatherUrl);

    const weatherRes = await fetch(weatherUrl);
    console.log('[hasW] Weather API response status:', weatherRes.status);

    if (!weatherRes.ok) {
      console.error('[hasW] Weather API error:', weatherRes.status, weatherRes.statusText);
      return cities.map(c => ({ ...c, weather: null, aqi: {} }));
    }

    const weatherAll = await weatherRes.json();

    const aqiUrl = `${AIR_QUALITY_API}?latitude=${cities.map(c => c.latitude).join(',')}&longitude=${cities.map(c => c.longitude).join(',')}&current=us_aqi,pm2_5,european_aqi&timezone=auto`;
    const aqiRes = await fetch(aqiUrl);
    const aqiData = await aqiRes.json();

    const result = cities.map((city, i) => {
      let cityWeather;
      if (Array.isArray(weatherAll)) {
        const raw = weatherAll[i] || {};
        const rawHourlyKeys = Object.keys(raw).filter(k => k !== 'latitude' && k !== 'longitude' && k !== 'elevation' && k !== 'generationtime_ms' && k !== 'utc_offset_seconds' && k !== 'timezone' && k !== 'timezone_abbreviation' && k !== 'current' && k !== 'daily');
        const mergedHourly = raw.hourly ? { ...raw.hourly } : { time: weatherAll[0]?.hourly?.time || [] };
        rawHourlyKeys.forEach(k => {
          const val = raw[k];
          if (Array.isArray(val) && val.length > 0 && typeof val[0] !== 'object') {
            mergedHourly[k] = val;
          }
        });
        cityWeather = {
          current: raw.current || {},
          hourly: mergedHourly,
          daily: raw.daily || weatherAll[0]?.daily || {},
        };
      } else {
        const hasResultsArray = Array.isArray(weatherAll.results);
        if (hasResultsArray) {
          const raw = weatherAll.results[i] || {};
          const rawHourlyKeys = Object.keys(raw).filter(k => k !== 'latitude' && k !== 'longitude' && k !== 'elevation' && k !== 'generationtime_ms' && k !== 'utc_offset_seconds' && k !== 'timezone' && k !== 'timezone_abbreviation' && k !== 'current' && k !== 'daily');
          const mergedHourly = raw.hourly ? { ...raw.hourly } : { time: weatherAll.hourly?.time || [] };
          rawHourlyKeys.forEach(k => {
            const val = raw[k];
            if (Array.isArray(val) && val.length > 0 && typeof val[0] !== 'object') {
              mergedHourly[k] = val;
            }
          });
          cityWeather = {
            current: raw.current || {},
            hourly: mergedHourly,
            daily: raw.daily || weatherAll.daily || {},
          };
        } else {
          cityWeather = {
            current: weatherAll.current || {},
            hourly: weatherAll.hourly || { time: [] },
            daily: weatherAll.daily || {},
          };
        }
      }

      let aqiResult;
      if (Array.isArray(aqiData)) {
        aqiResult = aqiData[i] || {};
      } else {
        const hasAqiResultsArray = Array.isArray(aqiData.results);
        if (hasAqiResultsArray) {
          aqiResult = aqiData.results[i] || {};
        } else {
          aqiResult = {
            us_aqi: aqiData.current?.us_aqi ?? aqiData.us_aqi,
            pm2_5: aqiData.current?.pm2_5 ?? aqiData.pm2_5,
            european_aqi: aqiData.current?.european_aqi ?? aqiData.european_aqi,
          };
        }
      }

      return {
        ...city,
        weather: cityWeather,
        aqi: aqiResult,
      };
    });

    return result;
  } catch (e) {
    console.error('[hasW] fetchWeatherForCities() caught error:', e);
    return cities.map(c => ({ ...c, weather: null, aqi: {} }));
  }
}

function applyBackgrounds() {

    style.id = 'dynamic-bg';
    document.head.appendChild(style);
  }

function renderCityCard(data) {
  const w = data.weather;
  const a = data.aqi;
  if (!w || !w.current) {
    return `<div style="padding:2rem;text-align:center;">Error loading data</div>`;
  }

  const current = w.current || {};
  const hourly = w.hourly || {};
  const daily = w.daily || {};
  const aqiData = aqiLabel(a.us_aqi || 0);

  const curTemp = current?.temperature_2m != null ? convertTemp(current.temperature_2m) : '—';
  const feelsLike = current?.apparent_temperature != null ? convertTemp(current.apparent_temperature) : '—';
  const curWeatherCode = current?.weather_code ?? 0;
  const humidity = current?.relative_humidity_2m ?? '—';
  const windSpeed = current?.wind_speed_10m ?? '—';
  const windDir = current?.wind_direction_10m ?? 0;
  const pressure = current?.surface_pressure ?? '—';
  const uv = current?.uv_index ?? '—';
  const vis = current?.visibility ? (current.visibility / 1609.34).toFixed(1) : '—';
  const pm25 = a.pm2_5 !== undefined && a.pm2_5 !== null ? a.pm2_5 : '—';

  const highTemp = daily?.temperature_2m_max?.[0] != null ? convertTemp(daily.temperature_2m_max[0]) : '—';
  const lowTemp = daily?.temperature_2m_min?.[0] != null ? convertTemp(daily.temperature_2m_min[0]) : '—';

  // Store high/low on data object so drawMergedChart can use them
  data.highTemp = highTemp;
  data.lowTemp = lowTemp;

  const sunrise = daily?.sunrise?.[0]?.split('T')[1]?.split('+')[0];
  const sunset = daily?.sunset?.[0]?.split('T')[1]?.split('+')[0];

  const now = new Date();
  const currentHour = now.getHours();
  const sunriseTime = sunrise ? parseInt(sunrise.split(':')[0]) : 6;
  const sunsetTime = sunset ? parseInt(sunset.split(':')[0]) : 19;
  const isDay = isDaytime(currentHour, sunriseTime, sunsetTime);

  const curIcon = isDay ? getWeatherIcon(curWeatherCode) : getMoonIcon(curWeatherCode);
  const curIconLarge = isDay ? getWeatherIcon(curWeatherCode, 80) : getMoonIcon(curWeatherCode, 80);

  const timeArr = hourly?.time || [];
  const currentDay = now.toISOString().split('T')[0];
  const currentIdx = timeArr.findIndex(t => {
    const [datePart, timePart] = t.split('T');
    return datePart === currentDay && timePart.startsWith(`T${String(currentHour).padStart(2, '0')}`);
  });

  let hourlyHTML = '';
  for (let i = 0; i < 12; i++) {
    const hIdx = currentIdx >= 0 ? currentIdx + 1 + i : currentHour + 1 + i;
    if (hIdx < 0 || hIdx >= timeArr.length) break;
    const hTime = timeArr[hIdx]?.split('T')[1]?.split('+')[0]?.slice(0, 5);
    const hTemp = hourly?.temperature_2m?.[hIdx] != null ? convertTemp(hourly.temperature_2m[hIdx]) : 0;
    const precipMM = hourly?.precipitation?.[hIdx] || 0;
    const hPrecip = precipMM > 0.1 ? `${Math.round(precipMM)}mm` : '';
    const hCode = hourly?.weather_code?.[hIdx] ?? 0;
    const isCurrent = i === 0;
    const hHour = parseInt(hTime.split(':')[0]);
    const hIsDay = isDaytime(hHour, sunriseTime, sunsetTime);
    const hWind = hourly?.wind_speed_10m?.[hIdx] != null ? `${Math.round(hourly.wind_speed_10m[hIdx])} km/h` : '';
    hourlyHTML += `<div class="hour-slot${isCurrent ? ' current' : ''}">
      <div class="hour-time">${hTime}</div>
      <div class="hour-icon">${isCurrent ? curIcon : (hIsDay ? getWeatherIcon(hCode) : getMoonIcon(hCode))}</div>
      <div class="hour-temp">${Math.round(hTemp)}°</div>
      ${hWind ? `<div class="hour-wind">${hWind}</div>` : ''}
      ${hPrecip ? `<div class="hour-precip">${hPrecip}</div>` : ''}
    </div>`;
  }

  let dailyHTML = '';
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const globalMin = -40, globalMax = 80;
  const dailyArr = daily?.time || [];
  const todayIdx = dailyArr.findIndex(d => d && d.split('T')[0] === currentDay);
  const startIdx = todayIdx >= 0 ? todayIdx + 1 : 0;

  for (let i = 0; i < 7; i++) {
    const idx = startIdx + i;
    if (idx >= dailyArr.length) break;
    const d = dailyArr[idx];
    const day = d ? dayNames[new Date(d).getDay()] : '';
    const dCode = daily?.weather_code?.[idx] ?? 0;
    const dHigh = daily?.temperature_2m_max?.[idx] != null ? convertTemp(daily.temperature_2m_max[idx]) : 0;
    const dLow = daily?.temperature_2m_min?.[idx] != null ? convertTemp(daily.temperature_2m_min[idx]) : 0;

    const dWind = daily?.wind_speed_10m_max?.[idx] != null ? `${Math.round(daily.wind_speed_10m_max[idx])} km/h` : '';
    const barLeft = ((dLow - globalMin) / (globalMax - globalMin)) * 100;

    dailyHTML += `<div class="daily-row">

    <div class="city-compass-row" style="display:flex;align-items:center;gap:0.4rem;margin-top:0.1rem;">
      <span class="compass-heading">${bearingToCompass(data.bearing)}</span>

      </div>
      <div class="info-item">
        <span class="info-label">☀️</span>

// ===== CLEAN CANVAS CHART =====
function drawMergedChart(canvasId, cityData, dayHigh, dayLow) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width;
  const h = rect.height;
  const pad = { top: 6, right: 0, bottom: 6, left: 0 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const hourly = cityData.hourly || {};
  // Slice to 24 hours (current day only), convert temps to current unit
  const temps = (hourly.temperature_2m || []).slice(0, 24).map(v => convertTemp(v));
  const rain = (hourly.precipitation || []).slice(0, 24);
  const wind = (hourly.wind_speed_10m || []).slice(0, 24);

  if (temps.length === 0) return;

  const n = temps.length;
  const stepX = plotW / (n - 1 || 1);

  // Temp range - use day high/low when available
  const tempMin = (dayLow != null ? dayLow : Math.min(...temps)) - 2;
  const tempMax = (dayHigh != null ? dayHigh : Math.max(...temps)) + 2;
  const tempRange = tempMax - tempMin || 1;

  // Rain max
  const rainMax = Math.max(...rain, 0.5);

  // Wind max
  const windMax = Math.max(...wind, 1);

  // Draw grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 3; i++) {
    const y = pad.top + (plotH / 3) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + plotW, y);
    ctx.stroke();
  }

  // Temperature area fill
  const tempFillGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  tempFillGrad.addColorStop(0, 'rgba(255,140,66,0.25)');
  tempFillGrad.addColorStop(1, 'rgba(255,140,66,0.02)');

  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + (n - 1) * stepX, pad.top + plotH);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = tempFillGrad;
  ctx.fill();

  // Temperature line
  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#ff8c42';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Temperature dots
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff8c42';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Rain bars (bottom)
  const rainH = plotH * 0.25;
  const rainY = pad.top + plotH - rainH;
  const barW = Math.max(2, stepX * 0.5);
  rain.forEach((v, i) => {
    const x = pad.left + i * stepX + (stepX - barW) / 2;
    const barH = (v / rainMax) * rainH;
    ctx.fillStyle = `rgba(77,166,255,${0.15 + (v / rainMax) * 0.35})`;
    ctx.fillRect(x, rainY + rainH - barH, barW, barH);
  });

  // Wind line (subtle)
  ctx.beginPath();
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * (plotH * 0.15);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(125,217,160,0.3)';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Temp labels on left
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 3; i++) {
    const val = tempMax - (tempRange / 3) * i;
    const y = pad.top + (plotH / 3) * i;
    ctx.fillText(Math.round(val) + '°', pad.left + 17, y + 3);
  }

}

      console.log(`[hasW] drawAllCharts() skipping ${data.name} (no weather)`);
      return;
    }
    const w = data.weather;
    const hourly = w.hourly || {};
    const safeName = sanitizeId(data.name);

    if (Object.keys(hourly).length === 0) {
      console.log(`[hasW] drawAllCharts() skipping ${data.name} (empty hourly)`);
      return;
    }

    console.log(`[hasW] drawAllCharts() drawing charts for ${data.name} (hourly keys: ${Object.keys(hourly).join(', ')})`);
    drawMergedChart(`chart-merged-${safeName}`, data.weather, data.highTemp, data.lowTemp);
    drawCombinedChart(`chart-combined-${safeName}`, data.weather);
  });
}

// ===== PARTICLE CANVAS =====
function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 30; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      opacity: Math.random() * 0.1 + 0.05,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y -= p.speed;
      if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

// ===== LOCATION PROMPT =====
function showLocationPrompt() {
  document.getElementById('location-prompt').classList.remove('hidden');
}

function hideLocationPrompt() {
  document.getElementById('location-prompt').classList.add('hidden');
}

async function handleCitySearch() {
  const input = document.getElementById('city-input');
  const city = input.value.trim();
  if (!city) return;

  hideLocationPrompt();
  input.value = '';

  try {
    const url = `${NOMINATIM}?q=${encodeURIComponent(city)}&format=jsonv2&limit=1`;
    const res = await fetch(url);
    const data = await res.json();
    if (data?.length > 0) {
      userLocation = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
      document.getElementById('user-location').textContent = `📍 ${userLocation.lat.toFixed(2)}°N, ${Math.abs(userLocation.lon).toFixed(2)}°W`;
      await run();
    }
  } catch (e) {
    console.error('City search failed:', e);
  }
}

// ===== REFRESH & UNIT TOGGLE =====
function toggleUnit() {
  unit = unit === 'F' ? 'C' : 'F';
  const btn = document.getElementById('unit-toggle');
  if (btn) btn.textContent = `°${unit}`;
  renderAll();
}

async function refresh() {
  if (isLoading) return;
  isLoading = true;
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.disabled = true;

  await run();

  btn.classList.remove('spinning');
  btn.disabled = false;
  isLoading = false;
}

// ===== MAIN RUN =====
async function run() {
  console.log('[hasW] === run() called ===');

  if (!userLocation) {
    console.log('[hasW] No userLocation, calling getLocation()...');
    userLocation = await getLocation();
    console.log('[hasW] getLocation() returned:', userLocation);
  }

  const locEl = document.getElementById('user-location');
  if (locEl) locEl.textContent = `📍 ${userLocation.lat.toFixed(2)}°N, ${Math.abs(userLocation.lon).toFixed(2)}°W`;

  _nearbyCache = null;
  _nearbyCacheTime = 0;

  console.log('[hasW] Calling findNearbyCities(lat=%s, lon=%s)...', userLocation.lat, userLocation.lon);
  const cities = await findNearbyCities(userLocation.lat, userLocation.lon);
  console.log('[hasW] findNearbyCities() returned %d cities:', cities.length, cities);

  if (cities.length === 0) {
    console.log('[hasW] No cities found!');
    return;
  }

  console.log('[hasW] Calling fetchWeatherForCities(%d cities)...', cities.length);
  weatherData = await fetchWeatherForCities(cities);
  console.log('[hasW] fetchWeatherForCities() returned %d weather entries:', weatherData.length);
  weatherData.forEach((wd, i) => {
    console.log(`[hasW]   City ${i}: ${wd.name} - weather=${wd.weather ? 'OK' : 'null'}, aqi=${wd.aqi ? JSON.stringify(wd.aqi) : 'null'}`);
  });

  console.log('[hasW] Calling renderAll()...');
  renderAll();
  console.log('[hasW] === run() done ===');
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  console.log('[hasW] DOMContentLoaded fired');
  initParticles();

  const unitBtn = document.getElementById('unit-toggle');
  const refreshBtn = document.getElementById('refresh-btn');
  const searchBtn = document.getElementById('search-btn');
  const cityInput = document.getElementById('city-input');

  if (unitBtn) {
    unitBtn.addEventListener('click', toggleUnit);
    console.log('[hasW] unit-toggle button attached');
  }
  if (refreshBtn) {
    refreshBtn.addEventListener('click', refresh);
    console.log('[hasW] refresh-btn button attached');
  }
  if (searchBtn) {
    searchBtn.addEventListener('click', handleCitySearch);
    console.log('[hasW] search-btn button attached');
  }
  if (cityInput) {
    cityInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleCitySearch();
    });
    console.log('[hasW] city-input attached');
  }

  console.log('[hasW] Calling run() from DOMContentLoaded');
  run();
});
