<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hasWeather</title>
<link rel="icon" href="hasWeather-low.png" type="image/png">
<link rel="stylesheet" href="css/main.css">
</head>
<body translate="no">

<!-- Radar background (fixed, behind everything) -->
<div id="radar-background"></div>

<canvas id="particle-canvas"></canvas>

<header class="header">
  <h1 class="logo">hasWeather</h1>
   <button id="unit-toggle" class="btn btn-small" title="Toggle °F/°C">°F</button>
   <div class="radar-toggle-group">
     <button id="radar-toggle-btn" class="btn btn-small radar-toggle-btn" title="View Radar" aria-label="View Radar">👁</button>
     <select id="radar-overlay-select" class="btn btn-small radar-overlay-select" title="Radar Overlay"></select>
   </div>
   <button id="refresh-btn" class="btn btn-small" title="Refresh data">⟳</button>
   <button id="game-btn" class="btn btn-small" title="Donkey Runner Minigame">🫏</button>
   <button id="fullscreen-btn" class="btn btn-small" title="Toggle fullscreen" style="display:none;">⛶</button>
  <span id="user-location" class="location-display"></span>
  <select id="debug-location-select" class="btn btn-small debug-location-select" title="Select test location">
    <option value="local">Local</option>
    <option value="25.2854:51.5310">Qatar</option>
    <option value="24.4539:54.3773">Abu Dhabi</option>
    <option value="50.1109:8.6821">Frankfurt</option>
    <option value="33.4709:-81.9648">Augusta, GA</option>
    <option value="42.3601:-71.0589">Boston, MA</option>
    <option value="35.2271:-80.8431">Charlotte, NC</option>
  </select>
</header>

<!-- Local sensor bar (populated by js/local-sensor.js) -->
<div id="local-sensor-bar" class="sensor-bar"></div>

<main id="city-grid" class="city-grid">
  <!-- City cards injected here -->
</main>


<script src="weather-local.js"></script>
<script src="js/constants.js"></script>
<script src="js/cache.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/api-openmeteo.js"></script>
<script src="js/api-openstreetmap.js"></script>
<script src="js/api-nws.js"></script>
<script src="js/api-radar.js"></script>
<script src="js/render.js"></script>
<script src="js/charts.js"></script>
  <script src="js/network-monitor.js"></script>
  <script src="js/donkey-runner.js"></script>
 <script src="js/local-sensor.js"></script>
 <script src="js/main.js"></script>
</body>
</html>
