<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hasWeather</title>
<link rel="icon" href="hasWeather-low.png" type="image/png">
<style>
/* ===== main.css - Entry Point ===== */
/* This file imports all modular CSS components */
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}/* ===== LAYOUT - Core layout and structural styles ===== */

/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 2rem;
  position: relative;
  z-index: 10;
}

.logo {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #fff;
}

.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: rgba(255,255,255,0.15); }
.btn:active { transform: scale(0.96); }
.btn-small { padding: 0.3rem 0.6rem; font-size: 0.85rem; }
.btn-primary {
  background: rgba(70,130,255,0.3);
  border-color: rgba(70,130,255,0.5);
  font-size: 1rem;
  padding: 0.6rem 1.2rem;
}

.location-display {
  margin-left: auto;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.6);
}

#refresh-btn.spinning {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Game toggle button */
#game-btn {
  background: rgba(100, 200, 100, 0.1);
  border-color: rgba(100, 200, 100, 0.2);
}

#game-btn:hover {
  background: rgba(100, 200, 100, 0.2);
}

#game-btn.active {
  background: rgba(100, 200, 100, 0.25);
  border-color: rgba(100, 200, 100, 0.4);
  box-shadow: 0 0 8px rgba(100, 200, 100, 0.2);
}

/* Source toggle button */
#source-toggle {
  font-weight: 600;
  letter-spacing: 0.02em;
}

#source-toggle.nws {
  background: rgba(70, 130, 255, 0.3);
  border-color: rgba(70, 130, 255, 0.5);
}

#source-toggle.nws:hover {
  background: rgba(70, 130, 255, 0.4);
}

#source-toggle.loading {
  animation: spin 1s linear infinite;
}

#source-toggle.disabled {
  background: rgba(128,128,128,0.1);
  border-color: rgba(128,128,128,0.2);
  color: rgba(255,255,255,0.3);
  cursor: not-allowed;
}

#source-toggle.disabled:hover {
  background: rgba(128,128,128,0.1);
}

#source-toggle.disabled:active {
  transform: none;
}

/* ===== CITY GRID ===== */
.city-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(280px, 1fr));
  gap: 1rem;
  padding: 1rem 2rem 2rem;
  position: relative;
  z-index: 1;
}

@media (max-width: 1400px) {
  .city-grid { grid-template-columns: repeat(3, minmax(280px, 1fr)); }
}
@media (max-width: 900px) {
  .city-grid { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
}
@media (max-width: 600px) {
  .city-grid { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; }
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 2rem;
  min-width: 320px;
  animation: fadeInUp 0.3s ease;
}
.modal-card h2 {
  font-size: 1.2rem;
  margin-bottom: 1rem;
}
.modal-card input {
  width: 100%;
  padding: 0.6rem 0.8rem;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 1rem;
  margin-bottom: 0.8rem;
  outline: none;
}
.modal-card input:focus {
  border-color: rgba(70,130,255,0.6);
}
.modal-card .btn {
  width: 100%;
}

/* ===== LOADING ===== */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem;
  color: rgba(255,255,255,0.5);
  font-size: 1rem;
}

/* ===== GLOW FOR HEADER TEXT ===== */
.city-name,
.city-state,
.current-temp-inline,
.info-val {
  text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.2);
}/* ===== CARD-COMPONENTS - Card-related display components ===== */

/* ===== LOCAL SENSOR BAR ===== */
.sensor-bar {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding: 0.5rem 1.5rem;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px) saturate(188%);
  border-top: 1px solid rgba(255,255,255,0.07);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

/* Info line (note + timestamp + source) - centered */
.sensor-bar > :first-child {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  padding: 0 0.5rem;
  width: 100%;
}

.sensor-info-note,
.sensor-info-timestamp,
.sensor-info-source {
  justify-content: center;
  align-items: center;
  font-size: 0.6rem;
  color: rgba(255,255,255,0.35);
  white-space: nowrap;
  display: flex;
}

.sensor-expiry-warning {
  font-size: 0.75rem;
  color: rgba(255,80,80,0.8);
  text-align: center;
  padding: 0.3rem 0;
}

/* Sensor items - centered flex row */
.sensor-items {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  align-items: center;
  justify-content: center;
  padding: 0 0.5rem;
}

/* Individual sensor item - compact size */
.sensor-item {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.15rem 0.45rem;
  border-radius: 6px;
  background: rgba(0,0,0,0.18);
  flex-shrink: 0;
  transition: opacity 0.3s ease;
}

.sensor-item.hidden {
  opacity: 0;
  pointer-events: none;
  height: 0;
  padding: 0;
  margin: 0;
  overflow: hidden;
}

/* Location item - wider to accommodate combined coords */
.sensor-location {
  flex-basis: auto;
}

.sensor-icon {
  font-size: 0.7rem;
  line-height: 1;
}

.sensor-label {
  font-size: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.35);
  white-space: nowrap;
}

.sensor-value {
  font-size: 0.75rem;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  white-space: nowrap;
}

.sensor-value.hot {
  color: #ff8c42;
}

.sensor-value.cool {
  color: #6cb4ee;
}

.sensor-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Sensor bar responsive */
@media (max-width: 900px) {
  .sensor-bar {
    gap: 0.5rem;
    padding: 0.4rem 1rem;
  }
}

/* ===== CARD-COMPONENTS - Card-related display components ===== */

/* ===== CITY CARD ===== */
.city-card {
  position: relative;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px) saturate(188%);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px;
  padding: 0.5rem;
  overflow: visible;
  transition: transform 0.3s, box-shadow 0.3s, opacity 0.4s ease;
  animation: fadeInUp 0.6s ease forwards;
  opacity: 0;
  margin-right: 2rem;
  margin-top: 1rem;
}
.city-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.city-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.4;
  transition: opacity 2s;
  z-index: -1;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== CARD HEADER ===== */
.city-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.4rem;
  position: relative;
}
.city-name-wrap {
  display: flex;
  flex-direction: column;
  gap: 0;
  align-items: flex-end;
}
.city-name {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;
}
.city-state {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
  font-weight: 400;
  letter-spacing: 0.02em;
  text-align: right;
}
.city-meta {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.45);
}
.current-temp-inline {
  font-size: 2.4rem;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  z-index: 1;
}
.current-weather-icon-inline {
  width: 80px;
  height: 80px;
  position: absolute;
  top: -50%;
  left: 100%;
  transform: translate(-50%, -50%);
  opacity: 0.5;
  pointer-events: none;
  z-index: 0;
}

.current-weather {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 0.8rem;
}
.weather-icon {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}
.current-temp {
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1;
}
.current-weather-meta {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.55);
}

/* Source badge */
.source-badge {
  display: inline-block;
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.1rem 0.3rem;
  border-radius: 8px;
  margin-left: 0.3rem;
  vertical-align: middle;
  line-height: 1;
}
.source-badge.enhanced {
  background: rgba(70, 130, 255, 0.3);
  color: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(70, 130, 255, 0.4);
}
.source-badge.open-meteo {
  background: rgba(100, 200, 100, 0.3);
  color: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(100, 200, 100, 0.4);
}

/* Details row: HIGH / LOW / ☀️ / 🌙 */
.info-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.8rem;
  padding: 0.45rem 0.6rem;
  background: rgba(0,0,0,0.12);
  border-radius: 8px;
}
.info-item {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.info-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.4);
}
.info-val {
  font-size: 1.05rem;
  font-weight: 700;
}
.info-val.hot { color: #ff8c42; }
.info-val.cool { color: #6cb4ee; }

/* Details Grid */
.details-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
  padding: 0.6rem;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
}
.detail-cell {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.detail-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
}
.detail-value {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.aqi-badge {
  display: inline-block;
  padding: 0.1rem 0.3rem;
  border-radius: 8px;
  font-size: 0.7rem;
  font-weight: 600;
}
.aqi-good { background: rgba(76,175,80,0.3); color: #81c784; }
.aqi-moderate { background: rgba(255,193,7,0.3); color: #ffd54f; }
.aqi-unhealthy { background: rgba(244,67,54,0.3); color: #e57373; }

/* High/Low + Sun */
.high-low-section {
  margin-bottom: 0.8rem;
  padding: 0.5rem;
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
}
.high-low-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.3rem;
}
.high-label { color: #ff8c42; font-weight: 700; }
.low-label  { color: #6cb4ee; font-weight: 700; }
.high-val, .low-val { font-weight: 700; }
.sun-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.55);
}

/* Hourly Forecast */
.hourly-section {
  position: relative;
  margin-bottom: 0.8rem;
}
.hourly-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.4rem;
}
.hourly-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(6, auto);
  gap: 0.3rem;
}
.hour-slot {
  text-align: center;
  padding: 0.4rem 0.3rem;
  border-radius: 8px;
  background: rgba(0,0,0,0.15);
  border: 1px solid transparent;
  transition: border-color 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100px;
}
.hour-slot.current {
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08);
}
.hour-time {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.1rem;
}
.hour-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hour-icon .weather-svg {
  width: 48px;
  height: 48px;
}
.hour-temp {
  font-size: 0.8rem;
  font-weight: 600;
  margin-top: 0.15rem;
}
.hour-precip {
  font-size: 0.55rem;
  color: #6cb4ee;
  margin-top: 0.05rem;
}
.hour-wind {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.55);
  margin-top: 0.05rem;
}

/* Canvas Charts */
.charts-section {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-bottom: 0.8rem;
}
.chart-title {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.4);
  margin-bottom: 0.15rem;
}
.chart-canvas {
  width: 100%;
  height: 100px;
  display: block;
  border-radius: 8px;
  background: rgba(0,0,0,0.12);
}

/* Chart stats row */
.chart-stats-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.4rem;
  margin-bottom: 0.3rem;
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
}
.chart-stats-row .stat {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.05rem;
}
.chart-stats-row .stat-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.35);
}
.chart-stats-row .stat-val {
  font-size: 0.8rem;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
}

/* Overlaid charts container */
.overlaid-charts {
  position: relative;
  width: 100%;
  height: 80px;
  margin-bottom: 0.4rem;
}
.overlaid-charts canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 8px;
}

/* Charts group below header */
.charts-group {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  margin-bottom: 0.6rem;
}
.chart-row {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.chart-row-title {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.4);
  padding: 0 0.2rem;
}

/* Combined chart */
.combined-chart-row {
  position: relative;
  margin-bottom: 0.6rem;
  margin-top: 2rem;
}
.combined-chart-canvas {
  top: 12px;
  width: 100%;
  height: 80px;
  display: block;
  border-radius: 8px;
  background: rgba(0,0,0,0.12);
}
.combined-chart-stats {
  position: absolute;
  bottom: 0px;
  left: 0px;
  right: 0px;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0.25rem 0.5rem;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  border-radius: 8px;
  z-index: 5;
}
.combined-chart-stats .stat-group {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.05rem;
}
.combined-chart-stats .stat-group-title {
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.05rem;
}
.combined-chart-stats .stat {
  display: flex;
  justify-content: center;
  gap: 0.15rem;
}
.combined-chart-stats .stat-label {
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.45);
  min-width: 12px;
}
.combined-chart-stats .stat-val {
  font-size: 0.7rem;
  font-weight: 700;
  color: rgba(255,255,255,0.95);
}
.combined-chart-stats .divider {
  width: 1px;
  background: rgba(255,255,255,0.1);
}

/* ===== NWS GHOST OVERLAY - Section-specific ghost elements ===== */

/* Ghost value styling - dark blue tint, reduced opacity */
.nws-ghost {
  pointer-events: none;
  opacity: 0.25;
  color: #003087 !important;
}

/* ===== GHOST HEADER ELEMENTS (positioned relative to city-header) ===== */

/* Ghost temperature - offset from OM temp (which is at right side of header) */
.nws-ghost-temp {
  position: absolute;
  top: calc(50% + 5px);
  left: calc(100% - 16px);
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1;
}

/* Ghost weather icon - offset from OM icon (which is at left: 100%; top: -50%) */
.nws-ghost-icon {
  position: absolute;
  top: -30%;
  left: calc(100% + 8px);
  width: 48px;
  height: 48px;
}

/* Ghost NOAA badge */
.nws-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  margin-left: 0.3rem;
  vertical-align: middle;
}

.nws-badge svg {
  width: 100%;
  height: 100%;
}

/* ===== GHOST DETAILS GRID (positioned relative to details-grid) ===== */
.nws-ghost-details {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  padding: 0.6rem;
}

/* Ghost detail cell */
.nws-ghost-detail-cell {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.nws-ghost-detail-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(0, 48, 135, 0.4);
}

.nws-ghost-detail-value {
  font-size: 0.7rem;
  font-weight: 600;
  color: #003087;
}

/* ===== GHOST HOURLY FORECAST (positioned relative to hourly-section) ===== */
.nws-ghost-hourly {
  position: absolute;
  margin-top: 1.3rem;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(6, auto);
  gap: 0.3rem;
}

.nws-ghost-hour-slot {
  text-align: center;
  padding: 0.4rem 0.3rem;
  border-radius: 8px;
  background: rgba(0, 48, 135, 0.06);
  border: 1px solid rgba(0, 48, 135, 0.1);
  height: 100px;
}

.nws-ghost-hour-slot.current {
  border-color: rgba(0, 48, 135, 0.2);
  background: rgba(0, 48, 135, 0.1);
}


.nws-ghost-hour-temp {
  font-size: 0.65rem;
  font-weight: 600;
  color: #003087;
}

.nws-ghost-hour-wind {
  font-size: 0.5rem;
  color: rgba(0, 48, 135, 0.35);
}

.nws-ghost-hour-precip {
  font-size: 0.45rem;
  color: rgba(0, 48, 135, 0.4);
}

/* Ghost icon for weather */
.nws-ghost-icon svg {
  width: 48px;
  height: 48px;
}

/* Ghost hourly icon */
.nws-ghost-hour-icon {
  width: 36px;
  height: 36px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nws-ghost-hour-icon svg {
  width: 36px;
  height: 36px;
}

/* ===== PLACEHOLDER CARD (before data loads) ===== */
.city-card.placeholder {
  background: rgba(255,255,255,0.02);
  border-color: rgba(255,255,255,0.04);
}

.city-card.placeholder::before {
  display: none;
}

/* Placeholder city name with pulsing animation */
.placeholder-name {
  font-size: 1.3rem;
  font-weight: 700;
  color: rgba(255,255,255,0.5);
  animation: placeholderPulse 2s ease-in-out infinite;
}

@keyframes placeholderPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.8; }
}

/* Placeholder state text */
.placeholder-state {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.02em;
  margin-top: 0.1rem;
}

/* Placeholder distance text */
.placeholder-distance {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.2);
  margin-top: 0.1rem;
}

/* Placeholder card content layout */
.placeholder-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 80px;
  gap: 0.2rem;
}

/* Loading state for cards that have some data but not all */
.city-card.loading-om {
  opacity: 0.6;
}

.city-card.loading-nws {
  opacity: 0.7;
}

/* Transition animation when OM data arrives - fade in weather content */
.city-card.transitioning-to-full {
  transition: opacity 0.3s ease, background 1s ease;
}/* ===== INTERACTIVE - Interactive elements and visual effects ===== */

/* ===== SVG WEATHER ICONS - LOUD & ANIMATED ===== */
.weather-svg {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.weather-svg .sun { stroke: #ffd54f; fill: #ffd54f; }
.weather-svg .moon { stroke: #e0e0e0; fill: #e0e0e0; }
.weather-svg .cloud { stroke: #b0bec5; fill: rgba(176,190,197,0.3); }
.weather-svg .rain { stroke: #64b5f6; fill: none; }
.weather-svg .snow { stroke: #e0e0e0; fill: none; }

/* Icon animation classes */
.weather-icon-animated {
  overflow: visible;
}

/* Sun: rotating rays + pulsing glow */
.weather-icon-sun .icon-glow {
  transform-origin: 32px 32px;
}
.weather-icon-sun .icon-rotate {
  transform-origin: 32px 32px;
  animation: icon-rotate 20s linear infinite;
}

@keyframes icon-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Moon: bobbing + twinkling stars */
.weather-icon-moon .icon-bob {
  animation: icon-bob 4s ease-in-out infinite;
}

@keyframes icon-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Cloud: drifting */
.weather-icon-cloud .icon-drift,
.weather-icon-cloud-sun .icon-drift,
.weather-icon-rain .icon-drift,
.weather-icon-snow .icon-drift,
.weather-icon-fog .icon-drift {
  animation: icon-drift 3s ease-in-out infinite;
}

@keyframes icon-drift {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(2px); }
}

/* Thunderstorm: shaking + lightning flash */
.weather-icon-thunder .icon-shake {
  animation: icon-shake 2s ease-in-out infinite;
}

@keyframes icon-shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  10% { transform: translateX(-1px) rotate(-1deg); }
  20% { transform: translateX(1px) rotate(1deg); }
  30% { transform: translateX(0); }
  40% { transform: translateX(-1px) rotate(-0.5deg); }
  50% { transform: translateX(0); }
}

.weather-icon-animated .icon-bolt {
  animation: icon-flash 2s ease-in-out infinite;
}

@keyframes icon-flash {
  0%, 100% { opacity: 1; }
  48% { opacity: 1; }
  50% { opacity: 0.3; }
  52% { opacity: 1; }
  70% { opacity: 1; }
  72% { opacity: 0.4; }
  74% { opacity: 1; }
}

/* ===== WIND COMPASS ===== */
.wind-compass {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.wind-compass .compass-dial {
  display: inline-block;
  width: 20px;
  height: 20px;
  position: relative;
}
.wind-compass .compass-dial svg {
  width: 20px;
  height: 20px;
  display: block;
}
.wind-compass .compass-needle {
  transform-origin: 10px 10px;
  animation: needle-pulse 2s ease-in-out infinite;
}
@keyframes needle-pulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

/* ===== NETWORK OUTAGE PANEL ===== */
.outage-panel {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 180;
  display: block;
  background: none;
  backdrop-filter: none;
  opacity: 0;
  pointer-events: none;
  bottom: 20px;
  top: auto;
  transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1), top 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

.outage-panel.outage-visible {
  opacity: 1;
  pointer-events: auto;
  animation: outageSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes outageSlideIn {
  from {
    transform: translateX(-50%) translateY(100vh);
    opacity: 0;
  }
  to {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
}

.outage-panel.outage-hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.outage-glass {
  background: rgba(20, 25, 40, 0.85);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid rgba(255, 100, 100, 0.2);
  border-radius: 24px;
  padding: 2rem 2.5rem;
  width: fit-content;
  min-width: 360px;
  max-width: 460px;
  margin: 0 auto;
  text-align: center;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.5),
    0 0 60px rgba(255, 80, 80, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* Donkey Icon */
.outage-donkey-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 1.2rem;
  animation: donkeyBounce 2s ease-in-out infinite;
}

.outage-donkey-svg {
  width: 100%;
  height: 100%;
}

.outage-donkey-svg .donkey-head {
  fill: rgba(180, 160, 140, 0.6);
  stroke: rgba(140, 120, 100, 0.8);
}

.outage-donkey-svg .donkey-ear {
  stroke: rgba(140, 120, 100, 0.8);
  stroke-width: 2;
}

.outage-donkey-svg .donkey-ear-inner {
  stroke: rgba(200, 140, 140, 0.5);
  stroke-width: 1.5;
}

.outage-donkey-svg .donkey-eye {
  fill: #1a1a2e;
  stroke: none;
}

.outage-donkey-svg .donkey-nostril {
  fill: rgba(100, 80, 70, 0.6);
  stroke: none;
}

.outage-donkey-svg .donkey-mouth {
  stroke: rgba(100, 80, 70, 0.7);
  stroke-width: 1.5;
  fill: none;
}

.outage-donkey-svg .donkey-man {
  stroke: rgba(80, 60, 50, 0.5);
  stroke-width: 2;
}

@keyframes donkeyBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-2deg); }
  75% { transform: translateY(-2px) rotate(2deg); }
}

/* Title */
.outage-title {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin: 0 0 1.5rem;
  animation: glitchText 3s infinite;
  background: linear-gradient(90deg, #ff6b6b, #ffa500, #ff6b6b, #ff4757, #ffa500);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes glitchText {
  0%, 90%, 100% {
    transform: translate(0);
    filter: none;
  }
  91% {
    transform: translate(-2px, 1px);
    filter: hue-rotate(90deg);
  }
  93% {
    transform: translate(2px, -1px);
    filter: hue-rotate(-90deg);
  }
  95% {
    transform: translate(-1px, -1px);
    filter: hue-rotate(0deg);
  }
  97% {
    transform: translate(1px, 1px);
  }
}

/* Glitch text area */
.outage-glitch {
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.2rem;
  position: relative;
}

.glitch-text {
  font-size: 1rem;
  line-height: 1.5;
  color: rgba(255, 200, 180, 0.9);
  font-weight: 500;
  animation: textFlicker 4s infinite;
}

@keyframes textFlicker {
  0%, 100% { opacity: 1; }
  5% { opacity: 0.85; }
  10% { opacity: 1; }
  50% { opacity: 1; }
  52% { opacity: 0.9; }
  54% { opacity: 1; }
}

/* Scanline overlay */
.outage-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
  pointer-events: none;
  border-radius: 24px;
}

/* Status indicator */
.outage-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.5);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4444;
  animation: pulse 1.5s ease-in-out infinite;
}

.status-dot.retrying {
  background: #ffa500;
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}

/* Progress bar */
.outage-progress {
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #ff6b6b, #ffa500);
  border-radius: 2px;
  transition: none;
}

/* ===== RADAR CARD WRAPPER ===== */
.radar-card-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 1rem 2rem 2rem;
}
/* ===== DONKEY RUNNER MINIGAME ===== */
.donkey-panel {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 640px;
  max-width: 95vw;
  z-index: 200;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 60px rgba(100, 200, 100, 0.05);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  transform-origin: top center;
  will-change: transform, opacity;
}

.donkey-panel.donkey-visible {
  top: 80px;
  opacity: 1;
  pointer-events: auto;
}

.donkey-panel.donkey-hidden {
  top: -200px;
  opacity: 0;
  pointer-events: none;
}

/* Header - full width titlebar with scores */
.donkey-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 0.8rem;
  background: rgba(0, 0, 0, 0.35);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  gap: 0.6rem;
}

/* Touch-friendly buttons */
.donkey-panel-header button {
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.2);
  color: rgba(255, 255, 255, 0.85);
  min-width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  flex-shrink: 0;
}

.donkey-panel-header button:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.35);
}

.donkey-panel-header button:active {
  background: rgba(255, 255, 255, 0.3);
}

.donkey-close-btn {
  font-size: 1.1rem;
  font-weight: 700;
}

.donkey-close-btn:hover {
  background: rgba(239, 68, 68, 0.25);
  border-color: rgba(239, 68, 68, 0.5);
  color: #ef4444;
}

/* Score section (left side) */
.donkey-header-score {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}

/* Score display - 7-segment look */
.donkey-score {
  font-size: 1.8rem;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 0.08em;
  line-height: 1.1;
  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.3),
    0 2px 4px rgba(0, 0, 0, 0.5);
  font-family: 'Courier New', 'Lucida Console', monospace;
}

/* Title (center) */
.donkey-title {
  font-size: 0.7rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.05em;
  text-align: center;
  white-space: nowrap;
  flex-shrink: 0;
}

/* High score section (right side) */
.donkey-header-highscore {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}

/* High score display */
.donkey-highscore {
  font-size: 1.2rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.08em;
  line-height: 1.1;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
}

/* Body */
.donkey-panel-body {
  padding: 0.3rem 0.8rem 0.8rem;
}

/* Sound toggle button - muted state (inherits header button base styles) */
.donkey-sound-btn.muted {
  color: rgba(255, 255, 255, 0.35);
  opacity: 0.65;
}

/* Play area — canvas + overlays, positioned relative */
.donkey-play-area {
  position: relative;
  width: 100%;
  height: 180px;
  overflow: hidden;
}

/* Canvas inside play area */
#donkey-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}

#donkey-canvas:hover {
  box-shadow:
    0 0 15px rgba(100, 200, 100, 0.15),
    inset 0 0 15px rgba(100, 200, 100, 0.03);
  border-color: rgba(100, 200, 100, 0.25);
}

/* Start screen overlay (canvas area only, centered) */
.donkey-startscreen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10, 14, 24, 0.88);
  z-index: 5;
  padding: 1.2rem;
  text-align: center;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.donkey-startscreen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.ds-subtitle {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}

.ds-objective {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.25);
  line-height: 1.6;
  margin: 0 auto 1rem;
  text-align: center;
}

.ds-highscore {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  margin-bottom: 1rem;
  padding: 0.4rem 0.8rem;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.ds-highscore-label {
  font-size: 0.6rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 0.1em;
}

.ds-highscore-val {
  font-size: 0.9rem;
  font-weight: 900;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.08em;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
}

.ds-controls {
  margin-bottom: 0.7rem;
}

.ds-ctrl-row {
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.4);
  margin-bottom: 0.25rem;
  letter-spacing: 0.03em;
}

.ds-ctrl-row kbd {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 3px;
  padding: 1px 5px;
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.55);
}

.ds-prompt {
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.35);
  animation: startPromptBlink 1.8s ease-in-out infinite;
  letter-spacing: 0.04em;
}

@keyframes startPromptBlink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* Game over overlay (canvas area only) */
.donkey-gameover {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(5, 8, 16, 0.85);
  backdrop-filter: blur(3px);
  z-index: 10;
  transition: opacity 0.2s ease;
}

.donkey-gameover.hidden {
  opacity: 0;
  pointer-events: none;
}

/* GAME OVER title — the hero of the panel, big and dramatic */
.donkey-gameover-text {
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: 0.22em;
  color: #e05555;
  margin-bottom: 0.3rem;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 20px rgba(224, 85, 85, 0.6), 0 0 40px rgba(224, 85, 85, 0.3), 0 0 60px rgba(224, 85, 85, 0.15);
  animation: gameoverShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, gameoverPulse 2.5s ease-in-out 0.6s infinite;
}

@keyframes gameoverShake {
  0% { transform: scale(2) translateY(-20px); opacity: 0; }
  20% { transform: scale(1.4) translateY(5px); opacity: 0.8; }
  40% { transform: scale(1.1) translateY(-3px); opacity: 1; }
  60% { transform: scale(1.02) translateY(1px); }
  80% { transform: scale(0.99) translateY(-1px); }
  100% { transform: scale(1) translateY(0); }
}

@keyframes gameoverPulse {
  0%, 100% { text-shadow: 0 0 20px rgba(224, 85, 85, 0.6), 0 0 40px rgba(224, 85, 85, 0.3), 0 0 60px rgba(224, 85, 85, 0.15); }
  50% { text-shadow: 0 0 30px rgba(224, 85, 85, 0.8), 0 0 50px rgba(224, 85, 85, 0.4), 0 0 80px rgba(224, 85, 85, 0.2); }
}

/* Score — prominent but not overpowering the GAME OVER text */
.donkey-gameover-score {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 0.6rem;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}

/* New high score badge — clean, compact */
.donkey-gameover-new {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 0.5rem;
  padding: 0.15rem 0.5rem;
  background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), rgba(74, 222, 128, 0.08));
  border: 1px solid rgba(74, 222, 128, 0.3);
  border-radius: 20px;
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #4ade80;
  animation: newBadgePulse 1.5s ease-in-out 0.6s infinite;
}

.donkey-gameover-new.hidden {
  display: none;
}

.donkey-gameover-new-label {
  letter-spacing: 0.12em;
}

.donkey-gameover-new-score {
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: #4ade80;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
}

@keyframes newBadgePulse {
  0%, 100% { box-shadow: 0 0 8px rgba(74, 222, 128, 0.1); }
  50% { box-shadow: 0 0 16px rgba(74, 222, 128, 0.25); }
}

/* Corner stat blocks — compact, no overlap with center heroes */
.donkey-gameover-stats-top-left,
.donkey-gameover-stats-top-right,
.donkey-gameover-stats-bottom-left,
.donkey-gameover-stats-bottom-right {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
  padding: 0.25rem 0.4rem;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 4px;
}

.donkey-gameover-stats-top-left {
  left: 8px;
  top: 8px;
}

.donkey-gameover-stats-top-right {
  right: 8px;
  top: 8px;
}

.donkey-gameover-stats-bottom-left {
  left: 8px;
  bottom: 8px;
}

.donkey-gameover-stats-bottom-right {
  right: 8px;
  bottom: 8px;
}

/* Corner stat row */
.donkey-gameover-stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.4rem;
  line-height: 1.1;

<script>
// ===== DATA CACHE =====
// Unified cache for ALL API calls with configurable TTL per type and LRU eviction

// NWS cache key — used by cross-source lookups to check for cached NWS data.
// Defined here (before utils.js) so it's available when the NWS toggle code runs.
function nwsCacheKey(lat, lon) {
  return `nws_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// ===== NWS RATE LIMITER =====
// NWS API limit: 1 request/second, burst of 3.
// Moved here (before utils.js) so isNwsBoundsAvailable can use it during initial page load.
const _nwsRateLimiter = {
  lastRequestTime: 0,
  burstCount: 0,
  burstWindow: 0,
  maxBurst: 3,
  burstWindowMs: 1000,
  minIntervalMs: 1000,

  _checkBurst() {
    const now = Date.now();
    if (now - this.burstWindow > this.burstWindowMs) {
      this.burstCount = 0;
      this.burstWindow = now;
    }
    return this.burstCount < this.maxBurst;
  },

  _waitForBurst() {
    return new Promise(resolve => {
      const check = () => {
        if (this._checkBurst()) resolve();
        else setTimeout(check, 50);
      };
      check();
    });
  },

  async waitForSlot() {
    const now = Date.now();
    const timeSinceLast = now - this.lastRequestTime;

    // If we're within the burst window and at max burst, wait
    if (timeSinceLast < this.burstWindowMs && !this._checkBurst()) {
      await this._waitForBurst();
    }

    // Ensure minimum interval between requests
    if (timeSinceLast < this.minIntervalMs) {
      await new Promise(r => setTimeout(r, this.minIntervalMs - timeSinceLast));
    }

    this.burstCount++;
    this.burstWindow = Date.now();
    this.lastRequestTime = Date.now();
  },
};

// ===== NWS TOGGLE STATE =====
// Track which cities have NWS data actively displayed (per-city toggle).
// The per-city toggle allows users to switch individual city cards from Open-Meteo (OM) base data
// to NWS-enhanced data. The toggle state is persisted to localStorage for cross-session
// persistence, so user preferences are remembered across app reloads.
//
// Note: _nwsActive entries are intentionally NOT cleaned up when cities are removed.
// This preserves the user's preference when a city is removed and later re-added.
// Over time this may result in stale entries, but the localStorage size impact is negligible
// (a single entry is ~30 bytes; even 1000 cities would be < 32KB).
const NWS_ACTIVE_STORAGE_KEY = 'hasW_nwsActive';
let _nwsActive = {}; // { place_id: boolean }

// Restore NWS toggle state from localStorage on load
try {
  const saved = localStorage.getItem(NWS_ACTIVE_STORAGE_KEY);
  if (saved) _nwsActive = JSON.parse(saved);
} catch { /* ignore corrupted data */ }

function saveNwsActiveState() {
  try {
    localStorage.setItem(NWS_ACTIVE_STORAGE_KEY, JSON.stringify(_nwsActive));
  } catch { /* ignore storage errors */ }
}

const DataCache = {
  // Default: max number of cache entries per type before LRU eviction kicks in
  MAX_ENTRIES_PER_TYPE: 500,

  // TTLs in milliseconds
  TTL: {
    weather: 15 * 60 * 1000,      // 15 minutes
    airQuality: 15 * 60 * 1000,   // 15 minutes
    geocode: 24 * 60 * 60 * 1000, // 24 hours
    nearby: 15 * 60 * 1000,       // 15 minutes (aligned with weather TTL)
    ipLocation: 24 * 60 * 60 * 1000, // 24 hours
    nwsPoint: 15 * 60 * 1000,     // 15 minutes
    nwsForecast: 10 * 60 * 1000,  // 10 minutes
    nwsHourly: 5 * 60 * 1000,     // 5 minutes
    nwsCurrent: 10 * 60 * 1000,   // 10 minutes
    nwsObservation: 5 * 60 * 1000, // 5 minutes
    nwsAlerts: 2 * 60 * 1000,     // 2 minutes
    nwsZoneForecast: 10 * 60 * 1000, // 10 minutes
    nwsCityData: 10 * 60 * 1000,   // 10 minutes (NWS city data)
    nwsStations: 30 * 60 * 1000,   // 30 minutes (observation stations)
    nwsObsLatest: 5 * 60 * 1000,   // 5 minutes (latest observation from station)
    nwsObsHistorical: 5 * 60 * 1000, // 5 minutes (historical observation)
    nwsProducts: 10 * 60 * 1000,   // 10 minutes (text products)
    nwsAviation: 10 * 60 * 1000,   // 10 minutes (aviation data)
    nwsRadar: 5 * 60 * 1000,       // 5 minutes (radar data)
    nwsGrid: 10 * 60 * 1000,       // 10 minutes (raw gridpoint data)
    nwsZone: 15 * 60 * 1000,       // 15 minutes (zone metadata)
    nwsCounty: 15 * 60 * 1000,     // 15 minutes (county metadata)
    nwsOffice: 15 * 60 * 1000,     // 15 minutes (office metadata)
    nwsActiveAlerts: 2 * 60 * 1000, // 2 minutes (active alerts)
    nwsAlertTypes: 60 * 60 * 1000,  // 60 minutes (alert type list)
    nwsProductTypes: 60 * 60 * 1000, // 60 minutes (product type list)
    nwsProductLocations: 60 * 60 * 1000, // 60 minutes (product location list)
    nwsRadarServers: 60 * 60 * 1000, // 60 minutes (radar server list)
    nwsRadarStations: 60 * 60 * 1000, // 60 minutes (radar station list)
    nwsGlossary: 24 * 60 * 60 * 1000, // 24 hours (glossary)
    nwsOffices: 15 * 60 * 1000,    // 15 minutes (office list)
  },

  // Round coordinates to 2 decimal places (~1km accuracy) for cache key grouping
  _roundCoord(coord) {
    return Math.round(coord * 100) / 100;
  },

  // Get the LRU list key for a cache type
  _lruKey(type) {
    return `hasw_lru_${type}`;
  },

  // Get the LRU list for a type (array of keys, most-recently-used first)
  _getLruList(type) {
    try {
      const raw = localStorage.getItem(this._lruKey(type));
      if (!raw) return [];
      const list = JSON.parse(raw);
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  },

  // Set the LRU list for a type
  _setLruList(type, list) {
    try {
      localStorage.setItem(this._lruKey(type), JSON.stringify(list));
    } catch (e) {
      // ignore LRU write failures
    }
  },

  // Evict least-recently-used entries when the cache exceeds the limit
  _evictIfNecessary(type) {
    try {
      const maxEntries = this.MAX_ENTRIES_PER_TYPE;
      const lruList = this._getLruList(type);
      if (lruList.length <= maxEntries) return;

      // Remove the oldest entries (they're at the end of the LRU list)
      const toRemove = lruList.splice(0, lruList.length - maxEntries);
      for (const key of toRemove) {
        localStorage.removeItem(`hasw_cache_${key}`);
        console.log(`[DataCache] EVICTED (LRU): ${key}`);
      }
      this._setLruList(type, lruList);
    } catch (e) {
      // ignore eviction failures
    }
  },

  // Move a key to the front of the LRU list (most-recently-used)
  _touchLru(type, key) {
    try {
      const lruList = this._getLruList(type);
      const idx = lruList.indexOf(key);
      if (idx !== -1) {
        lruList.splice(idx, 1); // remove from current position
      }
      lruList.unshift(key); // move to front
      this._setLruList(type, lruList);
    } catch (e) {
      // ignore LRU touch failures
    }
  },

  // Check if a cache entry exists and is not expired
  has(key, type) {
    try {
      const raw = localStorage.getItem(`hasw_cache_${key}`);
      if (!raw) {
        console.log(`[DataCache] MISS (not found): ${key}`);
        return false;
      }
      const entry = JSON.parse(raw);
      // Validate type matches (always check, even when type is falsy — skip only for backward compat)
      if (type != null && entry.type !== type) {
        console.log(`[DataCache] MISS (type mismatch): ${key} (expected: ${type}, got: ${entry.type})`);
        return false;
      }
      // Use entry.type for TTL lookup when type is null, to avoid undefined TTL
      const ttlKey = type != null ? type : entry.type;
      const expired = !entry || (Date.now() - entry.timestamp > this.TTL[ttlKey]);
      if (expired) {
        console.log(`[DataCache] MISS (expired): ${key} (type: ${ttlKey})`);
        return false;
      }
      console.log(`[DataCache] HIT: ${key} (type: ${type})`);
      return true;
    } catch (e) {
      console.log(`[DataCache] MISS (error): ${key}`);
      return false;
    }
  },

  // Get cached data (returns null if expired/missing/wrong type)
  get(key, type) {
    try {
      const raw = localStorage.getItem(`hasw_cache_${key}`);
      if (!raw) {
        console.log(`[DataCache] MISS (not found): ${key}`);
        return null;
      }
      const entry = JSON.parse(raw);
      // Validate type matches (always check, even when type is falsy — skip only for backward compat)
      if (type != null && entry.type !== type) {
        console.log(`[DataCache] MISS (type mismatch): ${key} (expected: ${type}, got: ${entry.type})`);
        return null;
      }
      // Use entry.type for TTL lookup when type is null, to avoid undefined TTL
      const ttlKey = type != null ? type : entry.type;
      if (Date.now() - entry.timestamp > this.TTL[ttlKey]) {
        console.log(`[DataCache] MISS (expired): ${key} (type: ${ttlKey}, age: ${Math.round((Date.now() - entry.timestamp) / 1000)}s, ttl: ${this.TTL[ttlKey] / 1000}s)`);
        localStorage.removeItem(`hasw_cache_${key}`);
        return null;
      }
      console.log(`[DataCache] HIT: ${key} (type: ${type}, age: ${Math.round((Date.now() - entry.timestamp) / 1000)}s)`);
      this._touchLru(type, key);
      return entry.data;
    } catch (e) {
      console.log(`[DataCache] MISS (parse error): ${key}`, e);
      return null;
    }
  },

  // Store data with timestamp and type
  set(key, data, type) {
    try {
      const size = new Blob([JSON.stringify({ timestamp: Date.now(), type: type, data: data })]).size;
      console.log(`[DataCache] SET: ${key} (type: ${type}, size: ${Math.round(size / 100)} / 100B)`);
      localStorage.setItem(`hasw_cache_${key}`, JSON.stringify({
        timestamp: Date.now(),
        type: type,
        data: data
      }));
      this._touchLru(type, key);
      this._evictIfNecessary(type);
    } catch (e) {
      console.log(`[DataCache] SET FAILED: ${key} - ${e.message}`);
    }
  },

  // Invalidate a specific cache key
  invalidate(key) {
    console.log(`[DataCache] INVALIDATE: ${key}`);
    localStorage.removeItem(`hasw_cache_${key}`);
  },

};

</script>
<script>
// ===== UTILITY FUNCTIONS =====
function toF(c) { return c * 9 / 5 + 32; }
function toC(f) { return (f - 32) * 5 / 9; }
function convertTemp(celsius) {
  if (celsius == null || celsius !== celsius) return NaN;
  return unit === 'F' ? toF(celsius) : toC(celsius);
}
function tempUnit() { return unit === 'F' ? '°F' : '°C'; }

function escapeHTML(str) {
  if (typeof str !== 'string') return str;
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = EARTH_RADIUS_MI;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
            Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
  let b = Math.atan2(y, x) * 180 / Math.PI;
  return (b + 360) % 360;
}

function bearingToCompass(deg) {
  const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function aqiLabel(aqi) {
  if (aqi === null || aqi === undefined || aqi === false || aqi !== aqi) return { label: '—', cls: '' };
  if (aqi <= 50) return { label: 'Good', cls: 'aqi-good' };
  if (aqi <= 100) return { label: 'Moderate', cls: 'aqi-moderate' };
  return { label: 'Unhealthy', cls: 'aqi-unhealthy' };
}

// ===== WIND COMPASS =====
function getWindCompass(deg) {
  const arrow = ['⬆', '↗', '➡', '↘', '⬇', '↙', '⬅', '↖'][Math.round(deg / 45) % 8];
  return `<span class="wind-compass"><span class="compass-dial">${arrow}</span> ${bearingToCompass(deg)} ${deg}°</span>`;
}

// ===== DAY/NIGHT CHECK =====
function isDaytime(hour, sunrise, sunset) {
  return hour >= sunrise && hour < sunset;
}

// ===== IP-BASED LOCATION API CLIENT =====
// Provides fallback geolocation via ipinfo.io.

// ===== ENDPOINT =====
const IP_API = 'https://ipinfo.io/json';

// ===== GET LOCATION (Browser Geolocation + IP Fallback) =====
async function getLocation() {
  // Check in-memory cache
  if (userLocation) return userLocation;

  // Check localStorage cache for IP geolocation
  const cachedIP = DataCache.get('ip_location', 'ipLocation');
  if (cachedIP) {
    return cachedIP;
  }

  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: GEOLOCATION_TIMEOUT_MS });
    });
    const { latitude, longitude } = pos.coords;
    const loc = { lat: latitude, lon: longitude };
    // Cache browser geolocation briefly (it's not reliable to cache long-term)
    return loc;
  } catch {
    try {
      const res = await fetch(IP_API);
      const data = await res.json();
      const lat = parseFloat(data.loc?.split(',')[0] ?? data.lat);
      const lon = parseFloat(data.loc?.split(',')[1] ?? data.lon);
      const loc = { lat, lon };
      // Cache IP location for 24 hours
      DataCache.set('ip_location', loc, 'ipLocation');
      return loc;
    } catch {
      return { lat: 43.41947, lon: -83.95081 };
    }
  }
}

// ===== NWS BOUNDS CHECK =====
// Track NWS bounds availability per city (checked during initial fetch)
const _nwsBoundsCache = {}; // { lat,lon: Promise<boolean> | { value: boolean, expiresAt: number } }
const NWS_BOUNDS_CACHE_TTL_MS = 60 * 60 * 1000; // 1 hour TTL

async function isNwsBoundsAvailable(lat, lon) {
  const key = `${DataCache._roundCoord(lat)},${DataCache._roundCoord(lon)}`;
  if (key in _nwsBoundsCache) {
    const entry = _nwsBoundsCache[key];
    // If it's a TTL entry, check expiration
    if (typeof entry === 'object' && !entry.then && 'value' in entry) {
      if (Date.now() < entry.expiresAt) return entry.value;
      delete _nwsBoundsCache[key]; // Expired — fall through to re-check
    } else {
      // It's a pending Promise — return it (concurrent request dedup)
      return entry;
    }
  }
  const promise = (async () => {
    try {
      const url = `${NWS_API}/points/${lat},${lon}`;
      // Use rate-limited NWS fetch to avoid 429s during bulk checks
      await _nwsRateLimiter.waitForSlot();
      const data = await (await fetch(url)).json();
      const props = data?.properties || {};
      return !!(props.gridId || props.cwa) && !!props.gridX && !!props.gridY;
    } catch {
      return false;
    }
  })();
  // Cache as Promise while pending
  _nwsBoundsCache[key] = promise;
  const result = await promise;
  // Replace with TTL entry after resolution
  _nwsBoundsCache[key] = { value: result, expiresAt: Date.now() + NWS_BOUNDS_CACHE_TTL_MS };
  return result;
}

// ===== BACKGROUND REFRESH =====
let _bgRefreshTimer = null;

// Get the shortest remaining TTL across all cities' weather + AQI caches
function getCityShortestTTL(city) {
  let shortest = Infinity;
  const lat = city.latitude;
  const lon = city.longitude;

  // Check consolidated cache key (weatherAqi) first — this is the new format
  const consolidatedKey = weatherAqiCacheKey(lat, lon);
  const consolidatedEntry = localStorage.getItem(`hasw_cache_${consolidatedKey}`);
  if (consolidatedEntry) {
    const entry = JSON.parse(consolidatedEntry);
    const ttl = DataCache.TTL[entry.type] || DataCache.TTL.weather;
    const remaining = ttl - (Date.now() - entry.timestamp);
    if (remaining < shortest) shortest = remaining;
  }

  // Check legacy weather cache key (backward compatibility)
  const weatherKey = weatherCacheKey(lat, lon);
  const weatherEntry = localStorage.getItem(`hasw_cache_${weatherKey}`);
  if (weatherEntry && !consolidatedEntry) {
    const entry = JSON.parse(weatherEntry);
    const ttl = DataCache.TTL[entry.type] || DataCache.TTL.weather;
    const remaining = ttl - (Date.now() - entry.timestamp);
    if (remaining < shortest) shortest = remaining;
  }

  // Check legacy AQI cache key (backward compatibility)
  const aqiKey = aqiCacheKey(lat, lon);
  const airEntry = localStorage.getItem(`hasw_cache_${aqiKey}`);
  if (airEntry && !consolidatedEntry) {
    const entry = JSON.parse(airEntry);
    const ttl = DataCache.TTL[entry.type] || DataCache.TTL.airQuality;
    const remaining = ttl - (Date.now() - entry.timestamp);
    if (remaining < shortest) shortest = remaining;
  }

  // Check NWS cache — only nwsPoint entries matter (they have the longest TTL among NWS types)
  const nwsPointKey = nwsPointCacheKey(lat, lon);
  const nwsEntry = localStorage.getItem(`hasw_cache_${nwsPointKey}`);
  if (nwsEntry) {
    const entry = JSON.parse(nwsEntry);
    const ttl = DataCache.TTL[entry.type] || DataCache.TTL.nwsPoint;
    const remaining = ttl - (Date.now() - entry.timestamp);
    if (remaining < shortest) shortest = remaining;
  }

  // Default to 15 minutes if no cache — NWS rate limits at 1 req/sec, so use a conservative default
  return shortest === Infinity ? 15 * 60 * 1000 : shortest;
}

function startBackgroundRefresh() {
  // Clear existing timer
  if (_bgRefreshTimer) clearInterval(_bgRefreshTimer);
  
  // Calculate the shortest remaining TTL across all cities and use 80% of it as the refresh interval (with a minimum of 1 minute)
  let shortestTTL = Infinity;
  if (weatherData.length > 0) {
    for (const city of weatherData) {
      const ttl = getCityShortestTTL(city);
      if (ttl < shortestTTL) shortestTTL = ttl;
    }
  }
  
  // Use 80% of the shortest TTL as the refresh interval, with a minimum of 1 minute
  const interval = Math.max(60 * 1000, shortestTTL * 0.8);
  
  _bgRefreshTimer = setInterval(() => {
    if (isLoading) return;
    if (!userLocation) return;
    
    // Only refresh if we have weather data
    if (weatherData.length === 0) return;
    
    // Invalidate OM caches for all cities (NWS is always fetched where available)
    for (const city of weatherData) {
      const consolidatedKey = weatherAqiCacheKey(city.latitude, city.longitude);
      DataCache.invalidate(consolidatedKey);
      // Also invalidate legacy keys for backward compatibility
      const weatherCk = weatherCacheKey(city.latitude, city.longitude);
      const aqiCk = aqiCacheKey(city.latitude, city.longitude);
      DataCache.invalidate(weatherCk);
      DataCache.invalidate(aqiCk);
    }
    
    // Re-fetch data silently
    run();
  }, interval);
}

// ===== REFRESH & UNIT TOGGLE =====
function toggleUnit() {
  if (_toggleDebounceTimer) return;
  _toggleDebounceTimer = setTimeout(() => {
    _toggleDebounceTimer = null;
    unit = unit === 'F' ? 'C' : 'F';
    const btn = document.getElementById('unit-toggle');
    if (btn) btn.textContent = `°${unit}`;
    renderAll();
    // Notify other modules that the unit changed
    window.dispatchEvent(new CustomEvent('unitChanged', { detail: { unit } }));
  }, TOGGLE_DEBOUNCE_MS);
}

async function refresh() {
  if (isLoading) return;
  isLoading = true;
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.disabled = true;

  // Clear weather, nearby, and ip caches on refresh
  DataCache.invalidate('ip_location');
  _nearbyCache = null;
  _nearbyCacheTime = 0;
  // Also invalidate nearby DataCache entry
  if (userLocation) {
    const nearbyKey = `nearby_${DataCache._roundCoord(userLocation.lat)}_${DataCache._roundCoord(userLocation.lon)}`;
    DataCache.invalidate(nearbyKey);
  }

  await run();

  btn.classList.remove('spinning');
  btn.disabled = false;
  isLoading = false;
}
