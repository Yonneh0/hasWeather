// Step 4: Fetch raw grid data (current conditions)
async function fetchCurrentConditions(wfo, x, y) {
  const cacheKey = nwsGridCacheKey(wfo, x, y, 'current');
  const cached = DataCache.get(cacheKey, 'nwsCurrent');
  if (cached) return cached;

  const url = `${NWS_API}/gridpoints/${wfo}/${x},${y}`;
  const data = await nwsFetch(url);

  const props = data?.properties || {};
  const now = new Date();

  // Find the value whose validTime covers the current time
  const findCurrent = (propName) => {
    const values = props[propName]?.values;
    if (!values || !Array.isArray(values) || values.length === 0) return null;
    const found = findCurrentNwsValue(values, now);
    if (!found) return null;
    return { value: found.value, uom: props[propName]?.uom };
  };

  const temp = findCurrent('temperature');
  const dew = findCurrent('dewpoint');
  const rh = findCurrent('relativeHumidity');
  const ws = findCurrent('windSpeed');
  const wg = findCurrent('windGust');
  const wd = findCurrent('windDirection');
  const vis = findCurrent('visibility');
  // NWS gridpoint uses 'surfacePressure' or 'surface_pressure' for surface-level pressure
  const pr = findCurrent('surfacePressure') ?? findCurrent('surface_pressure') ?? findCurrent('pressure');
  const ch = findCurrent('ceilingHeight');

  // Weather and hazards have a different structure (array of objects)
  const weatherValues = props.weather?.values;
  const weather = weatherValues && weatherValues.length > 0 ? findCurrentNwsValue(weatherValues, now)?.value ?? [] : [];
  const hazardsValues = props.hazards?.values;
  const hazards = hazardsValues && hazardsValues.length > 0 ? findCurrentNwsValue(hazardsValues, now)?.value ?? [] : [];

  // PoP has a different structure - find the closest value
  const popValues = props.probabilityOfPrecipitation?.values;
  let pop = null;
  if (popValues && popValues.length > 0) {
    const foundPop = findCurrentNwsValue(popValues, now);
    pop = foundPop?.value ?? null;
  }

  // QPE has a different structure - find the closest value
  const qpeValues = props.quantitativePrecipitation?.values;
  let qpe = null;
  let qpeUnit = null;
  if (qpeValues && qpeValues.length > 0) {
    const foundQpe = findCurrentNwsValue(qpeValues, now);
    qpe = foundQpe?.value ?? null;
    qpeUnit = props.quantitativePrecipitation?.uom ?? 'wmoUnit:mm';
  }

  // Ice accumulation - find the closest value
  const iceValues = props.iceAccumulation?.values;
  let ice = null;
  let iceUnit = null;
  if (iceValues && iceValues.length > 0) {
    const foundIce = findCurrentNwsValue(iceValues, now);
    ice = foundIce?.value ?? null;
    iceUnit = props.iceAccumulation?.uom ?? 'wmoUnit:mm';
  }

  // Snowfall - find the closest value
  const snowValues = props.snowfallAmount?.values;
  let snow = null;
  let snowUnit = null;
  if (snowValues && snowValues.length > 0) {
    const foundSnow = findCurrentNwsValue(snowValues, now);
    snow = foundSnow?.value ?? null;
    snowUnit = props.snowfallAmount?.uom ?? 'wmoUnit:mm';
  }

  // Sky cover - find the closest value
  const skyCoverValues = props.skyCover?.values;
  let skyCover = null;
  let skyCoverUnit = null;
  if (skyCoverValues && skyCoverValues.length > 0) {
    const foundSky = findCurrentNwsValue(skyCoverValues, now);
    skyCover = foundSky?.value ?? null;
    skyCoverUnit = props.skyCover?.uom ?? 'wmoUnit:percent';
  }

  const current = {
    temperature: temp?.value ?? null,
    temperatureUnit: temp?.uom ?? 'wmoUnit:degC',
    dewpoint: dew?.value ?? null,
    dewpointUnit: dew?.uom ?? 'wmoUnit:degC',
    relativeHumidity: rh?.value ?? null,
    relativeHumidityUnit: rh?.uom ?? 'wmoUnit:percent',
    windSpeed: ws?.value ?? null,
    windSpeedUnit: ws?.uom ?? 'wmoUnit:m/s',
    windGust: wg?.value ?? null,
    windGustUnit: wg?.uom ?? 'wmoUnit:m/s',
    windDirection: wd?.value ?? null,
    windDirectionUnit: wd?.uom ?? 'wmoUnit:degree_(angle)',
    weather: weather,
    hazards: hazards,
    probabilityOfPrecipitation: pop,
    quantitativePrecipitation: qpe,
    quantitativePrecipitationUnit: qpeUnit,
    iceAccumulation: ice,
    iceAccumulationUnit: iceUnit,
    snowfallAmount: snow,
    snowfallAmountUnit: snowUnit,
    skyCover: skyCover,
    skyCoverUnit: skyCoverUnit,
    ceilingHeight: ch?.value ?? null,
    ceilingHeightUnit: ch?.uom ?? 'wmoUnit:m',
    visibility: vis?.value ?? null,
    visibilityUnit: vis?.uom ?? 'wmoUnit:m',
    // Use surfacePressure if available (NWS gridpoint), fallback to pressure
    pressure: pr?.value ?? null,
    pressureUnit: pr?.uom ?? 'nwsUnit:inHg',
  };

  DataCache.set(cacheKey, current, 'nwsCurrent');
  return current;
}

async function fetchLatestObservation(stationId) {
  const cacheKey = `nws_obs_${stationId}`;
  const cached = DataCache.get(cacheKey, 'nwsObservation');
  if (cached) return cached;

  const url = `${NWS_API}/stations/${stationId}/observations/latest?require_qc=true`;
  const data = await nwsFetch(url);
  const props = data?.properties || {};

  const obs = {
    // Temperature is in Celsius (wmoUnit:degC), convert to Fahrenheit
    temperature: props.temperature?.value != null ? convertObsTempToF(props.temperature.value, props.temperature.unitCode) : null,
    temperatureUnit: props.temperature?.unitCode == null ? 'F' : props.temperature.unitCode,
    // Dewpoint is in Celsius (wmoUnit:degC), convert to Fahrenheit
    dewpoint: props.dewpoint?.value != null ? convertObsTempToF(props.dewpoint.value, props.dewpoint.unitCode) : null,
    dewpointUnit: props.dewpoint?.unitCode == null ? 'F' : props.dewpoint.unitCode,
    windDirection: props.windDirection?.value ?? null,
    // Wind speed is in km/h (wmoUnit:km_h-1), convert to mph
    windSpeed: props.windSpeed?.value != null ? convertObsWindToMph(props.windSpeed.value, props.windSpeed.unitCode) : null,
    windSpeedUnit: props.windSpeed?.unitCode == null ? 'mph' : props.windSpeed.unitCode,
    // Wind gust is in km/h (wmoUnit:km_h-1), convert to mph
    windGust: props.windGust?.value != null ? convertObsWindToMph(props.windGust.value, props.windGust.unitCode) : null,
    windGustUnit: props.windGust?.unitCode == null ? 'mph' : props.windGust.unitCode,
    // Barometric pressure is in Pa (wmoUnit:Pa), convert to hPa
    barometricPressure: props.barometricPressure?.value != null ? paToHpa(props.barometricPressure.value) : null,
    barometricPressureUnit: props.barometricPressure?.unitCode == null ? 'hPa' : props.barometricPressure.unitCode,
    seaLevelPressure: props.seaLevelPressure?.value != null ? paToHpa(props.seaLevelPressure.value) : null,
    seaLevelPressureUnit: props.seaLevelPressure?.unitCode == null ? 'hPa' : props.seaLevelPressure.unitCode,
    // Visibility is in meters (wmoUnit:m), convert to miles
    visibility: props.visibility?.value != null ? metersToMiles(props.visibility.value) : null,
    visibilityUnit: props.visibility?.unitCode == null ? 'mi' : props.visibility.unitCode,
    relativeHumidity: props.relativeHumidity?.value ?? null,
    relativeHumidityUnit: props.relativeHumidity?.unitCode == null ? '%' : props.relativeHumidity.unitCode,
    // Wind chill is in Celsius (wmoUnit:degC), convert to Fahrenheit
    windChill: props.windChill?.value != null ? convertObsTempToF(props.windChill.value, props.windChill.unitCode) : null,
    windChillUnit: props.windChill?.unitCode == null ? 'F' : props.windChill.unitCode,
    // Heat index is in Celsius (wmoUnit:degC), convert to Fahrenheit
    heatIndex: props.heatIndex?.value != null ? convertObsTempToF(props.heatIndex.value, props.heatIndex.unitCode) : null,
    heatIndexUnit: props.heatIndex?.unitCode == null ? 'F' : props.heatIndex.unitCode,
    cloudLayers: props.cloudLayers || [],
    weather: props.presentWeather || [],
    rawMessage: props.rawMessage || '',
  };

  DataCache.set(cacheKey, obs, 'nwsObservation');
  return obs;
}

// Main orchestrator: fetch all NWS data for a city's coordinates
async function fetchForCity(lat, lon) {
  const point = await resolvePoint(lat, lon);
  if (!point.wfo || !point.gridX || !point.gridY) {
    return null; // NWS doesn't cover this area
  }

  const [current, hourly] = await Promise.all([
    fetchCurrentConditions(point.wfo, point.gridX, point.gridY),
    fetchHourlyForecast(point.wfo, point.gridX, point.gridY),
  ]);

  return { point, current, hourly };
}

// NWS unit code constants
const NWS_UNIT_DEGC = 'wmoUnit:degC';
const NWS_UNIT_DEGF = 'nwsUnit:degF';
const NWS_UNIT_MS = 'wmoUnit:m/s';
const NWS_UNIT_KM_H = 'wmoUnit:km_h-1';
const NWS_UNIT_MPH = 'nwsUnit:mi/h';
const NWS_UNIT_M = 'wmoUnit:m';
const NWS_UNIT_MI = 'nwsUnit:mi';
const NWS_UNIT_HPA = 'wmoUnit:hPa';
const NWS_UNIT_INHG = 'nwsUnit:inHg';
const NWS_UNIT_MM = 'wmoUnit:mm';
const NWS_UNIT_IN = 'nwsUnit:in';
const NWS_UNIT_PERCENT = 'wmoUnit:percent';

// Convert NWS unit code to a boolean for the app's unit preference
function isNwsUnitInMeters(unitCode) {
  return unitCode === NWS_UNIT_M;
}

function isNwsUnitInMetersPerSecond(unitCode) {
  return unitCode === NWS_UNIT_MS || unitCode === NWS_UNIT_KM_H;
}

function isNwsUnitInInches(unitCode) {
  return unitCode === NWS_UNIT_IN;
}

function isNwsUnitInInchesHg(unitCode) {
  return unitCode === NWS_UNIT_INHG;
}

// Convert Celsius to Fahrenheit
function celsiusToFahrenheit(c) {
  if (c == null) return null;
  return Math.round((c * 9 / 5) + 32);
}

// Convert meters to miles
function metersToMiles(m) {
  if (m == null) return null;
  return Math.round(m / 1609.34 * 10) / 10;
}

// Convert m/s to km/h
function mpsToKmh(ms) {
  if (ms == null) return null;
  return Math.round(ms * 3.6);
}

// Convert km/h to km/h (no conversion needed)
function kmhToKmh(kmh) {
  if (kmh == null) return null;
  return Math.round(kmh);
}

// Convert mph to km/h
function mphToKmh(mph) {
  if (mph == null) return null;
  return Math.round(mph * 1.60934);
}

// Convert wind speed to km/h based on unit code
function convertWindSpeedToKmh(speed, unitCode) {
  if (speed == null) return null;
  if (unitCode === NWS_UNIT_MS) return mpsToKmh(speed);
  if (unitCode === NWS_UNIT_KM_H) return kmhToKmh(speed);
  if (unitCode === NWS_UNIT_MPH) return mphToKmh(speed);
  // Default: assume km/h
  return kmhToKmh(speed);
}

// Convert inHg to hPa
function inhgToHpa(inhg) {
  if (inhg == null) return null;
  return Math.round(inhg * 33.8639);
}

// Convert hPa to hPa (no conversion needed)
function hpaToHpa(hpa) {
  if (hpa == null) return null;
  return Math.round(hpa);
}

// Convert pressure to hPa based on unit code
function convertPressureToHpa(pressure, unitCode) {
  if (pressure == null) return null;
  if (unitCode === NWS_UNIT_INHG) return inhgToHpa(pressure);
  if (unitCode === NWS_UNIT_HPA) return hpaToHpa(pressure);
  // Default: assume hPa
  return hpaToHpa(pressure);
}

// Convert mm to inches
function mmToInches(mm) {
  if (mm == null) return null;
  return Math.round(mm / 25.4 * 100) / 100;
}

// Convert mm to inches (for snowfall)
function mmToInchesSnow(mm) {
  if (mm == null) return null;
  // Roughly: 1 inch of rain = ~10 inches of snow
  return Math.round(mm / 25.4 * 10) / 10;
}

// Convert Pa to hPa
function paToHpa(pa) {
  if (pa == null) return null;
  return Math.round(pa / 100);
}

// Convert meters to feet
function metersToFeet(m) {
  if (m == null) return null;
  return Math.round(m * 3.28084);
}

// Parse a NWS validTime string like "2026-06-13T06:00:00+00:00/PT2H" into start/end timestamps
function parseNwsValidTime(vt) {
  if (!vt) return null;
  const slashIdx = vt.indexOf('/');
  if (slashIdx === -1) return null;
  const startStr = vt.substring(0, slashIdx);
  const durationStr = vt.substring(slashIdx + 1);
  const start = new Date(startStr).getTime();
  // Parse duration like PT2H, PT1H, P1DT6H etc.
  let durationMs = 0;
  const dMatch = durationStr.match(/P(?:(\d+)D)?(?:(\d+)H)?(?:(\d+)M)?/);
  if (dMatch) {
    if (dMatch[1]) durationMs += parseInt(dMatch[1]) * 86400000;
    if (dMatch[2]) durationMs += parseInt(dMatch[2]) * 3600000;
    if (dMatch[3]) durationMs += parseInt(dMatch[3]) * 60000;
  }
  return { start, end: start + durationMs };
}

// Find the value whose validTime covers the current time
function findCurrentNwsValue(values, now) {
  if (!values || !Array.isArray(values) || values.length === 0) return null;
  const nowMs = now.getTime();
  let best = null;
  let bestDiff = Infinity;
  for (const v of values) {
    const range = parseNwsValidTime(v.validTime);
    if (!range) continue;
    // Check if current time falls within this range
    if (nowMs >= range.start && nowMs < range.end) {
      return v;
    }
    // If not within range, find the closest one
    const diff = Math.min(Math.abs(nowMs - range.start), Math.abs(nowMs - range.end));
    if (diff < bestDiff) {
      bestDiff = diff;
      best = v;
    }
  }
  return best;
}

// Convert Celsius to Fahrenheit for observation station data
function convertObsTempToF(c, unitCode) {
  if (c == null) return null;
  if (unitCode === NWS_UNIT_DEGC) return celsiusToFahrenheit(c);
  return c;
}

// Convert observation station wind speed to mph based on unit code
function convertObsWindToMph(speed, unitCode) {
  if (speed == null) return null;
  if (unitCode === NWS_UNIT_KM_H) return Math.round(speed * 0.621371);
  if (unitCode === NWS_UNIT_MS) return Math.round(speed * 2.23694);
  // Default: assume mph
  return Math.round(speed);
}

// NWS hourly forecast windSpeed is a string like "2 mph" or "10 mph"
// Extract the numeric value
function parseWindSpeedString(windSpeedStr) {
  if (typeof windSpeedStr !== 'string') return windSpeedStr;
  const match = windSpeedStr.match(/^(\d+)\s*mph$/);
  return match ? parseInt(match[1], 10) : null;
}

// Map NWS data to the app's weather data model
function nwsToAppData(city, nwsData) {
  if (!nwsData || !nwsData.current) return null;

  const { current, hourly } = nwsData;

  // Determine if we need to convert units (NWS gridpoint is always metric)
  const needsTempConversion = current.temperatureUnit === NWS_UNIT_DEGC;
  const needsWindConversion = current.windSpeedUnit !== NWS_UNIT_MPH;
  const needsVisConversion = current.visibilityUnit === NWS_UNIT_M;
  const needsPrecipConversion = current.quantitativePrecipitationUnit === NWS_UNIT_MM;

  // Build current conditions object
  // Temperature is already in Celsius (NWS gridpoint always returns Celsius)
  // Store as Celsius so convertTemp() can convert to F or C based on user preference
  const temp = current.temperature;

  // Convert wind speed to km/h for the app
  const windSpeed = convertWindSpeedToKmh(current.windSpeed, current.windSpeedUnit);

  // Convert visibility from meters to miles for the app
  const vis = needsVisConversion ? metersToMiles(current.visibility) : current.visibility;

  // Convert quantitative precipitation from mm to inches for the app
  const precip = needsPrecipConversion ? mmToInches(current.quantitativePrecipitation) : current.quantitativePrecipitation;

  // Convert ice accumulation from mm to inches for the app
  const ice = mmToInches(current.iceAccumulation);

  // Convert snowfall from mm to inches for the app
  const snow = mmToInchesSnow(current.snowfallAmount);

  // Dewpoint is already in Celsius (NWS gridpoint always returns Celsius)
  // Store as Celsius so convertTemp() can convert to F or C based on user preference
  const dewpoint = current.dewpoint;

  // Convert wind gust from m/s to km/h for the app (same as wind speed conversion)
  const windGust = convertWindSpeedToKmh(current.windGust, current.windGustUnit);

  // Check if NWS fields are missing — we'll try to cross-source them from OM cache
  const nwsHasPressure = current.pressure != null;
  const nwsHasVisibility = current.visibility != null;
  const nwsHasUvIndex = false; // NWS never provides UV Index

  const currentApp = {
    temperature_2m: temp,
    temperatureUnit: 'C', // Always store Celsius — convertTemp() converts from Celsius
    relative_humidity_2m: current.relativeHumidity,
    wind_speed_10m: windSpeed,
    wind_direction_10m: current.windDirection,
    surface_pressure: nwsHasPressure ? convertPressureToHpa(current.pressure, current.pressureUnit) : null,
    weather_code: nwsWeatherToWmo(current.weather),
    probabilityOfPrecipitation: current.probabilityOfPrecipitation,
    skyCover: current.skyCover,
    visibility: nwsHasVisibility ? vis : null,
    visibilityUnit: needsVisConversion ? 'mi' : (nwsHasVisibility ? current.visibilityUnit : null),
    uv_index: null, // NWS doesn't provide UV Index — will be cross-sourced below
    dewpoint: dewpoint,
    windGust: windGust,
    shortForecast: current.weather?.[0]?.icon || '',
    detailedForecast: '',
    // Keep raw values for reference
    _rawTemp: current.temperature,
    _rawTempUnit: current.temperatureUnit,
    _rawWindSpeed: current.windSpeed,
    _rawWindSpeedUnit: current.windSpeedUnit,
    _rawVisibility: current.visibility,
    _rawVisibilityUnit: current.visibilityUnit,
    _rawPrecip: current.quantitativePrecipitation,
    _rawPrecipUnit: current.quantitativePrecipitationUnit,
    _rawIce: current.iceAccumulation,
    _rawIceUnit: current.iceAccumulationUnit,
    _rawSnow: current.snowfallAmount,
    _rawSnowUnit: current.snowfallAmount?.uom ?? 'wmoUnit:mm',
  };

  // Cross-source missing fields from OM cache (pressure, visibility, UV Index)
  const omWeather = DataCache.get(weatherCacheKey(city.latitude, city.longitude), 'weather');
  if (omWeather && omWeather.current) {
    // Merge missing pressure from OM
    if (!nwsHasPressure && omWeather.current.surface_pressure != null) {
      currentApp.surface_pressure = omWeather.current.surface_pressure;
    }
    // Merge missing visibility from OM (OM returns meters, convert to miles)
    if (!nwsHasVisibility && omWeather.current.visibility != null) {
      currentApp.visibility = metersToMiles(omWeather.current.visibility);
      currentApp.visibilityUnit = 'mi';
    }
    // Merge UV Index from OM (NWS doesn't provide it)
    if (omWeather.current.uv_index != null) {
      currentApp.uv_index = omWeather.current.uv_index;
    }
  }

  // Build hourly forecast array (NWS hourly is already in order)
  const hourlyTimes = hourly.map(p => p.startTime);
  // NWS hourly with units=us returns temperature in Fahrenheit — convert to Celsius
  // convertTemp() always converts from Celsius, so we must store in Celsius
  const hourlyTemps = hourly.map(p => {
    const f = p.temperature;
    return f != null ? (f - 32) * 5 / 9 : null;
  });
  const hourlyHumidity = hourly.map(p => p.relativeHumidity);
  // NWS hourly windSpeed is a string like "2 mph" - extract numeric value and convert mph → km/h
  const hourlyWind = hourly.map(p => {
    const mphVal = parseWindSpeedString(p.windSpeed);
    return mphVal != null ? mphToKmh(mphVal) : null;
  });
  const hourlyWindDir = hourly.map(p => p.windDirection);
  const hourlyPoP = hourly.map(p => p.probabilityOfPrecipitation);
  const hourlyWeatherCodes = hourly.map(p => nwsForecastToWmo(p.shortForecast));
  // NWS hourly doesn't provide precipitation directly - use PoP as proxy
  const hourlyPrecip = hourly.map(p => {
    return null;
  });

  const hourlyApp = {
    time: hourlyTimes,
    temperature_2m: hourlyTemps,
    relative_humidity_2m: hourlyHumidity,
    wind_speed_10m: hourlyWind,
    wind_direction_10m: hourlyWindDir,
    probabilityOfPrecipitation: hourlyPoP,
    weather_code: hourlyWeatherCodes,
    precipitation: hourlyPrecip,
  };

  // Add sunrise/sunset from point data
  const astroData = nwsData.point?.astronomicalData;
  if (astroData) {
    currentApp.sunrise = astroData.sunrise;
    currentApp.sunset = astroData.sunset;
  }

  return {
    ...city,
    source: 'nws',
    weather: {
      current: currentApp,
      hourly: hourlyApp,
    },
  };
}

// Check if NWS covers a given lat/lon
async function isNwsCoverage(lat, lon) {
  const point = await resolvePoint(lat, lon);
  return !!(point.wfo && point.gridX && point.gridY);
}

// ===== NWS MULTI-CITY FETCH =====
// Build a unique cache key for NWS data per city
function nwsCacheKey(lat, lon) {
  return `nws_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// ===== NWS AVALABILITY CHECK =====
// Check if NWS covers a given lat/lon (cached)
const _nwsCoverageCache = {}; // { lat,lon: boolean | Promise<boolean> }

async function checkNwsCoverage(lat, lon) {
  const key = `${DataCache._roundCoord(lat)},${DataCache._roundCoord(lon)}`;
  // Check cache first
  if (key in _nwsCoverageCache) {
    const cached = _nwsCoverageCache[key];
    // If it's a Promise, return it (concurrent request dedup)
    if (cached instanceof Promise) return cached;
    return cached;
  }
  // Check if we have a pending request for this key
  if (_nwsCoverageCache[key] instanceof Promise) {
    return _nwsCoverageCache[key];
  }
  // Create a promise and cache it to deduplicate concurrent requests
  const promise = (async () => {
    try {
      const url = `${NWS_API}/points/${lat},${lon}`;
      const data = await nwsFetch(url);
      const props = data?.properties || {};
      const result = !!(props.gridId || props.cwa) && !!props.gridX && !!props.gridY;
      _nwsCoverageCache[key] = result;
      return result;
    } catch (e) {
      delete _nwsCoverageCache[key];
      return false;
    }
  })();
  _nwsCoverageCache[key] = promise;
  const result = await promise;
  return result;
}

// Deduplicate city results by coordinate pair (keep first entry per coordinate pair)
// Prefer entries with a non-null place_id when there's a tie
function nwsDeduplicateResults(results) {
  const seenCoords = new Map();
  const deduped = [];
  for (const entry of results) {
    const lat = entry.latitude != null ? DataCache._roundCoord(entry.latitude) : null;
    const lon = entry.longitude != null ? DataCache._roundCoord(entry.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(entry);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    let isDup = false;
    for (const [existingKey, existingEntry] of seenCoords) {
      const [exLat, exLon] = existingKey.split(',').map(Number);
      if (Math.abs(lat - exLat) < 0.01 && Math.abs(lon - exLon) < 0.01) {
        isDup = true;
        if (!existingEntry.place_id && entry.place_id) {
          seenCoords.set(existingKey, entry);
          const dupIdx = deduped.findIndex(d => d === existingEntry);
          if (dupIdx !== -1) deduped[dupIdx] = entry;
        }
        break;
      }
    }
    if (!isDup) {
      seenCoords.set(coordKey, entry);
      deduped.push(entry);
    }
  }
  return deduped;
}

// Cross-source cache lookup for NWS: try NWS keys first (current source), then OM keys (cross-source)
function crossSourceGetNws(lat, lon) {
  // Try NWS city data key FIRST (current source priority)
  const nwsCityData = DataCache.get(nwsCacheKey(lat, lon), 'nwsCityData');
  if (nwsCityData && nwsCityData.weather) return { data: nwsCityData, source: 'nws' };

  // Try NWS point cache key (current source priority)
  const nwsPoint = DataCache.get(nwsPointCacheKey(lat, lon), 'nwsPoint');
  if (nwsPoint && nwsPoint.weather) return { data: nwsPoint, source: 'nws' };

  // Try OM weather key (cross-source fallback)
  const omWeather = DataCache.get(weatherCacheKey(lat, lon), 'weather');
  if (omWeather) return { data: omWeather, source: 'open-meteo' };

  // Try OM AQI key (cross-source fallback for AQI)
  const omAqi = DataCache.get(aqiCacheKey(lat, lon), 'airQuality');
  if (omAqi) return { data: omAqi, source: 'open-meteo' };

  return null;
}

// Cross-source AQI lookup for NWS: try NWS city data first, then OM AQI key
function crossSourceGetNwsAQI(lat, lon) {
  // Try NWS city data key (current source priority)
  const nwsCityData = DataCache.get(nwsCacheKey(lat, lon), 'nwsCityData');
  if (nwsCityData && nwsCityData.aqi) return { data: nwsCityData.aqi, source: 'nws' };

  // Try OM AQI key (cross-source fallback)
  const omAqi = DataCache.get(aqiCacheKey(lat, lon), 'airQuality');
  if (omAqi) return { data: omAqi, source: 'open-meteo' };

  return null;
}

// Main orchestrator: fetch NWS data for multiple cities
async function fetchNwsForCities(cities) {
  // Check cache for each city individually — use cross-source lookup
  const cachedResults = [];
  const uncachedCities = [];
  const cityCacheMap = []; // map city index to its position in uncachedCities

  for (let i = 0; i < cities.length; i++) {
    const ck = nwsCacheKey(cities[i].latitude, cities[i].longitude);
    const cached = DataCache.get(ck, 'nwsCityData');
    // Cross-source: also check OM keys for NWS lookup
    const crossSource = crossSourceGetNws(cities[i].latitude, cities[i].longitude);
    if (cached) {
      // Cross-source AQI from OM cache if NWS doesn't have it
      const crossAqi = crossSourceGetNwsAQI(cities[i].latitude, cities[i].longitude);
      const aqiData = crossAqi?.data || cached.aqi || {};
      cachedResults.push({ ...cities[i], source: 'nws', weather: cached.weather, aqi: aqiData });
    } else if (crossSource && crossSource.data.weather) {
      // OM data can serve as NWS weather data (it has the same structure)
      const crossAqi = crossSourceGetNwsAQI(cities[i].latitude, cities[i].longitude);
      cachedResults.push({ ...cities[i], source: crossSource.source, weather: crossSource.data.weather, aqi: crossAqi?.data || {} });
    } else {
      cityCacheMap.push(i);
      uncachedCities.push(cities[i]);
    }
  }

  // If all cached, apply deduplication before returning
  if (uncachedCities.length === 0) {
    return nwsDeduplicateResults(cachedResults);
  }

  // Deduplicate BEFORE fetching
  const dedupedUncached = deduplicateCities(uncachedCities);

  // Fetch NWS data for each unique city, and fall back to OM for cities outside NWS coverage
  const nwsResults = [];
  const omFallbackResults = [];
  for (const city of dedupedUncached) {
    const nwsData = await fetchForCity(city.latitude, city.longitude);
    if (nwsData) {
      const appData = nwsToAppData(city, nwsData);
      if (appData) {
        nwsResults.push(appData);
      }
    } else {
      // NWS doesn't cover this city — fall back to OM data
      omFallbackResults.push(city);
    }
  }

  const result = new Array(cities.length);

  // Fill cached results first (with source: 'nws' to ensure badge updates on toggle)
  for (let i = 0; i < cities.length; i++) {
    const ck = nwsCacheKey(cities[i].latitude, cities[i].longitude);
    const cached = DataCache.get(ck, 'nwsCityData');
    if (cached) {
      // Cross-source AQI from OM cache if NWS doesn't have it
      const crossAqi = crossSourceGetNwsAQI(cities[i].latitude, cities[i].longitude);
      const aqiData = crossAqi?.data || cached.aqi || {};
      result[i] = { ...cities[i], source: 'nws', weather: cached.weather, aqi: aqiData };
    }
  }

  // Fill fetched NWS results using coordinate-based matching instead of cache key string comparison
  for (const nwsResult of nwsResults) {
    const ck = nwsCacheKey(nwsResult.latitude, nwsResult.longitude);
    DataCache.set(ck, nwsResult, 'nwsCityData');
    // Find the city by matching coordinates instead of cache key strings
    for (const idx of cityCacheMap) {
      const cityLat = cities[idx].latitude;
      const cityLon = cities[idx].longitude;
      if (cityLat != null && cityLon != null) {
        const resultLat = nwsResult.latitude;
        const resultLon = nwsResult.longitude;
        if (Math.abs(resultLat - cityLat) < 0.01 && Math.abs(resultLon - cityLon) < 0.01) {
          result[idx] = nwsResult;
          break;
        }
      }
    }
  }

  // Fill OM fallback results for cities outside NWS coverage
  const omCities = await fetchWeatherForCities(omFallbackResults);
  for (const omResult of omCities) {
    // Find the city by matching coordinates
    for (const idx of cityCacheMap) {
      const cityLat = cities[idx].latitude;
      const cityLon = cities[idx].longitude;
      if (cityLat != null && cityLon != null) {
        const resultLat = omResult.latitude;
        const resultLon = omResult.longitude;
        if (Math.abs(resultLat - cityLat) < 0.01 && Math.abs(resultLon - cityLon) < 0.01) {
          // Use OM data for cities outside NWS coverage
          result[idx] = { ...omResult, source: 'open-meteo' };
          break;
        }
      }
    }
  }

  // Fill any uncached cities with null data
  for (const idx of cityCacheMap) {
    if (!result[idx]) {
      result[idx] = { ...cities[idx], weather: null, aqi: {} };
    }
  }

  return nwsDeduplicateResults(result);
}

// Merge NWS supplemental fields into OM base data
// NWS current conditions replace OM current conditions (NWS is more accurate for current state)
// NWS hourly replaces OM hourly (but keep OM precipitation since NWS hourly doesn't have it)
function mergeNwsWithOM(omEntry, nwsEntry) {
  const merged = { ...omEntry };

  // Merge weather data
  if (nwsEntry.weather && omEntry.weather) {
    const nwsCurrent = nwsEntry.weather.current || {};
    const omCurrent = omEntry.weather.current || {};

    // Replace current conditions with NWS data (NWS is more accurate for current state)
    merged.weather = {
      current: {
        ...omCurrent,
        ...nwsCurrent,
      },
      hourly: nwsEntry.weather.hourly || omEntry.weather.hourly,
    };
  }

  // Update source to 'enhanced' (OM base + NWS supplemental)
  merged.source = 'enhanced';

  return merged;
}

// ===== SOURCE-DEPENDENT DATA FETCH =====
// This is the unified entry point that the app uses to fetch weather data.
// OM is always the base for all cities; NWS is fetched only where available as supplemental.
async function fetchWeatherForCitiesUnified(cities) {
  // Always fetch OM weather + AQI for ALL cities first
  const omResults = await fetchWeatherForCities(cities);

  // Check which cities have NWS coverage and fetch NWS data for those
  const nwsFetches = [];

  for (const city of cities) {
    const hasNws = await checkNwsCoverage(city.latitude, city.longitude);
    if (hasNws) {
      const nwsData = await fetchForCity(city.latitude, city.longitude);
      if (nwsData) {
        nwsFetches.push({ city, nwsData });
      }
    }
  }

  // Merge NWS supplemental data into OM base data
  const mergedResults = new Array(cities.length);

  // First, fill with OM base data
  for (let i = 0; i < cities.length; i++) {
    const omEntry = omResults.find(r => r && Math.abs(r.latitude - cities[i].latitude) < 0.01 && Math.abs(r.longitude - cities[i].longitude) < 0.01);
    if (omEntry) {
      mergedResults[i] = { ...omEntry, source: 'open-meteo' };
    } else {
      mergedResults[i] = { ...cities[i], weather: null, aqi: {} };
    }
  }

  // Then, merge NWS supplemental data into OM base data for cities with coverage
  for (const { city, nwsData } of nwsFetches) {
    const appData = nwsToAppData(city, nwsData);
    if (!appData) continue;

    // Find the OM entry for this city
    const omEntryIdx = mergedResults.findIndex(r => r && Math.abs(r.latitude - city.latitude) < 0.01 && Math.abs(r.longitude - city.longitude) < 0.01);
    if (omEntryIdx === -1) continue;

    // Merge NWS supplemental fields into OM base data
    const merged = mergeNwsWithOM(mergedResults[omEntryIdx], appData);
    mergedResults[omEntryIdx] = merged;

    // Cache the NWS city data for future use
    const ck = nwsCacheKey(city.latitude, city.longitude);
    DataCache.set(ck, appData, 'nwsCityData');
  }

  return nwsDeduplicateResults(mergedResults);
}

<script>
// ===== WIND COMPASS =====
function getWindCompass(deg) {
  const arrow = ['⬆', '↗', '➡', '↘', '⬇', '↙', '⬅', '↖'][Math.round(deg / 45) % 8];
  return `<span class="wind-compass"><span class="compass-dial">${arrow}</span> ${bearingToCompass(deg)} ${deg}°</span>`;
}

// ===== DAY/NIGHT CHECK =====
function isDaytime(hour, sunrise, sunset) {
  return hour >= sunrise && hour < sunset;
}

// Parse time string as decimal hours so minutes are accounted for (e.g., "18:45" → 18.75)
function parseDecimalTime(timeStr, fallback) {
  if (!timeStr) return fallback;
  const [h, m] = timeStr.split(':').map(Number);
  return h + (m / 60);
}

function renderAll() {

    if (lat == null || lon == null) {
      deduped.push(entry);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    let isDup = false;
    for (const [existingKey, existingEntry] of seenCoords) {
      const [exLat, exLon] = existingKey.split(',').map(Number);
      if (Math.abs(lat - exLat) < 0.01 && Math.abs(lon - exLon) < 0.01) {
        isDup = true;
        // Prefer the entry with a non-null place_id
        if (!existingEntry.place_id && entry.place_id) {
          seenCoords.set(existingKey, entry);
          const dupIdx = deduped.findIndex(d => d === existingEntry);
          if (dupIdx !== -1) deduped[dupIdx] = entry;
        }
        break;
      }

    if (!isDup) {
      seenCoords.set(coordKey, entry);

function applyBackgrounds() {

function renderCityCard(data, suffix) {
  const w = data.weather;
  const a = data.aqi;
  if (!w || !w.current) {
    return `<div style="padding:2rem;text-align:center;">Error loading data</div>`;
  }

  const current = w.current || {};
  const hourly = w.hourly || {};
  const aqiData = aqiLabel(a?.us_aqi ?? null);

  // Use currentSource (toggle state) for field lookup consistency with badge display
  const isCurrentSourceNws = currentSource === 'nws';
  const curTemp = current?.temperature_2m != null ? convertTemp(current.temperature_2m) :
                  current?.temperature != null ? convertTemp(current.temperature) : '—';
  const curWeatherCode = current?.weather_code ?? current?.weatherCode ?? 0;
  // Field names: both sources use the same field names after nwsToAppData mapping
  const humidity = current?.relative_humidity_2m ?? current?.relativeHumidity ?? '—';
  const windSpeed = current?.wind_speed_10m ?? current?.windSpeed ?? '—';
  const windDir = current?.wind_direction_10m ?? current?.windDirection ?? 0;
  
  // Pressure: always in hPa (NWS converted from inHg, OM already in hPa)
  let pressure = '—';
  if (current?.surface_pressure != null) {
    pressure = current.surface_pressure;
  } else if (current?.pressure != null) {
    pressure = current.pressure;
  }
  
  // UV Index: cross-source from OM cache if available
  const uv = current?.uv_index != null ? current.uv_index : '—';
  
  // Visibility: always in meters, convert to miles for display
  let vis = '—';
  if (current?.visibility != null) {
    if (current.visibilityUnit === 'mi') {
      vis = current.visibility.toFixed(1);
    } else {
      // meters to miles
      vis = (current.visibility / 1609.34).toFixed(1);
    }
  }
  
  // PM2.5: cross-source from OM cache if available
  const pm25 = a && a.pm2_5 !== undefined && a.pm2_5 !== null ? a.pm2_5 : '—';

  const now = new Date();
  const currentHour = now.getHours();

  const sunriseTime = current?.sunrise ? parseDecimalTime(current.sunrise.split('T')[1]?.split('+')[0], 6) : 6;
  const sunsetTime = current?.sunset ? parseDecimalTime(current.sunset.split('T')[1]?.split('+')[0], 19) : 19;
  const isDay = isDaytime(currentHour, sunriseTime, sunsetTime);

  const curIcon = isDay ? getWeatherIcon(curWeatherCode) : getMoonIcon(curWeatherCode);
  const curIconLarge = isDay ? getWeatherIcon(curWeatherCode, 80) : getMoonIcon(curWeatherCode, 80);

  const timeArr = hourly?.time || [];
  const currentDay = now.toISOString().split('T')[0];
  const currentIdx = timeArr.findIndex(t => {
    const [datePart, timePart] = t.split('T');
    return datePart === currentDay && timePart.startsWith(`T${String(currentHour).padStart(2, '0')}`);
  });

  let hourlyHTML = '';
  for (let i = 0; i < 24; i++) {
    const hIdx = currentIdx >= 0 ? currentIdx + i : currentHour + i;
    if (hIdx < 0 || hIdx >= timeArr.length) break;
    const hTime = timeArr[hIdx]?.split('T')[1]?.split('+')[0]?.slice(0, 5);
    const hTemp = hourly?.temperature_2m?.[hIdx] != null ? convertTemp(hourly.temperature_2m[hIdx]) :
                  hourly?.temperature?.[hIdx] != null ? convertTemp(hourly.temperature[hIdx]) : 0;
    const precipMM = hourly?.precipitation?.[hIdx] || 0;
    const hPrecip = precipMM > 0.1 ? `${Math.round(precipMM)}mm` : '';
    const hCode = hourly?.weather_code?.[hIdx] ?? hourly?.weatherCode?.[hIdx] ?? 0;
    const isCurrent = i === 0;
    const hHourDecimal = parseDecimalTime(hTime, 12);
    const hIsDay = isDaytime(hHourDecimal, sunriseTime, sunsetTime);
    const hWind = hourly?.wind_speed_10m?.[hIdx] != null ? `${Math.round(hourly.wind_speed_10m[hIdx])} km/h` :
                  hourly?.windSpeed?.[hIdx] != null ? `${Math.round(hourly.windSpeed[hIdx])} km/h` : '';
    hourlyHTML += `<div class="hour-slot${isCurrent ? ' current' : ''}">
      <div class="hour-time">${hTime}</div>
      <div class="hour-icon">${isCurrent ? curIcon : (hIsDay ? getWeatherIcon(hCode) : getMoonIcon(hCode))}</div>
      <div class="hour-temp">${Math.round(hTemp)}°</div>
      ${hWind ? `<div class="hour-wind">${hWind}</div>` : ''}
      ${hPrecip ? `<div class="hour-precip">${hPrecip}</div>` : ''}
    </div>`;
  }

  // Badge reflects each city's actual data source (not toggle state)
  const sourceBadge = data.source === 'nws' ? '<span class="source-badge nws">NWS</span>' : '<span class="source-badge open-meteo">OM</span>';

  const safeName = data.place_id || suffix;
  const mergedCanvasId = `chart-merged-${safeName}`;
  const combinedCanvasId = `chart-combined-${safeName}`;

  // Slice to 24 hours (current day only) for chart display
  const temps = (hourly?.temperature_2m || hourly?.temperature || []).slice(0, 24);
  const rain = (hourly?.precipitation || []).slice(0, 24);
  const hum = (hourly?.relative_humidity_2m || hourly?.relativeHumidity || []).slice(0, 24);
  const wind = (hourly?.wind_speed_10m || hourly?.windSpeed || []).slice(0, 24);
  const chartStats = (data) => {
    // Filter out null values before computing stats
    const valid = data.filter(v => v != null);
    return valid.length ? {
      min: Math.round(Math.min(...valid)),
      max: Math.round(Math.max(...valid)),
      avg: Math.round(valid.reduce((a, b) => a + b, 0) / valid.length),
    } : { min: '—', max: '—', avg: '—' };
  };

  const humStats = chartStats(hum);
  const windStats = chartStats(wind);
  const rainStats = chartStats(rain);

  return `
    <canvas class="chart-canvas chart-merged" id="${mergedCanvasId}" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;"></canvas>
    <div style="position:relative;z-index:2;">
    <div class="city-header">
      <div class="city-name-wrap">
        <span class="city-name">${escapeHTML(data.name)}${FavoritesManager.has(data.place_id, data.latitude, data.longitude) ? '<span class="fav-star">★</span>' : ''}${sourceBadge}</span>
        <span class="city-state">${escapeHTML(data.state)}</span>
      </div>
      <span class="current-temp-inline">${Math.round(curTemp)}°</span>
      <div class="current-weather-icon-inline">${curIconLarge}</div>
    </div>
    <div class="city-compass-row" style="display:flex;align-items:center;gap:0.4rem;margin-top:0.1rem;">
      <span class="compass-heading">${escapeHTML(bearingToCompass(data.bearing))}</span>
      <span class="compass-heading">${Math.round(data.distance)} mi</span>
    </div>
    <div class="combined-chart-row">
      <canvas class="combined-chart-canvas" id="${combinedCanvasId}"></canvas>
      <div class="combined-chart-stats">
        <div class="stat-group">
          <div class="stat-group-title">Humidity</div>
          <div class="stat"><span class="stat-label">CUR</span><span class="stat-val">${humidity}%</span></div>
          <div class="stat"><span class="stat-label">MIN</span><span class="stat-val">${humStats.min}%</span></div>
          <div class="stat"><span class="stat-label">MAX</span><span class="stat-val">${humStats.max}%</span></div>
          <div class="stat"><span class="stat-label">AVG</span><span class="stat-val">${humStats.avg}%</span></div>
        </div>
        <div class="divider"></div>
        <div class="stat-group">
          <div class="stat-group-title">Wind</div>
          <div class="stat"><span class="stat-label">CUR</span><span class="stat-val">${windSpeed}</span></div>
          <div class="stat"><span class="stat-label">MIN</span><span class="stat-val">${windStats.min}</span></div>
          <div class="stat"><span class="stat-label">MAX</span><span class="stat-val">${windStats.max}</span></div>
          <div class="stat"><span class="stat-label">AVG</span><span class="stat-val">${windStats.avg}</span></div>
        </div>
        <div class="divider"></div>
        <div class="stat-group">
          <div class="stat-group-title">Precip</div>
          <div class="stat"><span class="stat-label">CUR</span><span class="stat-val">${rain[0] ?? 0}mm</span></div>
          <div class="stat"><span class="stat-label">MIN</span><span class="stat-val">${rainStats.min}mm</span></div>
          <div class="stat"><span class="stat-label">MAX</span><span class="stat-val">${rainStats.max}mm</span></div>
          <div class="stat"><span class="stat-label">AVG</span><span class="stat-val">${rainStats.avg}mm</span></div>
        </div>
      </div>
    </div>
    <div class="details-grid">
      <div class="detail-cell"><span class="detail-label">Humidity</span><span class="detail-value">${humidity}%</span></div>
      <div class="detail-cell"><span class="detail-label">Wind</span><span class="detail-value">${windDir !== 0 ? getWindCompass(windDir) + ' ' + windSpeed : '—'}</span></div>
      <div class="detail-cell"><span class="detail-label">Pressure</span><span class="detail-value">${pressure} hPa</span></div>
      <div class="detail-cell"><span class="detail-label">UV Index</span><span class="detail-value">${uv}</span></div>
      <div class="detail-cell"><span class="detail-label">Visibility</span><span class="detail-value">${vis} mi</span></div>
      <div class="detail-cell"><span class="detail-label">AQI (PM2.5)</span><span class="detail-value"><span class="aqi-badge ${aqiData.cls}">${aqiData.label}</span> ${pm25}</span></div>
    </div>
    <div class="hourly-section">
      <div class="hourly-title">24-Hour Forecast</div>
      <div class="hourly-row">${hourlyHTML}</div>
    </div>
    </div>`;
}

<script>
// ===== CLEAN CANVAS CHART =====
function drawMergedChart(canvasId, cityData, dayHigh, dayLow) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width;
  const h = rect.height;
  const pad = { top: 6, right: 0, bottom: 6, left: 0 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const hourly = cityData.hourly || {};
  // Slice to 24 hours (current day only), convert temps to current unit
  const temps = (hourly.temperature_2m || []).slice(0, 24).map(v => convertTemp(v));
  const rain = (hourly.precipitation || []).slice(0, 24);
  const wind = (hourly.wind_speed_10m || []).slice(0, 24);

  if (temps.length === 0) return;

  const n = temps.length;
  const stepX = plotW / (n - 1 || 1);

  // Temp range - use day high/low when available
  const tempMin = (dayLow != null ? dayLow : Math.min(...temps)) - 2;
  const tempMax = (dayHigh != null ? dayHigh : Math.max(...temps)) + 2;
  const tempRange = tempMax - tempMin || 1;

  // Rain max
  const rainMax = Math.max(...rain, 0.5);

  // Wind max
  const windMax = Math.max(...wind, 1);

  // Draw grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 3; i++) {
    const y = pad.top + (plotH / 3) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + plotW, y);
    ctx.stroke();
  }

  // Temperature area fill
  const tempFillGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  tempFillGrad.addColorStop(0, 'rgba(255,140,66,0.25)');
  tempFillGrad.addColorStop(1, 'rgba(255,140,66,0.02)');

  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + (n - 1) * stepX, pad.top + plotH);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = tempFillGrad;
  ctx.fill();

  // Temperature line
  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#ff8c42';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Temperature dots
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff8c42';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Rain bars (bottom)
  const rainH = plotH * 0.25;
  const rainY = pad.top + plotH - rainH;
  const barW = Math.max(2, stepX * 0.5);
  rain.forEach((v, i) => {
    const x = pad.left + i * stepX + (stepX - barW) / 2;
    const barH = (v / rainMax) * rainH;
    ctx.fillStyle = `rgba(77,166,255,${0.15 + (v / rainMax) * 0.35})`;
    ctx.fillRect(x, rainY + rainH - barH, barW, barH);
  });

  // Wind line (subtle)
  ctx.beginPath();
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * (plotH * 0.15);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(125,217,160,0.3)';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Temp labels on left
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 3; i++) {
    const val = tempMax - (tempRange / 3) * i;
    const y = pad.top + (plotH / 3) * i;
    ctx.fillText(Math.round(val) + '°', pad.left + 17, y + 3);
  }

}

// ===== COMBINED CHART =====
function drawCombinedChart(canvasId, cityData) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width;
  const h = rect.height;
  const pad = { top: 10, right: 10, bottom: 10, left: 10 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const hourly = cityData.hourly || {};
  // Slice to 24 hours (current day only)
  const hum = (hourly.relative_humidity_2m || []).slice(0, 24);
  const wind = (hourly.wind_speed_10m || []).slice(0, 24);
  const rain = (hourly.precipitation || []).slice(0, 24);

  if (hum.length === 0) return;

  const n = hum.length;
  const stepX = plotW / (n - 1 || 1);
  const windMax = Math.max(...wind, 1);
  const rainMax = Math.max(...rain, 0.5);

  // Humidity gradient fill
  const humGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  humGrad.addColorStop(0, 'rgba(77,166,255,0.05)');
  humGrad.addColorStop(1, 'rgba(77,166,255,0.3)');
  ctx.beginPath();
  hum.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / 100) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + (n - 1) * stepX, pad.top + plotH);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = humGrad;
  ctx.fill();

  // Humidity line
  ctx.beginPath();
  hum.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / 100) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(77,166,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Wind line
  ctx.beginPath();
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(125,217,160,0.6)';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Wind dots
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * plotH;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(125,217,160,0.8)';
    ctx.fill();
  });

  // Rain bars (bottom)
  const rainH = plotH * 0.2;
  const rainY = pad.top + plotH - rainH;
  const barW = Math.max(2, stepX * 0.5);
  rain.forEach((v, i) => {
    const x = pad.left + i * stepX + (stepX - barW) / 2;
    const barH = (v / rainMax) * rainH;
    ctx.fillStyle = `rgba(77,166,255,${0.15 + (v / rainMax) * 0.35})`;
    ctx.fillRect(x, rainY + rainH - barH, barW, barH);
  });

  // Labels
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('100%', pad.left + 2, pad.top + 4);
  ctx.fillText('0%', pad.left + 2, pad.top + plotH);
  ctx.fillText(Math.round(windMax) + ' km/h', pad.left + 2, pad.top + plotH - 2);
}

// ===== CANVAS CHARTS =====
function drawAllCharts() {
  weatherData.forEach((data) => {
    if (!data.weather) return;
    const hourly = data.weather.hourly || {};
    const safeName = data.place_id || `${data.latitude || 0}_${data.longitude || 0}`;
    if (Object.keys(hourly).length === 0) return;
    drawMergedChart(`chart-merged-${safeName}`, data.weather, data.highTemp, data.lowTemp);
    drawCombinedChart(`chart-combined-${safeName}`, data.weather);
  });
}

// ===== PARTICLE CANVAS =====
function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      opacity: Math.random() * 0.1 + 0.05,
    });
  }

  // Pause particles when the donkey runner game is active (reduces GPU compositing load)
  let animId = null;

  function animate() {
    if (animId) cancelAnimationFrame(animId);
    animId = null;

    function step() {
      animId = requestAnimationFrame(step);

      // Check if game is active — pause particles when game is running
      const isGameActive = typeof DONKEY_RUNNER !== 'undefined' && DONKEY_RUNNER && DONKEY_RUNNER.gameRunning;
      if (!isGameActive) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y -= p.speed;
          if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
          ctx.fill();
        });
      } else {
        // Clear canvas when paused to keep it clean (no particles drawn)
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    step();
  }
  animate();
}

<script>
// ===== SOURCE TOGGLE =====
// Track NWS availability per location
let _nwsAvailability = {}; // { lat,lon: boolean }

function isNwsAvailableForLocation(lat, lon) {
  const key = `${DataCache._roundCoord(lat)},${DataCache._roundCoord(lon)}`;
  return !!_nwsAvailability[key];
}

// Update source toggle UI to reflect NWS availability
async function updateSourceToggleUI() {
  const btn = document.getElementById('source-toggle');
  if (!btn) return;
  
  // Check if ALL current cities have NWS coverage (not just any)
  let allCitiesHaveNws = true;
  let hasAnyCityWithNws = false;
  
  if (weatherData.length > 0) {
    for (const city of weatherData) {
      const key = `${DataCache._roundCoord(city.latitude)},${DataCache._roundCoord(city.longitude)}`;
      // Check cache first
      let nwsAvail = false;
      if (key in _nwsAvailability) {
        nwsAvail = _nwsAvailability[key];
      } else {
        // Check uncached
        nwsAvail = await checkNwsCoverage(city.latitude, city.longitude);
        _nwsAvailability[key] = nwsAvail;
      }
      
      if (nwsAvail) {
        hasAnyCityWithNws = true;
      } else {
        allCitiesHaveNws = false;
      }
    }
  }
  
  // Update button state - only enable toggle if ALL cities have NWS coverage
  const isNws = currentSource === 'nws';
  
  btn.textContent = currentSource === 'open-meteo' ? 'OM' : 'NWS';
  btn.classList.toggle('nws', isNws && allCitiesHaveNws);
  
  // Disable button if not ALL cities have NWS coverage (toggle only works when all cities are in coverage)
  if (!allCitiesHaveNws) {
    btn.disabled = true;
    btn.title = 'Some cities outside NWS coverage — OM active';
    btn.classList.add('disabled');
    // Auto-switch to OM if currently on NWS but not all cities have NWS
    if (isNws && !allCitiesHaveNws) {
      currentSource = 'open-meteo';
      localStorage.setItem('hasW_source', 'open-meteo');
      btn.textContent = 'OM';
      btn.classList.remove('nws');
      btn.disabled = false;
      btn.title = 'Some cities outside NWS coverage — OM active';
      btn.classList.remove('disabled');
    }
  } else if (isNws && hasAnyCityWithNws) {
    // Currently on NWS and at least one city has NWS - show toggle enabled
    btn.disabled = false;
    btn.title = 'Switch to OM';
    btn.classList.remove('disabled');
  } else {
    // On OM, some cities have NWS - allow toggle
    btn.disabled = false;
    btn.title = hasAnyCityWithNws ? 'Switch to NWS' : 'No NWS coverage available';
    btn.classList.remove('disabled');
  }
}

function toggleSource() {
  const btn = document.getElementById('source-toggle');
  if (btn && btn.disabled) return;
  
  // Save preference
  localStorage.setItem('hasW_source', currentSource === 'open-meteo' ? 'nws' : 'open-meteo');
  currentSource = currentSource === 'open-meteo' ? 'nws' : 'open-meteo';
  
  // Update background refresh timers
  startBackgroundRefresh();
  
  // Re-fetch data with new source
  refresh();
}

// Restore saved source preference
function restoreSourcePreference() {
  const saved = localStorage.getItem('hasW_source');
  if (saved === 'nws') {
    currentSource = 'nws';
  }
}

// ===== BACKGROUND REFRESH =====
let _bgRefreshTimer = null;

// NWS minimum background refresh interval (10 minutes) — prevents 429s
const NWS_MIN_REFRESH_INTERVAL_MS = 10 * 60 * 1000;

// Get the shortest remaining TTL for a city's data
function getCityShortestTTL(city) {
  let shortest = Infinity;
  if (currentSource === 'open-meteo') {
    // Weather and AQI have separate cache keys now
    const weatherKey = weatherCacheKey(city.latitude, city.longitude);
    const aqiKey = aqiCacheKey(city.latitude, city.longitude);
    // Check weather cache
    const weatherEntry = localStorage.getItem(`hasw_cache_${weatherKey}`);
    if (weatherEntry) {
      const entry = JSON.parse(weatherEntry);
      const ttl = DataCache.TTL[entry.type] || DataCache.TTL.weather;
      const remaining = ttl - (Date.now() - entry.timestamp);
      if (remaining < shortest) shortest = remaining;
    }
    // Check AQI cache (separate key)
    const airEntry = localStorage.getItem(`hasw_cache_${aqiKey}`);
    if (airEntry) {
      const entry = JSON.parse(airEntry);
      const ttl = DataCache.TTL[entry.type] || DataCache.TTL.airQuality;
      const remaining = ttl - (Date.now() - entry.timestamp);
      if (remaining < shortest) shortest = remaining;
    }
  } else {
    // NWS: check ALL NWS cache keys for this city
    const nwsCacheKeys = [
      nwsPointCacheKey(city.latitude, city.longitude),
      nwsGridCacheKey('DTX', 0, 0), // placeholder — check the cityData key instead
    ];
    const nwsCityCacheKey = nwsCacheKey(city.latitude, city.longitude);

    // Check point cache
    const pointEntry = localStorage.getItem(`hasw_cache_${nwsCacheKeys[0]}`);
    if (pointEntry) {
      const entry = JSON.parse(pointEntry);
      const ttl = DataCache.TTL[entry.type] || DataCache.TTL.nwsPoint;
      const remaining = ttl - (Date.now() - entry.timestamp);
      if (remaining < shortest) shortest = remaining;
    }

    // Check cityData cache (the actual NWS city data)
    const cityDataEntry = localStorage.getItem(`hasw_cache_${nwsCityCacheKey}`);
    if (cityDataEntry) {
      const entry = JSON.parse(cityDataEntry);
      const ttl = DataCache.TTL[entry.type] || DataCache.TTL.nwsCityData;
      const remaining = ttl - (Date.now() - entry.timestamp);
      if (remaining < shortest) shortest = remaining;
    }
  }
  return shortest === Infinity ? 10 * 60 * 1000 : shortest; // Default to 10 minutes if no cache
}

function startBackgroundRefresh() {
  // Clear existing timer
  if (_bgRefreshTimer) clearInterval(_bgRefreshTimer);
  
  // Calculate the shortest remaining TTL across all cities
  let shortestTTL = Infinity;
  if (weatherData.length > 0) {
    for (const city of weatherData) {
      const ttl = getCityShortestTTL(city);
      if (ttl < shortestTTL) shortestTTL = ttl;
    }
  }
  
  // For NWS: use a fixed 10-minute interval (never faster)
  // For OM: use 80% of the shortest TTL as the refresh interval (with a minimum of 1 minute)
  let interval;
  if (currentSource === 'nws') {
    interval = NWS_MIN_REFRESH_INTERVAL_MS;
  } else {
    interval = Math.max(60 * 1000, shortestTTL * 0.8);
  }
  
  _bgRefreshTimer = setInterval(() => {
    if (isLoading) return;
    if (!userLocation) return;
    
    // Only refresh if we have weather data
    if (weatherData.length === 0) return;
    
    // Invalidate all caches for the current source
    if (currentSource === 'open-meteo') {
      // Invalidate both weather and AQI caches (separate keys)
      for (const city of weatherData) {
        const weatherCk = weatherCacheKey(city.latitude, city.longitude);
        const aqiCk = aqiCacheKey(city.latitude, city.longitude);
        DataCache.invalidate(weatherCk);
        DataCache.invalidate(aqiCk);
      }
    } else {
      // NWS: invalidate all NWS caches for this city
      for (const city of weatherData) {
        const ck = nwsPointCacheKey(city.latitude, city.longitude);
        DataCache.invalidate(ck);
        const cityCk = nwsCacheKey(city.latitude, city.longitude);
        DataCache.invalidate(cityCk);
      }
    }
    
    // Re-fetch data silently
    run();
  }, interval);
}

// ===== REFRESH & UNIT TOGGLE =====
function toggleUnit() {
  if (_toggleDebounceTimer) return;
  _toggleDebounceTimer = setTimeout(() => {
    _toggleDebounceTimer = null;
    unit = unit === 'F' ? 'C' : 'F';
    const btn = document.getElementById('unit-toggle');
    if (btn) btn.textContent = `°${unit}`;
    renderAll();
  }, TOGGLE_DEBOUNCE_MS);
}

async function refresh() {
  if (isLoading) return;
  isLoading = true;
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.disabled = true;

  // Clear weather, nearby, and ip caches on refresh
  DataCache.invalidate('ip_location');
  _nearbyCache = null;
  _nearbyCacheTime = 0;
  _allNearbyCities = [];
  // Also invalidate nearby DataCache entry
  if (userLocation) {
    const nearbyKey = `nearby_${DataCache._roundCoord(userLocation.lat)}_${DataCache._roundCoord(userLocation.lon)}`;
    DataCache.invalidate(nearbyKey);
  }

  await run();

  btn.classList.remove('spinning');
  btn.disabled = false;
  isLoading = false;
}

 <script>
// ===== NETWORK MONITOR =====
const OUTAGE_MESSAGES = [
  "🦓 The network has left the building.",
  "🌐 DNS said 'I don't know that one.'",
  "📡 Signal lost. Last known location: confusion.",
  "🔌 Even the cables are on strike.",
  "🤖 Error 418: I'm a teapot (but not a fun one).",
  "📶 The internet went to get a snack.",
  "🏜️ Nothing but digital silence and crickets.",
  "🦥 The packet snail is still en route.",
  "🌋 Your data got swallowed by a volcano.",
  "👽 Aliens intercepted your WiFi signal.",
  "🧊 Your connection froze. Literally.",
  "🎪 The router joined a circus. No return date.",
];

const RETRY_DELAYS = [2000, 4000, 8000, 15000];
let _outagePanel = null;
let _retryInterval = null;
let _outageVisible = false;
let _pendingRunFn = null;
let _donkeyAutoOpened = false;

// ===== PANEL =====
function createOutagePanel() {
  if (_outagePanel) return _outagePanel;

  const panel = document.createElement('div');
  panel.id = 'outage-panel';
  panel.className = 'outage-panel';
  panel.innerHTML = `
    <div class="outage-glass">
      <div class="outage-header">
        <div class="outage-donkey-icon">
          <svg viewBox="0 0 64 64" class="outage-donkey-svg">
            <ellipse cx="32" cy="28" rx="14" ry="12" class="donkey-head" />
            <line x1="22" y1="18" x2="18" y2="6" class="donkey-ear" />
            <line x1="42" y1="18" x2="46" y2="6" class="donkey-ear" />
            <line x1="22" y1="18" x2="20" y2="8" class="donkey-ear-inner" />
            <line x1="42" y1="18" x2="44" y2="8" class="donkey-ear-inner" />
            <circle cx="26" cy="26" r="2.5" class="donkey-eye" />
            <circle cx="38" cy="26" r="2.5" class="donkey-eye" />
            <circle cx="26.5" cy="25.5" r="0.8" fill="#fff" />
            <circle cx="38.5" cy="25.5" r="0.8" fill="#fff" />
            <circle cx="28" cy="32" r="1.2" class="donkey-nostril" />
            <circle cx="36" cy="32" r="1.2" class="donkey-nostril" />
            <path d="M 27 35 Q 32 38 37 35" class="donkey-mouth" />
            <line x1="24" y1="16" x2="28" y2="20" class="donkey-man" />
            <line x1="28" y1="14" x2="32" y2="18" class="donkey-man" />
            <line x1="32" y1="14" x2="36" y2="18" class="donkey-man" />
            <line x1="36" y1="16" x2="40" y2="20" class="donkey-man" />
          </svg>
        </div>
        <h2 class="outage-title">NO INTERNET, PARTNER</h2>
      </div>
      <div class="outage-body">
        <div class="outage-glitch" id="outage-glitch">
          <span class="glitch-text" id="glitch-text">...</span>
        </div>
        <div class="outage-status" id="outage-status">
          <span class="status-dot"></span>
          <span id="retry-text">Checking connection...</span>
        </div>
        <div class="outage-progress" id="outage-progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(panel);
  _outagePanel = panel;
  return panel;
}

function removeOutagePanel() {
  if (_outagePanel) {
    _outagePanel.classList.add('outage-hidden');
    setTimeout(() => {
      if (_outagePanel && _outagePanel.parentNode) {
        _outagePanel.parentNode.removeChild(_outagePanel);
      }
      _outagePanel = null;
      _outageVisible = false;
      // Close auto-opened donkey panel
      if (_donkeyAutoOpened && typeof DONKEY_RUNNER !== 'undefined' && DONKEY_RUNNER.gamePanel) {
        DONKEY_RUNNER.close();
        _donkeyAutoOpened = false;
      }
      // Reset position for next time
      const panel = document.getElementById('outage-panel');
      if (panel) { panel.style.top = ''; panel.style.bottom = ''; }
    }, 500);
  }
}

function showOutagePanel() {
  const panel = createOutagePanel();
  _outageVisible = true;

  // Auto-open donkey panel if it's not already visible
  if (typeof DONKEY_RUNNER !== 'undefined' && DONKEY_RUNNER.gamePanel) {
    if (DONKEY_RUNNER.gamePanel.classList.contains('donkey-hidden')) {
      DONKEY_RUNNER.toggle();
      _donkeyAutoOpened = true;
    }
  }

  // Set position BEFORE the slide-in animation begins, so the panel animates
  // from the bottom of the screen to the correct target position.
  adjustOutagePositionImmediate();

  panel.classList.remove('outage-hidden');
  panel.classList.add('outage-visible');
  cycleOutageMessage();
}

// Immediately-set the outage panel position (no delay).
// Used when the panel first appears, before its slide-in animation begins.
function adjustOutagePositionImmediate() {
  const panel = document.getElementById('outage-panel');
  if (!panel) return;

  const donkeyVisible = DONKEY_RUNNER && DONKEY_RUNNER.gamePanel &&
    !DONKEY_RUNNER.gamePanel.classList.contains('donkey-hidden');

  if (donkeyVisible) {
    const donkeyRect = DONKEY_RUNNER.gamePanel.getBoundingClientRect();
    panel.style.top = (donkeyRect.bottom + 20) + 'px';
    panel.style.bottom = 'auto';
  } else {
    panel.style.top = '64px';
    panel.style.bottom = 'auto';
  }
}

// Delayed position adjustment (used when donkey game is toggled).
// Waits for the donkey panel's 400ms CSS transition to complete before measuring.
function adjustOutagePosition() {
  const panel = document.getElementById('outage-panel');
  if (!panel) return;

  const donkeyVisible = DONKEY_RUNNER && DONKEY_RUNNER.gamePanel &&
    !DONKEY_RUNNER.gamePanel.classList.contains('donkey-hidden');

  // The donkey panel has a 0.4s CSS transition on `top`. We must wait for it
  // to finish animating before calling getBoundingClientRect(), otherwise we
  // measure a mid-transition (incorrect) position.  450ms ≈ transition duration
  // plus a small safety margin.
  const transitionDelay = 450;

  // Also cancel any previously-scheduled adjustment so rapid toggles don't
  // leave stale timeouts firing and overwriting the correct position.
  if (adjustOutagePosition._timer) {
    clearTimeout(adjustOutagePosition._timer);
    adjustOutagePosition._timer = null;
  }

  adjustOutagePosition._timer = setTimeout(() => {
    adjustOutagePosition._timer = null;
    if (!document.getElementById('outage-panel')) return;
    const p = document.getElementById('outage-panel');

    if (donkeyVisible) {
      const donkeyRect = DONKEY_RUNNER.gamePanel.getBoundingClientRect();
      p.style.top = (donkeyRect.bottom + 20) + 'px';
      p.style.bottom = 'auto';
    } else {
      p.style.top = '64px';
      p.style.bottom = 'auto';
    }
  }, transitionDelay);
}

function cycleOutageMessage() {
  if (!_outageVisible) return;

  const textEl = document.getElementById('glitch-text');
  if (!textEl) return;

  const msg = OUTAGE_MESSAGES[Math.floor(Math.random() * OUTAGE_MESSAGES.length)];
  typeWriter(textEl, msg, 30, () => {
    setTimeout(() => {
      if (_outageVisible) cycleOutageMessage();
    }, 3000);
  });
}

function typeWriter(el, text, speed, callback, index) {
  index = index || 0;
  if (index <= text.length) {
    el.textContent = text.substring(0, index);
    setTimeout(() => typeWriter(el, text, speed, callback, index + 1), speed);
  } else if (callback) {
    callback();
  }
}

function updateRetryStatus(retryCount) {
  const statusDot = document.querySelector('.status-dot');
  const retryText = document.getElementById('retry-text');
  const progressBar = document.getElementById('progress-bar');

  if (statusDot) {
    statusDot.className = 'status-dot retrying';
  }

  if (retryText) {
    const labels = ['Initial', 'Secondary', 'Tertiary', 'Emergency'];
    retryText.textContent = `${labels[retryCount] || 'Continuous'} attempt...`;
  }

  if (progressBar) {
    const delay = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];
    // Force reflow for transition restart
    progressBar.style.transition = 'none';
    progressBar.style.width = '0%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        progressBar.style.transition = `width ${delay}ms linear`;
        progressBar.style.width = '100%';
      });
    });
  }
}

// ===== RETRY CYCLE =====
function stopRetryCycle() {
  if (_retryInterval) {
    clearTimeout(_retryInterval);
    _retryInterval = null;
  }
}

function startRetryCycle() {
  let retryCount = 0;

  function attempt() {
    updateRetryStatus(retryCount);
    const timeout = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];

    // Use a fast fetch with abort timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), Math.min(timeout, 8000));

    fetch('https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current=temperature_2m&timezone=auto', {
      method: 'GET',
      mode: 'cors',
      cache: 'no-store',
      signal: controller.signal
    })
      .then(res => {
        clearTimeout(timeoutId);
        if (res.ok || res.status === 0) {
          // Network is back!
          stopRetryCycle();
          removeOutagePanel();
          if (_pendingRunFn) {
            const fn = _pendingRunFn;
            _pendingRunFn = null;
            fn();
          }
        } else {
          throw new Error('Not OK');
        }
      })
      .catch(() => {
        clearTimeout(timeoutId);
        retryCount++;
        const nextDelay = retryCount < RETRY_DELAYS.length
          ? RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)]
          : 30000;
        _retryInterval = setTimeout(attempt, nextDelay);
      });
  }

  _retryInterval = setTimeout(attempt, 800);
}

// ===== NETWORK CHECK =====
async function checkNetwork() {
  // Quick check 1: navigator.onLine (browser's offline flag)
  if (!navigator.onLine) return false;

  // Quick check 2: Use a simple HEAD request with AbortController timeout
  // Use google.com as it's extremely reliable
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);

  try {
    await fetch('https://www.google.com/favicon.ico', {
      method: 'HEAD',
      mode: 'no-cors',
      cache: 'no-store',
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    return navigator.onLine;
  } catch (e) {
    clearTimeout(timeoutId);
    // Fallback: try a second endpoint
    const controller2 = new AbortController();
    const timeoutId2 = setTimeout(() => controller2.abort(), 2500);
    try {
      await fetch('https://captive.apple.com/hotspot-detect.html', {
        method: 'GET',
        mode: 'no-cors',
        cache: 'no-store',
        signal: controller2.signal
      });
      clearTimeout(timeoutId2);
      return true;
    } catch (e2) {
      clearTimeout(timeoutId2);
      return false;
    }
  }
}

// ===== PUBLIC API =====
function checkNetworkAndRun(runFn) {
  _pendingRunFn = runFn;

  checkNetwork().then((online) => {
    if (online) {
      runFn();
    } else {
      showOutagePanel();
      startRetryCycle();
    }
  });
}
