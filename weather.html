const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
const AIR_QUALITY_API = 'https://air-quality-api.open-meteo.com/v1/air-quality';

// ===== AIR QUALITY RATE LIMITER =====
// The AQI API has strict rate limits (likely similar to NWS: 1 req/sec, burst of 3)
const _aqiRateLimiter = {
  lastRequestTime: 0,
  burstCount: 0,
  burstWindow: 0,
  maxBurst: 3,
  burstWindowMs: 1000,
  minIntervalMs: 1000,

  _checkBurst() {
    const now = Date.now();
    if (now - this.burstWindow > this.burstWindowMs) {
      this.burstCount = 0;
      this.burstWindow = now;
    }
    return this.burstCount < this.maxBurst;
  },

  _waitForBurst() {
    return new Promise(resolve => {
      const check = () => {
        if (this._checkBurst()) resolve();
        else setTimeout(check, 50);
      };
      check();
    });
  },

  async waitForSlot() {
    const now = Date.now();
    const timeSinceLast = now - this.lastRequestTime;

    // If we're within the burst window and at max burst, wait
    if (timeSinceLast < this.burstWindowMs && !this._checkBurst()) {
      await this._waitForBurst();
    }

    // Ensure minimum interval between requests
    if (timeSinceLast < this.minIntervalMs) {
      await new Promise(r => setTimeout(r, this.minIntervalMs - timeSinceLast));
    }

    this.burstCount++;
    this.burstWindow = Date.now();
    this.lastRequestTime = Date.now();
  },
};

// ===== CROSS-SOURCE LOOKUP FUNCTIONS =====
// Simplified: only look up weather data from NWS when OM is missing.
// AQI cross-source lookup removed — NWS doesn't provide AQI, and OM handles it.

function crossSourceGetWeather(lat, lon) {
  // Try NWS point cache key (which contains full weather object)
  const nwsPoint = DataCache.get(nwsPointCacheKey(lat, lon), 'nwsPoint');
  if (nwsPoint && nwsPoint.weather) return { data: nwsPoint, source: 'nws' };

  // Try NWS city data key (which contains full weather object)
  const nwsCityData = DataCache.get(nwsCacheKey(lat, lon), 'nwsCityData');
  if (nwsCityData && nwsCityData.weather) return { data: nwsCityData, source: 'nws' };

  return null;
}

// ===== CACHE KEY HELPERS =====
// Consolidated cache key for weather + AQI (they share the same TTL and are always fetched together)
function weatherAqiCacheKey(lat, lon) {
  return `weatherAqi_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// Legacy keys — kept for backward compatibility with existing cache entries
function weatherCacheKey(lat, lon) {
  return `weather_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

function aqiCacheKey(lat, lon) {
  return `airQuality_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// ===== RETRY HELPER =====
// Retry a fetch with exponential backoff. Handles HTTP 429 (rate limit) specially.
async function retryWithBackoff(fn, maxRetries = 3, baseDelay = 1000) {
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const result = await fn();
      // If result is a Response with 429, retry
      if (result && typeof result.status === 'number' && result.status === 429) {
        if (attempt === maxRetries) throw new Error('Rate limited after retries');
        const delay = baseDelay * Math.pow(2, attempt);
        console.log(`[retry] Attempt ${attempt + 1}/${maxRetries + 1} failed with 429, retrying in ${delay}ms`);
        await new Promise(r => setTimeout(r, delay));
      } else {
        return result;
      }
    } catch (err) {
      if (attempt === maxRetries) throw err;
      const delay = baseDelay * Math.pow(2, attempt);
      console.log(`[retry] Attempt ${attempt + 1}/${maxRetries + 1} failed, retrying in ${delay}ms`);
      await new Promise(r => setTimeout(r, delay));
    }
  }
}

// ===== OPEN-METEO SPECIFIC HELPERS =====
// Known keys that are NOT hourly variable data
const KNOWN_NON_HOURLY_KEYS = new Set([
  'latitude', 'longitude', 'elevation',
  'generationtime_ms', 'utc_offset_seconds',
  'timezone', 'timezone_abbreviation',
  'current', 'hourly'
]);

// Helper: extract hourly variable keys from a raw response object
function extractHourlyKeys(raw) {
  return Object.keys(raw).filter(k =>
    KNOWN_NON_HOURLY_KEYS.has(k) === false &&
    Array.isArray(raw[k]) &&
    raw[k].length > 0 &&
    typeof raw[k][0] !== 'object'
  );
}

// ===== DEDUPLICATION =====
// Deduplicate city results by coordinate pair (keep first entry per coordinate pair)
// Prefer entries with a non-null place_id when there's a tie
function deduplicateResults(results) {
  const seenCoords = new Map();
  const deduped = [];
  for (const entry of results) {
    const lat = entry.latitude != null ? DataCache._roundCoord(entry.latitude) : null;
    const lon = entry.longitude != null ? DataCache._roundCoord(entry.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(entry);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    let isDup = false;
    for (const [existingKey, existingEntry] of seenCoords) {
      const [exLat, exLon] = existingKey.split(',').map(Number);
      if (Math.abs(lat - exLat) < 0.01 && Math.abs(lon - exLon) < 0.01) {
        isDup = true;
        // Prefer the entry with a non-null place_id
        if (!existingEntry.place_id && entry.place_id) {
          seenCoords.set(existingKey, entry);
          const dupIdx = deduped.findIndex(d => d === existingEntry);
          if (dupIdx !== -1) deduped[dupIdx] = entry;
        }
        break;
      }
    }
    if (!isDup) {
      seenCoords.set(coordKey, entry);
      deduped.push(entry);
    }
  }
  return deduped;
}

// Deduplicate cities by coordinate pair (for deduplication BEFORE the API call)
function deduplicateCities(cities) {
  const seenCoords = new Set();
  const deduped = [];
  for (const city of cities) {
    const lat = city.latitude != null ? DataCache._roundCoord(city.latitude) : null;
    const lon = city.longitude != null ? DataCache._roundCoord(city.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(city);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    if (!seenCoords.has(coordKey)) {
      seenCoords.add(coordKey);
      deduped.push(city);
    }
  }
  return deduped;
}

// ===== REQUEST DEDUPLICATION =====
// Prevent duplicate bulk fetches for the same city set
const _pendingWeatherFetch = new Map(); // key (sorted lat,lon pairs) → Promise

function getPendingWeatherFetch(cities) {
  const key = cities.map(c => `${DataCache._roundCoord(c.latitude)},${DataCache._roundCoord(c.longitude)}`).sort().join('|');
  if (_pendingWeatherFetch.has(key)) {
    return _pendingWeatherFetch.get(key);
  }
  return null;
}

function setPendingWeatherFetch(key, promise) {
  _pendingWeatherFetch.set(key, promise);
}

// Clean up pending fetch after completion
function clearPendingWeatherFetch(key) {
  _pendingWeatherFetch.delete(key);
}

// ===== PER-CITY WEATHER FETCH (for incremental updates) =====
async function fetchWeatherForCity(city) {
  // Check consolidated cache first
  const cacheKey = weatherAqiCacheKey(city.latitude, city.longitude);
  
  const cached = DataCache.get(cacheKey, 'weatherAqi');
  if (cached) {
    return { ...city, source: 'open-meteo', weather: cached.weather, aqi: cached.aqi };
  }
  
  // Check cross-source: NWS data can serve as OM weather data
  const crossSource = crossSourceGetWeather(city.latitude, city.longitude);
  if (crossSource && crossSource.data.weather) {
    return { ...city, source: crossSource.source, weather: crossSource.data.weather, aqi: {} };
  }
  
  // Fetch weather for single city (with AQI rate limiting)
  try {
    await _aqiRateLimiter.waitForSlot();
    
    const weatherUrl = `${WEATHER_API}?latitude=${city.latitude}&longitude=${city.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index,visibility&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&forecast_days=2&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=auto`;
    
    const weatherRes = await retryWithBackoff(() => fetch(weatherUrl));
    if (!weatherRes.ok) {
      return { ...city, source: 'open-meteo', weather: null, aqi: {} };
    }
    
    const weatherAll = await weatherRes.json();
    
    // Parse single-city weather response (flat object, no results array)
    const cityWeather = {
      current: weatherAll.current || {},
      hourly: weatherAll.hourly || { time: [] },
    };
    
    // Fetch AQI for single city (with rate limiting)
    await _aqiRateLimiter.waitForSlot();
    const aqiUrl = `${AIR_QUALITY_API}?latitude=${city.latitude}&longitude=${city.longitude}&current=us_aqi,pm2_5,european_aqi&timezone=auto`;
    const aqiRes = await retryWithBackoff(() => fetch(aqiUrl));
    const aqiData = await aqiRes.json();
    
    // Parse single-city AQI response (flat object, no results array)
    const cityAqi = {
      us_aqi: aqiData.current?.us_aqi ?? aqiData.us_aqi ?? null,
      pm2_5: aqiData.current?.pm2_5 ?? aqiData.pm2_5 ?? null,
      european_aqi: aqiData.current?.european_aqi ?? aqiData.european_aqi ?? null,
    };
    
    // Store consolidated cache
    DataCache.set(cacheKey, { weather: cityWeather, aqi: cityAqi }, 'weatherAqi');
    
    return { ...city, source: 'open-meteo', weather: cityWeather, aqi: cityAqi };
  } catch (err) {
    console.error(`[fetchWeatherForCity] Failed for ${city.name}:`, err);
    return { ...city, source: 'open-meteo', weather: null, aqi: {} };
  }
}

// ===== FETCH WEATHER FOR CITIES (BATCH) =====
async function fetchWeatherForCities(cities) {
  // De-duplicate input cities by coordinate pair BEFORE any processing
  const dedupedInput = deduplicateCities(cities);

  // Check cache for each city individually — use cross-source lookup
  const cachedResults = [];
  const uncachedCities = [];
  const cityCacheMap = []; // map city index to its position in uncachedCities

  for (let i = 0; i < dedupedInput.length; i++) {
    // Check consolidated cache first
    const cacheKey = weatherAqiCacheKey(dedupedInput[i].latitude, dedupedInput[i].longitude);
    const cached = DataCache.get(cacheKey, 'weatherAqi');
    if (cached) {
      cachedResults.push({ ...dedupedInput[i], source: 'open-meteo', weather: cached.weather, aqi: cached.aqi });
      continue;
    }

    // Cross-source: also check NWS keys for OM lookup
    const crossSource = crossSourceGetWeather(dedupedInput[i].latitude, dedupedInput[i].longitude);
    if (crossSource && crossSource.data.weather) {
      cachedResults.push({ ...dedupedInput[i], source: crossSource.source, weather: crossSource.data.weather, aqi: {} });
      continue;
    }

    cityCacheMap.push(i);
    uncachedCities.push(dedupedInput[i]);
  }

  // If all cached, apply deduplication before returning
  if (uncachedCities.length === 0) {
    return deduplicateResults(cachedResults);
  }

  // Check for pending fetch (request deduplication)
  const pendingKey = getPendingWeatherFetch(uncachedCities);
  if (pendingKey) {
    console.log('[fetchWeatherForCities] Pending fetch exists, waiting...');
    return pendingKey;
  }

  // ===== Deduplicate BEFORE caching =====
  // Only unique coordinate pairs should be fetched from the API
  const dedupedUncached = deduplicateCities(uncachedCities);

  // Build combined weather + AQI URL for deduplicated uncached cities only
  try {
    const weatherUrl = `${WEATHER_API}?latitude=${dedupedUncached.map(c => c.latitude).join(',')}&longitude=${dedupedUncached.map(c => c.longitude).join(',')}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index,visibility&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&forecast_days=2&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=auto`;

    // Retry logic for weather API (handles 429)
    const weatherRes = await retryWithBackoff(() => fetch(weatherUrl));

    if (!weatherRes.ok) {
      // Fill uncached with null data
      for (const idx of cityCacheMap) {
        cachedResults[idx] = { ...dedupedInput[idx], source: 'open-meteo', weather: null, aqi: {} };
      }
      return deduplicateResults(cachedResults);
    }

    const weatherAll = await weatherRes.json();

    // Rate-limit the AQI request too
    await _aqiRateLimiter.waitForSlot();
    const aqiUrl = `${AIR_QUALITY_API}?latitude=${dedupedUncached.map(c => c.latitude).join(',')}&longitude=${dedupedUncached.map(c => c.longitude).join(',')}&current=us_aqi,pm2_5,european_aqi&timezone=auto`;
    const aqiRes = await retryWithBackoff(() => fetch(aqiUrl));
    const aqiData = await aqiRes.json();

    const result = new Array(dedupedInput.length);

    // First fill cached results (use get directly — it already handles expiration internally)
    for (let i = 0; i < dedupedInput.length; i++) {
      const cacheKey = weatherAqiCacheKey(dedupedInput[i].latitude, dedupedInput[i].longitude);
      const cached = DataCache.get(cacheKey, 'weatherAqi');
      if (cached) {
        result[i] = { ...dedupedInput[i], source: 'open-meteo', weather: cached.weather, aqi: cached.aqi };
      }
    }

    // Parse weather response — Open-Meteo returns a flat object when single lat/lon,
    // or an object with 'results' array when multiple lat/lon values are provided.
    const hasResultsArray = weatherAll && Array.isArray(weatherAll.results);

    // Parse AQI response — same pattern: flat for single, 'results' array for multiple
    const hasAqiResultsArray = aqiData && Array.isArray(aqiData.results);

    let wIdx = 0; // index into weatherAll.results / aqiData.results
    for (let i = 0; i < dedupedInput.length; i++) {
      // Skip already-cached
      if (result[i]) continue;

      const city = dedupedInput[i];
      let cityWeather;
      let aqiResult;

      if (hasResultsArray) {
        const raw = weatherAll.results[wIdx] || {};
        const rawHourlyKeys = extractHourlyKeys(raw);
        const mergedHourly = raw.hourly ? { ...raw.hourly } : { time: [] };
        rawHourlyKeys.forEach(k => {
          const val = raw[k];
          if (Array.isArray(val) && val.length > 0 && typeof val[0] !== 'object') {
            mergedHourly[k] = val;
          }
        });
        cityWeather = {
          current: raw.current || {},
          hourly: mergedHourly,
        };

        // AQI from results array
        if (hasAqiResultsArray) {
          const aqiRaw = aqiData.results[wIdx] || {};
          aqiResult = {
            us_aqi: aqiRaw.current?.us_aqi ?? aqiRaw.us_aqi ?? null,
            pm2_5: aqiRaw.current?.pm2_5 ?? aqiRaw.pm2_5 ?? null,
            european_aqi: aqiRaw.current?.european_aqi ?? aqiRaw.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }

        wIdx++;
      } else if (Array.isArray(weatherAll)) {
        // Fallback: weatherAll is an array of individual results
        const raw = weatherAll[i] || {};
        cityWeather = {
          current: raw.current || {},
          hourly: raw.hourly || { time: [] },
        };
        if (Array.isArray(aqiData)) {
          const aqiRaw = aqiData[i] || {};
          aqiResult = {
            us_aqi: aqiRaw.current?.us_aqi ?? aqiRaw.us_aqi ?? null,
            pm2_5: aqiRaw.current?.pm2_5 ?? aqiRaw.pm2_5 ?? null,
            european_aqi: aqiRaw.current?.european_aqi ?? aqiRaw.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }
      } else {
        // Single result (no results array)
        const raw = weatherAll;
        cityWeather = {
          current: raw.current || {},
          hourly: raw.hourly || { time: [] },
        };
        if (aqiData && !hasAqiResultsArray) {
          aqiResult = {
            us_aqi: aqiData.current?.us_aqi ?? aqiData.us_aqi ?? null,
            pm2_5: aqiData.current?.pm2_5 ?? aqiData.pm2_5 ?? null,
            european_aqi: aqiData.current?.european_aqi ?? aqiData.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }
      }

      // Store consolidated cache (weather + AQI together)
      const cacheKey = weatherAqiCacheKey(city.latitude, city.longitude);
      DataCache.set(cacheKey, { weather: cityWeather, aqi: aqiResult }, 'weatherAqi');

      result[i] = { ...city, source: 'open-meteo', weather: cityWeather, aqi: aqiResult };
    }

    return deduplicateResults(result);
  } catch (err) {
    console.error('[fetchWeatherForCities] Failed:', err);
    // Fill uncached with null data
    const result = new Array(dedupedInput.length);
    for (let i = 0; i < dedupedInput.length; i++) {
      const cacheKey = weatherAqiCacheKey(dedupedInput[i].latitude, dedupedInput[i].longitude);
      const cached = DataCache.get(cacheKey, 'weatherAqi');
      if (cached) {
        result[i] = { ...dedupedInput[i], source: 'open-meteo', weather: cached.weather, aqi: cached.aqi };
      } else {
        result[i] = { ...dedupedInput[i], source: 'open-meteo', weather: null, aqi: {} };
      }
    }
    return result;
  } finally {
    // Clean up pending fetch regardless of success/failure
    const key = getPendingWeatherFetch(uncachedCities);
    if (key) clearPendingWeatherFetch(key);
  }
}
</script>
<script>
// ===== OPENSTREETMAP / NOMINATIM API CLIENT =====
// Fetches nearby city data from Nominatim/OSM.

// ===== ENDPOINT =====
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';

// ===== NOMINATIM CONSTANTS =====
const NOMINATIM_CLOSE_RADIUS = 0.45;
const NOMINATIM_WIDE_RADIUS = 1.0;

// ===== HELPER: Scale viewbox for Nominatim =====
function scaleViewbox(lat, lon, radiusDeg) {
  const south = (lat - radiusDeg).toFixed(4);
  const north = (lat + radiusDeg).toFixed(4);
  const west = (lon - radiusDeg).toFixed(4);
  const east = (lon + radiusDeg).toFixed(4);
  return `${west},${north},${east},${south}`;
}

// ===== FIND NEARBY CITIES =====
async function findNearbyCities(lat, lon) {
  // Handle _maxCities === 0
  if (_maxCities === 0) return [];

  // Check in-memory cache first
  if (_nearbyCache && Date.now() - _nearbyCacheTime < NEARBY_CACHE_TTL_MS) {
    return _nearbyCache;
  }

  // Check localStorage cache
  const cacheKey = `nearby_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
  const cached = DataCache.get(cacheKey, 'nearby');
  if (cached) {
    _nearbyCache = cached;
    _nearbyCacheTime = Date.now();
    return cached;
  }

  // Fetch a larger set first so we can filter and still have enough
  let viewbox = scaleViewbox(lat, lon, NOMINATIM_CLOSE_RADIUS);
  let url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=30&addressdetails=1`;

  let results;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Nominatim ${resp.status}`);
    results = await resp.json();
  } catch {
    results = [];
  }

  // Filter: keep only towns/cities/villages/hamlets/localities, reject boundary/fuel/street/country
  if (results.length > 0) {
    const acceptableTypes = ['city','town','village','hamlet','suburb','quarter','neighbourhood','locality','isolated_dwelling','farmhouse','county','administrative'];
    results = results.filter(r => {
      const type = (r.type || '').toLowerCase();
      const cls = (r.class || '').toLowerCase();
      // Reject known non-city types
      if (cls === 'boundary' && r.place_rank >= 4) return false;
      if (type === 'country' || type === 'state' || type === 'administrative') return false;
      if (type === 'fuel' || type === 'street' || type === 'residential') return false;
      // Accept if rank 10-16 (typical city/town/village)
      if (r.place_rank >= 10 && r.place_rank <= 16) return true;
      // Accept if type looks like a populated place
      return acceptableTypes.includes(type);
    });
  }

  if (results.length < _maxCities) {
    viewbox = scaleViewbox(lat, lon, NOMINATIM_WIDE_RADIUS);
    url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=50&addressdetails=1`;
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const extra = await resp.json();
        const existingIds = new Set(results.map(r => r.place_id));
        const existingNames = new Set(results.map(r => (r.name || '').toLowerCase().trim()));
        extra.forEach(r => {
          // Skip if same place_id OR same name at same coordinates (dedup by name+coords)
          if (existingIds.has(r.place_id)) return;
          const latMatch = Math.abs(parseFloat(r.lat) - parseFloat(results[0]?.lat || 0)) < 0.01;
          const sameName = existingNames.has((r.name || '').toLowerCase().trim()) && latMatch;
          if (sameName) return;
          const type = (r.type || '').toLowerCase();
          const cls = (r.class || '').toLowerCase();
          if (cls === 'boundary' && r.place_rank >= 4) return;
          if (type === 'country' || type === 'state' || type === 'administrative') return;
          if (type === 'fuel' || type === 'street' || type === 'residential') return;
          if (r.place_rank >= 10 && r.place_rank <= 16) {
            results.push(r);
            existingIds.add(r.place_id);
            existingNames.add((r.name || '').toLowerCase().trim());
          }
        });
      }
    } catch {
      // silently ignore
    }
  }

  if (results.length === 0) {
    if (_maxCities > 0) showLocationPrompt();
    return [];
  }

  const cities = results.map(item => {
    const address = item.address || {};
    let name = item.name || address.city || '';
    // International region fallback chain
    let state = address.state || address.state_district || address.region || address.county || '';
    let country = address.country || '';
    name = name.replace(/^City of\s+/i, '');

    return {
      place_id: String(item.place_id),
      name,
      latitude: parseFloat(item.lat),
      longitude: parseFloat(item.lon),
      state,
      country,
      distance: haversine(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
      bearing: bearing(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
    };
  });

  // Deduplicate by place_id AND by name+coordinate proximity
  const seen = new Set();
  const deduped = cities.filter(c => {
    if (seen.has(c.place_id)) return false;
    // Also check by name + coordinates (within 0.01° ≈ 1km)
    const nameKey = c.name.toLowerCase().trim();
    const coordKey = `${DataCache._roundCoord(c.latitude)},${DataCache._roundCoord(c.longitude)}`;
    for (const existing of seen) {
      if (existing.name === nameKey && existing.coordKey === coordKey) {
        return false;
      }
    }
    seen.add({ name: nameKey, coordKey, place_id: c.place_id });
    return true;
  });

  deduped.sort((a, b) => a.distance - b.distance);

  // Select cities with bearing diversity and min distance
  const selected = [deduped[0]];
  const used = new Set([0]);
  const remaining = deduped.filter((_, i) => !used.has(i));
  remaining.sort((a, b) => {
    const aMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(a.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    const bMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(b.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    return bMinDiff - aMinDiff;
  });

  for (const city of remaining) {
    if (selected.length >= _maxCities) break;
    let tooClose = false;
    for (const sel of selected) {
      const dist = haversine(city.latitude, city.longitude, sel.latitude, sel.longitude);
      if (dist < MIN_CITY_DISTANCE_MI) { tooClose = true; break; }
    }
    if (!tooClose) {
      selected.push(city);
      used.add(deduped.indexOf(city));
    }
  }

  // Fill remaining slots if we still need more
  for (let i = 0; i < deduped.length && selected.length < _maxCities; i++) {
    if (!used.has(i)) selected.push(deduped[i]);
  }

  _nearbyCache = selected;
  _nearbyCacheTime = Date.now();

  // Store in localStorage cache
  DataCache.set(cacheKey, selected, 'nearby');

  return selected;
}

<script>
// ===== NWS API CLIENT =====
// Fetches weather data from api.weather.gov (NWS) and maps it to the app's data model.

const NWS_API = 'https://api.weather.gov';
const NWS_USER_AGENT = 'hasWeather/1.0 (https://github.com/Yonneh0/hasWeather)';

// NWS forecast period descriptions mapped to WMO weather codes
// Maps shortForecast keywords to WMO codes that drive existing SVG icons
function nwsForecastToWmo(shortForecast) {
  const text = (shortForecast || '').toLowerCase();

  // Clear/sky conditions
  if (/clear|sunny|fair/.test(text)) return 0;
  if (/mainly clear|mostly clear/.test(text)) return 1;
  if (/partly cloudy|partly sunny|mostly sunny/.test(text)) return 2;
  if (/overcast|cloudy/.test(text)) return 3;

  // Fog
  if (/fog|mist|haze/.test(text)) return 45;

  // Drizzle
  if (/drizzle/.test(text)) return 53;

  // Rain
  if (/rain/.test(text)) {
    if (/heavy|violent|intense/.test(text)) return 65;
    if (/moderate/.test(text)) return 63;
    return 61;
  }

  // Freezing rain
  if (/freezing rain|freezing drizzle/.test(text)) return 57;

  // Snow
  if (/snow/.test(text)) {
    if (/heavy|intense/.test(text)) return 75;
    if (/moderate/.test(text)) return 73;
    return 71;
  }

  // Snow grains
  if (/snow grains|snow pellets/.test(text)) return 77;

  // Showers
  if (/shower/.test(text)) {
    if (/heavy|violent|intense/.test(text)) return 82;
    if (/moderate/.test(text)) return 81;
    return 80;
  }

  // Thunderstorm
  if (/thunderstorm|thunder/.test(text)) return 95;

  // Default: overcast
  return 3;
}

// Map NWS weather array items to WMO codes
function nwsWeatherToWmo(weatherArray) {
  if (!weatherArray || !Array.isArray(weatherArray) || weatherArray.length === 0) return 0;

  // Find the most severe weather event
  const priority = [
    'tornado', 'severe thunderstorm', 'severe thunderstorms', 'tstm',
    'thunderstorm', 'thunder', 'hail', 'hail',
    'heavy rain', 'rain', 'heavy showers', 'showers',
    'freezing rain', 'freezing drizzle',
    'snow', 'heavy snow', 'snow showers',
    'drizzle',
    'fog', 'mist', 'haze',
  ];

  for (const condition of priority) {
    if (condition.includes(' ')) {
      // Multi-word condition
      for (const item of weatherArray) {
        const icon = (item.icon || '').toLowerCase();
        if (icon.includes(condition.toLowerCase())) {
          return nwsForecastToWmo(condition);
        }
      }
    }
  }

  // Fallback: check individual weather icon keywords
  for (const item of weatherArray) {
    const icon = (item.icon || '').toLowerCase();
    if (icon.includes('tornado')) return 99;
    if (icon.includes('thunderstorm')) return 95;
    if (icon.includes('rain')) return 63;
    if (icon.includes('snow')) return 73;
    if (icon.includes('drizzle')) return 53;
    if (icon.includes('fog')) return 45;
  }

  return 0;
}

// Build a NWS cache key for a point
function nwsPointCacheKey(lat, lon) {
  return `nws_point_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// Build a NWS cache key for gridpoint data
function nwsGridCacheKey(wfo, x, y, suffix) {
  return `nws_grid_${wfo}_${x}_${y}${suffix ? '_' + suffix : ''}`;
}

// Fetch with User-Agent header, rate limiting, and retry logic
async function nwsFetch(url, maxRetries = 3) {
  // Rate limit: wait for available slot
  await _nwsRateLimiter.waitForSlot();

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000); // 10s timeout

  try {
    const response = await fetch(url, {
      headers: { 'User-Agent': NWS_USER_AGENT },
      signal: controller.signal,
    });

    // Handle 429 rate limiting with exponential backoff
    if (response.status === 429) {
      if (maxRetries <= 0) throw new Error('NWS API rate limited (429)');
      const waitMs = Math.pow(2, 3 - maxRetries) * 2000; // 16s, 8s, 4s
      console.log(`[NWS] Rate limited, waiting ${waitMs}ms before retry`);
      await new Promise(r => setTimeout(r, waitMs));
      return await nwsFetch(url, maxRetries - 1);
    }

    if (!response.ok) {
      throw new Error(`NWS API error: ${response.status}`);
    }
    return await response.json();
  } finally {
    clearTimeout(timeout);
  }
}

// Step 1: Resolve a lat/lon to a WFO grid
async function resolvePoint(lat, lon) {
  const cacheKey = nwsPointCacheKey(lat, lon);
  const cached = DataCache.get(cacheKey, 'nwsPoint');
  if (cached) return cached;

  const url = `${NWS_API}/points/${lat},${lon}`;
  const data = await nwsFetch(url);

  const props = data?.properties || {};
  const result = {
    wfo: props.gridId || props.cwa,
    gridX: props.gridX,
    gridY: props.gridY,
    forecastZone: props.forecastZone,
    county: props.county,
    fireWeatherZone: props.fireWeatherZone,
    timeZone: props.timeZone,
    radarStation: props.radarStation,
    observationStations: props.observationStations,
    forecast: props.forecast,
    forecastHourly: props.forecastHourly,
    forecastGridData: props.forecastGridData,
  };

  DataCache.set(cacheKey, result, 'nwsPoint');
  return result;
}

// Step 2: Fetch 12-hour forecast
async function fetchForecast(wfo, x, y) {
  const cacheKey = nwsGridCacheKey(wfo, x, y, 'forecast');
  const cached = DataCache.get(cacheKey, 'nwsForecast');
  if (cached) return cached;

  const url = `${NWS_API}/gridpoints/${wfo}/${x},${y}/forecast?units=us`;
  const data = await nwsFetch(url);

  const periods = (data?.properties?.periods || []).map(p => ({
    number: p.number,
    name: p.name,
    startTime: p.startTime,
    endTime: p.endTime,
    isDaytime: p.isDaytime,
    temperature: p.temperature,
    temperatureUnit: p.temperatureUnit,
    temperatureTrend: p.temperatureTrend,
    probabilityOfPrecipitation: p.probabilityOfPrecipitation?.value ?? null,
    // NWS returns dewpoint in Celsius even with units=us
    dewpoint: p.dewpoint?.value != null ? convertObsTempToF(p.dewpoint.value, p.dewpoint.unitCode) : null,
    dewpointUnit: p.dewpoint?.unitCode == null ? 'F' : p.dewpoint.unitCode,
    // windSpeed is a string like "10 mph" - parse to number
    windSpeed: parseWindSpeedString(p.windSpeed),
    windSpeedUnit: 'mph',
    // windGust is a string like "20 mph" - parse to number
    windGust: parseWindSpeedString(p.windGust),
    windGustUnit: 'mph',
    windDirection: p.windDirection,
    shortForecast: p.shortForecast,
    detailedForecast: p.detailedForecast,
  }));

  DataCache.set(cacheKey, periods, 'nwsForecast');
  return periods;
}

// Step 3: Fetch hourly forecast
async function fetchHourlyForecast(wfo, x, y) {
  const cacheKey = nwsGridCacheKey(wfo, x, y, 'hourly');

    dewpoint: p.dewpoint?.value != null ? convertObsTempToF(p.dewpoint.value, p.dewpoint.unitCode) : null,
    dewpointUnit: p.dewpoint?.unitCode == null ? 'F' : p.dewpoint.unitCode,
    // windSpeed is a string like "10 mph" - parse to number
    windSpeed: parseWindSpeedString(p.windSpeed),
    windSpeedUnit: 'mph',
    // windGust is a string like "20 mph" - parse to number
    windGust: parseWindSpeedString(p.windGust),

// Step 4: Fetch raw grid data (current conditions)
async function fetchCurrentConditions(wfo, x, y) {
  const cacheKey = nwsGridCacheKey(wfo, x, y, 'current');
  const cached = DataCache.get(cacheKey, 'nwsCurrent');
  if (cached) return cached;

  const url = `${NWS_API}/gridpoints/${wfo}/${x},${y}`;
  const data = await nwsFetch(url);

  const props = data?.properties || {};
  const now = new Date();

  // Find the value whose validTime covers the current time
  const findCurrent = (propName) => {
    const values = props[propName]?.values;
    if (!values || !Array.isArray(values) || values.length === 0) return null;
    const found = findCurrentNwsValue(values, now);
    if (!found) return null;
    return { value: found.value, uom: props[propName]?.uom };
  };

  const temp = findCurrent('temperature');
  const dew = findCurrent('dewpoint');
  const rh = findCurrent('relativeHumidity');
  const ws = findCurrent('windSpeed');
  const wg = findCurrent('windGust');
  const wd = findCurrent('windDirection');
  const vis = findCurrent('visibility');
  // NWS gridpoint uses 'surfacePressure' or 'surface_pressure' for surface-level pressure
  const pr = findCurrent('surfacePressure') ?? findCurrent('surface_pressure') ?? findCurrent('pressure');
  const ch = findCurrent('ceilingHeight');

  // Weather and hazards have a different structure (array of objects)
  const weatherValues = props.weather?.values;
  const weather = weatherValues && weatherValues.length > 0 ? findCurrentNwsValue(weatherValues, now)?.value ?? [] : [];
  const hazardsValues = props.hazards?.values;
  const hazards = hazardsValues && hazardsValues.length > 0 ? findCurrentNwsValue(hazardsValues, now)?.value ?? [] : [];

  // PoP has a different structure - find the closest value
  const popValues = props.probabilityOfPrecipitation?.values;
  let pop = null;
  if (popValues && popValues.length > 0) {
    const foundPop = findCurrentNwsValue(popValues, now);
    pop = foundPop?.value ?? null;
  }

  // QPE has a different structure - find the closest value
  const qpeValues = props.quantitativePrecipitation?.values;
  let qpe = null;
  let qpeUnit = null;
  if (qpeValues && qpeValues.length > 0) {
    const foundQpe = findCurrentNwsValue(qpeValues, now);
    qpe = foundQpe?.value ?? null;
    qpeUnit = props.quantitativePrecipitation?.uom ?? 'wmoUnit:mm';
  }

  // Ice accumulation - find the closest value
  const iceValues = props.iceAccumulation?.values;
  let ice = null;
  let iceUnit = null;
  if (iceValues && iceValues.length > 0) {
    const foundIce = findCurrentNwsValue(iceValues, now);
    ice = foundIce?.value ?? null;
    iceUnit = props.iceAccumulation?.uom ?? 'wmoUnit:mm';
  }

  // Snowfall - find the closest value
  const snowValues = props.snowfallAmount?.values;
  let snow = null;
  let snowUnit = null;
  if (snowValues && snowValues.length > 0) {
    const foundSnow = findCurrentNwsValue(snowValues, now);
    snow = foundSnow?.value ?? null;
    snowUnit = props.snowfallAmount?.uom ?? 'wmoUnit:mm';
  }

  // Sky cover - find the closest value
  const skyCoverValues = props.skyCover?.values;
  let skyCover = null;
  let skyCoverUnit = null;
  if (skyCoverValues && skyCoverValues.length > 0) {
    const foundSky = findCurrentNwsValue(skyCoverValues, now);
    skyCover = foundSky?.value ?? null;
    skyCoverUnit = props.skyCover?.uom ?? 'wmoUnit:percent';
  }

  const current = {
    temperature: temp?.value ?? null,
    temperatureUnit: temp?.uom ?? 'wmoUnit:degC',
    dewpoint: dew?.value ?? null,
    dewpointUnit: dew?.uom ?? 'wmoUnit:degC',
    relativeHumidity: rh?.value ?? null,
    relativeHumidityUnit: rh?.uom ?? 'wmoUnit:percent',
    windSpeed: ws?.value ?? null,
    windSpeedUnit: ws?.uom ?? 'wmoUnit:m/s',
    windGust: wg?.value ?? null,
    windGustUnit: wg?.uom ?? 'wmoUnit:m/s',
    windDirection: wd?.value ?? null,
    windDirectionUnit: wd?.uom ?? 'wmoUnit:degree_(angle)',
    weather: weather,
    hazards: hazards,
    probabilityOfPrecipitation: pop,
    quantitativePrecipitation: qpe,
    quantitativePrecipitationUnit: qpeUnit,
    iceAccumulation: ice,
    iceAccumulationUnit: iceUnit,
    snowfallAmount: snow,
    snowfallAmountUnit: snowUnit,
    skyCover: skyCover,
    skyCoverUnit: skyCoverUnit,
    ceilingHeight: ch?.value ?? null,
    ceilingHeightUnit: ch?.uom ?? 'wmoUnit:m',
    visibility: vis?.value ?? null,
    visibilityUnit: vis?.uom ?? 'wmoUnit:m',
    // Use surfacePressure if available (NWS gridpoint), fallback to pressure
    pressure: pr?.value ?? null,
    pressureUnit: pr?.uom ?? 'nwsUnit:inHg',
  };

  DataCache.set(cacheKey, current, 'nwsCurrent');
  return current;
}

// Step 5: Fetch nearest observation stations
async function fetchStations(wfo, x, y) {

// Step 6: Fetch latest observation from a station
async function fetchLatestObservation(stationId) {
  const cacheKey = `nws_obs_${stationId}`;
  const cached = DataCache.get(cacheKey, 'nwsObservation');
  if (cached) return cached;

  const url = `${NWS_API}/stations/${stationId}/observations/latest?require_qc=true`;
  const data = await nwsFetch(url);
  const props = data?.properties || {};

  const obs = {
    // Temperature is in Celsius (wmoUnit:degC), convert to Fahrenheit
    temperature: props.temperature?.value != null ? convertObsTempToF(props.temperature.value, props.temperature.unitCode) : null,
    temperatureUnit: props.temperature?.unitCode == null ? 'F' : props.temperature.unitCode,
    // Dewpoint is in Celsius (wmoUnit:degC), convert to Fahrenheit
    dewpoint: props.dewpoint?.value != null ? convertObsTempToF(props.dewpoint.value, props.dewpoint.unitCode) : null,
    dewpointUnit: props.dewpoint?.unitCode == null ? 'F' : props.dewpoint.unitCode,
    windDirection: props.windDirection?.value ?? null,
    // Wind speed is in km/h (wmoUnit:km_h-1), convert to mph
    windSpeed: props.windSpeed?.value != null ? convertObsWindToMph(props.windSpeed.value, props.windSpeed.unitCode) : null,
    windSpeedUnit: props.windSpeed?.unitCode == null ? 'mph' : props.windSpeed.unitCode,
    // Wind gust is in km/h (wmoUnit:km_h-1), convert to mph
    windGust: props.windGust?.value != null ? convertObsWindToMph(props.windGust.value, props.windGust.unitCode) : null,
    windGustUnit: props.windGust?.unitCode == null ? 'mph' : props.windGust.unitCode,
    // Barometric pressure is in Pa (wmoUnit:Pa), convert to hPa
    barometricPressure: props.barometricPressure?.value != null ? paToHpa(props.barometricPressure.value) : null,
    barometricPressureUnit: props.barometricPressure?.unitCode == null ? 'hPa' : props.barometricPressure.unitCode,
    seaLevelPressure: props.seaLevelPressure?.value != null ? paToHpa(props.seaLevelPressure.value) : null,
    seaLevelPressureUnit: props.seaLevelPressure?.unitCode == null ? 'hPa' : props.seaLevelPressure.unitCode,
    // Visibility is in meters (wmoUnit:m), convert to miles
    visibility: props.visibility?.value != null ? metersToMiles(props.visibility.value) : null,
    visibilityUnit: props.visibility?.unitCode == null ? 'mi' : props.visibility.unitCode,
    relativeHumidity: props.relativeHumidity?.value ?? null,
    relativeHumidityUnit: props.relativeHumidity?.unitCode == null ? '%' : props.relativeHumidity.unitCode,
    // Wind chill is in Celsius (wmoUnit:degC), convert to Fahrenheit
    windChill: props.windChill?.value != null ? convertObsTempToF(props.windChill.value, props.windChill.unitCode) : null,
    windChillUnit: props.windChill?.unitCode == null ? 'F' : props.windChill.unitCode,
    // Heat index is in Celsius (wmoUnit:degC), convert to Fahrenheit
    heatIndex: props.heatIndex?.value != null ? convertObsTempToF(props.heatIndex.value, props.heatIndex.unitCode) : null,
    heatIndexUnit: props.heatIndex?.unitCode == null ? 'F' : props.heatIndex.unitCode,
    cloudLayers: props.cloudLayers || [],
    weather: props.presentWeather || [],
    rawMessage: props.rawMessage || '',
  };

  DataCache.set(cacheKey, obs, 'nwsObservation');
  return obs;
}

// Main orchestrator: fetch all NWS data for a city's coordinates
async function fetchForCity(lat, lon) {
  const point = await resolvePoint(lat, lon);
  if (!point.wfo || !point.gridX || !point.gridY) {
    return null; // NWS doesn't cover this area
  }

  const [current, hourly] = await Promise.all([
    fetchCurrentConditions(point.wfo, point.gridX, point.gridY),
    fetchHourlyForecast(point.wfo, point.gridX, point.gridY),
  ]);

  return { point, current, hourly };
}

// NWS unit code constants
const NWS_UNIT_DEGC = 'wmoUnit:degC';
const NWS_UNIT_DEGF = 'nwsUnit:degF';
const NWS_UNIT_MS = 'wmoUnit:m/s';
const NWS_UNIT_KM_H = 'wmoUnit:km_h-1';
const NWS_UNIT_MPH = 'nwsUnit:mi/h';
const NWS_UNIT_M = 'wmoUnit:m';
const NWS_UNIT_MI = 'nwsUnit:mi';
const NWS_UNIT_HPA = 'wmoUnit:hPa';
const NWS_UNIT_INHG = 'nwsUnit:inHg';
const NWS_UNIT_MM = 'wmoUnit:mm';
const NWS_UNIT_IN = 'nwsUnit:in';
const NWS_UNIT_PERCENT = 'wmoUnit:percent';

// Convert NWS unit code to a boolean for the app's unit preference
function isNwsUnitInMeters(unitCode) {
  return unitCode === NWS_UNIT_M;
}

function isNwsUnitInMetersPerSecond(unitCode) {
  return unitCode === NWS_UNIT_MS || unitCode === NWS_UNIT_KM_H;
}

function isNwsUnitInInches(unitCode) {
  return unitCode === NWS_UNIT_IN;
}

function isNwsUnitInInchesHg(unitCode) {
  return unitCode === NWS_UNIT_INHG;
}

// Convert Celsius to Fahrenheit
function celsiusToFahrenheit(c) {
  if (c == null) return null;
  return Math.round((c * 9 / 5) + 32);
}

// Convert meters to miles
function metersToMiles(m) {
  if (m == null) return null;
  return Math.round(m / 1609.34 * 10) / 10;
}

// Convert m/s to km/h
function mpsToKmh(ms) {
  if (ms == null) return null;
  return Math.round(ms * 3.6);
}

// Convert km/h to km/h (no conversion needed)
function kmhToKmh(kmh) {
  if (kmh == null) return null;
  return Math.round(kmh);
}

// Convert mph to km/h
function mphToKmh(mph) {
  if (mph == null) return null;
  return Math.round(mph * 1.60934);
}

// Convert wind speed to km/h based on unit code
function convertWindSpeedToKmh(speed, unitCode) {
  if (speed == null) return null;
  if (unitCode === NWS_UNIT_MS) return mpsToKmh(speed);
  if (unitCode === NWS_UNIT_KM_H) return kmhToKmh(speed);
  if (unitCode === NWS_UNIT_MPH) return mphToKmh(speed);
  // Default: assume km/h
  return kmhToKmh(speed);
}

// Convert inHg to hPa
function inhgToHpa(inhg) {
  if (inhg == null) return null;
  return Math.round(inhg * 33.8639);
}

// Convert hPa to hPa (no conversion needed)
function hpaToHpa(hpa) {
  if (hpa == null) return null;
  return Math.round(hpa);
}

// Convert pressure to hPa based on unit code
function convertPressureToHpa(pressure, unitCode) {
  if (pressure == null) return null;
  if (unitCode === NWS_UNIT_INHG) return inhgToHpa(pressure);
  if (unitCode === NWS_UNIT_HPA) return hpaToHpa(pressure);
  // Default: assume hPa
  return hpaToHpa(pressure);
}

// Convert mm to inches
function mmToInches(mm) {
  if (mm == null) return null;
  return Math.round(mm / 25.4 * 100) / 100;
}

// Convert mm to inches (for snowfall)
function mmToInchesSnow(mm) {
  if (mm == null) return null;
  // Roughly: 1 inch of rain = ~10 inches of snow
  return Math.round(mm / 25.4 * 10) / 10;
}

// Convert Pa to hPa
function paToHpa(pa) {
  if (pa == null) return null;
  return Math.round(pa / 100);
}

// Convert meters to feet
function metersToFeet(m) {
  if (m == null) return null;
  return Math.round(m * 3.28084);
}

// Parse a NWS validTime string like "2026-06-13T06:00:00+00:00/PT2H" into start/end timestamps
function parseNwsValidTime(vt) {
  if (!vt) return null;
  const slashIdx = vt.indexOf('/');
  if (slashIdx === -1) return null;
  const startStr = vt.substring(0, slashIdx);
  const durationStr = vt.substring(slashIdx + 1);
  const start = new Date(startStr).getTime();
  // Parse duration like PT2H, PT1H, P1DT6H etc.
  let durationMs = 0;
  const dMatch = durationStr.match(/P(?:(\d+)D)?(?:(\d+)H)?(?:(\d+)M)?/);
  if (dMatch) {
    if (dMatch[1]) durationMs += parseInt(dMatch[1]) * 86400000;
    if (dMatch[2]) durationMs += parseInt(dMatch[2]) * 3600000;
    if (dMatch[3]) durationMs += parseInt(dMatch[3]) * 60000;
  }
  return { start, end: start + durationMs };
}

// Find the value whose validTime covers the current time
function findCurrentNwsValue(values, now) {
  if (!values || !Array.isArray(values) || values.length === 0) return null;
  const nowMs = now.getTime();
  let best = null;
  let bestDiff = Infinity;
  for (const v of values) {
    const range = parseNwsValidTime(v.validTime);
    if (!range) continue;
    // Check if current time falls within this range
    if (nowMs >= range.start && nowMs < range.end) {
      return v;
    }
    // If not within range, find the closest one
    const diff = Math.min(Math.abs(nowMs - range.start), Math.abs(nowMs - range.end));
    if (diff < bestDiff) {
      bestDiff = diff;
      best = v;
    }
  }
  return best;
}

// Convert Celsius to Fahrenheit for observation station data
function convertObsTempToF(c, unitCode) {
  if (c == null) return null;
  if (unitCode === NWS_UNIT_DEGC) return celsiusToFahrenheit(c);
  return c;
}

// Convert observation station wind speed to mph based on unit code
function convertObsWindToMph(speed, unitCode) {
  if (speed == null) return null;
  if (unitCode === NWS_UNIT_KM_H) return Math.round(speed * 0.621371);
  if (unitCode === NWS_UNIT_MS) return Math.round(speed * 2.23694);
  // Default: assume mph
  return Math.round(speed);
}

// NWS hourly forecast windSpeed is a string like "2 mph" or "10 mph"
// Extract the numeric value
function parseWindSpeedString(windSpeedStr) {
  if (typeof windSpeedStr !== 'string') return windSpeedStr;
  const match = windSpeedStr.match(/^(\d+)\s*mph$/);
  return match ? parseInt(match[1], 10) : null;
}

// Map NWS data to the app's weather data model
function nwsToAppData(city, nwsData) {
  if (!nwsData || !nwsData.current) return null;

  const { current, hourly } = nwsData;

  // Determine if we need to convert units (NWS gridpoint is always metric)
  const needsTempConversion = current.temperatureUnit === NWS_UNIT_DEGC;
  const needsWindConversion = current.windSpeedUnit !== NWS_UNIT_MPH;
  const needsVisConversion = current.visibilityUnit === NWS_UNIT_M;
  const needsPrecipConversion = current.quantitativePrecipitationUnit === NWS_UNIT_MM;

  // Build current conditions object
  // Temperature is already in Celsius (NWS gridpoint always returns Celsius)
  // Store as Celsius so convertTemp() can convert to F or C based on user preference
  const temp = current.temperature;

  // Convert wind speed to km/h for the app
  const windSpeed = convertWindSpeedToKmh(current.windSpeed, current.windSpeedUnit);

  // Convert visibility from meters to miles for the app
  const vis = needsVisConversion ? metersToMiles(current.visibility) : current.visibility;

  // Convert quantitative precipitation from mm to inches for the app
  const precip = needsPrecipConversion ? mmToInches(current.quantitativePrecipitation) : current.quantitativePrecipitation;

  // Convert ice accumulation from mm to inches for the app
  const ice = mmToInches(current.iceAccumulation);

  // Convert snowfall from mm to inches for the app
  const snow = mmToInchesSnow(current.snowfallAmount);

  // Dewpoint is already in Celsius (NWS gridpoint always returns Celsius)
  // Store as Celsius so convertTemp() can convert to F or C based on user preference
  const dewpoint = current.dewpoint;

  // Convert wind gust from m/s to km/h for the app (same as wind speed conversion)
  const windGust = convertWindSpeedToKmh(current.windGust, current.windGustUnit);

  // Check if NWS fields are missing — we'll try to cross-source them from OM cache
  const nwsHasPressure = current.pressure != null;
  const nwsHasVisibility = current.visibility != null;
  const nwsHasUvIndex = false; // NWS never provides UV Index

  const currentApp = {
    temperature_2m: temp,
    temperatureUnit: 'C', // Always store Celsius — convertTemp() converts from Celsius
    relative_humidity_2m: current.relativeHumidity,
    wind_speed_10m: windSpeed,
    wind_direction_10m: current.windDirection,
    surface_pressure: nwsHasPressure ? convertPressureToHpa(current.pressure, current.pressureUnit) : null,
    weather_code: nwsWeatherToWmo(current.weather),
    probabilityOfPrecipitation: current.probabilityOfPrecipitation,
    skyCover: current.skyCover,
    visibility: nwsHasVisibility ? vis : null,
    visibilityUnit: needsVisConversion ? 'mi' : (nwsHasVisibility ? current.visibilityUnit : null),
    uv_index: null, // NWS doesn't provide UV Index — will be cross-sourced below
    dewpoint: dewpoint,
    windGust: windGust,
    shortForecast: current.weather?.[0]?.icon || '',
    detailedForecast: '',
    // Keep raw values for reference
    _rawTemp: current.temperature,
    _rawTempUnit: current.temperatureUnit,
    _rawWindSpeed: current.windSpeed,
    _rawWindSpeedUnit: current.windSpeedUnit,
    _rawVisibility: current.visibility,
    _rawVisibilityUnit: current.visibilityUnit,
    _rawPrecip: current.quantitativePrecipitation,
    _rawPrecipUnit: current.quantitativePrecipitationUnit,
    _rawIce: current.iceAccumulation,
    _rawIceUnit: current.iceAccumulationUnit,
    _rawSnow: current.snowfallAmount,
    _rawSnowUnit: current.snowfallAmount?.uom ?? 'wmoUnit:mm',
  };

  // Cross-source missing fields from OM cache (pressure, visibility, UV Index)
  // Try consolidated cache key first, then fall back to legacy weather key
  const omWeather = DataCache.get(weatherAqiCacheKey(city.latitude, city.longitude), 'weatherAqi')?.weather 
    || DataCache.get(weatherCacheKey(city.latitude, city.longitude), 'weather');
  if (omWeather && omWeather.current) {
    // Merge missing pressure from OM
    if (!nwsHasPressure && omWeather.current.surface_pressure != null) {
      currentApp.surface_pressure = omWeather.current.surface_pressure;
    }
    // Merge missing visibility from OM (OM returns meters, convert to miles)
    if (!nwsHasVisibility && omWeather.current.visibility != null) {
      currentApp.visibility = metersToMiles(omWeather.current.visibility);
      currentApp.visibilityUnit = 'mi';
    }
    // Merge UV Index from OM (NWS doesn't provide it)
    if (omWeather.current.uv_index != null) {
      currentApp.uv_index = omWeather.current.uv_index;
    }
  }

  // Build hourly forecast array (NWS hourly is already in order)
  const hourlyTimes = hourly.map(p => p.startTime);
  // NWS hourly with units=us returns temperature in Fahrenheit — convert to Celsius
  // convertTemp() always converts from Celsius, so we must store in Celsius
  const hourlyTemps = hourly.map(p => {
    const f = p.temperature;
    return f != null ? (f - 32) * 5 / 9 : null;
  });
  const hourlyHumidity = hourly.map(p => p.relativeHumidity);
  // NWS hourly windSpeed is a string like "2 mph" - extract numeric value and convert mph → km/h
  const hourlyWind = hourly.map(p => {
    const mphVal = parseWindSpeedString(p.windSpeed);
    return mphVal != null ? mphToKmh(mphVal) : null;
  });
  const hourlyWindDir = hourly.map(p => p.windDirection);
  const hourlyPoP = hourly.map(p => p.probabilityOfPrecipitation);
  const hourlyWeatherCodes = hourly.map(p => nwsForecastToWmo(p.shortForecast));
  // NWS hourly doesn't provide precipitation directly - use PoP as proxy
  const hourlyPrecip = hourly.map(p => {
    return null;
  });

  const hourlyApp = {
    time: hourlyTimes,
    temperature_2m: hourlyTemps,
    relative_humidity_2m: hourlyHumidity,
    wind_speed_10m: hourlyWind,
    wind_direction_10m: hourlyWindDir,
    probabilityOfPrecipitation: hourlyPoP,
    weather_code: hourlyWeatherCodes,
    precipitation: hourlyPrecip,
  };

  // Add sunrise/sunset from point data
  const astroData = nwsData.point?.astronomicalData;
  if (astroData) {
    currentApp.sunrise = astroData.sunrise;
    currentApp.sunset = astroData.sunset;
  }

  return {
    ...city,
    source: 'nws',
    weather: {
      current: currentApp,
      hourly: hourlyApp,
    },
  };
}

<script>
// ===== WEATHER.GOV RADAR API CLIENT =====
// Fetches radar imagery from NOAA/NCEP GeoServer WMS service.
// Primary source: MRMS (Multi-Radar-Multi-Sensor) composite radar data.
// Cache: Binary images stored in Browser Cache API (CacheStorage), metadata in localStorage.

// ===== ENDPOINTS & CONSTANTS =====
const RADAR_WMS_BASE = 'https://opengeo.ncep.noaa.gov/geoserver/conus/';
const RADAR_DEFAULT_LAYER = 'conus_bref_qcd'; // MRMS Base Reflectivity (quality controlled, shows all radar returns)
const RADAR_IMAGE_SIZE = 512;                  // Image dimension in pixels
const RADAR_BBOX_RADIUS_KM = 200;              // Area around user location to capture (km)
const RADAR_TTL = 5 * 60 * 1000;               // 5 minutes (radar updates every ~2 min)
const RADAR_META_TTL = 30 * 60 * 1000;         // 30 minutes (metadata doesn't change often)

// Available radar layers
const RADAR_LAYERS = {
  BASE_REFLECTIVITY: 'conus_bref_qcd',      // Quality Controlled 1km Base Reflectivity (MRMS)
  COMPOSITE_REFLECTIVITY: 'conus_cref_qcd',  // Composite Reflectivity
  ECHO_TOPS: 'conus_neet_v18',              // Echo Tops
  PRECIPITATION_TYPE: 'conus_pcpn_typ',      // Precipitation Type
};

// Cache API constants
const RADAR_CACHE_NAME = 'hasw-radar-v1';
// Fake HTTP prefix for cache keys — required because Cache API only accepts http(s) URLs
const RADAR_FAKE_BASE = 'https://radar.hasweather.local/';
const RADAR_FRAME_PREFIX = `${RADAR_FAKE_BASE}frame/`;
const RADAR_FRAMES_KEY = 'frames';
const RADAR_MAX_CACHE_BYTES = 250 * 1024 * 1024; // ~250MB total limit

// ===== BBOX CALCULATION =====
// Convert lon to EPSG:3857 meters
function lonToX(lon) {
  return lon * 20037508.34 / 180;
}

// Convert lat to EPSG:3857 meters
function latToY(lat) {
  const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) / (Math.PI / 180);
  return y * 20037508.34 / 180;
}

// Calculate bounding box in EPSG:3857 meters around a lat/lon point
function latLonToBboxEPSG3857(lat, lon, radiusKm) {
  const R = 6371; // Earth radius in km
  const dLat = (radiusKm / R) * (180 / Math.PI);
  const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(lat * Math.PI / 180);

  return [
    lonToX(lon - dLon),   // minx in meters
    latToY(lat - dLat),   // miny in meters
    lonToX(lon + dLon),   // maxx in meters
    latToY(lat + dLat),   // maxy in meters
  ];
}

// ===== WMS URL BUILDER =====
function buildRadarImageUrl(lat, lon, layer, timestamp) {
  const bbox = latLonToBboxEPSG3857(lat, lon, RADAR_BBOX_RADIUS_KM);
  const timeStr = timestamp ? new Date(timestamp).toISOString().replace(/\.\d+Z$/, 'Z') : '';

  return `${RADAR_WMS_BASE}${layer}/wms?` +
    `SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&FORMAT=image/png` +
    `&LAYERS=${encodeURIComponent(layer)}` +
    `&TIME=${encodeURIComponent(timeStr)}` +
    `&WIDTH=${RADAR_IMAGE_SIZE}&HEIGHT=${RADAR_IMAGE_SIZE}` +
    `&SRS=EPSG:3857&BBOX=${bbox.join(',')}`;
}

// ===== CACHE KEY GENERATION =====
// Build a fake HTTP URL as the cache key — Cache API only accepts http(s) URLs
function radarFrameCacheKey(lat, lon, layer, timestamp) {
  return `${RADAR_FRAME_PREFIX}${lat.toFixed(4)}/${lon.toFixed(4)}/${layer}/frame/${timestamp}`;
}

function radarFramesCacheKey(lat, lon, layer) {
  return `${RADAR_FAKE_BASE}${lat.toFixed(4)}/${lon.toFixed(4)}/${layer}/${RADAR_FRAMES_KEY}`;
}

function radarLocationPrefix(lat, lon, layer) {
  return `${RADAR_FAKE_BASE}${lat.toFixed(4)}/${lon.toFixed(4)}/${layer}/`;
}

// ===== LATEST RADAR TIMESTAMP CACHE =====
// Cache the latest radar timestamp to avoid repeated GetCapabilities calls
let _latestTimestampCache = null; // { timestamp: string, expiresAt: number }

// ===== ALL RADAR TIMESTAMPS CACHE =====
// Cache all available timestamps from GetCapabilities to populate the timeline
let _allTimestampsCache = null; // { timestamps: string[], layer: string, expiresAt: number }

// Parse all available timestamps from WMS GetCapabilities response
function parseRadarTimestamps(capabilitiesText) {
  const timestamps = [];
  
  // Parse all <Extent> elements with name="time" to find time values
  const extentRegex = /<Extent[^>]+name="time"[^>]*>([^<]+)<\/Extent>/gi;
  let match;
  while ((match = extentRegex.exec(capabilitiesText)) !== null) {
    // Timestamps can be comma-separated or space-separated
    const timeValues = match[1].split(/[\s,]+/).map(t => t.trim()).filter(Boolean);
    timestamps.push(...timeValues);
  }
  
  // Also check for default attribute (most recent timestamp)
  const defaultMatch = capabilitiesText.match(/<Extent[^>]+name="time"[^>]*default="([^"]+)"/i);
  if (defaultMatch && defaultMatch[1] && !timestamps.includes(defaultMatch[1])) {
    timestamps.push(defaultMatch[1]);
  }
  
  // Validate and deduplicate timestamps
  const validTimestamps = [];
  for (const ts of timestamps) {
    // Validate ISO8601 format
    const date = new Date(ts);
    if (!isNaN(date.getTime())) {
      // Normalize to consistent ISO8601 format
      validTimestamps.push(date.toISOString().replace(/\.\d+Z$/, 'Z'));
    }
  }
  
  // Deduplicate
  return [...new Set(validTimestamps)].sort();
}

// Get ALL available timestamps for a layer (not just the latest)
async function getRadarTimestampsForLayer(layer = RADAR_DEFAULT_LAYER) {
  const cacheKey = `${layer}`;
  
  // Return cached timestamps if valid (30 min TTL — metadata rarely changes)
  if (_allTimestampsCache && _allTimestampsCache.layer === layer && Date.now() < _allTimestampsCache.expiresAt) {
    return [..._allTimestampsCache.timestamps];
  }

  try {
    const url = `${RADAR_WMS_BASE}${layer}/wms?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.1.1`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`WMS GetCapabilities failed: ${response.status}`);

    const text = await response.text();
    const timestamps = parseRadarTimestamps(text);
    
    if (timestamps.length > 0) {
      _allTimestampsCache = {
        timestamps,
        layer,
        expiresAt: Date.now() + 30 * 60 * 1000, // 30 min TTL
      };
      return timestamps;
    }

    throw new Error('Could not parse radar timestamps from GetCapabilities');
  } catch (e) {
    console.warn('[Radar] Failed to get radar timestamps:', e);
    return [];
  }
}

// Get the latest radar timestamp (convenience wrapper, uses same cache as getRadarTimestampsForLayer)
async function getLatestRadarTimestamp() {
  // Return cached timestamp if valid (2 min TTL — matches radar update interval)
  if (_latestTimestampCache && Date.now() < _latestTimestampCache.expiresAt) {
    return _latestTimestampCache.timestamp;
  }

  try {
    const url = `${RADAR_WMS_BASE}${RADAR_DEFAULT_LAYER}/wms?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.1.1`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`WMS GetCapabilities failed: ${response.status}`);

    const text = await response.text();
    // Parse the time extent from GetCapabilities response
    const timeMatch = text.match(/<Extent[^>]+name="time"[^>]*default="([^"]+)"/i);
    if (timeMatch && timeMatch[1]) {
      _latestTimestampCache = {
        timestamp: timeMatch[1],
        expiresAt: Date.now() + 2 * 60 * 1000, // 2 min TTL
      };
      return timeMatch[1];
    }

    // If no default, parse the available times and use the last one
    const times = parseRadarTimestamps(text);
    if (times.length > 0) {
      // Sort and use the latest timestamp
      times.sort();
      _latestTimestampCache = {
        timestamp: times[times.length - 1],
        expiresAt: Date.now() + 2 * 60 * 1000,
      };
      return times[times.length - 1];
    }

    throw new Error('Could not parse radar timestamps from GetCapabilities');
  } catch (e) {
    console.warn('[Radar] Failed to get latest timestamp:', e);
    // Return null — WMS will use default (latest) if time is omitted
    return null;
  }
}

// ===== CACHE METADATA MANAGEMENT =====
function getRadarMeta(lat, lon, layer) {
  try {
    const key = `hasw_cache_radar_meta_${lat.toFixed(4)}_${lon.toFixed(4)}_${layer}`;
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const meta = JSON.parse(raw);
    // Check if metadata is stale (older than TTL — use longer TTL for metadata)
    if (Date.now() - meta.lastUpdated > RADAR_META_TTL) {
      localStorage.removeItem(key);
      return null;
    }
    return meta;
  } catch {
    return null;
  }
}

function setRadarMeta(lat, lon, layer, timestamp) {
  try {
    const key = `hasw_cache_radar_meta_${lat.toFixed(4)}_${lon.toFixed(4)}_${layer}`;
    let meta = getRadarMeta(lat, lon, layer) || { timestamps: [], layer, lat, lon, lastUpdated: 0 };
    // Add timestamp if not already present
    if (!meta.timestamps.includes(timestamp)) {
      meta.timestamps.push(timestamp);
      // Keep only the last 500 timestamps (about 16 hours of radar data at 2-min intervals)
      if (meta.timestamps.length > 500) {
        meta.timestamps = meta.timestamps.slice(-500);
      }
    }
    meta.lastUpdated = Date.now();
    localStorage.setItem(key, JSON.stringify(meta));
  } catch { /* ignore */ }
}

function invalidateRadarMeta(lat, lon, layer) {
  try {
    const key = `hasw_cache_radar_meta_${lat.toFixed(4)}_${lon.toFixed(4)}_${layer}`;
    localStorage.removeItem(key);
  } catch { /* ignore */ }
}

// ===== CACHE API FUNCTIONS =====
async function getCache() {
  return await caches.open(RADAR_CACHE_NAME);
}

// Store a single radar frame as ArrayBuffer
async function cacheRadarFrame(lat, lon, layer, timestamp, arrayBuffer) {
  try {
    const cache = await getCache();
    const key = radarFrameCacheKey(lat, lon, layer, timestamp);
    const response = new Response(new Blob([arrayBuffer], { type: 'image/png' }));
    await cache.put(key, response);
    
    // Update metadata
    setRadarMeta(lat, lon, layer, timestamp);
    
    // Evict if over limit
    await evictCacheIfNecessary(lat, lon, layer);
  } catch (e) {
    console.warn('[Radar] Failed to cache frame:', e);
  }
}

// Get cached radar frame as ArrayBuffer (returns null if not found)
async function getCachedRadarFrame(lat, lon, layer, timestamp) {
  try {
    const cache = await getCache();
    const key = radarFrameCacheKey(lat, lon, layer, timestamp);
    const response = await cache.match(key);
    if (!response) return null;
    return new Uint8Array(await response.arrayBuffer());
  } catch {
    return null;
  }
}

// Get cached radar frame as base64 data URL (returns null if not found)
async function getCachedRadarFrameAsDataURL(lat, lon, layer, timestamp) {
  const arrayBuffer = await getCachedRadarFrame(lat, lon, layer, timestamp);
  if (!arrayBuffer) return null;
  
  // Convert ArrayBuffer to base64
  const bytes = new Uint8Array(arrayBuffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return 'data:image/png;base64,' + btoa(binary);
}

// Fetch a range of frames for animation (e.g., last N timestamps in order)
async function getRadarFramesForClip(lat, lon, layer, count = 10) {
  const meta = getRadarMeta(lat, lon, layer);
  if (!meta || !meta.timestamps.length) return null;
  
  // Get the last `count` timestamps (oldest first for animation)
  const clipTimestamps = meta.timestamps.slice(-count);
  const frames = [];
  
  for (const ts of clipTimestamps) {
    const arrayBuffer = await getCachedRadarFrame(lat, lon, layer, ts);
    if (arrayBuffer) {
      // Convert to base64 data URL for display
      let binary = '';
      for (let i = 0; i < arrayBuffer.length; i++) {
        binary += String.fromCharCode(arrayBuffer[i]);
      }
      frames.push({ timestamp: ts, dataUrl: 'data:image/png;base64,' + btoa(binary) });
    }
  }
  
  return frames;
}

// Invalidate a single frame from cache
async function invalidateRadarFrame(lat, lon, layer, timestamp) {
  try {
    const cache = await getCache();
    const key = radarFrameCacheKey(lat, lon, layer, timestamp);
    await cache.delete(key);
  } catch { /* ignore */ }
}

// Clear all radar frames for a location/layer
async function clearRadarCacheForLocation(lat, lon) {
  try {
    const cache = await getCache();
    const prefix = `${RADAR_FAKE_BASE}${lat.toFixed(4)}/${lon.toFixed(4)}/`;
    const entries = await cache.keys();
    for (const key of entries) {
      if (key.url.startsWith(prefix)) {
        await cache.delete(key);
      }
    }
    // Also clear metadata for all layers at this location
    const metaPrefix = `hasw_cache_radar_meta_${lat.toFixed(4)}_${lon.toFixed(4)}_`;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(metaPrefix)) {
          localStorage.removeItem(key);
        }
      }
    } catch { /* ignore */ }
  } catch { /* ignore */ }
}

// Clear all radar frames for a specific layer
async function clearRadarCacheForLayer(lat, lon, layer) {
  try {
    const cache = await getCache();
    const prefix = `${RADAR_FAKE_BASE}${lat.toFixed(4)}/${lon.toFixed(4)}/${layer}/`;
    const entries = await cache.keys();
    for (const key of entries) {
      if (key.url.startsWith(prefix)) {
        await cache.delete(key);
      }
    }
    // Also clear metadata
    invalidateRadarMeta(lat, lon, layer);
  } catch { /* ignore */ }
}

// Evict oldest frames when cache exceeds limit
async function evictCacheIfNecessary(lat, lon, layer) {
  try {
    const cache = await getCache();
    const prefix = `${RADAR_FAKE_BASE}${lat.toFixed(4)}/${lon.toFixed(4)}/${layer}/frame/`;
    let totalSize = 0;
    
    // Calculate total size of all radar frames for this location/layer
    const entries = await cache.keys();
    const frameEntries = [];
    for (const key of entries) {
      if (key.url.startsWith(prefix)) {
        const response = await cache.match(key);
        if (response) {
          const arrayBuffer = await response.arrayBuffer();
          totalSize += arrayBuffer.byteLength;
          frameEntries.push({ key: key.url, size: arrayBuffer.byteLength });
        }
      }
    }
    
    // Evict oldest frames if over limit
    if (totalSize > RADAR_MAX_CACHE_BYTES) {
      // Sort by timestamp (oldest first) — extract from key URL (timestamp is after "frame/")
      frameEntries.sort((a, b) => {
        const aParts = a.key.split('/');
        const bParts = b.key.split('/');
        const tsA = parseInt(aParts[aParts.length - 1]);
        const tsB = parseInt(bParts[bParts.length - 1]);
        return tsA - tsB;
      });
      
      for (const entry of frameEntries) {
        if (totalSize <= RADAR_MAX_CACHE_BYTES) break;
        await cache.delete(entry.key);
        totalSize -= entry.size;
      }
    }
  } catch { /* ignore */ }
}

// ===== REQUEST DEDUPLICATION =====
// Prevent duplicate radar fetches for the same location at the same time
const _pendingRadarFetches = new Map(); // cacheKey → Promise

function getPendingRadarFetch(cacheKey) {
  if (_pendingRadarFetches.has(cacheKey)) {
    return _pendingRadarFetches.get(cacheKey);
  }
  return null;
}

function setPendingRadarFetch(cacheKey, promise) {
  _pendingRadarFetches.set(cacheKey, promise);
}

// Clean up pending fetch after completion
function clearPendingRadarFetch(cacheKey) {
  _pendingRadarFetches.delete(cacheKey);
}

// ===== RADAR IMAGE FETCH =====
async function fetchRadarImageFromWMS(url, maxRetries = 3) {
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000); // 15s timeout

    try {
      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(timeout);

      if (!response.ok) {
        throw new Error(`WMS GetMap failed: ${response.status}`);
      }

      // Validate content type (should be an image)
      const contentType = response.headers.get('content-type') || '';
      if (!contentType.includes('image/')) {
        throw new Error(`Unexpected content type: ${contentType}`);
      }

      const blob = await response.blob();
      return new Uint8Array(await blob.arrayBuffer());
    } catch (e) {
      clearTimeout(timeout);
      if (attempt === maxRetries) {
        throw e;
      }
      // Exponential backoff: 1s, 2s, 4s
      const delay = Math.pow(2, attempt) * 1000;
      console.log(`[Radar] WMS fetch failed (attempt ${attempt + 1}/${maxRetries + 1}), retrying in ${delay}ms`);
      await new Promise(r => setTimeout(r, delay));
    }
  }
}

// ===== MAIN ORCHESTRATOR =====
// Fetch radar image for user location and return base64 data URL.
// Returns { imageUrl: 'data:image/png;base64,...', timestamp: string, cached: boolean } or { error: string } on failure.
async function fetchRadarImageForLocation(lat, lon, layer = RADAR_DEFAULT_LAYER, timestamp = null) {
  // Get the latest radar timestamp if none specified
  if (!timestamp) {
    timestamp = await getLatestRadarTimestamp();
  }

  const cacheKey = radarFrameCacheKey(lat, lon, layer, timestamp);

  // Check Cache API first
  const cachedDataURL = await getCachedRadarFrameAsDataURL(lat, lon, layer, timestamp);
  if (cachedDataURL) {
    console.log(`[Radar] Cache HIT: ${cacheKey}`);
    return { imageUrl: cachedDataURL, timestamp, cached: true };
  }

  // Check for pending fetch (request deduplication)
  const pending = getPendingRadarFetch(cacheKey);
  if (pending) {
    console.log(`[Radar] Pending fetch exists, waiting...`);
    return pending;
  }

  // Build WMS URL and initiate fetch
  const imageUrl = buildRadarImageUrl(lat, lon, layer, timestamp);
  console.log(`[Radar] Cache MISS: ${cacheKey}, fetching from WMS`);

  const fetchPromise = (async () => {
    try {
      // Fetch the radar image
      const arrayBuffer = await fetchRadarImageFromWMS(imageUrl);

      // Convert to base64 data URL
      let binary = '';
      for (let i = 0; i < arrayBuffer.length; i++) {
        binary += String.fromCharCode(arrayBuffer[i]);
      }
      const dataURL = 'data:image/png;base64,' + btoa(binary);

      // Cache the result in Cache API
      await cacheRadarFrame(lat, lon, layer, timestamp, arrayBuffer);

      return { imageUrl: dataURL, timestamp, cached: false };
    } catch (e) {
      console.error('[Radar] Failed to fetch radar image:', e);
      return { error: `Failed to load radar: ${e.message}` };
    } finally {
      clearPendingRadarFetch(cacheKey);
    }
  })();

  // Store pending fetch for deduplication
  setPendingRadarFetch(cacheKey, fetchPromise);
  return fetchPromise;
}

// ===== RADAR CLIP FUNCTIONS =====
// Fetch radar image for a specific timestamp (for clip playback)
async function fetchRadarImageForTimestamp(lat, lon, layer, timestamp) {
  // Check cache first
  const cachedDataURL = await getCachedRadarFrameAsDataURL(lat, lon, layer, timestamp);
  if (cachedDataURL) {
    return { imageUrl: cachedDataURL, timestamp };
  }

  // Fetch from WMS
  const imageUrl = buildRadarImageUrl(lat, lon, layer, timestamp);
  try {
    const arrayBuffer = await fetchRadarImageFromWMS(imageUrl);
    
    // Cache the result
    await cacheRadarFrame(lat, lon, layer, timestamp, arrayBuffer);

    // Convert to base64 data URL
    let binary = '';
    for (let i = 0; i < arrayBuffer.length; i++) {
      binary += String.fromCharCode(arrayBuffer[i]);
    }
    const dataURL = 'data:image/png;base64,' + btoa(binary);

    return { imageUrl: dataURL, timestamp };
  } catch (e) {
    console.error('[Radar] Failed to fetch radar image:', e);
    return { error: `Failed to load radar: ${e.message}` };
  }
}

// ===== RADAR CACHE INVALIDATION =====
// Invalidate radar cache for a location (used during background refresh)
function invalidateRadarCache(lat, lon) {
  // Clear metadata for all layers
  const prefix = `hasw_cache_radar_meta_${lat.toFixed(4)}_${lon.toFixed(4)}_`;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(prefix)) {
        localStorage.removeItem(key);
      }
    }
  } catch { /* ignore */ }
}

// ===== RADAR CACHE CLEAR =====
// Clear all radar cache entries (used during manual refresh or storage cleanup)
async function clearRadarCache() {
  try {
    const cache = await getCache();
    const entries = await cache.keys();
    for (const key of entries) {
      if (key.url.startsWith(RADAR_FRAME_PREFIX)) {
        await cache.delete(key);
      }
    }
    // Also clear all radar metadata from localStorage
    const prefix = 'hasw_cache_radar_meta_';
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(prefix)) {
        localStorage.removeItem(key);
      }
    }
    console.log('[Radar] All radar cache cleared');
  } catch { /* ignore */ }
}

// ===== RADAR CACHE SIZE =====
async function getRadarCacheSize() {
  try {
    const cache = await getCache();
    let totalSize = 0;
    const entries = await cache.keys();
    for (const key of entries) {
      if (key.url.startsWith(RADAR_FRAME_PREFIX)) {
        const response = await cache.match(key);
        if (response) {
          const arrayBuffer = await response.arrayBuffer();
          totalSize += arrayBuffer.byteLength;
        }
      }
    }
    return totalSize;
  } catch {
    return 0;
  }
}

// ===== BATCH PRE-FETCH FOR A RANGE OF FRAMES =====
// Fetch a contiguous range of frames for the radar player timeline
async function prefetchFramesInRange(lat, lon, layer, startIdx, endIdx) {
  const meta = getRadarMeta(lat, lon, layer);
  if (!meta || !meta.timestamps.length) return;

  const results = [];
  for (let i = Math.max(0, startIdx); i <= Math.min(endIdx, meta.timestamps.length - 1); i++) {
    const timestamp = meta.timestamps[i];
    // Check cache first
    const cached = await getCachedRadarFrameAsDataURL(lat, lon, layer, timestamp);
    if (cached) continue; // Already cached

    // Fetch from WMS
    const result = await fetchRadarImageForTimestamp(lat, lon, layer, timestamp);
    if (!result.error) {
      results.push({ index: i, timestamp, dataUrl: result.imageUrl });
    }
  }
  return results;
}

// ===== GET FRAME RANGE FOR PLAYBACK =====
// Get frames within a time range for the radar player
async function getFramesInRange(lat, lon, layer, startTimestamp, endTimestamp) {
  const meta = getRadarMeta(lat, lon, layer);
  if (!meta || !meta.timestamps.length) return [];

  // Filter timestamps within range
  const filtered = meta.timestamps.filter(ts => ts >= startTimestamp && ts <= endTimestamp);
  const frames = [];

  for (const ts of filtered) {
    const dataUrl = await getCachedRadarFrameAsDataURL(lat, lon, layer, ts);
    if (dataUrl) {
      frames.push({ timestamp: ts, dataUrl });
    }
  }

  return frames;
}

// ===== CHECK IF ALL FRAMES IN RANGE ARE CACHED =====
async function areFramesCachedInRange(lat, lon, layer, startIdx, endIdx) {
  const meta = getRadarMeta(lat, lon, layer);
  if (!meta || !meta.timestamps.length) return false;

  for (let i = Math.max(0, startIdx); i <= Math.min(endIdx, meta.timestamps.length - 1); i++) {
    const cached = await getCachedRadarFrameAsDataURL(lat, lon, layer, meta.timestamps[i]);
    if (!cached) return false;
  }
  return true;
}

// ===== GLOBAL EXPORTS =====
// Make all radar functions and constants available globally for non-module scripts
window.RADAR_DEFAULT_LAYER = RADAR_DEFAULT_LAYER;
window.RADAR_LAYERS = RADAR_LAYERS;
window.fetchRadarImageForLocation = fetchRadarImageForLocation;
window.fetchRadarImageForTimestamp = fetchRadarImageForTimestamp;
window.getCachedRadarFrameAsDataURL = getCachedRadarFrameAsDataURL;
window.getRadarFramesForClip = getRadarFramesForClip;
window.prefetchFramesInRange = prefetchFramesInRange;
window.getFramesInRange = getFramesInRange;
window.areFramesCachedInRange = areFramesCachedInRange;
window.clearRadarCacheForLocation = clearRadarCacheForLocation;
window.clearRadarCacheForLayer = clearRadarCacheForLayer;
window.clearRadarCache = clearRadarCache;
window.invalidateRadarCache = invalidateRadarCache;
window.getRadarMeta = getRadarMeta;
window.getRadarCacheSize = getRadarCacheSize;
window.getRadarTimestampsForLayer = getRadarTimestampsForLayer;
