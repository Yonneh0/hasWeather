 <script>
// ===== NETWORK MONITOR =====
const OUTAGE_MESSAGES = [
  "🦓 The network has left the building.",
  "🌐 DNS said 'I don't know that one.'",
  "📡 Signal lost. Last known location: confusion.",
  "🔌 Even the cables are on strike.",
  "🤖 Error 418: I'm a teapot (but not a fun one).",
  "📶 The internet went to get a snack.",
  "🏜️ Nothing but digital silence and crickets.",
  "🦥 The packet snail is still en route.",
  "🌋 Your data got swallowed by a volcano.",
  "👽 Aliens intercepted your WiFi signal.",
  "🧊 Your connection froze. Literally.",
  "🎪 The router joined a circus. No return date.",
];

const RETRY_DELAYS = [2000, 4000, 8000, 15000];
let _outagePanel = null;
let _retryInterval = null;
let _outageVisible = false;
let _pendingRunFn = null;
let _donkeyAutoOpened = false;

// ===== PANEL =====
function createOutagePanel() {
  if (_outagePanel) return _outagePanel;

  const panel = document.createElement('div');
  panel.id = 'outage-panel';
  panel.className = 'outage-panel';
  panel.innerHTML = `
    <div class="outage-glass">
      <div class="outage-header">
        <div class="outage-donkey-icon">
          <svg viewBox="0 0 64 64" class="outage-donkey-svg">
            <ellipse cx="32" cy="28" rx="14" ry="12" class="donkey-head" />
            <line x1="22" y1="18" x2="18" y2="6" class="donkey-ear" />
            <line x1="42" y1="18" x2="46" y2="6" class="donkey-ear" />
            <line x1="22" y1="18" x2="20" y2="8" class="donkey-ear-inner" />
            <line x1="42" y1="18" x2="44" y2="8" class="donkey-ear-inner" />
            <circle cx="26" cy="26" r="2.5" class="donkey-eye" />
            <circle cx="38" cy="26" r="2.5" class="donkey-eye" />
            <circle cx="26.5" cy="25.5" r="0.8" fill="#fff" />
            <circle cx="38.5" cy="25.5" r="0.8" fill="#fff" />
            <circle cx="28" cy="32" r="1.2" class="donkey-nostril" />
            <circle cx="36" cy="32" r="1.2" class="donkey-nostril" />
            <path d="M 27 35 Q 32 38 37 35" class="donkey-mouth" />
            <line x1="24" y1="16" x2="28" y2="20" class="donkey-man" />
            <line x1="28" y1="14" x2="32" y2="18" class="donkey-man" />
            <line x1="32" y1="14" x2="36" y2="18" class="donkey-man" />
            <line x1="36" y1="16" x2="40" y2="20" class="donkey-man" />
          </svg>
        </div>
        <h2 class="outage-title">NO INTERNET, PARTNER</h2>
      </div>
      <div class="outage-body">
        <div class="outage-glitch" id="outage-glitch">
          <span class="glitch-text" id="glitch-text">...</span>
        </div>
        <div class="outage-status" id="outage-status">
          <span class="status-dot"></span>
          <span id="retry-text">Checking connection...</span>
        </div>
        <div class="outage-progress" id="outage-progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(panel);
  _outagePanel = panel;
  return panel;
}

function removeOutagePanel() {
  if (_outagePanel) {
    _outagePanel.classList.add('outage-hidden');
    setTimeout(() => {
      if (_outagePanel && _outagePanel.parentNode) {
        _outagePanel.parentNode.removeChild(_outagePanel);
      }
      _outagePanel = null;
      _outageVisible = false;
      // Close auto-opened donkey panel
      if (_donkeyAutoOpened && typeof DONKEY_RUNNER !== 'undefined' && DONKEY_RUNNER.gamePanel) {
        DONKEY_RUNNER.close();
        _donkeyAutoOpened = false;
      }
      // Reset position for next time
      const panel = document.getElementById('outage-panel');
      if (panel) { panel.style.top = ''; panel.style.bottom = ''; }
    }, 500);
  }
}

function showOutagePanel() {
  const panel = createOutagePanel();
  _outageVisible = true;

  // Auto-open donkey panel if it's not already visible
  if (typeof DONKEY_RUNNER !== 'undefined' && DONKEY_RUNNER.gamePanel) {
    if (DONKEY_RUNNER.gamePanel.classList.contains('donkey-hidden')) {
      DONKEY_RUNNER.toggle();
      _donkeyAutoOpened = true;
    }
  }

  // Set position BEFORE the slide-in animation begins, so the panel animates
  // from the bottom of the screen to the correct target position.
  adjustOutagePositionImmediate();

  panel.classList.remove('outage-hidden');
  panel.classList.add('outage-visible');
  cycleOutageMessage();
}

// Immediately-set the outage panel position (no delay).
// Used when the panel first appears, before its slide-in animation begins.
function adjustOutagePositionImmediate() {
  const panel = document.getElementById('outage-panel');
  if (!panel) return;

  const donkeyVisible = DONKEY_RUNNER && DONKEY_RUNNER.gamePanel &&
    !DONKEY_RUNNER.gamePanel.classList.contains('donkey-hidden');

  if (donkeyVisible) {
    const donkeyRect = DONKEY_RUNNER.gamePanel.getBoundingClientRect();
    panel.style.top = (donkeyRect.bottom + 20) + 'px';
    panel.style.bottom = 'auto';
  } else {
    panel.style.top = '64px';
    panel.style.bottom = 'auto';
  }
}

// Delayed position adjustment (used when donkey game is toggled).
// Waits for the donkey panel's 400ms CSS transition to complete before measuring.
function adjustOutagePosition() {
  const panel = document.getElementById('outage-panel');
  if (!panel) return;

  const donkeyVisible = DONKEY_RUNNER && DONKEY_RUNNER.gamePanel &&
    !DONKEY_RUNNER.gamePanel.classList.contains('donkey-hidden');

  // The donkey panel has a 0.4s CSS transition on `top`. We must wait for it
  // to finish animating before calling getBoundingClientRect(), otherwise we
  // measure a mid-transition (incorrect) position.  450ms ≈ transition duration
  // plus a small safety margin.
  const transitionDelay = 450;

  // Also cancel any previously-scheduled adjustment so rapid toggles don't
  // leave stale timeouts firing and overwriting the correct position.
  if (adjustOutagePosition._timer) {
    clearTimeout(adjustOutagePosition._timer);
    adjustOutagePosition._timer = null;
  }

  adjustOutagePosition._timer = setTimeout(() => {
    adjustOutagePosition._timer = null;
    if (!document.getElementById('outage-panel')) return;
    const p = document.getElementById('outage-panel');

    if (donkeyVisible) {
      const donkeyRect = DONKEY_RUNNER.gamePanel.getBoundingClientRect();
      p.style.top = (donkeyRect.bottom + 20) + 'px';
      p.style.bottom = 'auto';
    } else {
      p.style.top = '64px';
      p.style.bottom = 'auto';
    }
  }, transitionDelay);
}

function cycleOutageMessage() {
  if (!_outageVisible) return;

  const textEl = document.getElementById('glitch-text');
  if (!textEl) return;

  const msg = OUTAGE_MESSAGES[Math.floor(Math.random() * OUTAGE_MESSAGES.length)];
  typeWriter(textEl, msg, 30, () => {
    setTimeout(() => {
      if (_outageVisible) cycleOutageMessage();
    }, 3000);
  });
}

function typeWriter(el, text, speed, callback, index) {
  index = index || 0;
  if (index <= text.length) {
    el.textContent = text.substring(0, index);
    setTimeout(() => typeWriter(el, text, speed, callback, index + 1), speed);
  } else if (callback) {
    callback();
  }
}

function updateRetryStatus(retryCount) {
  const statusDot = document.querySelector('.status-dot');
  const retryText = document.getElementById('retry-text');
  const progressBar = document.getElementById('progress-bar');

  if (statusDot) {
    statusDot.className = 'status-dot retrying';
  }

  if (retryText) {
    const labels = ['Initial', 'Secondary', 'Tertiary', 'Emergency'];
    retryText.textContent = `${labels[retryCount] || 'Continuous'} attempt...`;
  }

  if (progressBar) {
    const delay = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];
    // Force reflow for transition restart
    progressBar.style.transition = 'none';
    progressBar.style.width = '0%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        progressBar.style.transition = `width ${delay}ms linear`;
        progressBar.style.width = '100%';
      });
    });
  }
}

// ===== RETRY CYCLE =====
function stopRetryCycle() {
  if (_retryInterval) {
    clearTimeout(_retryInterval);
    _retryInterval = null;
  }
}

function startRetryCycle() {
  let retryCount = 0;

  function attempt() {
    updateRetryStatus(retryCount);
    const timeout = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];

    // Use a fast fetch with abort timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), Math.min(timeout, 8000));

    fetch('https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current=temperature_2m&timezone=auto', {
      method: 'GET',
      mode: 'cors',
      cache: 'no-store',
      signal: controller.signal
    })
      .then(res => {
        clearTimeout(timeoutId);
        if (res.ok || res.status === 0) {
          // Network is back!
          stopRetryCycle();
          removeOutagePanel();
          if (_pendingRunFn) {
            const fn = _pendingRunFn;
            _pendingRunFn = null;
            fn();
          }
        } else {
          throw new Error('Not OK');
        }
      })
      .catch(() => {
        clearTimeout(timeoutId);
        retryCount++;
        const nextDelay = retryCount < RETRY_DELAYS.length
          ? RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)]
          : 30000;
        _retryInterval = setTimeout(attempt, nextDelay);
      });
  }

  _retryInterval = setTimeout(attempt, 800);
}

// ===== NETWORK CHECK =====
async function checkNetwork() {
  // Quick check 1: navigator.onLine (browser's offline flag)
  if (!navigator.onLine) return false;

  // Quick check 2: Use a simple HEAD request with AbortController timeout
  // Use google.com as it's extremely reliable
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);

  try {
    await fetch('https://www.google.com/favicon.ico', {
      method: 'HEAD',
      mode: 'no-cors',
      cache: 'no-store',
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    return navigator.onLine;
  } catch (e) {
    clearTimeout(timeoutId);
    // Fallback: try a second endpoint
    const controller2 = new AbortController();
    const timeoutId2 = setTimeout(() => controller2.abort(), 2500);
    try {
      await fetch('https://captive.apple.com/hotspot-detect.html', {
        method: 'GET',
        mode: 'no-cors',
        cache: 'no-store',
        signal: controller2.signal
      });
      clearTimeout(timeoutId2);
      return true;
    } catch (e2) {
      clearTimeout(timeoutId2);
      return false;
    }
  }
}

// ===== PUBLIC API =====
function checkNetworkAndRun(runFn) {
  _pendingRunFn = runFn;

  checkNetwork().then((online) => {
    if (online) {
      runFn();
    } else {
      showOutagePanel();
      startRetryCycle();
    }
  });
}

    this.ctx = this.canvas.getContext('2d');
    this.GROUND_Y = this.canvas.height - 20;

    // Score elements
    this.scoreEl = document.getElementById('donkey-score');
    this.highScoreEl = document.getElementById('donkey-highscore');
    this.startScreenEl = document.getElementById('donkey-startscreen');
    this.gameOverEl = document.getElementById('donkey-gameover');
    this.speedBarEl = document.getElementById('donkey-speed-fill');
    this.nearMissEl = document.getElementById('donkey-near-miss');
    this.bonusTextEl = document.getElementById('donkey-bonus-text');
    this.speedLinesEl = document.getElementById('donkey-speed-lines');
    this.comboEl = document.getElementById('donkey-combo');
    this.soundBtnEl = document.getElementById('donkey-sound-btn');

    // Sound toggle button — starts muted by default
    if (this.soundBtnEl) {
      this.soundBtnEl.textContent = '\u{1F507}'; // muted icon
      this.soundBtnEl.classList.add('muted');
      this.soundBtnEl.addEventListener('click', (e) => {
        e.stopPropagation();
        this.soundEnabled = !this.soundEnabled;
        this.soundBtnEl.textContent = this.soundEnabled ? '\u{1F50A}' : '\u{1F507}';
        this.soundBtnEl.classList.toggle('muted', !this.soundEnabled);
        this.soundBtnEl.title = this.soundEnabled ? 'Mute sound' : 'Unmute sound';
      });
    }

    // Create speed lines (horizontal lines for high-speed visual effect)
    this.buildSpeedLines();

    // Button handler — close only (minimize removed)
    this.gamePanel.querySelector('.donkey-close-btn').addEventListener('click', () => this.close());

    // Canvas click/tap
    this.canvas.addEventListener('click', () => this.handleInput());
    this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.handleInput(); });

    // Start screen overlay click/tap
    if (this.startScreenEl) {
      this.startScreenEl.addEventListener('click', () => this.handleInput());
      this.startScreenEl.addEventListener('touchstart', (e) => { e.preventDefault(); this.handleInput(); });
    }

    // Generate stars
    this.generateStars();
    this.generateClouds();

    // Initial draw
    this.drawIdle();
  },

  // Build speed line elements (for high-speed visual effect)
  buildSpeedLines() {
    this.speedLines = [];
    const container = this.speedLinesEl;
    if (!container) return;
    for (let i = 0; i < 6; i++) {
      const line = document.createElement('div');
      line.style.cssText = `
        position: absolute;
        bottom: ${5 + i * 8}px;
        left: 0;
        width: ${30 + Math.random() * 60}px;
        height: 1px;
        background: rgba(255, 255, 255, ${0.05 + Math.random() * 0.08});
        pointer-events: none;
      `;
      container.appendChild(line);
      this.speedLines.push(line);
    }
  },

  generateStars() {
    this.stars = [];
    for (let i = 0; i < 25; i++) {
      this.stars.push({
        x: Math.random() * 600,
        y: Math.random() * 80,
        size: Math.random() * 1.5 + 0.5,
        twinkle: Math.random() * Math.PI * 2,
      });
    }
  },

  generateClouds() {
    this.clouds = [];
    for (let i = 0; i < 4; i++) {
      this.clouds.push({
        x: Math.random() * 600,
        y: 25 + Math.random() * 50,
        width: 35 + Math.random() * 40,
        speed: 0.2 + Math.random() * 0.6,
      });
    }
  },

  bindInput() {
    // Track which keys are pressed down
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (!this.gamePanel || this.gamePanel.classList.contains('donkey-hidden')) return;
        e.preventDefault();
        this.keysDown[e.code] = true;
        this.handleInput();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        this.keysDown[e.code] = false;
        // Mark jump as released after death - enables restart input
        if (this.gameOverActive || this.gameOverCooldown) {
          this.jumpReleasedAfterDeath = true;
        }
      }
    });
  },

  // Initialize audio context on first user interaction
  initAudio() {
    if (this.audioCtx) return;
    try {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      this.soundEnabled = false;
    }
  },

  // Play a short procedural sound effect
  playSound(type) {
    if (!this.soundEnabled || !this.audioCtx) return;

    try {
      const now = this.audioCtx.currentTime;
      const oscillator = this.audioCtx.createOscillator();
      const gainNode = this.audioCtx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(this.audioCtx.destination);

      switch (type) {
        case 'jump':
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(400, now);
          oscillator.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gainNode.gain.setValueAtTime(0.1, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          oscillator.start(now);
          oscillator.stop(now + 0.1);
          break;

        case 'knock':
          oscillator.type = 'square';
          oscillator.frequency.setValueAtTime(200, now);
          oscillator.frequency.exponentialRampToValueAtTime(80, now + 0.12);
          gainNode.gain.setValueAtTime(0.08, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          oscillator.start(now);
          oscillator.stop(now + 0.15);
          break;

        case 'gameover':
          oscillator.type = 'sawtooth';
          oscillator.frequency.setValueAtTime(400, now);
          oscillator.frequency.exponentialRampToValueAtTime(80, now + 0.5);
          gainNode.gain.setValueAtTime(0.12, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          oscillator.start(now);
          oscillator.stop(now + 0.6);
          break;

        case 'milestone':
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(523, now);
          oscillator.frequency.setValueAtTime(659, now + 0.08);
          oscillator.frequency.setValueAtTime(784, now + 0.16);
          gainNode.gain.setValueAtTime(0.1, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          oscillator.start(now);
          oscillator.stop(now + 0.3);
          break;

        case 'nearmiss':
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(800, now);
          oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
          oscillator.frequency.exponentialRampToValueAtTime(600, now + 0.15);
          gainNode.gain.setValueAtTime(0.08, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          oscillator.start(now);
          oscillator.stop(now + 0.2);
          break;

        case 'combo':
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(600, now);
          oscillator.frequency.setValueAtTime(800, now + 0.06);
          oscillator.frequency.setValueAtTime(1000, now + 0.12);
          gainNode.gain.setValueAtTime(0.08, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          oscillator.start(now);
          oscillator.stop(now + 0.25);
          break;

        case 'land':
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(150, now);
          oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.08);
          gainNode.gain.setValueAtTime(0.05, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          oscillator.start(now);
          oscillator.stop(now + 0.1);
          break;
      }
    } catch (e) {
      // Silently fail if audio context has issues
    }
  },

  handleInput() {
    // Block jump input during game over cooldown while game is still running
    if (this.gameOverCooldown && this.gameRunning) return;

    // Initialize audio on first user interaction
    this.initAudio();

    if (!this.gameStarted) {
      this.start();
    } else if (!this.gameRunning && !this.gameOverActive) {
      // Between death and cooldown expiry — should not happen in normal flow, but be safe
      return;
    } else if (!this.gameRunning && this.gameOverActive) {
      // Game is dead and game over screen is showing — only restart if:
      // 1. The jump key has been released since death (new press, not held)
      // 2. At least 200ms have passed since game over (visual flash time)
      if (!this.jumpReleasedAfterDeath) return;
      this.restart();
    } else if (this.donkey.grounded && !this.donkey.stumbling && !this.gameOverActive) {
      this.playSound('jump');
      this.donkey.vy = this.JUMP_FORCE;
      this.donkey.jumping = true;
      this.donkey.grounded = false;
      if (Math.random() < 0.08) {
        this.donkey.backflipping = true;
        this.donkey.backflipProgress = 0;
      }
    }
  },

  start() {
    this.gameStarted = true;
    this.gameRunning = true;
    if (this.startScreenEl) this.startScreenEl.classList.add('hidden');
    if (this.gameOverEl) this.gameOverEl.classList.add('hidden');
    this.resetGame();
    this.loop();
  },

  restart() {
    const now = performance.now();
    // Only allow restart if at least 200ms have passed since last game over event
    // This prevents held-key auto-restart while still allowing responsive restart
    if (now - (this.gameOverTimestamp || 0) < 200) return;
    this.gameRunning = true;
    this.gameOverActive = false;
    this.gameOverCooldown = false;
    this.jumpReleasedAfterDeath = false;
    this.keysDown = {};
    if (this.gameOverEl) {
      this.gameOverEl.classList.add('hidden');
    }
    this.resetGame();
    this.loop();
  },

  resetGame() {
    this.donkey.y = this.GROUND_Y - this.donkey.height;
    this.donkey.vy = 0;
    this.donkey.jumping = false;
    this.donkey.grounded = true;
    this.donkey.wasGrounded = true;
    this.donkey.frame = 0;
    this.donkey.backflipping = false;
    this.donkey.backflipProgress = 0;
    this.donkey.stumbling = false;
    this.donkey.stumbleTimer = 0;
    this.donkey.stumbleWobble = 0;
    // Initialize stumble trigger with a grace period (5-8 seconds = 3000-4800 frames at 60fps)
    this.donkey.stumbleNextTrigger = this.frameCount + this.randomFrameRange(3000, 4800);

    this.speed = this.INITIAL_SPEED;
    this.score = 0;
    this.distance = 0;
    this.lastMilestoneScore = 0;
    this.comboCount = 0;
    this.comboMultiplier = 1;
    this.obstacles = [];
    this.obstacleTimer = 0;
    this.groundX = 0;
    this.particles = [];
    this.dayNightPhase = 0;
    this.frameCount = 0;
    this.nearMissActive = false;

    // Regenerate clouds for fresh start
    this.generateClouds();
  },

  close() {
    this.stop();
    this.gameStarted = false;
    this.gameRunning = false;
    this.score = 0;
    this.distance = 0;
    if (this.scoreEl) {
      this.scoreEl.textContent = '00000';
    }
    this.obstacles = [];
    this.gamePanel.classList.remove('donkey-visible');
    this.gamePanel.classList.add('donkey-hidden');
    if (typeof adjustOutagePosition === 'function') adjustOutagePosition();
  },

  stop() {
    this.gameRunning = false;
    if (this.animFrameId) {
      cancelAnimationFrame(this.animFrameId);
      this.animFrameId = null;
    }
  },

  toggle() {
    if (this.gamePanel.classList.contains('donkey-hidden')) {
      this.gamePanel.classList.remove('donkey-hidden');
      this.gamePanel.classList.add('donkey-visible');
      this.gameStarted = false;
      this.gameRunning = false;
      if (this.startScreenEl) this.startScreenEl.classList.remove('hidden');
      if (this.gameOverEl) this.gameOverEl.classList.add('hidden');
      this.resetGame();
      this.drawIdle();
      if (typeof adjustOutagePosition === 'function') adjustOutagePosition();
    }
  },

  loop() {
    if (!this.gameRunning) return;

    try {
      this.update();
      this.draw();
    } catch (e) {
      console.warn('[donkey-runner] loop error:', e);
      this.gameOver();
      return;
    }

    this.animFrameId = requestAnimationFrame(() => this.loop());
  },

  update() {
    // Increase speed over time
    this.speed = Math.min(this.MAX_SPEED, this.speed + this.SPEED_INCREMENT);

    // Update score
    this.distance += this.speed * 0.01;
    this.score = Math.floor(this.distance * 100);

    // Score milestone flash check
    const currentMilestone = Math.floor(this.score / 1000) * 1000;
    if (currentMilestone > this.lastMilestoneScore && this.lastMilestoneScore > 0) {
      this.triggerMilestoneFlash();
      // Increment combo multiplier
      this.comboCount++;
      this.comboMultiplier = Math.min(5, 1 + Math.floor(this.comboCount / 3)); // Max 5x at 15 milestones
      this.updateComboDisplay();
      this.playSound('milestone');
      if (this.comboCount % 3 === 0) {
        this.playSound('combo');
      }
      this.lastMilestoneScore = currentMilestone;
    }

    if (this.scoreEl) {
      this.scoreEl.textContent = String(this.score).padStart(5, '0');
    }

    // Update speed bar display
    if (this.speedBarEl) {
      const speedPercent = ((this.speed - this.INITIAL_SPEED) / (this.MAX_SPEED - this.INITIAL_SPEED)) * 100;
      this.speedBarEl.style.width = `${Math.max(10, speedPercent)}%`;
    }

    // Update ground
    this.groundX = (this.groundX - this.speed) % 20;

    // Update speed lines visibility based on speed
    if (this.speedLinesEl) {
      if (this.speed > 7) {
        this.speedLinesEl.classList.add('visible');
        // Animate speed line positions
        this.speedLines.forEach((line, i) => {
          const offset = (this.frameCount * (0.5 + i * 0.15)) % 700;
          line.style.left = `${-offset + (i * 120)}px`;
          line.style.width = `${40 + (this.speed - 7) * 10}px`;
        });
      } else {
        this.speedLinesEl.classList.remove('visible');
      }
    }

    // Update day/night cycle
    this.dayNightPhase += (1 / 60) / 60; // 60 second cycle
    if (this.dayNightPhase > 1) this.dayNightPhase -= 1;

    // Update clouds
    this.clouds.forEach(cloud => {
      cloud.x -= cloud.speed * (this.speed / this.INITIAL_SPEED) * 0.5;
      if (cloud.x + cloud.width < 0) {
        cloud.x = 600 + Math.random() * 100;
        cloud.y = 25 + Math.random() * 50;
      }
    });

    // Update stars twinkle
    this.stars.forEach(star => {
      star.twinkle += 0.05;
    });

    // Update donkey animation
    this.donkey.frameTimer++;
    if (this.donkey.frameTimer >= 6) {
      this.donkey.frame = (this.donkey.frame + 1) % 4;
      this.donkey.frameTimer = 0;
    }

    // --- Backflip update ---
    if (this.donkey.backflipping) {
      this.donkey.backflipProgress += (1 / 60) / this.donkey.backflipDuration;
      if (this.donkey.backflipProgress >= 1) {
        this.donkey.backflipping = false;
        this.donkey.backflipProgress = 0;
      }
    }

    // Increment frame counter
    this.frameCount++;

    // --- Stumble update ---
    if (this.donkey.stumbling) {
      this.donkey.stumbleTimer += 1 / 60;
      this.donkey.stumbleWobble = Math.sin(this.donkey.stumbleTimer * 30) * 0.25;
      if (this.donkey.stumbleTimer >= this.donkey.stumbleDuration) {
        this.donkey.stumbling = false;
        this.donkey.stumbleTimer = 0;
        this.donkey.stumbleWobble = 0;
        // Reschedule next stumble
        this.donkey.stumbleNextTrigger = this.frameCount + this.randomFrameRange(1800, 3600);
      }
    } else if (!this.donkey.backflipping) {
      // Schedule next stumble: every 30–60 seconds of gameplay (~1800–3600 frames at 60fps)
      if (this.frameCount >= this.donkey.stumbleNextTrigger) {
        this.donkey.stumbling = true;
        this.donkey.stumbleTimer = 0;
        this.donkey.stumbleNextTrigger = this.frameCount + this.randomFrameRange(1800, 3600);
      }
    }

    // Donkey physics
    if (!this.donkey.grounded) {
      this.donkey.vy += this.GRAVITY;
      this.donkey.y += this.donkey.vy;

      if (this.donkey.y >= this.GROUND_Y - this.donkey.height) {
        this.donkey.y = this.GROUND_Y - this.donkey.height;
        this.donkey.vy = 0;
        this.donkey.grounded = true;
        this.donkey.jumping = false;
        // Reset backflip when landed
        if (this.donkey.backflipping) {
          this.donkey.backflipping = false;
          this.donkey.backflipProgress = 0;
        }
        // Spawn landing dust particles
        if (this.donkey.wasGrounded === false) {
          this.spawnLandingParticles();
        }
      }
    }
    this.donkey.wasGrounded = this.donkey.grounded;

    // Spawn obstacles
    this.obstacleTimer++;
    const targetInterval = Math.max(35, this.baseObstacleInterval - this.speed * 4);
    if (this.obstacleTimer >= targetInterval) {
      this.spawnObstacle();
      this.obstacleTimer = 0;
    }

    // Update obstacles
    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const obs = this.obstacles[i];
      obs.x -= this.speed;

      // Remove off-screen
      if (obs.x + obs.width < 0) {
        this.obstacles.splice(i, 1);
        continue;
      }

      // Near-miss detection (only check when donkey is not stumbling — allow during jumps)
      if (!this.donkey.stumbling) {
        const dist = (this.donkey.x + this.donkey.width) - obs.x;
        if (dist > 0 && dist < this.nearMissThreshold && !this.nearMissActive) {
          this.triggerNearMiss();
        }
      }

      // Collision detection
      if (this.checkCollision(obs)) {
        if (this.donkey.stumbling) {
          // Knock aside: remove obstacle, spawn particles
          this.knockObstacle(obs, i);
        } else {
          this.gameOver();
          return;
        }
      }
    }

    // Update particles — use swap-with-last for O(1) deletion
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15; // gravity
      p.life -= 1 / 60;
      if (p.life <= 0) {
        this.particles[i] = this.particles[this.particles.length - 1];
        this.particles.pop();
      }
    }
  },

  randomFrameRange(min, max) {
    return min + Math.random() * (max - min);
  },

  knockObstacle(obs, index) {
    // Remove obstacle
    this.obstacles.splice(index, 1);

    // Spawn particles from obstacle position with obstacle-type-specific colors
    this.spawnKnockParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.type);
    this.playSound('knock');
  },

  spawnKnockParticles(px, py, type) {
    let colors = ['#e8a838', '#d4763a', '#8B7355', '#c4a97d'];

    // Obstacle-type-specific particle colors
    switch (type) {
      case 'cactus-small':
      case 'cactus-large':
        colors = ['#2D5A27', '#4A8A3F', '#1A3A16', '#5A9A4F'];
        break;
      case 'rock':
        colors = ['#6B6B6B', '#4A4A4A', '#888888', '#555555'];
        break;
      case 'car':
        colors = ['#D44', '#C33', '#AA3333', '#882222'];
        break;
    }

    for (let i = 0; i < 15; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      this.particles.push({
        x: px,
        y: py,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 2 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 0.4 + Math.random() * 0.6,
      });
    }
  },

  // Spawn landing dust particles
  spawnLandingParticles() {
    this.playSound('land');
    for (let i = 0; i < 8; i++) {
      const angle = Math.PI + (Math.random() - 0.5) * Math.PI; // spread left and right
      const speed = 0.5 + Math.random() * 2;
      this.particles.push({
        x: this.donkey.x + 20 + (Math.random() - 0.5) * 20,
        y: this.GROUND_Y,
        vx: Math.cos(angle) * speed,
        vy: -0.5 - Math.random() * 1.5,
        size: 1.5 + Math.random() * 2,
        color: 'rgba(200, 180, 150, 0.6)',
        life: 0.3 + Math.random() * 0.3,
      });
    }
  },

  triggerNearMiss() {
    this.nearMissActive = true;

    // Flash "NEAR MISS!" text
    if (this.nearMissEl) {
      this.nearMissEl.classList.remove('flash');
      void this.nearMissEl.offsetWidth; // Force reflow for re-trigger
      this.nearMissEl.classList.add('flash');
      setTimeout(() => this.nearMissEl.classList.remove('flash'), 500);
    }

    // Show bonus text "+50"
    if (this.bonusTextEl) {
      const bonusAmount = 50 * this.comboMultiplier;
      this.bonusTextEl.textContent = `+${bonusAmount}`;
      this.bonusTextEl.classList.remove('flash');
      void this.bonusTextEl.offsetWidth; // Force reflow for re-trigger
      this.bonusTextEl.classList.add('flash');
      setTimeout(() => this.bonusTextEl.classList.remove('flash'), 700);
    }

    // Add bonus score with multiplier
    const bonusScore = Math.floor(50 * this.comboMultiplier);
    this.distance += bonusScore / 100;
    this.score = Math.floor(this.distance * 100);

    this.playSound('nearmiss');

    // Reset near-miss flag after delay
    setTimeout(() => {
      this.nearMissActive = false;
    }, 600);
  },

  updateComboDisplay() {
    if (this.comboEl) {
      this.comboEl.textContent = `COMBO x${this.comboMultiplier}`;
      if (this.comboMultiplier > 1) {
        this.comboEl.classList.add('active');
      } else {
        this.comboEl.classList.remove('active');
      }
    }
  },

  triggerMilestoneFlash() {
    if (this.scoreEl) {
      this.scoreEl.classList.add('milestone-flash');
      setTimeout(() => {
        this.scoreEl.classList.remove('milestone-flash');
      }, 300);
    }
  },

  spawnObstacle() {
    // Obstacle type weights change based on speed
    let weights = [0.35, 0.25, 0.25, 0.15];

    // At higher speeds, increase rock frequency (harder to jump over)
    if (this.speed > 7) {
      weights = [0.25, 0.15, 0.45, 0.15];
    }
    // At even higher speeds, introduce "car" more frequently
    if (this.speed > 9) {
      weights = [0.20, 0.10, 0.40, 0.30];
    }

    const types = ['cactus-small', 'cactus-large', 'rock', 'car'];

    // Pick type based on weights
    let r = Math.random();
    let type = types[0];
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) { type = types[i]; break; }
    }

    let obs = { type, x: 620, width: 0, height: 0 };

    switch (type) {
      case 'cactus-small':
        obs.width = 12;
        obs.height = 25 + Math.random() * 10;
        break;
      case 'cactus-large':
        obs.width = 18;
        obs.height = 35 + Math.random() * 8;
        break;
      case 'rock':
        obs.width = 16 + Math.random() * 8;
        obs.height = 12 + Math.random() * 6;
        break;
      case 'car':
        obs.width = 36;
        obs.height = 18;
        break;
    }

    obs.y = this.GROUND_Y - obs.height;
    this.obstacles.push(obs);
  },

  checkCollision(obs) {
    const dx = this.donkey.x + 8;
    const dy = this.donkey.y + 4;
    const dw = this.donkey.width - 16;
    const dh = this.donkey.height - 8;

    const padding = 4;
    return (
      dx + dw > obs.x + padding &&
      dx < obs.x + obs.width - padding &&
      dy + dh > obs.y + padding &&
      dy < obs.y + obs.height - padding
    );
  },

  gameOver() {
    this.gameRunning = false;
    this.gameOverActive = true;

    // Play game over sound
    this.playSound('gameover');

    // Update high score
    if (this.score > this.highScore) {
      this.highScore = this.score;
      localStorage.setItem('hasW_donkeyHighScore', this.highScore);
      if (this.highScoreEl) {
        this.highScoreEl.textContent = `HI ${String(this.highScore).padStart(5, '0')}`;
      }
    }

    // Show game over screen with score
    if (this.gameOverEl) {
      const scoreDisplay = document.getElementById('donkey-gameover-score');
      if (scoreDisplay) {
        scoreDisplay.textContent = `SCORE: ${String(this.score).padStart(5, '0')}`;
      }
      this.gameOverEl.classList.remove('hidden');
    }

    // Flash the canvas briefly
    this.draw();
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(255, 80, 60, 0.25)';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    setTimeout(() => { this.draw(); }, 100);

    // Record timestamp for restart cooldown (prevents held-key instant restart)
    this.gameOverTimestamp = performance.now();

    this.gameOverCooldown = true;
    setTimeout(() => {
      this.gameOverCooldown = false;
      this.keysDown = {};
    }, 1000);
  },

  drawIdle() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;

    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = 'rgba(20, 25, 40, 0.95)';
    ctx.fillRect(0, 0, w, h);

    // Ground line
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, this.GROUND_Y);
    ctx.lineTo(w, this.GROUND_Y);
    ctx.stroke();

    this.drawDonkey(ctx, this.donkey.x, this.GROUND_Y - this.donkey.height, 0, 0);

    if (this.startScreenEl) this.startScreenEl.classList.remove('hidden');
  },

  draw() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;

    ctx.clearRect(0, 0, w, h);

    // Day/night background
    this.drawDayNightBackground(ctx, w, h);

    // Stars
    this.drawStars(ctx);

    // Clouds
    this.drawClouds(ctx);

    // Ground
    this.drawGround(ctx);

    // Obstacles
    this.obstacles.forEach(obs => this.drawObstacle(ctx, obs));

    // Particles
    this.drawParticles(ctx);

    // Donkey
    let donkeyRotation = 0;
    if (this.donkey.backflipping) {
      donkeyRotation = this.donkey.backflipProgress * Math.PI * 2;
    } else if (this.donkey.stumbling) {
      donkeyRotation = this.donkey.stumbleWobble;
    }
    this.drawDonkey(ctx, this.donkey.x, this.donkey.y, this.donkey.frame, donkeyRotation);
  },

  drawDayNightBackground(ctx, w, h) {
    // Phase 0 = midnight, 0.5 = noon-ish, cycle back
    const phase = this.dayNightPhase;
    let topR, topG, topB, botR, botG, botB;

    if (phase < 0.25) {
      // Night → Dusk
      const t = phase / 0.25;
      topR = 20 + t * 15;
      topG = 25 + t * (-5);
      topB = 40 + t * 10;
      botR = 30 + t * 10;
      botG = 35 + t * (-15);
      botB = 50 + t * 0;
    } else if (phase < 0.5) {
      // Dusk → Night
      const t = (phase - 0.25) / 0.25;
      topR = 35 - t * 15;
      topG = 20 + t * 5;
      topB = 50 - t * 10;
      botR = 40 - t * 10;
      botG = 20 + t * 15;
      botB = 50 - t * 0;
    } else if (phase < 0.75) {
      // Night → Dawn
      const t = (phase - 0.5) / 0.25;
      topR = 20 + t * 20;
      topG = 25 + t * 5;
      topB = 40 + t * (-5);
      botR = 30 + t * 10;
      botG = 35 + t * 0;
      botB = 50 + t * (-15);
    } else {
      // Dawn → Night
      const t = (phase - 0.75) / 0.25;
      topR = 40 - t * 20;
      topG = 30 - t * 5;
      topB = 35 + t * 5;
      botR = 40 - t * 10;
      botG = 35 - t * 0;
      botB = 35 + t * 15;
    }

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, `rgb(${Math.round(topR)},${Math.round(topG)},${Math.round(topB)})`);
    grad.addColorStop(1, `rgb(${Math.round(botR)},${Math.round(botG)},${Math.round(botB)})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  },

  drawStars(ctx) {
    const alpha = this.getStarAlpha();
    if (alpha <= 0) return;

    this.stars.forEach(star => {
      const twinkleAlpha = 0.3 + Math.sin(star.twinkle) * 0.3;
      const finalAlpha = twinkleAlpha * alpha;
      ctx.fillStyle = `rgba(255, 255, 255, ${finalAlpha})`;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
    });
  },

  getStarAlpha() {
    const phase = this.dayNightPhase;
    if (phase < 0.2) return 1;
    if (phase < 0.35) return 1 - (phase - 0.2) / 0.15 * 0.6;
    if (phase < 0.5) return 0.4;
    if (phase < 0.65) return 0.4 + (phase - 0.5) / 0.15 * 0.6;
    if (phase < 0.8) return 1;
    return 1;
  },

  drawClouds(ctx) {
    const alpha = 0.06 + (1 - this.getStarAlpha()) * 0.04;
    this.clouds.forEach(cloud => {
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.ellipse(cloud.x + cloud.width / 2, cloud.y, cloud.width / 2, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cloud.x + cloud.width * 0.3, cloud.y - 5, cloud.width * 0.3, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  },

  drawGround(ctx) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(0, this.GROUND_Y);
    ctx.lineTo(this.canvas.width, this.GROUND_Y);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    for (let x = this.groundX; x < this.canvas.width; x += 20) {
      ctx.fillRect(x, this.GROUND_Y + 3, 8, 1);
    }
    for (let x = this.groundX + 10; x < this.canvas.width; x += 25) {
      ctx.fillRect(x, this.GROUND_Y + 8, 5, 1);
    }
  },

  drawDonkey(ctx, x, y, frame, rotation) {
    ctx.save();

    // Translate to donkey center, then scale, then offset by half-size for drawing
    ctx.translate(x + this.donkey.width / 2, y + this.donkey.height / 2);

    // Apply rotation for backflip/stumble
    if (rotation) {
      ctx.rotate(rotation);
    }

    const scale = 1.2;
    ctx.scale(scale, scale);
    ctx.translate(-this.donkey.width / 2, -this.donkey.height / 2);

    // Donkey colors
    const bodyColor = '#8B7355';
    const darkColor = '#6B5B45';
    const maneColor = '#4A3A2A';
    const eyeColor = '#1a1a2e';
    const noseColor = '#9B8B75';
    const hoovesColor = '#3A2A1A';

    // Animated tail wag using frame counter instead of Date.now()
    const tailWag = this.donkey.grounded && !this.donkey.stumbling
      ? Math.sin(frame * Math.PI / 2 + this.frameCount * 0.15) * 3
      : 0;

    // Tail - now properly connected to rear body
    ctx.strokeStyle = maneColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(6, 22);
    ctx.quadraticCurveTo(2 + tailWag, 28, -2 + tailWag * 0.5, 34);
    ctx.stroke();

    // Body
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(20, 26, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    ctx.fillStyle = bodyColor;
    const legOffsets = [
      { x: 10, frame: frame },
      { x: 15, frame: frame + 2 },
      { x: 22, frame: frame + 1 },
      { x: 27, frame: frame + 3 },
    ];

    legOffsets.forEach((leg) => {
      const legX = leg.x;
      const legFrame = leg.frame % 4;
      let legAnimOffset = 0;

      if (this.donkey.stumbling) {
        // Tumble: legs flail randomly
        legAnimOffset = Math.sin(legFrame * Math.PI / 2 + this.donkey.stumbleTimer * 20) * 5;
      } else if (this.donkey.grounded) {
        legAnimOffset = Math.sin(legFrame * Math.PI / 2) * 3;
      }

      // If mid-air during backflip, legs tuck up
      if (this.donkey.backflipping && !this.donkey.grounded) {
        legAnimOffset = -4;
      }

      ctx.strokeStyle = bodyColor;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(legX, 30);
      ctx.lineTo(legX + legAnimOffset, 42);
      ctx.stroke();

      // Hoof
      ctx.fillStyle = hoovesColor;
      ctx.beginPath();
      ctx.arc(legX + legAnimOffset, 42, 2, 0, Math.PI * 2);
      ctx.fill();
    });

    // Neck
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(28, 18);
    ctx.quadraticCurveTo(36, 10, 34, 4);
    ctx.lineTo(30, 4);
    ctx.quadraticCurveTo(28, 12, 24, 20);
    ctx.closePath();
    ctx.fill();

    // Mane
    ctx.fillStyle = maneColor;
    ctx.beginPath();
    ctx.moveTo(30, 2);
    ctx.lineTo(28, 8);
    ctx.lineTo(30, 8);
    ctx.lineTo(28, 14);
    ctx.lineTo(30, 14);
    ctx.lineTo(28, 20);
    ctx.lineTo(30, 20);
    ctx.closePath();
    ctx.fill();

    // Head
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(34, 8, 7, 5, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Ear
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(32, 3);
    ctx.lineTo(30, -4);
    ctx.lineTo(35, 1);
    ctx.closePath();
    ctx.fill();

    // Inner ear
    ctx.fillStyle = noseColor;
    ctx.beginPath();
    ctx.moveTo(32, 2);
    ctx.lineTo(31, -2);
    ctx.lineTo(34, 1);
    ctx.closePath();
    ctx.fill();

    // Eye - big and expressive
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(36, 6, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = eyeColor;
    ctx.beginPath();
    ctx.arc(36.5, 6, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(37, 5.5, 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Stumble eyes (X eyes when stumbling)
    if (this.donkey.stumbling) {
      ctx.strokeStyle = '#e8a838';
      ctx.lineWidth = 0.8;
      // X marks
      ctx.beginPath();
      ctx.moveTo(35, 4.5);
      ctx.lineTo(37.5, 6.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(37.5, 4.5);
      ctx.lineTo(35, 6.5);
      ctx.stroke();
    }

    // Nostril
    ctx.fillStyle = noseColor;
    ctx.beginPath();
    ctx.arc(39, 9, 1, 0, Math.PI * 2);
    ctx.fill();

    // Mouth - worried expression when stumbling
    if (this.donkey.stumbling) {
      ctx.strokeStyle = darkColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(38, 14, 2, Math.PI * 0.8, Math.PI * 0.2, true);
      ctx.stroke();
    } else {
      ctx.strokeStyle = darkColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(37, 12);
      ctx.quadraticCurveTo(39, 13, 40, 12);
      ctx.stroke();
    }

    // White muzzle stripe
    ctx.fillStyle = 'rgba(210, 190, 170, 0.5)';
    ctx.beginPath();
    ctx.ellipse(37, 10, 4, 3, 0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  },

  drawParticles(ctx) {
    this.particles.forEach(p => {
      const alpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  },

  drawObstacle(ctx, obs) {
    switch (obs.type) {
      case 'cactus-small':
      case 'cactus-large':
        this.drawCactus(ctx, obs);
        break;
      case 'rock':
        this.drawRock(ctx, obs);
        break;
      case 'car':
        this.drawCar(ctx, obs);
        break;
    }
  },

  drawCactus(ctx, obs) {
    ctx.fillStyle = '#2D5A27';
    ctx.strokeStyle = '#1A3A16';
    ctx.lineWidth = 1;

    const cx = obs.x + obs.width / 2;
    ctx.beginPath();
    ctx.roundRect(obs.x + 2, obs.y, obs.width - 4, obs.height, 3);
    ctx.fill();
    ctx.stroke();

    if (obs.type === 'cactus-large') {
      // Left arm
      ctx.beginPath();
      ctx.roundRect(obs.x - 4, obs.y + 8, 8, 4, 2);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(obs.x - 4, obs.y + 4, 4, 12, 2);
      ctx.fill();

      // Right arm
      ctx.beginPath();
      ctx.roundRect(obs.x + obs.width - 4, obs.y + 12, 8, 4, 2);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(obs.x + obs.width, obs.y + 8, 4, 10, 2);
      ctx.fill();
    }

    // Spines
    ctx.fillStyle = '#4A8A3F';
    for (let i = 0; i < 3; i++) {
      const sy = obs.y + 4 + i * (obs.height / 3);
      ctx.fillRect(obs.x, sy, 2, 1);
      ctx.fillRect(obs.x + obs.width - 2, sy, 2, 1);
    }
  },

  drawRock(ctx, obs) {
    ctx.fillStyle = '#6B6B6B';
    ctx.strokeStyle = '#4A4A4A';
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(obs.x, obs.y + obs.height);
    ctx.lineTo(obs.x + 3, obs.y + 3);
    ctx.quadraticCurveTo(obs.x + obs.width / 2, obs.y - 2, obs.x + obs.width - 3, obs.y + 3);
    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.ellipse(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 3, obs.height / 3, 0, 0, Math.PI * 2);
    ctx.fill();
  },

  drawCar(ctx, obs) {
    // Car body
    ctx.fillStyle = '#D44';
    ctx.strokeStyle = '#A33';
    ctx.lineWidth = 1;

    // Lower body
    ctx.beginPath();
    ctx.roundRect(obs.x, obs.y + 6, obs.width, 12, 3);
    ctx.fill();
    ctx.stroke();

    // Upper body (cabin)
    ctx.fillStyle = '#C33';
    ctx.beginPath();
    ctx.roundRect(obs.x + 8, obs.y, 20, 10, 3);
    ctx.fill();
    ctx.stroke();

    // Windows
    ctx.fillStyle = 'rgba(150, 200, 255, 0.4)';
    ctx.beginPath();
    ctx.roundRect(obs.x + 10, obs.y + 2, 8, 6, 1);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(obs.x + 20, obs.y + 2, 6, 6, 1);
    ctx.fill();

    // Wheels
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(obs.x + 8, obs.y + 18, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(obs.x + obs.width - 8, obs.y + 18, 4, 0, Math.PI * 2);
    ctx.fill();

    // Wheel hubs
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.arc(obs.x + 8, obs.y + 18, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(obs.x + obs.width - 8, obs.y + 18, 1.5, 0, Math.PI * 2);
    ctx.fill();
  },
};

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
  DONKEY_RUNNER.init();
});

 <script>
// ===== MAIN RUN =====
async function run() {
  if (!userLocation) {
    userLocation = await getLocation();
  }

  const locEl = document.getElementById('user-location');
  if (locEl) locEl.textContent = `\u{1F4CD} ${userLocation.lat.toFixed(2)}\u00B0N, ${Math.abs(userLocation.lon).toFixed(2)}\u00B0W`;

  _nearbyCache = null;
  _nearbyCacheTime = 0;

  // Load nearby cities + favorites, then render both
  const nearby = await findNearbyCities(userLocation.lat, userLocation.lon);
  const favAll = FavoritesManager.getAll();

  // Combine: nearby cities first, then favorites that aren't already in nearby
  // Use BOTH place_id AND coordinate proximity matching to prevent duplicates
  const allCities = [...nearby];
  const seenPlaceIds = new Set(nearby.map(c => String(c.place_id)));
  const seenCoords = new Set(nearby.map(c => {
    const lat = c.latitude != null ? DataCache._roundCoord(c.latitude) : null;
    const lon = c.longitude != null ? DataCache._roundCoord(c.longitude) : null;
    return lat != null && lon != null ? `${lat},${lon}` : null;
  }).filter(Boolean));

  for (const fav of favAll) {
    const favPlaceId = String(fav.place_id);
    const favLat = fav.latitude != null ? DataCache._roundCoord(fav.latitude) : null;
    const favLon = fav.longitude != null ? DataCache._roundCoord(fav.longitude) : null;

    // Skip if place_id already seen (same physical city from same source)
    if (seenPlaceIds.has(favPlaceId)) continue;

    // Skip if coordinate proximity match (same physical city from different source)
    const favCoordKey = favLat != null && favLon != null ? `${favLat},${favLon}` : null;
    if (favCoordKey != null) {
      let isCoordDuplicate = false;
      for (const existingCoord of seenCoords) {
        const [exLat, exLon] = existingCoord.split(',').map(Number);
        // 0.01° tolerance (≈1km)
        if (Math.abs(favLat - exLat) < 0.01 && Math.abs(favLon - exLon) < 0.01) {
          isCoordDuplicate = true;
          break;
        }
      }
      if (isCoordDuplicate) continue;
    }

    allCities.push({
      place_id: favPlaceId,
      name: fav.name,
      state: fav.state,
      latitude: fav.latitude,
      longitude: fav.longitude,
      distance: haversine(userLocation.lat, userLocation.lon, fav.latitude, fav.longitude),
      bearing: bearing(userLocation.lat, userLocation.lon, fav.latitude, fav.longitude),
    });
    seenPlaceIds.add(favPlaceId);
    if (favCoordKey != null) seenCoords.add(favCoordKey);
  }

  // Sort all cities by distance from user (closest first)
  allCities.sort((a, b) => a.distance - b.distance);

  if (allCities.length === 0) {
    return;
  }

  weatherData = await fetchWeatherForCities(allCities);
  renderAll();
}

 <script>
// ===== FAVORITES DROPDOWN =====
let _allNearbyCities = []; // 20 nearest cities for dropdown (with place_id)

async function renderFavDropdown(searchQuery) {
  const content = document.getElementById('fav-dropdown-content');
  if (!content) return;

  // Ensure we have nearby cities
  if (_allNearbyCities.length === 0 && userLocation) {
    _allNearbyCities = await fetchAllNearby(20);
  }

  let html = '';

  // Search results (if searching)
  if (searchQuery) {
    try {
      const url = `${NOMINATIM}?q=${encodeURIComponent(searchQuery)}&format=jsonv2&limit=5&addressdetails=1`;
      const res = await fetch(url);
      const data = await res.json();
      if (data?.length > 0) {
        html += '<div class="fav-section-title">Search Results</div>';
        for (const item of data) {
          const addr = item.address || {};
          const name = (item.name || addr.city || '').replace(/^City of\s+/i, '');
          const state = addr.state || addr.state_district || addr.region || addr.county || '';
          const lat = parseFloat(item.lat);
          const lon = parseFloat(item.lon);
          const placeId = String(item.place_id);
          const isFav = FavoritesManager.has(placeId);
          html += renderFavCityItem(placeId, name, state, lat, lon, isFav, false);
        }
      } else {
        html += '<div style="padding:0.5rem;font-size:0.7rem;color:rgba(255,255,255,0.3);text-align:center;">No results</div>';
      }
    } catch {
      html += '<div style="padding:0.5rem;font-size:0.7rem;color:rgba(255,255,255,0.3);text-align:center;">Search failed</div>';
    }
  } else {
    // Categorize cities by type
    const nearestCities = _allNearbyCities.filter(c => c.category === 'nearest_city').slice(0, 3);
    const regionalCapitals = _allNearbyCities.filter(c => c.category === 'regional_capital');
    const stateCapitals = _allNearbyCities.filter(c => c.category === 'state_capital');

    // Show Nearest Cities (exactly 3, non-capital)
    if (nearestCities.length > 0) {
      html += '<div class="fav-section-title">Nearest Cities</div>';
      for (const city of nearestCities) {
        const isFav = FavoritesManager.has(city.place_id);
        html += renderFavCityItem(city.place_id, city.name, city.state || '', city.latitude, city.longitude, isFav, true);
      }
    }

    // Show Regional Capitals
    if (regionalCapitals.length > 0) {
      html += '<div class="fav-section-title">Regional Capitals</div>';
      for (const city of regionalCapitals) {
        const isFav = FavoritesManager.has(city.place_id);
        html += renderFavCityItem(city.place_id, city.name, city.state || '', city.latitude, city.longitude, isFav, true);
      }
    }

    // Show State Capitals
    if (stateCapitals.length > 0) {
      html += '<div class="fav-section-title">State Capitals</div>';
      for (const city of stateCapitals) {
        const isFav = FavoritesManager.has(city.place_id);
        html += renderFavCityItem(city.place_id, city.name, city.state || '', city.latitude, city.longitude, isFav, true);
      }
    }
  }

  // Favorites section (always shown)
  const favAll = FavoritesManager.getAll();
  if (favAll.length > 0) {
    html += '<div class="fav-section-title">My Favorites</div>';
    for (const fav of favAll) {
      html += renderFavCityItem(fav.place_id, fav.name, fav.state || '', fav.latitude, fav.longitude, true, false, true);
    }
  }

  content.innerHTML = html;
  bindFavDropdownEvents();
}

function renderFavCityItem(placeId, name, state, lat, lon, isFav, isNearby, showRemove) {

// Feature codes for categorization (from Open-Meteo Geocoding API)
const FEATURE_CODE_MAP = {
  PPLC: 'state_capital',    // Capital of political entity
  PPLA: 'state_capital',    // Administrative seat
  PPLA2: 'regional_capital', // Second-order admin seat
  PPLX: 'regional_capital', // Seat of admin division
  PPL: 'nearest_city',      // Populated place
  TMHN: 'nearest_city',     // Hamlet
  INTL: 'nearest_city',     // International
};

// Fetch feature_codes from Open-Meteo Geocoding API for a list of cities
async function fetchFeatureCodes(cityList) {
  if (!cityList || cityList.length === 0) return {};

  // Extract unique names for geocoding
  const uniqueNames = new Map();
  for (const city of cityList) {
    const nameKey = (city.name || '').toLowerCase().trim();
    if (!uniqueNames.has(nameKey)) {
      uniqueNames.set(nameKey, city);
    }
  }

  // Batch query Open-Meteo Geocoding API (up to 20 names per request)
  const featureCodes = {};
  const nameArray = Array.from(uniqueNames.values()).map(c => c.name);

  // Open-Meteo Geocoding API accepts multiple names as query parameter
  // We query each city individually for accuracy
  const batchSize = 10;
  for (let i = 0; i < nameArray.length; i += batchSize) {
    const batch = nameArray.slice(i, i + batchSize);
    const queries = batch.map(n => encodeURIComponent(n)).join(',');

    try {
      const url = `${OPEN_METEO_GEOCODING}?name=${queries}&count=${batch.length}&language=en&format=json`;
      const resp = await fetch(url);
      if (resp.ok) {
        const data = await resp.json();
        if (data?.results) {
          for (const result of data.results) {
            // Match by name and coordinates
            const nameMatch = cityList.find(c =>
              (c.name || '').toLowerCase().trim() === (result.name || '').toLowerCase().trim() &&
              Math.abs(c.latitude - result.latitude) < 0.5 &&
              Math.abs(c.longitude - result.longitude) < 0.5
            );
            if (nameMatch) {
              const code = result.feature_code || '';
              if (code) {
                featureCodes[nameMatch.place_id] = code;
              }
            }
          }
        }
      }
    } catch {
      // silently ignore geocoding failures
    }

    // Small delay between batches to avoid rate limiting
    if (i + batchSize < nameArray.length) {
      await new Promise(resolve => setTimeout(resolve, 200));
    }
  }

  return featureCodes;
}

async function fetchAllNearby(count) {
  if (!userLocation) return [];

  // First: search close area for nearest cities
  let viewbox = scaleViewbox(userLocation.lat, userLocation.lon, NOMINATIM_CLOSE_RADIUS);
  let url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=20&addressdetails=1`;
  let results = [];
  try {
    const resp = await fetch(url);
    if (resp.ok) {
      const data = await resp.json();
      results = results.concat(data || []);
    }
  } catch { /* ignore */ }

  // Second: search wider area without bounded to find capitals/regional cities
  viewbox = scaleViewbox(userLocation.lat, userLocation.lon, NOMINATIM_WIDE_RADIUS);
  url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&limit=100&addressdetails=1`;
  try {
    const resp = await fetch(url);
    if (resp.ok) {
      const data = await resp.json();
      const existingIds = new Set(results.map(r => r.place_id));
      results = results.concat(data.filter(r => r && !existingIds.has(r.place_id)) || []);
    }
  } catch { /* ignore */ }

  // Filter: keep only towns/cities/villages/hamlets/localities, reject boundary/country/fuel/street
  if (results.length > 0) {
    results = results.filter(r => {
      const type = (r.type || '').toLowerCase();
      const cls = (r.class || '').toLowerCase();
      if (cls === 'boundary' && r.place_rank >= 4) return false;
      if (type === 'country' || type === 'state' || type === 'administrative') return false;
      if (type === 'fuel' || type === 'street' || type === 'residential') return false;
      if (r.place_rank >= 10 && r.place_rank <= 16) return true;
      return false;
    });
  }

  // Deduplicate by name+coordinate proximity
  const cities = [];
  const seen = new Set();
  for (const item of results) {
    const addr = item.address || {};
    const name = (item.name || addr.city || '').replace(/^City of\s+/i, '');
    const key = name.toLowerCase().trim();
    const lat = parseFloat(item.lat);
    const lon = parseFloat(item.lon);
    const coordKey = `${DataCache._roundCoord(lat)},${DataCache._roundCoord(lon)}`;

    // Skip duplicates (same name within 0.01° ≈ 1km)
    const nameKey = key;
    for (const existing of seen) {
      if (existing.nameKey === nameKey && existing.coordKey === coordKey) {
        continue; // skip
      }
    }
    seen.add({ nameKey, coordKey });

    // Skip if no name
    if (!name) continue;

    const distance = haversine(userLocation.lat, userLocation.lon, lat, lon);

    // Only include cities within reasonable range (200 miles)
    if (distance < 200) {
      cities.push({
        place_id: String(item.place_id),
        name,
        state: addr.state || addr.state_district || addr.region || addr.county || '',
        latitude: lat,
        longitude: lon,
        distance,
        category: 'nearest_city', // default, will be updated via Open-Meteo
      });
    }
  }

  // Now fetch feature_codes from Open-Meteo Geocoding API for categorization
  if (cities.length > 0) {
    const featureCodes = await fetchFeatureCodes(cities);
    for (const city of cities) {
      const code = featureCodes[city.place_id];
      if (code) {
        const mappedCategory = FEATURE_CODE_MAP[code];
        if (mappedCategory) {
          city.category = mappedCategory;
        }
      }
    }
  }

  // Fallback: for any uncategorized cities, use Nominatim address fields to determine category
  // This catches smaller/lesser-known cities that Open-Meteo geocoding may not have feature_code for
  for (const city of cities) {
    if (city.category === 'nearest_city') {
      // Check if the city IS a state or state_district from the Nominatim address
      // We already have this info from the initial fetch, check the original results
      const stateDistrict = city.state;
      // If state matches a known state_district name, this city might be a regional capital
      // But without additional API call, we can't be sure. Skip for now.
    }
  }

  cities.sort((a, b) => a.distance - b.distance);
  return cities;
}

async function addFavoriteCard(city) {
  // Check for duplicate card before adding — use BOTH place_id AND coordinate proximity matching
  const existingGrid = document.getElementById('city-grid');
  if (existingGrid) {
    // Check by place_id first
    const existingCardById = existingGrid.querySelector(`.city-card[data-placeid="${CSS.escape(String(city.place_id))}"]`);
    if (existingCardById) {
      // Card already exists (same place_id), don't add a duplicate
      return;
    }
    // Check by coordinates with tolerance (same city from different API source may have different place_id or slightly different coords)
    const allCards = Array.from(existingGrid.querySelectorAll('.city-card'));
    for (const existingCard of allCards) {
      const existingLat = parseFloat(existingCard.dataset.citylat);
      const existingLon = parseFloat(existingCard.dataset.citylon);
      if (!isNaN(existingLat) && !isNaN(existingLon)) {
        // Use 0.01° tolerance (≈1km), same as the dedup logic in fetchAllNearby
        const latDiff = Math.abs(city.latitude - existingLat);
        const lonDiff = Math.abs(city.longitude - existingLon);
        if (latDiff < 0.01 && lonDiff < 0.01) {
          // Same coordinates within tolerance, don't add a duplicate
          return;
        }
      }
    }
  }
  // Check for duplicate weather data before adding — use BOTH place_id AND coordinate proximity matching
  const existingDataIdx = weatherData.findIndex(d =>
    d.place_id === String(city.place_id) ||
    (d.latitude != null && d.longitude != null &&
     Math.abs(city.latitude - d.latitude) < 0.01 &&
     Math.abs(city.longitude - d.longitude) < 0.01)
  );
  if (existingDataIdx !== -1) {
    // Data already exists, don't add a duplicate
    return;
  }

  // Compute distance and bearing from user location
  const distance = haversine(userLocation.lat, userLocation.lon, city.latitude, city.longitude);
  const bearingVal = bearing(userLocation.lat, userLocation.lon, city.latitude, city.longitude);

  // Pass full city object with distance/bearing to weather fetch
  const cityWithGeo = {
    place_id: city.place_id,
    name: city.name,
    state: city.state,
    latitude: city.latitude,
    longitude: city.longitude,
    distance: distance,
    bearing: bearingVal,
  };

  const weatherResult = await fetchWeatherForCities([cityWithGeo]);
  if (!weatherResult?.[0]?.weather) return;
  const data = weatherResult[0];

  const grid = document.getElementById('city-grid');
  if (!grid) return;

  const card = document.createElement('div');
  card.className = 'city-card';
  card.dataset.cityName = data.name;
  card.dataset.placeid = data.place_id;
  card.dataset.citylat = data.latitude;
  card.dataset.citylon = data.longitude;
  card.dataset.citydist = data.distance;
  card.style.overflow = 'visible';
  // Pass the coordinate-based suffix to renderCityCard so canvas IDs are unique
  const coordSuffix = `${data.latitude || 0}_${data.longitude || 0}`;
  card.innerHTML = renderCityCard(data, coordSuffix);

  // Insert card at the correct position based on distance (sorted by distance, closest first)
  const allCards = Array.from(grid.querySelectorAll('.city-card'));
  let inserted = false;
  for (const existingCard of allCards) {
    const existingDist = parseFloat(existingCard.dataset.citydist);
    if (!isNaN(existingDist) && distance < existingDist) {
      grid.insertBefore(card, existingCard);
      inserted = true;
      break;
    }
  }
  if (!inserted) {
    grid.appendChild(card);
  }

  // Update weatherData
  weatherData.push(data);

  // Apply background
  const code = data.weather.current?.weather_code;
  const bg = WMO_GRADIENTS[code] || WMO_GRADIENTS[0];
  card.style.background = `linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04)), ${bg}`;

  // Draw charts for this card
  const safeName = data.place_id || coordSuffix;
  setTimeout(() => {
    drawMergedChart(`chart-merged-${safeName}`, data.weather, data.highTemp, data.lowTemp);
    drawCombinedChart(`chart-combined-${safeName}`, data.weather);
  }, 50);
}

function removeCardByPlaceId(placeId) {
  const grid = document.getElementById('city-grid');
  if (!grid) return;

  // Find the target coordinates: first from the card, then from weatherData
  let targetLat = null;
  let targetLon = null;

  // Try to find the card with matching place_id
  const targetCard = grid.querySelector(`.city-card[data-placeid="${CSS.escape(String(placeId))}"]`);
  if (targetCard) {
    targetLat = parseFloat(targetCard.dataset.citylat);
    targetLon = parseFloat(targetCard.dataset.citylon);
  }

  // If no card found, get coordinates from weatherData
  if (targetLat == null || targetLon == null) {
    const targetEntry = weatherData.find(d => d.place_id === String(placeId));
    if (targetEntry) {
      targetLat = targetEntry.latitude;
      targetLon = targetEntry.longitude;
    }
  }

  // If still no coordinates, nothing to remove
  if (targetLat == null || targetLon == null) return;

  // Remove ALL cards at the same coordinates (not just the one with the exact place_id)
  const allCards = Array.from(grid.querySelectorAll('.city-card'));
  for (const card of allCards) {
    const cardLat = parseFloat(card.dataset.citylat);
    const cardLon = parseFloat(card.dataset.citylon);
    if (!isNaN(cardLat) && !isNaN(cardLon)) {
      // Use 0.01° tolerance (≈1km), same as the dedup logic
      if (Math.abs(cardLat - targetLat) < 0.01 && Math.abs(cardLon - targetLon) < 0.01) {
        card.style.transition = 'opacity 0.3s, transform 0.3s';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.95)';
        setTimeout(() => card.remove(), 300);
      }
    }
  }

  // Remove all weatherData entries matching the coordinates (not just by place_id)
  const toRemove = [];
  for (let i = 0; i < weatherData.length; i++) {
    const d = weatherData[i];
    if (d.place_id === String(placeId)) {
      toRemove.push(i);
    } else if (d.latitude != null && d.longitude != null) {
      if (Math.abs(d.latitude - targetLat) < 0.01 && Math.abs(d.longitude - targetLon) < 0.01) {
        toRemove.push(i);
      }
    }
  }
  // Remove in reverse order to preserve indices
  for (let i = toRemove.length - 1; i >= 0; i--) {
    weatherData.splice(toRemove[i], 1);
  }
}
