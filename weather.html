<script>
// ===== RADAR PLAYER ENGINE =====
// Enhanced radar UI with zoom, pan, timeline, and playback state management.
// Canvas-based rendering for smooth interactions.

(function() {
  'use strict';

  // ===== CONSTANTS =====
  const ZOOM_LEVELS = [1, 1.5, 2, 3];
  // Expose speed options globally so main.js can use them
  window.SPEED_OPTIONS = [0.5, 1, 2, 4, 8];
  const MAX_ZOOM = 3;
  const PAN_SPEED = 8; // pixels per frame at zoom 1
  const ZOOM_DURATION_MS = 300;
  const PRE_FETCH_COUNT = 50; // frames to pre-fetch on load

  // ===== STATE =====
  let state = {
    lat: null,
    lon: null,
    layer: RADAR_DEFAULT_LAYER,
    zoomLevel: 0, // index into ZOOM_LEVELS
    panX: 0,
    panY: 0,
    isPanning: false,
    panStartX: 0,
    panStartY: 0,
    panStartPanX: 0,
    panStartPanY: 0,
    isPlaying: false,
    currentFrameIndex: -1,
    frames: null, // array of { timestamp, dataUrl }
    speed: 1,
    allTimestamps: [], // all available timestamps for this location/layer
    cachedTimestamps: [], // timestamps that have been fetched
    isPreFetching: false,
    preFetchProgress: 0,
    totalPreFetch: 0,
    isLoading: false,
    isLoaded: false,
    animFrameId: null,
    lastFrameTime: 0,
    isFullscreen: false,
  };

  // ===== CANVAS SETUP =====
  let canvas = null;
  let ctx = null;
  let loadedImage = null;
  let isCurrentImageLoaded = false; // tracks the current image's load state independently
  let canvasWidth = 512;
  let canvasHeight = 512;

  // ===== INITIALIZATION =====
  function initRadarPlayer(lat, lon) {
    state.lat = lat;
    state.lon = lon;
    state.layer = RADAR_DEFAULT_LAYER;
    state.zoomLevel = 0;
    state.panX = 0;
    state.panY = 0;
    state.isPlaying = false;
    state.currentFrameIndex = -1;
    state.frames = null;
    state.speed = 1;
    state.allTimestamps = [];
    state.cachedTimestamps = [];
    state.isPreFetching = false;
    state.preFetchProgress = 0;
    state.totalPreFetch = 0;
    state.isLoading = true;
    state.isLoaded = false;

    canvas = document.getElementById('radar-canvas');
    ctx = canvas.getContext('2d');

    // Set canvas size based on zoom level
    updateCanvasSize();

    // Event listeners
    setupCanvasEvents();
    setupKeyboardEvents();

    // Load initial data
    setupTimelineScrubbing();
    loadInitialRadarFrame();
  }

  function updateCanvasSize() {
    const container = document.getElementById('radar-canvas-container');
    if (!container) return;
    const rect = container.getBoundingClientRect();
    canvasWidth = Math.min(rect.width, 512);
    canvasHeight = canvasWidth;
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;
  }

  function hideLoadingOverlay() {
    const loadingOverlay = document.getElementById('radar-loading-overlay');
    if (loadingOverlay) {
      loadingOverlay.classList.add('hidden');
    }
  }

  function showLoadingOverlay(text) {
    const loadingOverlay = document.getElementById('radar-loading-overlay');
    if (loadingOverlay) {
      loadingOverlay.classList.remove('hidden');
      const loadingText = document.getElementById('radar-loading-text');
      if (loadingText) {
        loadingText.textContent = text || 'Loading radar...';
      }
    }
  }

  function showErrorOverlay(text) {
    const loadingOverlay = document.getElementById('radar-loading-overlay');
    if (!loadingOverlay) return;
    loadingOverlay.classList.remove('hidden');
    const spinner = loadingOverlay.querySelector('.radar-spinner');
    if (spinner) spinner.style.display = 'none';
    const loadingText = document.getElementById('radar-loading-text');
    if (loadingText) {
      loadingText.textContent = text || 'Error loading radar';
      loadingText.style.color = '#ff4444';
    }
  }

  function hideErrorOverlay() {
    const loadingOverlay = document.getElementById('radar-loading-overlay');
    if (!loadingOverlay) return;
    loadingOverlay.classList.add('hidden');
    const spinner = loadingOverlay.querySelector('.radar-spinner');
    if (spinner) spinner.style.display = '';
    const loadingText = document.getElementById('radar-loading-text');
    if (loadingText) {
      loadingText.textContent = 'Loading radar...';
      loadingText.style.color = '';
    }
  }

  // ===== CANVAS EVENTS =====
  function setupCanvasEvents() {
    if (!canvas) return;

    // Pan start
    canvas.addEventListener('mousedown', (e) => {
      if (state.zoomLevel > 0 && !isImageLoaded()) return;
      state.isPanning = true;
      state.panStartX = e.clientX;
      state.panStartY = e.clientY;
      state.panStartPanX = state.panX;
      state.panStartPanY = state.panY;
      canvas.style.cursor = 'grabbing';
    });

    // Pan move
    window.addEventListener('mousemove', (e) => {
      if (!state.isPanning) return;
      const zoom = ZOOM_LEVELS[state.zoomLevel];
      const dx = (e.clientX - state.panStartX) / zoom;
      const dy = (e.clientY - state.panStartY) / zoom;
      state.panX = state.panStartPanX + dx;
      state.panY = state.panStartPanY + dy;
      renderCanvas();
    });

    // Pan end
    window.addEventListener('mouseup', () => {
      if (state.isPanning) {
        state.isPanning = false;
        canvas.style.cursor = isImageLoaded() ? 'grab' : 'default';
      }
    });

    // Scroll to zoom (zoom-to-point)
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -1 : 1;
      const newZoom = Math.max(0, Math.min(ZOOM_LEVELS.length - 1, state.zoomLevel + delta));
      if (newZoom !== state.zoomLevel) {
        zoomTo(newZoom, e.clientX, e.clientY);
      }
    }, { passive: false });

    // Double-click to reset view (zoom-to-point for reset)
    canvas.addEventListener('dblclick', (e) => {
      if (isImageLoaded()) {
        // Reset zoom first, then pan at the click point
        const newZoom = 0;
        zoomTo(newZoom, e.clientX, e.clientY);
        state.panX = 0;
        state.panY = 0;
        updateZoomUI();
        renderCanvas();
      } else {
        resetView();
      }
    });

    // Resize observer
    const resizeObserver = new ResizeObserver(() => {
      updateCanvasSize();
      renderCanvas();
    });
    const container = document.getElementById('radar-canvas-container');
    if (container) resizeObserver.observe(container);
  }

  // ===== KEYBOARD EVENTS =====
  function setupKeyboardEvents() {
    window.addEventListener('keydown', (e) => {
      // Only handle when radar player is visible
      const radarCard = document.getElementById('radar-player-card');
      if (!radarCard || radarCard.classList.contains('hidden')) return;

      switch (e.key) {
        case ' ':
          e.preventDefault();
          togglePlayback();
          break;
        case '+':
        case '=':
          e.preventDefault();
          zoomIn();
          break;
        case '-':
          e.preventDefault();
          zoomOut();
          break;
        case '0':
          e.preventDefault();
          resetView();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          panFrame(-1);
          break;
        case 'ArrowRight':
          e.preventDefault();
          panFrame(1);
          break;
      }
    });
  }

  // ===== INITIAL LOAD =====
  async function loadInitialRadarFrame() {
    const progressBar = document.getElementById('radar-prefetch-progress');
    const progressText = document.getElementById('radar-frame-count-text');
    if (progressBar) progressBar.style.width = '0%';
    if (progressText) progressText.textContent = 'Loading radar...';

    // Try to load cached timestamps from metadata first
    let meta = getRadarMeta(state.lat, state.lon, state.layer);
    
    // If no metadata cache, fetch all timestamps from WMS GetCapabilities
    if (!meta || !meta.timestamps || meta.timestamps.length === 0) {
      const allTimestamps = await getRadarTimestampsForLayer(state.layer);
      if (allTimestamps && allTimestamps.length > 0) {
        // Save to metadata cache for future use
        meta = { timestamps: allTimestamps, layer: state.layer, lat: state.lat, lon: state.lon, lastUpdated: Date.now() };
        setRadarMeta(state.lat, state.lon, state.layer, null);
      }
    }

    // Set timestamps from metadata (or WMS if no cache)
    if (meta && meta.timestamps && meta.timestamps.length > 0) {
      state.allTimestamps = [...meta.timestamps].sort();
    } else {
      // No timestamps available — show error
      const loadingText = document.getElementById('radar-loading-text');
      if (loadingText) loadingText.textContent = 'No radar data available';
      showErrorOverlay('No radar data available for this location');
      return;
    }

    // Fetch the latest frame first (last in sorted timestamps)
    const loadResult = await loadCurrentFrame();
    
    // Check if the frame loaded successfully
    if (!loadResult && state.allTimestamps.length > 0) {
      showErrorOverlay('Failed to load radar image');
      return;
    }

    // Hide loading overlay after initial frame loads
    hideLoadingOverlay();

    // Start pre-fetching adjacent frames
    if (state.allTimestamps.length > 0 && !state.isPreFetching) {
      await preFetchFrames();
    }

    state.isLoading = false;
    state.isLoaded = true;

    // Update UI
    updateTimelineUI();
    updatePrefetchUI();
    renderCanvas();
  }

  // ===== FRAME LOADING =====
  async function loadCurrentFrame() {
    const timestamp = state.allTimestamps.length > 0
      ? state.allTimestamps[state.allTimestamps.length - 1] // latest timestamp
      : null;

    return loadRadarFrameForTimestamp(state.lat, state.lon, state.layer, timestamp);
  }

  async function loadRadarFrameForTimestamp(lat, lon, layer, timestamp) {
    // Check cache first
    let dataUrl = await getCachedRadarFrameAsDataURL(lat, lon, layer, timestamp);

    if (!dataUrl) {
      // Fetch from WMS
      const result = await fetchRadarImageForTimestamp(lat, lon, layer, timestamp);
      if (result.error) {
        console.warn('[Radar Player] Failed to load frame:', result.error);
        return null;
      }
      dataUrl = result.imageUrl;
    }

    // Load image into canvas
    const currentImg = new Image();
    loadedImage = currentImg;
    isCurrentImageLoaded = false;
    
    return new Promise((resolve) => {
      // Set onload before setting src to avoid race conditions with cached images
      currentImg.onload = () => {
        // Ensure this is still the current image (not overwritten by a newer request)
        if (loadedImage !== currentImg) return;
        isCurrentImageLoaded = true;
        renderCanvas();
        hideLoadingOverlay();
        resolve(dataUrl);
      };
      currentImg.onerror = () => {
        console.warn('[Radar Player] Image failed to load');
        resolve(null);
      };
      // Now set src - if the image is cached, onload may fire immediately
      currentImg.src = dataUrl;
      
      // If the image is already complete (cached), render immediately
      if (currentImg.complete && currentImg.naturalWidth > 0) {
        isCurrentImageLoaded = true;
        renderCanvas();
        hideLoadingOverlay();
        resolve(dataUrl);
      }
    });
  }

  async function loadFrameByIndex(index) {
    if (!state.allTimestamps.length || index < 0 || index >= state.allTimestamps.length) return null;

    const timestamp = state.allTimestamps[index];
    let dataUrl = await getCachedRadarFrameAsDataURL(state.lat, state.lon, state.layer, timestamp);

    if (!dataUrl) {
      const result = await fetchRadarImageForTimestamp(state.lat, state.lon, state.layer, timestamp);
      if (result.error) return null;
      dataUrl = result.imageUrl;
    }

    const currentImg = new Image();
    loadedImage = currentImg;
    isCurrentImageLoaded = false;
    
    return new Promise((resolve) => {
      currentImg.onload = () => {
        if (loadedImage !== currentImg) return;
        isCurrentImageLoaded = true;
        state.currentFrameIndex = index;
        updateTimestampDisplay(timestamp);
        renderCanvas();
        updateTimelineUI();
        resolve(dataUrl);
      };
      currentImg.onerror = () => resolve(null);
      currentImg.src = dataUrl;
    });
  }

  // ===== PRE-FETCHING =====
  async function preFetchFrames() {
    if (!state.allTimestamps.length) return;

    state.isPreFetching = true;
    state.preFetchProgress = 0;

    // Pre-fetch frames around the current position (last N frames)
    const startIdx = Math.max(0, state.allTimestamps.length - PRE_FETCH_COUNT);
    state.totalPreFetch = PRE_FETCH_COUNT;

    for (let i = startIdx; i < state.allTimestamps.length; i++) {
      const timestamp = state.allTimestamps[i];
      // Skip if already cached
      const cached = await getCachedRadarFrameAsDataURL(state.lat, state.lon, state.layer, timestamp);
      if (!cached) {
        await fetchRadarImageForTimestamp(state.lat, state.lon, state.layer, timestamp);
      }
      state.preFetchProgress++;
      updatePrefetchUI();

      // Yield to avoid blocking UI
      await new Promise(r => setTimeout(r, 10));
    }

    state.isPreFetching = false;
    state.preFetchProgress = state.totalPreFetch;
    updatePrefetchUI();
  }

  function updatePrefetchUI() {
    const progressBar = document.getElementById('radar-prefetch-progress');
    const progressText = document.getElementById('radar-frame-count-text');
    const loadAllBtn = document.getElementById('radar-load-all-btn');

    if (state.allTimestamps.length === 0) {
      if (progressBar) progressBar.style.width = '0%';
      if (progressText) progressText.textContent = '';
      if (loadAllBtn) loadAllBtn.style.display = 'none';
      return;
    }

    const available = state.allTimestamps.length;
    const cached = state.preFetchProgress || 0;

    if (progressText) {
      progressText.textContent = `${cached}/${available} frames`;
    }

    // Also update loading overlay text
    const loadingText = document.getElementById('radar-loading-text');
    if (loadingText && state.isLoading) {
      loadingText.textContent = `${cached}/${available} frames loaded...`;
    }

    if (progressBar) {
      const pct = state.totalPreFetch > 0 ? (state.preFetchProgress / state.totalPreFetch) * 100 : 0;
      progressBar.style.width = `${pct}%`;
    }

    // Show load all button if not all frames are cached
    if (loadAllBtn) {
      const allCached = state.allTimestamps.length <= state.preFetchProgress;
      loadAllBtn.style.display = allCached ? 'none' : 'flex';
      if (allCached) {
        loadAllBtn.innerHTML = '<span class="radar-check-icon">✓</span> All Loaded';
      } else {
        loadAllBtn.innerHTML = 'Load All Frames';
      }
    }
  }

  // ===== ZOOM =====
  function zoomTo(zoomLevel, centerX, centerY) {
    if (zoomLevel < 0 || zoomLevel >= ZOOM_LEVELS.length) return;
    const oldZoom = state.zoomLevel;
    state.zoomLevel = zoomLevel;
    const newZoom = ZOOM_LEVELS[zoomLevel];
    const oldZoomFactor = ZOOM_LEVELS[oldZoom] || 1;

    // Zoom-to-point: adjust pan so the point under the mouse stays in place
    if (centerX != null && centerY != null && isImageLoaded()) {
      const rect = canvas.getBoundingClientRect();
      const mouseX = centerX - rect.left;
      const mouseY = centerY - rect.top;
      
      // Calculate the offset of the zoom point from the center before zoom
      const imgW = 512 * (canvasWidth / 512) * oldZoomFactor;
      const imgH = 512 * (canvasHeight / 512) * oldZoomFactor;
      const centerXOffset = (canvas.width - imgW) / 2 + state.panX;
      const centerYOffset = (canvas.height - imgH) / 2 + state.panY;
      
      const pointOffsetX = mouseX - centerXOffset;
      const pointOffsetY = mouseY - centerYOffset;
      
      // Calculate new image size after zoom
      const newImgW = 512 * (canvasWidth / 512) * newZoom;
      const newImgH = 512 * (canvasHeight / 512) * newZoom;
      const newCenterXOffset = (canvas.width - newImgW) / 2 + state.panX;
      const newCenterYOffset = (canvas.height - newImgH) / 2 + state.panY;
      
      // Adjust pan to keep the point in place
      state.panX += pointOffsetX * (newZoom / oldZoomFactor - 1);
      state.panY += pointOffsetY * (newZoom / oldZoomFactor - 1);
    }

    // Update canvas size based on zoom
    const container = document.getElementById('radar-canvas-container');
    if (container) {
      const rect = container.getBoundingClientRect();
      canvasWidth = Math.min(rect.width, 512);
      canvasHeight = canvasWidth;
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
    }

    // Update cursor
    if (canvas) {
      canvas.style.cursor = isImageLoaded() ? 'grab' : 'default';
    }

    updateZoomUI();
    renderCanvas();
  }

  function zoomIn() {
    const newLevel = Math.min(ZOOM_LEVELS.length - 1, state.zoomLevel + 1);
    if (newLevel !== state.zoomLevel) zoomTo(newLevel);
  }

  function zoomOut() {
    const newLevel = Math.max(0, state.zoomLevel - 1);
    if (newLevel !== state.zoomLevel) zoomTo(newLevel);
  }

  function resetView() {
    state.zoomLevel = 0;
    state.panX = 0;
    state.panY = 0;
    updateZoomUI();
    renderCanvas();
  }

  function updateZoomUI() {
    const zoomLevel = ZOOM_LEVELS[state.zoomLevel];
    const zoomText = document.getElementById('radar-zoom-text');
    if (zoomText) {
      zoomText.textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    // Update zoom level buttons
    document.querySelectorAll('.radar-zoom-level-btn').forEach(btn => {
      const level = parseInt(btn.dataset.zoom);
      btn.classList.toggle('active', level === state.zoomLevel);
    });
  }

  // ===== PAN =====
  function panFrame(direction) {
    // Pan to adjacent frame in the timeline
    if (!state.allTimestamps.length) return;
    const newIdx = state.currentFrameIndex + direction;
    if (newIdx < 0 || newIdx >= state.allTimestamps.length) return;

    // Stop playback if active
    if (state.isPlaying) togglePlayback();

    loadFrameByIndex(newIdx);
  }

  function panToTimestamp(timestamp) {
    const idx = state.allTimestamps.indexOf(timestamp);
    if (idx === -1) return;
    panFrame(idx - state.currentFrameIndex);
  }

  // ===== PLAYBACK =====
  function togglePlayback() {
    if (!state.allTimestamps.length || !isImageLoaded()) return;

    if (state.isPlaying) {
      stopPlayback();
    } else {
      startPlayback();
    }
  }

  function startPlayback() {
    state.isPlaying = true;
    state.currentFrameIndex = -1;
    state.lastFrameTime = Date.now();

    // Update UI
    const playBtn = document.getElementById('radar-play-btn');
    if (playBtn) {
      playBtn.classList.add('active');
      playBtn.textContent = '⏸';
    }

    // Show timeline progress during playback
    const timelineContainer = document.getElementById('radar-timeline-container');
    if (timelineContainer) {
      timelineContainer.classList.add('playing');
    }

    // Highlight play button in titlebar
    const playerHeader = document.getElementById('radar-player-card')?.querySelector('.radar-player-header');
    if (playerHeader) {
      playerHeader.classList.add('playing');
    }

    // Start playback loop
    playbackLoop();
  }

  function stopPlayback() {
    state.isPlaying = false;
    if (state.animFrameId) {
      cancelAnimationFrame(state.animFrameId);
      state.animFrameId = null;
    }

    // Update UI
    const playBtn = document.getElementById('radar-play-btn');
    if (playBtn) {
      playBtn.classList.remove('active');
      playBtn.textContent = '▶';
    }

    // Hide timeline progress during playback
    const timelineContainer = document.getElementById('radar-timeline-container');
    if (timelineContainer) {
      timelineContainer.classList.remove('playing');
    }

    // Remove highlight from play button in titlebar
    const playerHeader = document.getElementById('radar-player-card')?.querySelector('.radar-player-header');
    if (playerHeader) {
      playerHeader.classList.remove('playing');
    }
  }

  function playbackLoop() {
    if (!state.isPlaying) return;

    const now = Date.now();
    const interval = 1000 / (state.speed * 2); // base: 2 fps at 1x speed

    if (now - state.lastFrameTime >= interval) {
      state.lastFrameTime = now;

      // Move to next frame
      state.currentFrameIndex++;
      if (state.currentFrameIndex >= state.allTimestamps.length) {
        state.currentFrameIndex = 0; // loop back to start
      }

      // Load and render frame
      loadFrameByIndex(state.currentFrameIndex);

      // Update timeline progress
      updateTimelineProgress();
    }

    state.animFrameId = requestAnimationFrame(playbackLoop);
  }

  // ===== TIMELINE =====
  function updateTimelineUI() {
    const timelineContainer = document.getElementById('radar-timeline');
    if (!timelineContainer || !state.allTimestamps.length) return;

    // Only rebuild dots if we don't have any yet (e.g., first load or layer change)
    const existingDots = timelineContainer.querySelectorAll('.radar-timeline-dot');
    if (existingDots.length !== state.allTimestamps.length) {
      // Need to create dots
      while (timelineContainer.firstChild) {
        timelineContainer.removeChild(timelineContainer.firstChild);
      }

      // Create dots for each timestamp
      state.allTimestamps.forEach((timestamp, idx) => {
        const dot = document.createElement('div');
        dot.className = 'radar-timeline-dot';
        if (idx === state.currentFrameIndex) {
          dot.classList.add('active');
        }

        // Check if frame is cached
        const isCached = getCachedRadarFrameAsDataURL(state.lat, state.lon, state.layer, timestamp) !== null;
        if (!isCached) {
          dot.classList.add('uncached');
        }

        // Format time for tooltip
        const date = new Date(timestamp);
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        dot.title = `${timeStr}`;
        dot.dataset.timestamp = timestamp;
        dot.dataset.index = idx;

        // Click to seek
        dot.addEventListener('click', () => {
          if (state.isPlaying) stopPlayback();
          loadFrameByIndex(parseInt(dot.dataset.index));
        });

        timelineContainer.appendChild(dot);
      });
    } else {
      // Just update active/cached classes on existing dots (efficient!)
      const dots = timelineContainer.querySelectorAll('.radar-timeline-dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === state.currentFrameIndex);
      });
    }

    // Update time range display
    const timeRange = document.getElementById('radar-time-range');
    if (timeRange && state.allTimestamps.length > 0) {
      const start = new Date(state.allTimestamps[0]);
      const end = new Date(state.allTimestamps[state.allTimestamps.length - 1]);
      timeRange.textContent = `${start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} — ${end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    }

    // Update timeline progress bar
    updateTimelineProgress();
  }

  // ===== TIMELINE SCRUBBING =====
  function setupTimelineScrubbing() {
    const progressBar = document.getElementById('radar-timeline-progress-bar');
    if (!progressBar) return;

    let isScrubbing = false;

    // Mouse down - start scrubbing
    progressBar.addEventListener('mousedown', (e) => {
      e.preventDefault();
      isScrubbing = true;
      scrubToPosition(e);
    });

    // Mouse move - continue scrubbing
    window.addEventListener('mousemove', (e) => {
      if (!isScrubbing) return;
      scrubToPosition(e);
    });

    // Mouse up - stop scrubbing
    window.addEventListener('mouseup', () => {
      isScrubbing = false;
    });

    // Touch events for mobile
    progressBar.addEventListener('touchstart', (e) => {
      isScrubbing = true;
      scrubToPosition(e.touches[0]);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isScrubbing) return;
      scrubToPosition(e.touches[0]);
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isScrubbing = false;
    });

    function scrubToPosition(e) {
      const rect = progressBar.getBoundingClientRect();
      let pct = (e.clientX - rect.left) / rect.width;
      pct = Math.max(0, Math.min(1, pct));

      // Guard against empty timestamps array
      if (!state.allTimestamps.length) return;

      // Calculate which frame index to seek to
      const targetIdx = Math.round(pct * (state.allTimestamps.length - 1));

      if (targetIdx !== state.currentFrameIndex) {
        if (state.isPlaying) stopPlayback();
        loadFrameByIndex(targetIdx);
      }
    }
  }

  function updateTimelineProgress() {
    const progressBar = document.getElementById('radar-timeline-progress');
    if (!progressBar || !state.allTimestamps.length) return;

    const pct = state.currentFrameIndex >= 0
      ? ((state.currentFrameIndex + 1) / state.allTimestamps.length) * 100
      : 0;
    progressBar.style.width = `${pct}%`;

    // Update active dot
    const timelineContainer = document.getElementById('radar-timeline');
    if (!timelineContainer) return;
    const dots = timelineContainer.querySelectorAll('.radar-timeline-dot');
    dots.forEach((dot, idx) => {
      dot.classList.toggle('active', idx === state.currentFrameIndex);
    });
  }

  function updateTimestampDisplay(timestamp) {
    const timestampEl = document.getElementById('radar-timestamp');
    const loadingOverlay = document.getElementById('radar-loading-overlay');
    if (!timestampEl) return;
    
    // Guard against null/invalid timestamps
    if (!timestamp) {
      timestampEl.textContent = '--:--';
      return;
    }
    
    const date = new Date(timestamp);
    if (isNaN(date.getTime())) {
      timestampEl.textContent = '--:--';
      return;
    }
    
    timestampEl.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
    // Hide loading overlay when timestamp is set
    if (loadingOverlay) loadingOverlay.classList.add('hidden');
  }

  // ===== CANVAS RENDERING =====
  function isImageLoaded() {
    return isCurrentImageLoaded;
  }

  function renderCanvas() {
    if (!ctx || !canvas) return;

    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvasHeight);

    // Background
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, 0, canvas.width, canvasHeight);

    if (!isImageLoaded()) {
      // Draw loading spinner
      drawLoadingSpinner(ctx, canvas.width / 2, canvas.height / 2);
      return;
    }

    const zoom = ZOOM_LEVELS[state.zoomLevel] || 1;
    const scale = (canvasWidth / 512) * zoom;
    const imgW = 512 * scale;
    const imgH = 512 * scale;

    ctx.save();

    // Apply pan offset
    ctx.translate(state.panX, state.panY);

    // Draw the image centered
    const offsetX = (canvas.width - imgW) / 2;
    const offsetY = (canvas.height - imgH) / 2;
    ctx.drawImage(loadedImage, offsetX, offsetY, imgW, imgH);

    ctx.restore();
  }

  function drawLoadingSpinner(ctx, cx, cy) {
    const radius = 16;
    const lineWidth = 3;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Spinning arc
    const time = Date.now() / 1000;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, radius, -Math.PI / 2 + time * 3, Math.PI / 2 + time * 3);
    ctx.stroke();
  }

  // ===== LAYER SWITCHING =====
  async function switchLayer(layer) {
    if (layer === state.layer) return;

    const oldLayer = state.layer;
    state.layer = layer;

    // Stop playback
    if (state.isPlaying) stopPlayback();

    // Clear state for new layer
    state.allTimestamps = [];
    state.cachedTimestamps = [];
    state.currentFrameIndex = -1;
    state.frames = null;
    loadedImage = null;

    // Get timestamps for new layer from WMS (not just metadata) — use all timestamps, not just latest
    const allTimestamps = await getRadarTimestampsForLayer(layer);
    if (allTimestamps && allTimestamps.length > 0) {
      state.allTimestamps = [...allTimestamps].sort();
    } else {
      // Fallback: try metadata cache, then latest timestamp
      const meta = getRadarMeta(state.lat, state.lon, state.layer);
      if (meta && meta.timestamps && meta.timestamps.length > 0) {
        state.allTimestamps = [...meta.timestamps].sort();
      } else {
        const latestTimestamp = await getLatestRadarTimestamp();
        if (latestTimestamp) {
          state.allTimestamps = [latestTimestamp];
        }
      }
    }

    // Update UI - set layer select value WITHOUT triggering another change event
    const layerSelect = document.getElementById('radar-layer-select');
    if (layerSelect) {
      layerSelect.value = layer;
    }

    updateZoomUI();

    // Show loading overlay for layer switch
    state.isLoading = true;
    showLoadingOverlay('Switching layer...');
    
    const loadResult = await loadCurrentFrame();
    if (!loadResult && state.allTimestamps.length > 0) {
      showErrorOverlay('Failed to load radar image');
      hideErrorOverlay();
      return;
    }
    
    hideLoadingOverlay();
    state.isLoading = false;
    state.isLoaded = true;

    updateTimelineUI();
    updatePrefetchUI();
    renderCanvas();
  }

  // ===== FULLSCREEN =====
  function toggleFullscreen() {
    const card = document.getElementById('radar-player-card');
    if (!card) return;

    if (state.isFullscreen) {
      exitFullscreen();
    } else {
      enterFullscreen();
    }
  }

  function enterFullscreen() {
    state.isFullscreen = true;
    const card = document.getElementById('radar-player-card');
    const fsBtn = document.getElementById('radar-fullscreen-btn');
    if (card) card.classList.add('fullscreen');
    if (fsBtn) {
      fsBtn.classList.add('active');
      fsBtn.textContent = '⛶'; // exit fullscreen icon
    }

    // Make card fixed overlay
    if (card) {
      card.style.position = 'fixed';
      card.style.inset = '0';
      card.style.zIndex = '999';
      card.style.margin = '0';
      card.style.borderRadius = '0';
      card.style.maxWidth = '100%';
      card.style.width = '100%';
    }

    // Update canvas size for fullscreen
    setTimeout(() => {
      updateCanvasSize();
      renderCanvas();
    }, 100);
  }

  function exitFullscreen() {
    state.isFullscreen = false;
    const card = document.getElementById('radar-player-card');
    const fsBtn = document.getElementById('radar-fullscreen-btn');
    if (card) {
      card.classList.remove('fullscreen');
      card.style.position = '';
      card.style.inset = '';
      card.style.zIndex = '';
      card.style.margin = '';
      card.style.borderRadius = '';
      card.style.maxWidth = '';
      card.style.width = '';
    }
    if (fsBtn) {
      fsBtn.classList.remove('active');
      fsBtn.textContent = '⛶'; // enter fullscreen icon
    }

    setTimeout(() => {
      updateCanvasSize();
      renderCanvas();
    }, 100);
  }

  // ===== UTILITY =====
  function getZoomPercent() {
    return Math.round((ZOOM_LEVELS[state.zoomLevel] || 1) * 100);
  }

  // ===== PUBLIC API =====
  const RadarPlayer = {
    init: initRadarPlayer,
    togglePlayback,
    stopPlayback,
    zoomIn,
    zoomOut,
    resetView,
    switchLayer,
    panFrame,
    toggleFullscreen,
    getZoomPercent,
    getState: () => ({ ...state }),
  };

  // Expose globally
  window.RADAR_PLAYER = RadarPlayer;

})();
</script>
<script>
// ===== RENDER =====

// ===== PLACEHOLDER CARD RENDERING =====
// Renders minimal city cards immediately after location is known, before any weather data arrives.

function renderPlaceholderCards(cities) {
  const grid = document.getElementById('city-grid');
  if (!grid) return;

  grid.innerHTML = '';

  cities.forEach((city, i) => {
    const card = document.createElement('div');
    card.className = 'city-card placeholder';
    card.dataset.cityName = city.name;
    card.dataset.placeid = city.place_id || '';
    card.dataset.citydist = city.distance != null ? city.distance : '';
    card.dataset.citylat = city.latitude != null ? city.latitude : '';
    card.dataset.citylon = city.longitude != null ? city.longitude : '';
    card.style.animationDelay = `${i * 120}ms`;
    
    const suffix = city.latitude != null && city.longitude != null 
      ? `${city.latitude}_${city.longitude}` 
      : undefined;
    card.innerHTML = renderPlaceholderCard(city, suffix);
    grid.appendChild(card);
  });
}

function renderPlaceholderCard(city, suffix) {
  const safeName = city.place_id || suffix;
  return `
    <div class="placeholder-content">
      <span class="placeholder-name">${escapeHTML(city.name)}</span>
      <span class="placeholder-state">${escapeHTML(city.state)}</span>
      ${city.distance != null ? `<span class="placeholder-distance">${Math.round(city.distance)} mi</span>` : ''}
    </div>`;
}

// ===== INCREMENTAL OM DATA UPDATE =====
// Updates placeholder cards with Open-Meteo weather data as it arrives.

function updateCardsWithOMData(omWeatherData) {
  // For each city in omWeatherData, find the matching card and update it
  for (const cityData of omWeatherData) {
    const card = findCardByCoords(cityData.latitude, cityData.longitude);
    if (!card) continue;

    // Remove placeholder class and add loading class for transition
    card.classList.remove('placeholder');
    card.classList.add('loading-om');
    
    // Build the full card HTML with OM data
    const suffix = cityData.place_id || `${cityData.latitude || 0}_${cityData.longitude || 0}`;
    const html = renderCityCard(cityData, suffix);
    
    // Fade out placeholder, then swap content
    card.style.opacity = '0';
    setTimeout(() => {
      card.innerHTML = html;
      card.classList.remove('loading-om');
      
      // Apply gradient background based on weather
      const w = cityData.weather;
      if (w && w.current) {
        const code = w.current.weather_code || 0;
        const bg = WMO_GRADIENTS[code] || WMO_GRADIENTS[0];
        card.style.background = `linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04)), ${bg}`;
      }
      
      // Fade in
      card.style.opacity = '1';
      
      // Draw chart for this card now that canvas exists (don't wait for global drawAllCharts)
      const safeName = cityData.place_id || `${cityData.latitude || 0}_${cityData.longitude || 0}`;
      setTimeout(() => {
        drawMergedChart(`chart-merged-${safeName}`, cityData.weather, cityData.highTemp, cityData.lowTemp);
        drawCombinedChart(`chart-combined-${safeName}`, cityData.weather);
      }, 50);
    }, 300);
  }
}

// ===== INCREMENTAL NWS DATA UPDATE =====
// Updates OM cards with NWS ghost overlay data as it arrives.
// Re-renders the full card HTML (OM + ghost) for affected cities.

function updateCardsWithNWSData(nwsCityData) {
  for (const cityData of nwsCityData) {
    const card = findCardByCoords(cityData.latitude, cityData.longitude);
    if (!card || !cityData.nwsData || !cityData.weather) continue;

    // Add loading-nws class for transition
    card.classList.add('loading-nws');
    
    // Build the full card HTML with OM + ghost data
    const suffix = cityData.place_id || `${cityData.latitude || 0}_${cityData.longitude || 0}`;
    const html = renderCityCard(cityData, suffix);
    
    // Fade out, swap content, fade in
    card.style.opacity = '0';
    setTimeout(() => {
      card.innerHTML = html;
      card.classList.remove('loading-nws');
      
      // Apply gradient background based on weather
      const w = cityData.weather;
      if (w && w.current) {
        const code = w.current.weather_code || 0;
        const bg = WMO_GRADIENTS[code] || WMO_GRADIENTS[0];
        card.style.background = `linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04)), ${bg}`;
      }
      
      // Fade in
      card.style.opacity = '1';
      
      // Draw OM chart on the new canvas (card innerHTML was replaced, destroying old canvas)
      const safeName = cityData.place_id || `${cityData.latitude || 0}_${cityData.longitude || 0}`;
      setTimeout(() => {
        drawMergedChart(`chart-merged-${safeName}`, cityData.weather, cityData.highTemp, cityData.lowTemp);
        drawCombinedChart(`chart-combined-${safeName}`, cityData.weather);
        // Draw ghost chart for this card now that canvas exists
        drawGhostMergedChart(`chart-ghost-merged-${safeName}`, cityData.nwsData.weather, cityData.highTemp, cityData.lowTemp);
      }, 50);
    }, 200);
  }
}

// ===== CARD LOOKUP BY COORDINATES =====
// More reliable than matching by name (which can contain quotes/special chars)

function findCardByCoords(lat, lon) {
  const cards = document.querySelectorAll('.city-card');
  for (const card of cards) {
    const cardLat = parseFloat(card.dataset.citylat);
    const cardLon = parseFloat(card.dataset.citylon);
    if (!isNaN(cardLat) && !isNaN(cardLon) && Math.abs(lat - cardLat) < 0.01 && Math.abs(lon - cardLon) < 0.01) {
      return card;
    }
  }
  return null;
}

function buildNWSGhostOverlay(cityData, safeName) {
  const hasNwsData = !!cityData.nwsData;
  if (!hasNwsData) return '';
  
  const current = cityData.nwsData.weather?.current || {};
  const hourly = cityData.nwsData.weather?.hourly || {};
  const now = new Date();
  const currentHour = now.getHours();

  // Ghost temperature
  const ghostTemp = current?.temperature_2m != null ? convertTemp(current.temperature_2m) :
                    current?.temperature != null ? convertTemp(current.temperature) : '—';
  
  // Ghost weather icon
  const ghostWeatherCode = current?.weather_code ?? current?.weatherCode ?? 0;
  const isNwsDay = isDaytime(currentHour, parseDecimalTime(current?.sunrise || '', 6), parseDecimalTime(current?.sunset || '', 19));
  const ghostIcon = isNwsDay ? getWeatherIcon(ghostWeatherCode) : getMoonIcon(ghostWeatherCode);

  // Ghost details grid values
  const ghostHumidity = current?.relative_humidity_2m ?? current?.relativeHumidity ?? '—';
  const ghostWindSpeed = current?.wind_speed_10m != null ? `${Math.round(current.wind_speed_10m)} km/h` :
                        current?.windSpeed != null ? `${Math.round(current.windSpeed)} km/h` : '';
  const ghostWindDir = current?.wind_direction_10m ?? current?.windDirection ?? 0;
  let ghostPressure = '—';
  if (current?.surface_pressure != null) {
    ghostPressure = current.surface_pressure;
  } else if (current?.pressure != null) {
    ghostPressure = current.pressure;
  }
  const ghostUv = '—';
  let ghostVis = '—';
  if (current?.visibility != null) {
    ghostVis = current.visibilityUnit === 'mi' ? current.visibility.toFixed(1) : (current.visibility / 1609.34).toFixed(1);
  }

  // Ghost hourly forecast
  const nwsTimeArr = hourly?.time || [];
  let ghostHourlySlotsHTML = '';
  for (let i = 0; i < 24; i++) {
    const hIdx = nwsTimeArr.findIndex(t => {
      const [datePart, timePart] = t.split('T');
      return datePart === now.toISOString().split('T')[0] && timePart.startsWith(`T${String(currentHour + i).padStart(2, '0')}`);
    });
    if (hIdx < 0 || hIdx >= nwsTimeArr.length) break;
    const hTime = nwsTimeArr[hIdx]?.split('T')[1]?.split('+')[0]?.slice(0, 5);
    const hTemp = hourly?.temperature_2m?.[hIdx] != null ? convertTemp(hourly.temperature_2m[hIdx]) :
                  hourly?.temperature?.[hIdx] != null ? convertTemp(hourly.temperature[hIdx]) : '—';
    const hCode = hourly?.weather_code?.[hIdx] ?? hourly?.weatherCode?.[hIdx] ?? 0;
    const isGhostCurrent = i === 0;
    const hHourDecimal = parseDecimalTime(hTime, 12);
    const hIsDay = isDaytime(hHourDecimal, parseDecimalTime(current?.sunrise || '', 6), parseDecimalTime(current?.sunset || '', 19));
    const hWind = hourly?.wind_speed_10m?.[hIdx] != null ? `${Math.round(hourly.wind_speed_10m[hIdx])} km/h` :
                  hourly?.windSpeed?.[hIdx] != null ? `${Math.round(hourly.windSpeed[hIdx])} km/h` : '';
    const hPrecip = hourly?.precipitation?.[hIdx] != null && hourly.precipitation[hIdx] > 0.1 
      ? `${Math.round(hourly.precipitation[hIdx])}mm` : '';
    ghostHourlySlotsHTML += `<div class="nws-ghost-hour-slot${isGhostCurrent ? ' current' : ''}">
      <div class="nws-ghost-hour-icon">${isGhostCurrent ? ghostIcon : (hIsDay ? getWeatherIcon(hCode) : getMoonIcon(hCode))}</div>
      <div class="nws-ghost-hour-temp">${Math.round(hTemp)}°</div>
      ${hWind ? `<div class="nws-ghost-hour-wind">${hWind}</div>` : ''}
      ${hPrecip ? `<div class="nws-ghost-hour-precip">${hPrecip}</div>` : ''}
    </div>`;
  }

  // Ghost merged canvas
  const ghostMergedCanvas = `<canvas class="chart-canvas chart-merged nws-ghost-chart" id="chart-ghost-merged-${safeName}" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;"></canvas>`;

  return {
    headerHTML: `
      <div class="nws-ghost nws-ghost-temp">${Math.round(ghostTemp)}°</div>
      <div class="nws-ghost nws-ghost-icon">${ghostIcon}</div>`,
    detailsHTML: `
      <div class="nws-ghost nws-ghost-details">
        <div class="nws-ghost-detail-cell"><span class="nws-ghost-detail-label">Humidity</span><span class="nws-ghost-detail-value">${ghostHumidity}%</span></div>
        <div class="nws-ghost-detail-cell"><span class="nws-ghost-detail-label">Wind</span><span class="nws-ghost-detail-value">${ghostWindDir !== 0 ? getWindCompass(ghostWindDir) + ' ' + ghostWindSpeed : '—'}</span></div>
        <div class="nws-ghost-detail-cell"><span class="nws-ghost-detail-label">Pressure</span><span class="nws-ghost-detail-value">${ghostPressure} hPa</span></div>
        <div class="nws-ghost-detail-cell"><span class="nws-ghost-detail-label">UV Index</span><span class="nws-ghost-detail-value">${ghostUv}</span></div>
        <div class="nws-ghost-detail-cell"><span class="nws-ghost-detail-label">Visibility</span><span class="nws-ghost-detail-value">${ghostVis} mi</span></div>
      </div>`,
    hourlyHTML: `
      <div class="nws-ghost nws-ghost-hourly">
        ${ghostHourlySlotsHTML}
      </div>`,
    ghostCanvas: ghostMergedCanvas,
  };
}

// ===== FULL RENDER =====
// Renders all city cards with complete data. Used for refresh/background updates.

// Parse time string as decimal hours so minutes are accounted for (e.g., "18:45" → 18.75)
function parseDecimalTime(timeStr, fallback) {
  if (!timeStr) return fallback;
  const [h, m] = timeStr.split(':').map(Number);
  return h + (m / 60);
}

function renderAll() {
  const grid = document.getElementById('city-grid');
  if (!grid) return;

  // De-duplicate weatherData by coordinates before rendering (keep entry with non-null place_id)
  const seenCoords = new Map();
  const deduped = [];
  for (const entry of weatherData) {
    const lat = entry.latitude != null ? DataCache._roundCoord(entry.latitude) : null;
    const lon = entry.longitude != null ? DataCache._roundCoord(entry.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(entry);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    let isDup = false;
    for (const [existingKey, existingEntry] of seenCoords) {
      const [exLat, exLon] = existingKey.split(',').map(Number);
      if (Math.abs(lat - exLat) < 0.01 && Math.abs(lon - exLon) < 0.01) {
        isDup = true;
        // Prefer the entry with a non-null place_id
        if (!existingEntry.place_id && entry.place_id) {
          seenCoords.set(existingKey, entry);
          const dupIdx = deduped.findIndex(d => d === existingEntry);
          if (dupIdx !== -1) deduped[dupIdx] = entry;
        }
        break;
      }
    }
    if (!isDup) {
      seenCoords.set(coordKey, entry);
      deduped.push(entry);
    }
  }
  weatherData = deduped;

  grid.innerHTML = '';

  weatherData.forEach((data, i) => {
    const card = document.createElement('div');
    card.className = 'city-card';
    card.dataset.cityName = data.name;
    card.dataset.placeid = data.place_id || '';
    card.dataset.citydist = data.distance != null ? data.distance : '';
    card.dataset.citylat = data.latitude != null ? data.latitude : '';
    card.dataset.citylon = data.longitude != null ? data.longitude : '';
    card.style.animationDelay = `${i * 120}ms`;
    card.style.animationFillMode = 'forwards';
    card.style.overflow = 'visible';
    const suffix = data.latitude != null && data.longitude != null ? `${data.latitude}_${data.longitude}` : undefined;
    card.innerHTML = renderCityCard(data, suffix);
    grid.appendChild(card);

  });

   applyBackgrounds();
   
   setTimeout(() => {
     drawAllCharts();
     drawGhostCharts();
   }, 400);
 }

function applyBackgrounds() {
  let style = document.getElementById('dynamic-bg');
  if (!style) {
    style = document.createElement('style');
    style.id = 'dynamic-bg';
    document.head.appendChild(style);
  }
  style.textContent = '';
  document.querySelectorAll('.city-card').forEach((card, i) => {
    if (weatherData[i]?.weather) {
      const code = weatherData[i].weather.current?.weather_code;
      const bg = WMO_GRADIENTS[code] || WMO_GRADIENTS[0];
      card.style.background = `linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04)), ${bg}`;
    }
  });
}

function renderCityCard(data, suffix) {
  const w = data.weather;
  const a = data.aqi;
  if (!w || !w.current) {
    return `<div style="padding:2rem;text-align:center;">Error loading data</div>`;
  }

  const current = w.current || {};
  const hourly = w.hourly || {};
  const aqiData = aqiLabel(a?.us_aqi ?? null);

  const curTemp = current?.temperature_2m != null ? convertTemp(current.temperature_2m) :
                  current?.temperature != null ? convertTemp(current.temperature) : '—';
  const curWeatherCode = current?.weather_code ?? current?.weatherCode ?? 0;
  // Field names: both sources use the same field names after nwsToAppData mapping
  const humidity = current?.relative_humidity_2m ?? current?.relativeHumidity ?? '—';
  const windSpeed = current?.wind_speed_10m ?? current?.windSpeed ?? '—';
  const windDir = current?.wind_direction_10m ?? current?.windDirection ?? 0;
  
  // Pressure: always in hPa (NWS converted from inHg, OM already in hPa)
  let pressure = '—';
  if (current?.surface_pressure != null) {
    pressure = current.surface_pressure;
  } else if (current?.pressure != null) {
    pressure = current.pressure;
  }
  
  // UV Index: cross-source from OM cache if available
  const uv = current?.uv_index != null ? current.uv_index : '—';
  
  // Visibility: always in meters, convert to miles for display
  let vis = '—';
  if (current?.visibility != null) {
    if (current.visibilityUnit === 'mi') {
      vis = current.visibility.toFixed(1);
    } else {
      // meters to miles
      vis = (current.visibility / 1609.34).toFixed(1);
    }
  }
  
  // PM2.5: cross-source from OM cache if available
  const pm25 = a && a.pm2_5 !== undefined && a.pm2_5 !== null ? a.pm2_5 : '—';

  const now = new Date();
  const currentHour = now.getHours();

  const sunriseTime = current?.sunrise ? parseDecimalTime(current.sunrise.split('T')[1]?.split('+')[0], 6) : 6;
  const sunsetTime = current?.sunset ? parseDecimalTime(current.sunset.split('T')[1]?.split('+')[0], 19) : 19;
  const isDay = isDaytime(currentHour, sunriseTime, sunsetTime);

  const curIcon = isDay ? getWeatherIcon(curWeatherCode) : getMoonIcon(curWeatherCode);
  const curIconLarge = isDay ? getWeatherIcon(curWeatherCode, 80) : getMoonIcon(curWeatherCode, 80);

  const timeArr = hourly?.time || [];
  const currentDay = now.toISOString().split('T')[0];
  const currentIdx = timeArr.findIndex(t => {

  let hourlyHTML = '';

      : '<span class="source-badge open-meteo">OM</span>';

  const safeName = data.place_id || suffix;
  const mergedCanvasId = `chart-merged-${safeName}`;

  // Slice to 24 hours (current day only) for chart display

  const chartStats = (data) => {
    // Filter out null values before computing stats
    const valid = data.filter(v => v != null);
    return valid.length ? {
      min: Math.round(Math.min(...valid)),

      avg: Math.round(valid.reduce((a, b) => a + b, 0) / valid.length),

  const humStats = chartStats(hum);

  // Build ghost overlay HTML when NWS data is available

  if (hasNwsData) {

    const ghostWindDir = nwsCurrent?.wind_direction_10m ?? nwsCurrent?.windDirection ?? 0;

    // Ghost hourly forecast
    const nwsTimeArr = nwsHourly?.time || [];
    const nwsCurrentDay = now.toISOString().split('T')[0];
    const nwsCurrentIdx = nwsTimeArr.findIndex(t => {
      const [datePart, timePart] = t.split('T');

    // Build ghost hourly slots
    let ghostHourlySlotsHTML = '';
    for (let i = 0; i < 24; i++) {
      const hIdx = nwsCurrentIdx >= 0 ? nwsCurrentIdx + i : currentHour + i;
      if (hIdx < 0 || hIdx >= nwsTimeArr.length) break;
      const hTime = nwsTimeArr[hIdx]?.split('T')[1]?.split('+')[0]?.slice(0, 5);
      const hTemp = nwsHourly?.temperature_2m?.[hIdx] != null ? convertTemp(nwsHourly.temperature_2m[hIdx]) :
                    nwsHourly?.temperature?.[hIdx] != null ? convertTemp(nwsHourly.temperature[hIdx]) : '—';
      const hCode = nwsHourly?.weather_code?.[hIdx] ?? nwsHourly?.weatherCode?.[hIdx] ?? 0;
      const isGhostCurrent = i === 0;
      const hHourDecimal = parseDecimalTime(hTime, 12);
      const hIsDay = isDaytime(hHourDecimal, sunriseTime, sunsetTime);
      const hWind = nwsHourly?.wind_speed_10m?.[hIdx] != null ? `${Math.round(nwsHourly.wind_speed_10m[hIdx])} km/h` :

      const hPrecip = nwsHourly?.precipitation?.[hIdx] != null && nwsHourly.precipitation[hIdx] > 0.1

// ===== DRAW GHOST CHARTS =====
function drawGhostCharts() {
  weatherData.forEach((data) => {
    if (!data.weather || !data.nwsData) return;
    const hourly = data.nwsData.weather.hourly || {};
    const safeName = data.place_id || `${data.latitude || 0}_${data.longitude || 0}`;
    if (Object.keys(hourly).length === 0) return;

    // Find current hour index in NWS hourly data to align with OM chart's time window
    const nwsTimeArr = hourly.time || [];
    const nwsCurrentDay = new Date().toISOString().split('T')[0];
    const currentHour = new Date().getHours();
    let currentIdx = -1;
    if (nwsTimeArr.length > 0) {
      // Find the index where the date matches current day and time starts with current hour
      for (let i = 0; i < nwsTimeArr.length; i++) {
        const t = nwsTimeArr[i];
        const [datePart, timePart] = t.split('T');
        if (datePart === nwsCurrentDay && timePart.startsWith(`T${String(currentHour).padStart(2, '0')}`)) {
          currentIdx = i;
          break;
        }
      }
    }

    // If no exact match found, fall back to first hour of current day
    if (currentIdx === -1) {
      for (let i = 0; i < nwsTimeArr.length; i++) {
        const t = nwsTimeArr[i];
        const [datePart] = t.split('T');
        if (datePart === nwsCurrentDay) {
          currentIdx = i;
          break;
        }
      }
    }

    drawGhostMergedChart(`chart-ghost-merged-${safeName}`, data.nwsData.weather, data.highTemp, data.lowTemp, currentIdx >= 0 ? currentIdx : 0);
  });
}

<script>
// ===== CLEAN CANVAS CHART =====
function drawMergedChart(canvasId, cityData, dayHigh, dayLow) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width;
  const h = rect.height;
  const pad = { top: 6, right: 0, bottom: 6, left: 0 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const hourly = cityData.hourly || {};
  // Slice to 24 hours (current day only), convert temps to current unit
  const temps = (hourly.temperature_2m || []).slice(0, 24).map(v => convertTemp(v));
  const rain = (hourly.precipitation || []).slice(0, 24);
  const wind = (hourly.wind_speed_10m || []).slice(0, 24);

  if (temps.length === 0) return;

  const n = temps.length;
  const stepX = plotW / (n - 1 || 1);

  // Temp range - use day high/low when available
  const tempMin = (dayLow != null ? dayLow : Math.min(...temps)) - 2;
  const tempMax = (dayHigh != null ? dayHigh : Math.max(...temps)) + 2;
  const tempRange = tempMax - tempMin || 1;

  // Rain max
  const rainMax = Math.max(...rain, 0.5);

  // Wind max
  const windMax = Math.max(...wind, 1);

  // Draw grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 3; i++) {
    const y = pad.top + (plotH / 3) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + plotW, y);
    ctx.stroke();
  }

  // Temperature area fill
  const tempFillGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  tempFillGrad.addColorStop(0, 'rgba(255,140,66,0.25)');
  tempFillGrad.addColorStop(1, 'rgba(255,140,66,0.02)');

  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + (n - 1) * stepX, pad.top + plotH);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = tempFillGrad;
  ctx.fill();

  // Temperature line
  ctx.beginPath();
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#ff8c42';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Temperature dots
  temps.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + (1 - (v - tempMin) / tempRange) * plotH;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff8c42';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Rain bars (bottom)
  const rainH = plotH * 0.25;
  const rainY = pad.top + plotH - rainH;
  const barW = Math.max(2, stepX * 0.5);
  rain.forEach((v, i) => {
    const x = pad.left + i * stepX + (stepX - barW) / 2;
    const barH = (v / rainMax) * rainH;
    ctx.fillStyle = `rgba(77,166,255,${0.15 + (v / rainMax) * 0.35})`;
    ctx.fillRect(x, rainY + rainH - barH, barW, barH);
  });

  // Wind line (subtle)
  ctx.beginPath();
  wind.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / windMax) * (plotH * 0.15);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(125,217,160,0.3)';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Temp labels on left
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 3; i++) {
    const val = tempMax - (tempRange / 3) * i;
    const y = pad.top + (plotH / 3) * i;
    ctx.fillText(Math.round(val) + '°', pad.left + 17, y + 3);
  }

}

function drawCombinedChart(canvasId, cityData) {

    const y = pad.top + plotH - (v / 100) * plotH;

  });
  ctx.lineTo(pad.left + (n - 1) * stepX, pad.top + plotH);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = humGrad;
  ctx.fill();

  // Humidity line
  ctx.beginPath();
  hum.forEach((v, i) => {
    const x = pad.left + i * stepX;
    const y = pad.top + plotH - (v / 100) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });

  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

    const y = pad.top + plotH - (v / windMax) * plotH;

}

// ===== PARTICLE CANVAS =====
function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      opacity: Math.random() * 0.1 + 0.05,
    });
  }

  // Pause particles when the donkey runner game is active (reduces GPU compositing load)
  let animId = null;

  function animate() {
    if (animId) cancelAnimationFrame(animId);
    animId = null;

    function step() {
      animId = requestAnimationFrame(step);

      // Check if game is active — pause particles when game is running
      const isGameActive = typeof DONKEY_RUNNER !== 'undefined' && DONKEY_RUNNER && DONKEY_RUNNER.gameRunning;
      if (!isGameActive) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y -= p.speed;
          if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
          ctx.fill();
        });
      } else {
        // Clear canvas when paused to keep it clean (no particles drawn)
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    step();
  }
  animate();
}

        progressBar.style.transition = `width ${delay}ms linear`;
        progressBar.style.width = '100%';
      });
    });

// ===== RETRY CYCLE =====
function stopRetryCycle() {
  if (_retryInterval) {
    clearTimeout(_retryInterval);
    _retryInterval = null;
  }
}

function startRetryCycle() {
  let retryCount = 0;

  function attempt() {
    updateRetryStatus(retryCount);
    const timeout = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];

    // Use a fast fetch with abort timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), Math.min(timeout, 8000));

      cache: 'no-store',
      signal: controller.signal
    })
      .then(res => {
        clearTimeout(timeoutId);

          stopRetryCycle();

            const fn = _pendingRunFn;
            _pendingRunFn = null;
            fn();

        } else {
          throw new Error('Not OK');
        }
      })
      .catch(() => {

          ? RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)]

        _retryInterval = setTimeout(attempt, nextDelay);
      });

  _retryInterval = setTimeout(attempt, 800);
}

// ===== NETWORK CHECK =====
async function checkNetwork() {
  // Quick check 1: navigator.onLine (browser's offline flag)
  if (!navigator.onLine) return false;

  // Use google.com as it's extremely reliable
  const controller = new AbortController();

      cache: 'no-store',
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    const controller2 = new AbortController();

      return false;
    }
  }
