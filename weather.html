<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hasWeather</title>
<link rel="icon" href="hasWeather-low.png" type="image/png">
<style>
/* ===== main.css - Entry Point ===== */
/* This file imports all modular CSS components */
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 2rem;
  position: relative;
  z-index: 10;
}

.logo {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #fff;
}

.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: rgba(255,255,255,0.15); }
.btn:active { transform: scale(0.96); }
.btn-small { padding: 0.3rem 0.6rem; font-size: 0.85rem; }
.btn-primary {
  background: rgba(70,130,255,0.3);
  border-color: rgba(70,130,255,0.5);
  font-size: 1rem;
  padding: 0.6rem 1.2rem;
}

.location-display {
  margin-left: auto;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.6);
}

#refresh-btn.spinning {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Game toggle button */
#game-btn {
  background: rgba(100, 200, 100, 0.1);
  border-color: rgba(100, 200, 100, 0.2);
}

#game-btn:hover {
  background: rgba(100, 200, 100, 0.2);
}

#game-btn.active {
  background: rgba(100, 200, 100, 0.25);
  border-color: rgba(100, 200, 100, 0.4);
  box-shadow: 0 0 8px rgba(100, 200, 100, 0.2);
}

/* Source toggle button */
#source-toggle {
  font-weight: 600;
  letter-spacing: 0.02em;
}

#source-toggle.nws {
  background: rgba(70, 130, 255, 0.3);
  border-color: rgba(70, 130, 255, 0.5);
}

#source-toggle.nws:hover {
  background: rgba(70, 130, 255, 0.4);
}

#source-toggle.loading {
  animation: spin 1s linear infinite;
}

#source-toggle.disabled {
  background: rgba(128,128,128,0.1);
  border-color: rgba(128,128,128,0.2);
  color: rgba(255,255,255,0.3);
  cursor: not-allowed;
}

#source-toggle.disabled:hover {
  background: rgba(128,128,128,0.1);
}

#source-toggle.disabled:active {
  transform: none;
}
/* ===== CITY GRID ===== */
.city-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(280px, 1fr));
  gap: 1rem;
  padding: 1rem 2rem 2rem;
  position: relative;
  z-index: 1;
}

@media (max-width: 1400px) {
  .city-grid { grid-template-columns: repeat(3, minmax(280px, 1fr)); }
}
@media (max-width: 900px) {
  .city-grid { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
}
@media (max-width: 600px) {
  .city-grid { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; }
}/* ===== CITY CARD ===== */
.city-card {
  position: relative;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 1.2rem;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
  animation: fadeInUp 0.6s ease forwards;
  opacity: 0;
}
.city-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.city-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.4;
  transition: opacity 2s;
  z-index: -1;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}/* ===== CARD HEADER ===== */
.city-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.4rem;
  position: relative;
}
.city-name-wrap {
  display: flex;
  flex-direction: column;
  gap: 0;
  align-items: flex-end;
}
.city-name {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;
}
.city-state {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
  font-weight: 400;
  letter-spacing: 0.02em;
  text-align: right;
}
.city-meta {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.45);
}
.current-temp-inline {
  font-size: 2.4rem;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  z-index: 1;
}
.current-weather-icon-inline {
  width: 80px;
  height: 80px;
  position: absolute;
  top: -50%;
  left: 100%;
  transform: translate(-50%, -50%);
  opacity: 0.5;
  pointer-events: none;
  z-index: 0;
}

.current-weather {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 0.8rem;
}
.weather-icon {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}
.current-temp {
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1;
}
.current-weather-meta {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.55);
}

/* Source badge */
.source-badge {
  display: inline-block;
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.1rem 0.3rem;
  border-radius: 3px;
  margin-left: 0.3rem;
  vertical-align: middle;
  line-height: 1;
}
.source-badge.nws {
  background: rgba(70, 130, 255, 0.3);
  color: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(70, 130, 255, 0.4);
}
.source-badge.open-meteo {
  background: rgba(100, 200, 100, 0.3);
  color: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(100, 200, 100, 0.4);
}
/* Details row: HIGH / LOW / ☀️ / 🌙 */
.info-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.8rem;
  padding: 0.45rem 0.6rem;
  background: rgba(0,0,0,0.12);
  border-radius: 10px;
}
.info-item {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.info-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.4);
}
.info-val {
  font-size: 1.05rem;
  font-weight: 700;
}
.info-val.hot { color: #ff8c42; }
.info-val.cool { color: #6cb4ee; }

/* Details Grid */
.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
  padding: 0.6rem;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
}
.detail-cell {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.detail-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
}
.detail-value {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.aqi-badge {
  display: inline-block;
  padding: 0.1rem 0.3rem;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
}
.aqi-good { background: rgba(76,175,80,0.3); color: #81c784; }
.aqi-moderate { background: rgba(255,193,7,0.3); color: #ffd54f; }
.aqi-unhealthy { background: rgba(244,67,54,0.3); color: #e57373; }

/* High/Low + Sun */
.high-low-section {
  margin-bottom: 0.8rem;
  padding: 0.5rem;
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
}
.high-low-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.3rem;
}
.high-label { color: #ff8c42; font-weight: 700; }
.low-label  { color: #6cb4ee; font-weight: 700; }
.high-val, .low-val { font-weight: 700; }
.sun-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.55);
}/* Hourly Forecast */
.hourly-section {
  margin-bottom: 0.8rem;
}
.hourly-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.4rem;
}
.hourly-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(6, auto);
  gap: 0.3rem;
}
.hour-slot {
  text-align: center;
  padding: 0.4rem 0.3rem;
  border-radius: 8px;
  background: rgba(0,0,0,0.15);
  border: 1px solid transparent;
  transition: border-color 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hour-slot.current {
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08);
}
.hour-time {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.1rem;
}
.hour-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hour-icon .weather-svg {
  width: 48px;
  height: 48px;
}
.hour-temp {
  font-size: 0.8rem;
  font-weight: 600;
  margin-top: 0.15rem;
}
.hour-precip {
  font-size: 0.55rem;
  color: #6cb4ee;
  margin-top: 0.05rem;
}
.hour-wind {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.55);
  margin-top: 0.05rem;
}/* Canvas Charts */
.charts-section {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-bottom: 0.8rem;
}
.chart-title {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.4);
  margin-bottom: 0.15rem;
}
.chart-canvas {
  width: 100%;
  height: 100px;
  display: block;
  border-radius: 8px;
  background: rgba(0,0,0,0.12);
}

/* Chart stats row */
.chart-stats-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.4rem;
  margin-bottom: 0.3rem;
  background: rgba(0,0,0,0.15);
  border-radius: 6px;
}
.chart-stats-row .stat {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.05rem;
}
.chart-stats-row .stat-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.35);
}
.chart-stats-row .stat-val {
  font-size: 0.8rem;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
}

/* Overlaid charts container */
.overlaid-charts {
  position: relative;
  width: 100%;
  height: 80px;
  margin-bottom: 0.4rem;
}
.overlaid-charts canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 8px;
}

/* Charts group below header */
.charts-group {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  margin-bottom: 0.6rem;
}
.chart-row {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.chart-row-title {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.4);
  padding: 0 0.2rem;
}

/* Combined chart */
.combined-chart-row {
  position: relative;
  margin-bottom: 0.6rem;
}
.combined-chart-canvas {
  width: 100%;
  height: 80px;
  display: block;
  border-radius: 8px;
  background: rgba(0,0,0,0.12);
}
.combined-chart-stats {
  position: absolute;
  bottom: 4px;
  left: 8px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0.25rem 0.5rem;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  border-radius: 4px;
  z-index: 5;
}
.combined-chart-stats .stat-group {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.05rem;
}
.combined-chart-stats .stat-group-title {
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.05rem;
}
.combined-chart-stats .stat {
  display: flex;
  justify-content: center;
  gap: 0.15rem;
}
.combined-chart-stats .stat-label {
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.45);
  min-width: 12px;
}
.combined-chart-stats .stat-val {
  font-size: 0.7rem;
  font-weight: 700;
  color: rgba(255,255,255,0.95);
}
.combined-chart-stats .divider {
  width: 1px;
  background: rgba(255,255,255,0.1);
}

/* City compass row */
.city-compass-row {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
}/* ===== SVG WEATHER ICONS - LOUD & ANIMATED ===== */
.weather-svg {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.weather-svg .sun { stroke: #ffd54f; fill: #ffd54f; }
.weather-svg .moon { stroke: #e0e0e0; fill: #e0e0e0; }
.weather-svg .cloud { stroke: #b0bec5; fill: rgba(176,190,197,0.3); }
.weather-svg .rain { stroke: #64b5f6; fill: none; }
.weather-svg .snow { stroke: #e0e0e0; fill: none; }

/* Icon animation classes */
.weather-icon-animated {
  overflow: visible;
}

/* Sun: rotating rays + pulsing glow */
.weather-icon-sun .icon-glow {
  transform-origin: 32px 32px;
}
.weather-icon-sun .icon-rotate {
  transform-origin: 32px 32px;
  animation: icon-rotate 20s linear infinite;
}

@keyframes icon-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Moon: bobbing + twinkling stars */
.weather-icon-moon .icon-bob {
  animation: icon-bob 4s ease-in-out infinite;
}

@keyframes icon-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Cloud: drifting */
.weather-icon-cloud .icon-drift,
.weather-icon-cloud-sun .icon-drift,
.weather-icon-rain .icon-drift,
.weather-icon-snow .icon-drift,
.weather-icon-fog .icon-drift {
  animation: icon-drift 3s ease-in-out infinite;
}

@keyframes icon-drift {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(2px); }
}

/* Thunderstorm: shaking + lightning flash */
.weather-icon-thunder .icon-shake {
  animation: icon-shake 2s ease-in-out infinite;
}

@keyframes icon-shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  10% { transform: translateX(-1px) rotate(-1deg); }
  20% { transform: translateX(1px) rotate(1deg); }
  30% { transform: translateX(0); }
  40% { transform: translateX(-1px) rotate(-0.5deg); }
  50% { transform: translateX(0); }
}

.weather-icon-animated .icon-bolt {
  animation: icon-flash 2s ease-in-out infinite;
}

@keyframes icon-flash {
  0%, 100% { opacity: 1; }
  48% { opacity: 1; }
  50% { opacity: 0.3; }
  52% { opacity: 1; }
  70% { opacity: 1; }
  72% { opacity: 0.4; }
  74% { opacity: 1; }
}

/* Compass heading */
.compass-heading {
  display: inline-block;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.6);
  white-space: nowrap;
}

/* ===== WIND COMPASS ===== */
.wind-compass {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.wind-compass .compass-dial {
  display: inline-block;
  width: 20px;
  height: 20px;
  position: relative;
}
.wind-compass .compass-dial svg {
  width: 20px;
  height: 20px;
  display: block;
}
.wind-compass .compass-needle {
  transform-origin: 10px 10px;
  animation: needle-pulse 2s ease-in-out infinite;
}
@keyframes needle-pulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 2rem;
  min-width: 320px;
  animation: fadeInUp 0.3s ease;
}
.modal-card h2 {
  font-size: 1.2rem;
  margin-bottom: 1rem;
}
.modal-card input {
  width: 100%;
  padding: 0.6rem 0.8rem;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 1rem;
  margin-bottom: 0.8rem;
  outline: none;
}
.modal-card input:focus {
  border-color: rgba(70,130,255,0.6);
}
.modal-card .btn {
  width: 100%;
}

/* ===== LOADING ===== */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem;
  color: rgba(255,255,255,0.5);
  font-size: 1rem;
}/* ===== FAVORITES ===== */
.fav-star {
  color: #ffd54f;
  font-size: 1rem;
  margin-left: 0.35rem;
  vertical-align: middle;
  text-shadow: 0 0 8px rgba(255,213,79,0.6);
}

.fav-wrapper {
  position: relative;
}

#fav-btn.active {
  background: rgba(255,213,79,0.25);
  border-color: rgba(255,213,79,0.6);
  color: #ffd54f;
}

.fav-dropdown {
  position: absolute;
  top: calc(100% + 0.35rem);
  left: 0;
  width: 180px;
  max-height: 55vh;
  overflow-y: auto;
  background: rgba(20,20,30,0.95);
  backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 0;
  padding-bottom: 0.5rem;
  z-index: 200;
  display: none;
  animation: fadeInUp 0.2s ease;
  box-shadow: 0 12px 48px rgba(0,0,0,0.6);
}

.fav-dropdown.open { display: block; }

/* Scrollbar hidden - dropdown scrolls but never shows scrollbar */
.fav-dropdown::-webkit-scrollbar {
  display: none;
}
.fav-dropdown {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.fav-dropdown-search {
  width: 100%;
  padding: 0.35rem 0.4rem;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 0.68rem;
  outline: none;
  border-radius: 10px 10px 0 0;
}
.fav-dropdown-search::placeholder { color: rgba(255,255,255,0.3); }
.fav-dropdown-search:focus { border-color: rgba(255,213,79,0.3); }

.fav-section-title {
  font-size: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.28);
  padding: 0.3rem 0.4rem 0.15rem;
  font-weight: 600;
}

.fav-city-item {
  display: flex;
  flex-direction: column;
  padding: 0.25rem 0.4rem;
  cursor: pointer;
  transition: background 0.12s;
  color: rgba(255,255,255,0.85);
}
.fav-city-item:hover { background: rgba(255,255,255,0.06); }

.fav-city-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.2rem;
}

.fav-city-name {
  font-weight: 600;
  font-size: 0.7rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.fav-city-star {
  color: #ffd54f;
  font-size: 0.65rem;
  flex-shrink: 0;
  text-shadow: 0 0 6px rgba(255,213,79,0.5);
  line-height: 1;
}

.fav-city-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.2rem;
  margin-top: 0px;
}

.fav-city-region {
  font-size: 0.55rem;
  color: rgba(255,255,255,0.32);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.fav-city-remove {
  width: 14px;
  height: 14px;
  border: none;
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.35);
  border-radius: 2px;
  cursor: pointer;
  font-size: 0.55rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s, color 0.12s;
  line-height: 1;
  padding: 0;
}
.fav-city-remove:hover { background: rgba(244,67,54,0.3); color: #e57373; }

.fav-dropdown-settings {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 0.3rem 0.35rem;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.58rem;
  color: rgba(255,255,255,0.4);
  white-space: nowrap;
  background: rgba(20,20,30,0.98);
}

.fav-dropdown-settings input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: #ffd54f;
  height: 3px;
}

.fav-dropdown-settings .setting-val {
  font-weight: 700;
  color: #ffd54f;
  min-width: 12px;
  text-align: center;
}/* ===== NETWORK OUTAGE PANEL ===== */
.outage-panel {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 180;
  display: block;
  background: none;
  backdrop-filter: none;
  opacity: 0;
  pointer-events: none;
  bottom: 20px;
  top: auto;
  transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1), top 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

.outage-panel.outage-visible {
  opacity: 1;
  pointer-events: auto;
  animation: outageSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes outageSlideIn {
  from {
    transform: translateX(-50%) translateY(100vh);
    opacity: 0;
  }
  to {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
}

.outage-panel.outage-hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.outage-glass {
  background: rgba(20, 25, 40, 0.85);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid rgba(255, 100, 100, 0.2);
  border-radius: 24px;
  padding: 2rem 2.5rem;
  width: fit-content;
  min-width: 360px;
  max-width: 460px;
  margin: 0 auto;
  text-align: center;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.5),
    0 0 60px rgba(255, 80, 80, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* Donkey Icon */
.outage-donkey-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 1.2rem;
  animation: donkeyBounce 2s ease-in-out infinite;
}

.outage-donkey-svg {
  width: 100%;
  height: 100%;
}

.outage-donkey-svg .donkey-head {
  fill: rgba(180, 160, 140, 0.6);
  stroke: rgba(140, 120, 100, 0.8);
}

.outage-donkey-svg .donkey-ear {
  stroke: rgba(140, 120, 100, 0.8);
  stroke-width: 2;
}

.outage-donkey-svg .donkey-ear-inner {
  stroke: rgba(200, 140, 140, 0.5);
  stroke-width: 1.5;
}

.outage-donkey-svg .donkey-eye {
  fill: #1a1a2e;
  stroke: none;
}

.outage-donkey-svg .donkey-nostril {
  fill: rgba(100, 80, 70, 0.6);
  stroke: none;
}

.outage-donkey-svg .donkey-mouth {
  stroke: rgba(100, 80, 70, 0.7);
  stroke-width: 1.5;
  fill: none;
}

.outage-donkey-svg .donkey-man {
  stroke: rgba(80, 60, 50, 0.5);
  stroke-width: 2;
}

@keyframes donkeyBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-2deg); }
  75% { transform: translateY(-2px) rotate(2deg); }
}

/* Title */
.outage-title {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin: 0 0 1.5rem;
  animation: glitchText 3s infinite;
  background: linear-gradient(90deg, #ff6b6b, #ffa500, #ff6b6b, #ff4757, #ffa500);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes glitchText {
  0%, 90%, 100% {
    transform: translate(0);
    filter: none;
  }
  91% {
    transform: translate(-2px, 1px);
    filter: hue-rotate(90deg);
  }
  93% {
    transform: translate(2px, -1px);
    filter: hue-rotate(-90deg);
  }
  95% {
    transform: translate(-1px, -1px);
    filter: hue-rotate(0deg);
  }
  97% {
    transform: translate(1px, 1px);
  }
}

/* Glitch text area */
.outage-glitch {
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.2rem;
  position: relative;
}

.glitch-text {
  font-size: 1rem;
  line-height: 1.5;
  color: rgba(255, 200, 180, 0.9);
  font-weight: 500;
  animation: textFlicker 4s infinite;
}

@keyframes textFlicker {
  0%, 100% { opacity: 1; }
  5% { opacity: 0.85; }
  10% { opacity: 1; }
  50% { opacity: 1; }
  52% { opacity: 0.9; }
  54% { opacity: 1; }
}

/* Scanline overlay */
.outage-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
  pointer-events: none;
  border-radius: 24px;
}

/* Status indicator */
.outage-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.5);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4444;
  animation: pulse 1.5s ease-in-out infinite;
}

.status-dot.retrying {
  background: #ffa500;
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}

/* Progress bar */
.outage-progress {
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #ff6b6b, #ffa500);
  border-radius: 2px;
  transition: none;
}/* ===== DONKEY RUNNER MINIGAME ===== */
.donkey-panel {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 640px;
  max-width: 95vw;
  z-index: 200;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 60px rgba(100, 200, 100, 0.05);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  transform-origin: top center;
  will-change: transform, opacity;
}

.donkey-panel.donkey-visible {
  top: 80px;
  opacity: 1;
  pointer-events: auto;
}

.donkey-panel.donkey-hidden {
  top: -200px;
  opacity: 0;
  pointer-events: none;
}

/* Header - full width titlebar with scores */
.donkey-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 0.8rem;
  background: rgba(0, 0, 0, 0.35);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  gap: 0.6rem;
}

/* Touch-friendly buttons */
.donkey-panel-header button {
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.2);
  color: rgba(255, 255, 255, 0.85);
  min-width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  flex-shrink: 0;
}

.donkey-panel-header button:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.35);
}

.donkey-panel-header button:active {
  background: rgba(255, 255, 255, 0.3);
}

.donkey-close-btn {
  font-size: 1.1rem;
  font-weight: 700;
}

.donkey-close-btn:hover {
  background: rgba(239, 68, 68, 0.25);
  border-color: rgba(239, 68, 68, 0.5);
  color: #ef4444;
}

/* Score section (left side) */
.donkey-header-score {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}

/* Score display - 7-segment look */
.donkey-score {
  font-size: 1.8rem;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 0.08em;
  line-height: 1.1;
  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.3),
    0 2px 4px rgba(0, 0, 0, 0.5);
  font-family: 'Courier New', 'Lucida Console', monospace;
}

/* Title (center) */
.donkey-title {
  font-size: 0.7rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.05em;
  text-align: center;
  white-space: nowrap;
  flex-shrink: 0;
}

/* High score section (right side) */
.donkey-header-highscore {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}

/* High score display */
.donkey-highscore {
  font-size: 1.2rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.08em;
  line-height: 1.1;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
}

/* Body */
.donkey-panel-body {
  padding: 0.3rem 0.8rem 0.8rem;
}

/* Sound toggle button - muted state (inherits header button base styles) */
.donkey-sound-btn.muted {
  color: rgba(255, 255, 255, 0.35);
  opacity: 0.65;
}

/* Play area — canvas + overlays, positioned relative */
.donkey-play-area {
  position: relative;
  width: 100%;
  height: 180px;
  overflow: hidden;
}

/* Canvas inside play area */
#donkey-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}

#donkey-canvas:hover {
  box-shadow:
    0 0 15px rgba(100, 200, 100, 0.15),
    inset 0 0 15px rgba(100, 200, 100, 0.03);
  border-color: rgba(100, 200, 100, 0.25);
}

/* Start screen overlay (canvas area only, centered) */
.donkey-startscreen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10, 14, 24, 0.88);
  z-index: 5;
  padding: 1.2rem;
  text-align: center;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.donkey-startscreen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.ds-subtitle {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}

.ds-objective {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.25);
  line-height: 1.6;
  margin: 0 auto 1rem;
  text-align: center;
}

.ds-highscore {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  margin-bottom: 1rem;
  padding: 0.4rem 0.8rem;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.ds-highscore-label {
  font-size: 0.6rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 0.1em;
}

.ds-highscore-val {
  font-size: 0.9rem;
  font-weight: 900;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.08em;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
}

.ds-controls {
  margin-bottom: 0.7rem;
}

.ds-ctrl-row {
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.4);
  margin-bottom: 0.25rem;
  letter-spacing: 0.03em;
}

.ds-ctrl-row kbd {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 3px;
  padding: 1px 5px;
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.55);
}

.ds-prompt {
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.35);
  animation: startPromptBlink 1.8s ease-in-out infinite;
  letter-spacing: 0.04em;
}

@keyframes startPromptBlink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* Game over overlay (canvas area only) */
.donkey-gameover {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(5, 8, 16, 0.85);
  backdrop-filter: blur(3px);
  z-index: 10;
  transition: opacity 0.2s ease;
}

.donkey-gameover.hidden {
  opacity: 0;
  pointer-events: none;
}

/* GAME OVER title — the hero of the panel, big and dramatic */
.donkey-gameover-text {
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: 0.22em;
  color: #e05555;
  margin-bottom: 0.3rem;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 20px rgba(224, 85, 85, 0.6), 0 0 40px rgba(224, 85, 85, 0.3), 0 0 60px rgba(224, 85, 85, 0.15);
  animation: gameoverShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, gameoverPulse 2.5s ease-in-out 0.6s infinite;
}

@keyframes gameoverShake {
  0% { transform: scale(2) translateY(-20px); opacity: 0; }
  20% { transform: scale(1.4) translateY(5px); opacity: 0.8; }
  40% { transform: scale(1.1) translateY(-3px); opacity: 1; }
  60% { transform: scale(1.02) translateY(1px); }
  80% { transform: scale(0.99) translateY(-1px); }
  100% { transform: scale(1) translateY(0); }
}

@keyframes gameoverPulse {
  0%, 100% { text-shadow: 0 0 20px rgba(224, 85, 85, 0.6), 0 0 40px rgba(224, 85, 85, 0.3), 0 0 60px rgba(224, 85, 85, 0.15); }
  50% { text-shadow: 0 0 30px rgba(224, 85, 85, 0.8), 0 0 50px rgba(224, 85, 85, 0.4), 0 0 80px rgba(224, 85, 85, 0.2); }
}

/* Score — prominent but not overpowering the GAME OVER text */
.donkey-gameover-score {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 0.6rem;
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}

/* New high score badge — clean, compact */
.donkey-gameover-new {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 0.5rem;
  padding: 0.15rem 0.5rem;
  background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), rgba(74, 222, 128, 0.08));
  border: 1px solid rgba(74, 222, 128, 0.3);
  border-radius: 20px;
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #4ade80;
  animation: newBadgePulse 1.5s ease-in-out 0.6s infinite;
}

.donkey-gameover-new.hidden {
  display: none;
}

.donkey-gameover-new-label {
  letter-spacing: 0.12em;
}

.donkey-gameover-new-score {
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: #4ade80;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
}

@keyframes newBadgePulse {
  0%, 100% { box-shadow: 0 0 8px rgba(74, 222, 128, 0.1); }
  50% { box-shadow: 0 0 16px rgba(74, 222, 128, 0.25); }
}

/* Corner stat blocks — compact, no overlap with center heroes */
.donkey-gameover-stats-top-left,
.donkey-gameover-stats-top-right,
.donkey-gameover-stats-bottom-left,
.donkey-gameover-stats-bottom-right {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
  padding: 0.25rem 0.4rem;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 4px;
}

.donkey-gameover-stats-top-left {
  left: 8px;
  top: 8px;
}

.donkey-gameover-stats-top-right {
  right: 8px;
  top: 8px;
}

.donkey-gameover-stats-bottom-left {
  left: 8px;
  bottom: 8px;
}

.donkey-gameover-stats-bottom-right {
  right: 8px;
  bottom: 8px;
}

/* Corner stat row */
.donkey-gameover-stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.4rem;
  line-height: 1.1;
}

/* Corner stat label — right-aligned for left blocks, left-aligned for right blocks */
.donkey-gameover-stat-label {
  font-size: 0.35rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
  text-align: right;
}

.donkey-gameover-stats-top-right .donkey-gameover-stat-label,
.donkey-gameover-stats-bottom-right .donkey-gameover-stat-label {
  text-align: left;
}

.donkey-gameover-stat-value {
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.65);
  font-family: 'Courier New', 'Lucida Console', monospace;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
}

/* Restart text — the other hero, big and inviting */
.donkey-restart-text {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.4);
  animation: restartBlink 2s ease-in-out infinite;
  letter-spacing: 0.08em;
  margin-top: 0.5rem;
}

@keyframes restartBlink {
  0%, 100% { opacity: 0.3; transform: translateY(0); }
  50% { opacity: 0.6; transform: translateY(-2px); }
}

/* Score milestone flash */
@keyframes milestoneFlash {
  0% { color: rgba(255, 255, 255, 0.9); }
  30% { color: #4ade80; text-shadow: 0 0 12px rgba(74, 222, 128, 0.5); transform: scale(1.1); }
  100% { color: rgba(255, 255, 255, 0.9); transform: scale(1); }
}

.donkey-score.milestone-flash {
  animation: milestoneFlash 0.3s ease-out;
}

/* Near-miss flash text overlay */
.donkey-near-miss {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.15em;
  color: #4ade80;
  text-shadow: 0 0 12px rgba(74, 222, 128, 0.6), 0 0 24px rgba(74, 222, 128, 0.3);
  z-index: 8;
  pointer-events: none;
  opacity: 0;
  transition: none;
}

.donkey-near-miss.flash {
  animation: nearMissFlash 0.5s ease-out forwards;
}

@keyframes nearMissFlash {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(0.8); }
}

/* Bonus text (e.g., +50 NEAR MISS) */
.donkey-bonus-text {
  position: absolute;
  top: 50%;
  left: 55%;
  transform: translate(-50%, -50%);
  font-size: 0.6rem;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.1em;
  color: #f59e0b;
  text-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
  z-index: 8;
  pointer-events: none;
  opacity: 0;
}

.donkey-bonus-text.flash {
  animation: bonusFlash 0.7s ease-out forwards;
}

@keyframes bonusFlash {
  0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
  100% { opacity: 0; transform: translate(-50%, -50%) translateY(-25px); }
}

/* Property damage bonus text animation — positioned at obstacle, green, prominent */
.property-damage-bonus {
  position: absolute;
  font-size: 0.9rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.1em;
  color: #4ade80;
  text-shadow: 0 0 8px rgba(74, 222, 128, 0.8), 0 0 16px rgba(74, 222, 128, 0.4), 0 0 24px rgba(74, 222, 128, 0.2);
  z-index: 9;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.5);
}

.property-damage-bonus.active {

<script>
// ===== DATA CACHE =====
// Unified cache for ALL API calls with configurable TTL per type and LRU eviction
const DataCache = {
  // Default: max number of cache entries per type before LRU eviction kicks in
  MAX_ENTRIES_PER_TYPE: 500,

  // TTLs in milliseconds
  TTL: {
    weather: 15 * 60 * 1000,      // 15 minutes
    airQuality: 15 * 60 * 1000,   // 15 minutes
    geocode: 24 * 60 * 60 * 1000, // 24 hours
    nearby: 10 * 60 * 1000,       // 10 minutes
    ipLocation: 24 * 60 * 60 * 1000, // 24 hours
    nwsPoint: 15 * 60 * 1000,     // 15 minutes
    nwsForecast: 10 * 60 * 1000,  // 10 minutes
    nwsHourly: 5 * 60 * 1000,     // 5 minutes
    nwsCurrent: 10 * 60 * 1000,   // 10 minutes
    nwsObservation: 5 * 60 * 1000, // 5 minutes
    nwsAlerts: 2 * 60 * 1000,     // 2 minutes
    nwsZoneForecast: 10 * 60 * 1000, // 10 minutes
    nwsCityData: 10 * 60 * 1000,   // 10 minutes (NWS city data)
    nwsStations: 30 * 60 * 1000,   // 30 minutes (observation stations)
    nwsObsLatest: 5 * 60 * 1000,   // 5 minutes (latest observation from station)
    nwsObsHistorical: 5 * 60 * 1000, // 5 minutes (historical observation)
    nwsProducts: 10 * 60 * 1000,   // 10 minutes (text products)
    nwsAviation: 10 * 60 * 1000,   // 10 minutes (aviation data)
    nwsRadar: 5 * 60 * 1000,       // 5 minutes (radar data)
    nwsGrid: 10 * 60 * 1000,       // 10 minutes (raw gridpoint data)
    nwsZone: 15 * 60 * 1000,       // 15 minutes (zone metadata)
    nwsCounty: 15 * 60 * 1000,     // 15 minutes (county metadata)
    nwsOffice: 15 * 60 * 1000,     // 15 minutes (office metadata)
    nwsActiveAlerts: 2 * 60 * 1000, // 2 minutes (active alerts)
    nwsAlertTypes: 60 * 60 * 1000,  // 60 minutes (alert type list)
    nwsProductTypes: 60 * 60 * 1000, // 60 minutes (product type list)
    nwsProductLocations: 60 * 60 * 1000, // 60 minutes (product location list)
    nwsRadarServers: 60 * 60 * 1000, // 60 minutes (radar server list)
    nwsRadarStations: 60 * 60 * 1000, // 60 minutes (radar station list)
    nwsGlossary: 24 * 60 * 60 * 1000, // 24 hours (glossary)
    nwsOffices: 15 * 60 * 1000,    // 15 minutes (office list)
  },

  // Round coordinates to 2 decimal places (~1km accuracy) for cache key grouping
  _roundCoord(coord) {
    return Math.round(coord * 100) / 100;
  },

  // Get the LRU list key for a cache type
  _lruKey(type) {
    return `hasw_lru_${type}`;
  },

  // Get the LRU list for a type (array of keys, most-recently-used first)
  _getLruList(type) {
    try {
      const raw = localStorage.getItem(this._lruKey(type));
      if (!raw) return [];
      const list = JSON.parse(raw);
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  },

  // Set the LRU list for a type
  _setLruList(type, list) {
    try {
      localStorage.setItem(this._lruKey(type), JSON.stringify(list));
    } catch (e) {
      // ignore LRU write failures
    }
  },

  // Evict least-recently-used entries when the cache exceeds the limit
  _evictIfNecessary(type) {
    try {
      const maxEntries = this.MAX_ENTRIES_PER_TYPE;
      const lruList = this._getLruList(type);
      if (lruList.length <= maxEntries) return;

      // Remove the oldest entries (they're at the end of the LRU list)
      const toRemove = lruList.splice(0, lruList.length - maxEntries);
      for (const key of toRemove) {
        localStorage.removeItem(`hasw_cache_${key}`);
        console.log(`[DataCache] EVICTED (LRU): ${key}`);
      }
      this._setLruList(type, lruList);
    } catch (e) {
      // ignore eviction failures
    }
  },

  // Move a key to the front of the LRU list (most-recently-used)
  _touchLru(type, key) {
    try {
      const lruList = this._getLruList(type);
      const idx = lruList.indexOf(key);
      if (idx !== -1) {
        lruList.splice(idx, 1); // remove from current position
      }
      lruList.unshift(key); // move to front
      this._setLruList(type, lruList);
    } catch (e) {
      // ignore LRU touch failures
    }
  },

  // Check if a cache entry exists and is not expired
  has(key, type) {
    try {
      const raw = localStorage.getItem(`hasw_cache_${key}`);
      if (!raw) {
        console.log(`[DataCache] MISS (not found): ${key}`);
        return false;
      }
      const entry = JSON.parse(raw);
      // Validate type matches (always check, even when type is falsy — skip only for backward compat)
      if (type != null && entry.type !== type) {
        console.log(`[DataCache] MISS (type mismatch): ${key} (expected: ${type}, got: ${entry.type})`);
        return false;
      }
      // Use entry.type for TTL lookup when type is null, to avoid undefined TTL
      const ttlKey = type != null ? type : entry.type;
      const expired = !entry || (Date.now() - entry.timestamp > this.TTL[ttlKey]);
      if (expired) {
        console.log(`[DataCache] MISS (expired): ${key} (type: ${ttlKey})`);
        return false;
      }
      console.log(`[DataCache] HIT: ${key} (type: ${type})`);
      return true;
    } catch (e) {
      console.log(`[DataCache] MISS (error): ${key}`);
      return false;
    }
  },

  // Get cached data (returns null if expired/missing/wrong type)
  get(key, type) {
    try {
      const raw = localStorage.getItem(`hasw_cache_${key}`);
      if (!raw) {
        console.log(`[DataCache] MISS (not found): ${key}`);
        return null;
      }
      const entry = JSON.parse(raw);
      // Validate type matches (always check, even when type is falsy — skip only for backward compat)
      if (type != null && entry.type !== type) {
        console.log(`[DataCache] MISS (type mismatch): ${key} (expected: ${type}, got: ${entry.type})`);
        return null;
      }
      // Use entry.type for TTL lookup when type is null, to avoid undefined TTL
      const ttlKey = type != null ? type : entry.type;
      if (Date.now() - entry.timestamp > this.TTL[ttlKey]) {
        console.log(`[DataCache] MISS (expired): ${key} (type: ${ttlKey}, age: ${Math.round((Date.now() - entry.timestamp) / 1000)}s, ttl: ${this.TTL[ttlKey] / 1000}s)`);
        localStorage.removeItem(`hasw_cache_${key}`);
        return null;
      }
      console.log(`[DataCache] HIT: ${key} (type: ${type}, age: ${Math.round((Date.now() - entry.timestamp) / 1000)}s)`);
      this._touchLru(type, key);
      return entry.data;
    } catch (e) {
      console.log(`[DataCache] MISS (parse error): ${key}`, e);
      return null;
    }
  },

  // Store data with timestamp and type
  set(key, data, type) {
    try {
      const size = new Blob([JSON.stringify({ timestamp: Date.now(), type: type, data: data })]).size;
      console.log(`[DataCache] SET: ${key} (type: ${type}, size: ${Math.round(size / 100)} / 100B)`);
      localStorage.setItem(`hasw_cache_${key}`, JSON.stringify({
        timestamp: Date.now(),
        type: type,
        data: data
      }));
      this._touchLru(type, key);
      this._evictIfNecessary(type);
    } catch (e) {
      console.log(`[DataCache] SET FAILED: ${key} - ${e.message}`);
    }
  },

  // Invalidate a specific cache key
  invalidate(key) {
    console.log(`[DataCache] INVALIDATE: ${key}`);
    localStorage.removeItem(`hasw_cache_${key}`);
  },

};

</script>
<script>
// ===== FAVORITES MANAGER (place_id-based) =====
const FavoritesManager = {
  _idsKey: 'hasW_favorites',
  _detailsKey: 'hasW_favDetails',

  // Get array of favorited place_id strings
  getIds() {
    try { return JSON.parse(localStorage.getItem(this._idsKey) || '[]'); }
    catch { return []; }
  },

  // Get details map { place_id -> {name, state, lat, lon} }
  getDetails() {
    try { return JSON.parse(localStorage.getItem(this._detailsKey) || '{}'); }
    catch { return {}; }
  },

  has(placeId, lat, lon) {
    // Check by place_id first
    if (this.getIds().includes(String(placeId))) return true;

    // If coordinates are provided, also check by coordinate proximity (0.01° tolerance ≈ 1km)
    if (lat != null && lon != null) {
      const latRounded = Math.round(lat * 100) / 100;
      const lonRounded = Math.round(lon * 100) / 100;
      const details = this.getDetails();
      for (const [id, entry] of Object.entries(details)) {
        const existingLat = Math.round(entry.latitude * 100) / 100;
        const existingLon = Math.round(entry.longitude * 100) / 100;
        if (Math.abs(latRounded - existingLat) < 0.01 && Math.abs(lonRounded - existingLon) < 0.01) {
          return true;
        }
      }
    }
    return false;
  },

  add(placeId, name, state, lat, lon) {
    const ids = this.getIds();
    const details = this.getDetails();

    // Check for coordinate-based duplicates before adding (0.01° tolerance ≈ 1km)
    const latRounded = Math.round(lat * 100) / 100;
    const lonRounded = Math.round(lon * 100) / 100;
    for (const [id, entry] of Object.entries(details)) {
      const existingLat = Math.round(entry.latitude * 100) / 100;
      const existingLon = Math.round(entry.longitude * 100) / 100;
      if (Math.abs(latRounded - existingLat) < 0.01 && Math.abs(lonRounded - existingLon) < 0.01) {
        // Same city by coordinates, update the existing entry instead of adding a duplicate
        details[id] = { name, state, latitude: lat, longitude: lon };
        localStorage.setItem(this._idsKey, JSON.stringify(ids));
        localStorage.setItem(this._detailsKey, JSON.stringify(details));
        return;
      }
    }

    // No coordinate match found, add as new
    if (!ids.includes(String(placeId))) {
      ids.push(String(placeId));
      details[String(placeId)] = { name, state, latitude: lat, longitude: lon };
      localStorage.setItem(this._idsKey, JSON.stringify(ids));
      localStorage.setItem(this._detailsKey, JSON.stringify(details));
    }
  },

  remove(placeId) {
    const ids = this.getIds();
    const details = this.getDetails();
    
    // First try to remove by place_id
    const filteredIds = ids.filter(id => id !== String(placeId));
    const filteredDetails = { ...details };
    delete filteredDetails[String(placeId)];
    
    // If nothing was removed, check by coordinate proximity (0.01° tolerance ≈ 1km)
    if (filteredIds.length === ids.length) {
      // Find the city to remove by place_id from details
      const cityToRemove = details[String(placeId)];
      if (cityToRemove && cityToRemove.latitude != null && cityToRemove.longitude != null) {
        const latRounded = Math.round(cityToRemove.latitude * 100) / 100;
        const lonRounded = Math.round(cityToRemove.longitude * 100) / 100;
        for (const [id, entry] of Object.entries(filteredDetails)) {
          const existingLat = Math.round(entry.latitude * 100) / 100;
          const existingLon = Math.round(entry.longitude * 100) / 100;
          if (Math.abs(latRounded - existingLat) < 0.01 && Math.abs(lonRounded - existingLon) < 0.01) {
            // Found coordinate match, remove this entry
            filteredIds.splice(filteredIds.indexOf(id), 1);
            delete filteredDetails[id];
            break;
          }
        }
      }
    }
    
    localStorage.setItem(this._idsKey, JSON.stringify(filteredIds));
    localStorage.setItem(this._detailsKey, JSON.stringify(filteredDetails));
  },

  // Get all favorite city objects (includes place_id)
  getAll() {
    const ids = this.getIds();
    const details = this.getDetails();
    return ids.map(id => {
      const d = details[id];
      return d ? { ...d, place_id: id } : null;
    }).filter(Boolean);
  },
};

<script>
// ===== UTILITY FUNCTIONS =====
function toF(c) { return c * 9 / 5 + 32; }
function toC(f) { return (f - 32) * 5 / 9; }
function convertTemp(celsius) {
  if (celsius == null || celsius !== celsius) return NaN;
  return unit === 'F' ? toF(celsius) : toC(celsius);
}
function tempUnit() { return unit === 'F' ? '°F' : '°C'; }

function escapeHTML(str) {
  if (typeof str !== 'string') return str;
  return str
    .replace(/&/g, '\u0026amp;')
    .replace(/</g, '\u0026lt;')
    .replace(/>/g, '\u0026gt;')
    .replace(/"/g, '\u0026quot;')
    .replace(/'/g, '\u0026#039;');
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = EARTH_RADIUS_MI;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
            Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
  let b = Math.atan2(y, x) * 180 / Math.PI;
  return (b + 360) % 360;
}

function bearingToCompass(deg) {
  const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function aqiLabel(aqi) {
  if (aqi === null || aqi === undefined || aqi === false || aqi !== aqi) return { label: '—', cls: '' };
  if (aqi <= 50) return { label: 'Good', cls: 'aqi-good' };
  if (aqi <= 100) return { label: 'Moderate', cls: 'aqi-moderate' };
  return { label: 'Unhealthy', cls: 'aqi-unhealthy' };
}

<script>
// ===== OPEN-METEO API CLIENT =====
// Fetches weather data and air quality from Open-Meteo APIs.

// ===== ENDPOINTS =====
const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
const AIR_QUALITY_API = 'https://air-quality-api.open-meteo.com/v1/air-quality';

// ===== CROSS-SOURCE LOOKUP FUNCTIONS =====
// These functions allow fetching data from alternate source caches when needed.

function crossSourceGetWeather(lat, lon) {
  // Try OM weather key
  const omWeather = DataCache.get(weatherCacheKey(lat, lon), 'weather');
  if (omWeather) return { data: omWeather, source: 'open-meteo' };

  // Try NWS city data key (which contains full weather object)
  const nwsCityData = DataCache.get(nwsCacheKey(lat, lon), 'nwsCityData');
  if (nwsCityData && nwsCityData.weather) return { data: nwsCityData, source: 'nws' };

  // Try NWS point cache key (which contains full weather object)
  const nwsPoint = DataCache.get(nwsPointCacheKey(lat, lon), 'nwsPoint');
  if (nwsPoint && nwsPoint.weather) return { data: nwsPoint, source: 'nws' };

  return null;
}

function crossSourceGetAQI(lat, lon) {
  // Try OM AQI key
  const omAqi = DataCache.get(aqiCacheKey(lat, lon), 'airQuality');
  if (omAqi) return { data: omAqi, source: 'open-meteo' };

  // Try NWS city data key (which may have AQI)
  const nwsCityData = DataCache.get(nwsCacheKey(lat, lon), 'nwsCityData');
  if (nwsCityData && nwsCityData.aqi) return { data: nwsCityData.aqi, source: 'nws' };

  return null;
}

// ===== CACHE KEY HELPERS =====
function weatherCacheKey(lat, lon) {
  return `weather_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

function aqiCacheKey(lat, lon) {
  return `airQuality_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// ===== RETRY HELPER =====
// Retry a fetch with exponential backoff
async function retryWithBackoff(fn, maxRetries = 3, baseDelay = 1000) {
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const result = await fn();
      return result;
    } catch (err) {
      if (attempt === maxRetries) throw err;
      const delay = baseDelay * Math.pow(2, attempt);
      console.log(`[retry] Attempt ${attempt + 1}/${maxRetries + 1} failed, retrying in ${delay}ms`);
      await new Promise(r => setTimeout(r, delay));
    }
  }
}

// ===== OPEN-METEO SPECIFIC HELPERS =====
// Known keys that are NOT hourly variable data
const KNOWN_NON_HOURLY_KEYS = new Set([
  'latitude', 'longitude', 'elevation',
  'generationtime_ms', 'utc_offset_seconds',
  'timezone', 'timezone_abbreviation',
  'current', 'hourly'
]);

// Helper: extract hourly variable keys from a raw response object
function extractHourlyKeys(raw) {
  return Object.keys(raw).filter(k =>
    KNOWN_NON_HOURLY_KEYS.has(k) === false &&
    Array.isArray(raw[k]) &&
    raw[k].length > 0 &&
    typeof raw[k][0] !== 'object'
  );
}

// ===== DEDUPLICATION =====
// Deduplicate city results by coordinate pair (keep first entry per coordinate pair)
// Prefer entries with a non-null place_id when there's a tie
function deduplicateResults(results) {
  const seenCoords = new Map();
  const deduped = [];
  for (const entry of results) {
    const lat = entry.latitude != null ? DataCache._roundCoord(entry.latitude) : null;
    const lon = entry.longitude != null ? DataCache._roundCoord(entry.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(entry);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    let isDup = false;
    for (const [existingKey, existingEntry] of seenCoords) {
      const [exLat, exLon] = existingKey.split(',').map(Number);
      if (Math.abs(lat - exLat) < 0.01 && Math.abs(lon - exLon) < 0.01) {
        isDup = true;
        // Prefer the entry with a non-null place_id
        if (!existingEntry.place_id && entry.place_id) {
          seenCoords.set(existingKey, entry);
          const dupIdx = deduped.findIndex(d => d === existingEntry);
          if (dupIdx !== -1) deduped[dupIdx] = entry;
        }
        break;
      }
    }
    if (!isDup) {
      seenCoords.set(coordKey, entry);
      deduped.push(entry);
    }
  }
  return deduped;
}

// Deduplicate cities by coordinate pair (for deduplication BEFORE the API call)
function deduplicateCities(cities) {
  const seenCoords = new Set();
  const deduped = [];
  for (const city of cities) {
    const lat = city.latitude != null ? DataCache._roundCoord(city.latitude) : null;
    const lon = city.longitude != null ? DataCache._roundCoord(city.longitude) : null;
    if (lat == null || lon == null) {
      deduped.push(city);
      continue;
    }
    const coordKey = `${lat},${lon}`;
    if (!seenCoords.has(coordKey)) {
      seenCoords.add(coordKey);
      deduped.push(city);
    }
  }
  return deduped;
}

// ===== FETCH WEATHER FOR CITIES =====
async function fetchWeatherForCities(cities) {
  // Check cache for each city individually — use cross-source lookup
  const cachedResults = [];
  const uncachedCities = [];
  const cityCacheMap = []; // map city index to its position in uncachedCities

  for (let i = 0; i < cities.length; i++) {
    const weatherCk = weatherCacheKey(cities[i].latitude, cities[i].longitude);
    const aqiCk = aqiCacheKey(cities[i].latitude, cities[i].longitude);
    const cachedWeather = DataCache.get(weatherCk, 'weather');
    const cachedAqi = DataCache.get(aqiCk, 'airQuality');
    // Cross-source: also check NWS keys for OM lookup
    const crossSource = crossSourceGetWeather(cities[i].latitude, cities[i].longitude);
    if (cachedWeather) {
      cachedResults.push({ ...cities[i], source: 'open-meteo', weather: cachedWeather, aqi: cachedAqi || {} });
    } else if (crossSource && crossSource.data.weather) {
      // NWS data can serve as OM weather data (it has the same structure)
      const crossAqi = crossSourceGetAQI(cities[i].latitude, cities[i].longitude);
      cachedResults.push({ ...cities[i], source: crossSource.source, weather: crossSource.data.weather, aqi: crossAqi?.data || {} });
    } else {
      cityCacheMap.push(i);
      uncachedCities.push(cities[i]);
    }
  }

  // If all cached, apply deduplication before returning
  if (uncachedCities.length === 0) {
    return deduplicateResults(cachedResults);
  }

  // ===== FIX #1: Deduplicate BEFORE caching =====
  // Only unique coordinate pairs should be fetched from the API
  const dedupedUncached = deduplicateCities(uncachedCities);

  // Build combined weather + AQI URL for deduplicated uncached cities only
  try {
    const weatherUrl = `${WEATHER_API}?latitude=${dedupedUncached.map(c => c.latitude).join(',')}&longitude=${dedupedUncached.map(c => c.longitude).join(',')}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index,visibility&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&forecast_days=2&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=auto`;

    // ===== FIX #5: Retry logic for weather API =====
    const weatherRes = await retryWithBackoff(() => fetch(weatherUrl));

    if (!weatherRes.ok) {
      // Fill uncached with null data
      for (const idx of cityCacheMap) {
        cachedResults[idx] = { ...cities[idx], weather: null, aqi: {} };
      }
      return deduplicateResults(cachedResults);
    }

    const weatherAll = await weatherRes.json();

    const aqiUrl = `${AIR_QUALITY_API}?latitude=${dedupedUncached.map(c => c.latitude).join(',')}&longitude=${dedupedUncached.map(c => c.longitude).join(',')}&current=us_aqi,pm2_5,european_aqi&timezone=auto`;
    // ===== FIX #5: Retry logic for AQI API =====
    const aqiRes = await retryWithBackoff(() => fetch(aqiUrl));
    const aqiData = await aqiRes.json();

    const result = new Array(cities.length);

    // First fill cached results (use get directly — it already handles expiration internally)
    for (let i = 0; i < cities.length; i++) {
      const weatherCk = weatherCacheKey(cities[i].latitude, cities[i].longitude);
      const aqiCk = aqiCacheKey(cities[i].latitude, cities[i].longitude);
      const entryWeather = DataCache.get(weatherCk, 'weather');
      const entryAqi = DataCache.get(aqiCk, 'airQuality');
      if (entryWeather) {
        result[i] = { ...cities[i], source: 'open-meteo', weather: entryWeather, aqi: entryAqi || {} };
      }
    }

    // Parse weather response — Open-Meteo returns a flat object when single lat/lon,
    // or an object with 'results' array when multiple lat/lon values are provided.
    const hasResultsArray = weatherAll && Array.isArray(weatherAll.results);

    // Parse AQI response — same pattern: flat for single, 'results' array for multiple
    const hasAqiResultsArray = aqiData && Array.isArray(aqiData.results);

    let wIdx = 0; // index into weatherAll.results / aqiData.results
    for (let i = 0; i < cities.length; i++) {
      // Skip already-cached
      if (result[i]) continue;

      const city = cities[i];
      let cityWeather;
      let aqiResult;

      if (hasResultsArray) {
        const raw = weatherAll.results[wIdx] || {};
        // ===== FIX #4: Clean up hourly variable extraction =====
        const rawHourlyKeys = extractHourlyKeys(raw);
        const mergedHourly = raw.hourly ? { ...raw.hourly } : { time: [] };
        rawHourlyKeys.forEach(k => {
          const val = raw[k];
          if (Array.isArray(val) && val.length > 0 && typeof val[0] !== 'object') {
            mergedHourly[k] = val;
          }
        });
        cityWeather = {
          current: raw.current || {},
          hourly: mergedHourly,
        };

        // AQI from results array
        if (hasAqiResultsArray) {
          const aqiRaw = aqiData.results[wIdx] || {};
          aqiResult = {
            us_aqi: aqiRaw.current?.us_aqi ?? aqiRaw.us_aqi ?? null,
            pm2_5: aqiRaw.current?.pm2_5 ?? aqiRaw.pm2_5 ?? null,
            european_aqi: aqiRaw.current?.european_aqi ?? aqiRaw.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }

        wIdx++;
      } else if (Array.isArray(weatherAll)) {
        // Fallback: weatherAll is an array of individual results
        const raw = weatherAll[i] || {};
        cityWeather = {
          current: raw.current || {},
          hourly: raw.hourly || { time: [] },
        };
        if (Array.isArray(aqiData)) {
          const aqiRaw = aqiData[i] || {};
          aqiResult = {
            us_aqi: aqiRaw.current?.us_aqi ?? aqiRaw.us_aqi ?? null,
            pm2_5: aqiRaw.current?.pm2_5 ?? aqiRaw.pm2_5 ?? null,
            european_aqi: aqiRaw.current?.european_aqi ?? aqiRaw.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }
      } else {
        // Single result (no results array)
        const raw = weatherAll;
        cityWeather = {
          current: raw.current || {},
          hourly: raw.hourly || { time: [] },
        };
        if (aqiData && !hasAqiResultsArray) {
          aqiResult = {
            us_aqi: aqiData.current?.us_aqi ?? aqiData.us_aqi ?? null,
            pm2_5: aqiData.current?.pm2_5 ?? aqiData.pm2_5 ?? null,
            european_aqi: aqiData.current?.european_aqi ?? aqiData.european_aqi ?? null,
          };
        } else {
          aqiResult = { us_aqi: null, pm2_5: null, european_aqi: null };
        }
      }

      // Use separate cache keys for weather and AQI
      const weatherCk = weatherCacheKey(city.latitude, city.longitude);
      const aqiCk = aqiCacheKey(city.latitude, city.longitude);
      DataCache.set(weatherCk, cityWeather, 'weather');
      DataCache.set(aqiCk, aqiResult, 'airQuality');

      result[i] = { ...city, source: 'open-meteo', weather: cityWeather, aqi: aqiResult };
    }

    return deduplicateResults(result);
  } catch {
    // Fill uncached with null data
    const result = new Array(cities.length);
    for (let i = 0; i < cities.length; i++) {
      const weatherCk = weatherCacheKey(cities[i].latitude, cities[i].longitude);
      const aqiCk = aqiCacheKey(cities[i].latitude, cities[i].longitude);
      if (DataCache.has(weatherCk, 'weather')) {
        const entryWeather = DataCache.get(weatherCk, 'weather');
        const entryAqi = DataCache.get(aqiCk, 'airQuality');
        result[i] = { ...cities[i], source: 'open-meteo', weather: entryWeather, aqi: entryAqi || {} };
      } else {
        result[i] = { ...cities[i], source: 'open-meteo', weather: null, aqi: {} };
      }
    }
    return result;
  }
}

<script>
// ===== OPENSTREETMAP / NOMINATIM API CLIENT =====
// Fetches nearby city data from Nominatim/OSM.

// ===== ENDPOINT =====
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';

// ===== NOMINATIM CONSTANTS =====
const NOMINATIM_CLOSE_RADIUS = 0.45;
const NOMINATIM_WIDE_RADIUS = 1.0;

// ===== HELPER: Scale viewbox for Nominatim =====
function scaleViewbox(lat, lon, radiusDeg) {
  const south = (lat - radiusDeg).toFixed(4);
  const north = (lat + radiusDeg).toFixed(4);
  const west = (lon - radiusDeg).toFixed(4);
  const east = (lon + radiusDeg).toFixed(4);
  return `${west},${north},${east},${south}`;
}

// ===== FIND NEARBY CITIES =====
async function findNearbyCities(lat, lon) {
  // Handle _maxCities === 0
  if (_maxCities === 0) return [];

  // Check in-memory cache first
  if (_nearbyCache && Date.now() - _nearbyCacheTime < NEARBY_CACHE_TTL_MS) {
    return _nearbyCache;
  }

  // Check localStorage cache
  const cacheKey = `nearby_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
  const cached = DataCache.get(cacheKey, 'nearby');
  if (cached) {
    _nearbyCache = cached;
    _nearbyCacheTime = Date.now();
    return cached;
  }

  // Fetch a larger set first so we can filter and still have enough
  let viewbox = scaleViewbox(lat, lon, NOMINATIM_CLOSE_RADIUS);
  let url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=30&addressdetails=1`;

  let results;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Nominatim ${resp.status}`);
    results = await resp.json();
  } catch {
    results = [];
  }

  // Filter: keep only towns/cities/villages/hamlets/localities, reject boundary/fuel/street/country
  if (results.length > 0) {
    const acceptableTypes = ['city','town','village','hamlet','suburb','quarter','neighbourhood','locality','isolated_dwelling','farmhouse','county','administrative'];
    results = results.filter(r => {
      const type = (r.type || '').toLowerCase();
      const cls = (r.class || '').toLowerCase();
      // Reject known non-city types
      if (cls === 'boundary' && r.place_rank >= 4) return false;
      if (type === 'country' || type === 'state' || type === 'administrative') return false;
      if (type === 'fuel' || type === 'street' || type === 'residential') return false;
      // Accept if rank 10-16 (typical city/town/village)
      if (r.place_rank >= 10 && r.place_rank <= 16) return true;
      // Accept if type looks like a populated place
      return acceptableTypes.includes(type);
    });
  }

  if (results.length < _maxCities) {
    viewbox = scaleViewbox(lat, lon, NOMINATIM_WIDE_RADIUS);
    url = `${NOMINATIM}?q=city&format=jsonv2&viewbox=${viewbox}&bounded=1&limit=50&addressdetails=1`;
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const extra = await resp.json();
        const existingIds = new Set(results.map(r => r.place_id));
        const existingNames = new Set(results.map(r => (r.name || '').toLowerCase().trim()));
        extra.forEach(r => {
          // Skip if same place_id OR same name at same coordinates (dedup by name+coords)
          if (existingIds.has(r.place_id)) return;
          const latMatch = Math.abs(parseFloat(r.lat) - parseFloat(results[0]?.lat || 0)) < 0.01;
          const sameName = existingNames.has((r.name || '').toLowerCase().trim()) && latMatch;
          if (sameName) return;
          const type = (r.type || '').toLowerCase();
          const cls = (r.class || '').toLowerCase();
          if (cls === 'boundary' && r.place_rank >= 4) return;
          if (type === 'country' || type === 'state' || type === 'administrative') return;
          if (type === 'fuel' || type === 'street' || type === 'residential') return;
          if (r.place_rank >= 10 && r.place_rank <= 16) {
            results.push(r);
            existingIds.add(r.place_id);
            existingNames.add((r.name || '').toLowerCase().trim());
          }
        });
      }
    } catch {
      // silently ignore
    }
  }

  if (results.length === 0) {
    if (_maxCities > 0) showLocationPrompt();
    return [];
  }

  const cities = results.map(item => {
    const address = item.address || {};
    let name = item.name || address.city || '';
    // International region fallback chain
    let state = address.state || address.state_district || address.region || address.county || '';
    let country = address.country || '';
    name = name.replace(/^City of\s+/i, '');

    return {
      place_id: String(item.place_id),
      name,
      latitude: parseFloat(item.lat),
      longitude: parseFloat(item.lon),
      state,
      country,
      distance: haversine(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
      bearing: bearing(lat, lon, parseFloat(item.lat), parseFloat(item.lon)),
    };
  });

  // Deduplicate by place_id AND by name+coordinate proximity
  const seen = new Set();
  const deduped = cities.filter(c => {
    if (seen.has(c.place_id)) return false;
    // Also check by name + coordinates (within 0.01° ≈ 1km)
    const nameKey = c.name.toLowerCase().trim();
    const coordKey = `${DataCache._roundCoord(c.latitude)},${DataCache._roundCoord(c.longitude)}`;
    for (const existing of seen) {
      if (existing.name === nameKey && existing.coordKey === coordKey) {
        return false;
      }
    }
    seen.add({ name: nameKey, coordKey, place_id: c.place_id });
    return true;
  });

  deduped.sort((a, b) => a.distance - b.distance);

  // Select cities with bearing diversity and min distance
  const selected = [deduped[0]];
  const used = new Set([0]);
  const remaining = deduped.filter((_, i) => !used.has(i));
  remaining.sort((a, b) => {
    const aMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(a.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    const bMinDiff = Math.min(...selected.map(s => {
      let diff = Math.abs(b.bearing - s.bearing);
      return diff > 180 ? 360 - diff : diff;
    }));
    return bMinDiff - aMinDiff;
  });

  for (const city of remaining) {
    if (selected.length >= _maxCities) break;
    let tooClose = false;
    for (const sel of selected) {
      const dist = haversine(city.latitude, city.longitude, sel.latitude, sel.longitude);
      if (dist < MIN_CITY_DISTANCE_MI) { tooClose = true; break; }
    }
    if (!tooClose) {
      selected.push(city);
      used.add(deduped.indexOf(city));
    }
  }

  // Fill remaining slots if we still need more
  for (let i = 0; i < deduped.length && selected.length < _maxCities; i++) {
    if (!used.has(i)) selected.push(deduped[i]);
  }

  _nearbyCache = selected;
  _nearbyCacheTime = Date.now();

  // Store in localStorage cache
  DataCache.set(cacheKey, selected, 'nearby');

  return selected;
}

<script>
// ===== IP-BASED LOCATION API CLIENT =====
// Provides fallback geolocation via ipinfo.io.

// ===== ENDPOINT =====
const IP_API = 'https://ipinfo.io/json';

// ===== GET LOCATION (Browser Geolocation + IP Fallback) =====
async function getLocation() {
  // Check in-memory cache
  if (userLocation) return userLocation;

  // Check localStorage cache for IP geolocation
  const cachedIP = DataCache.get('ip_location', 'ipLocation');
  if (cachedIP) {
    return cachedIP;
  }

  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: GEOLOCATION_TIMEOUT_MS });
    });
    const { latitude, longitude } = pos.coords;
    const loc = { lat: latitude, lon: longitude };
    // Cache browser geolocation briefly (it's not reliable to cache long-term)
    return loc;
  } catch {
    try {
      const res = await fetch(IP_API);
      const data = await res.json();
      const lat = parseFloat(data.loc?.split(',')[0] ?? data.lat);
      const lon = parseFloat(data.loc?.split(',')[1] ?? data.lon);
      const loc = { lat, lon };
      // Cache IP location for 24 hours
      DataCache.set('ip_location', loc, 'ipLocation');
      return loc;
    } catch {
      showLocationPrompt();
      return { lat: 43.41947, lon: -83.95081 };
    }
  }
}

<script>
// ===== NWS API CLIENT =====
// Fetches weather data from api.weather.gov (NWS) and maps it to the app's data model.

const NWS_API = 'https://api.weather.gov';
const NWS_USER_AGENT = 'hasWeather/1.0 (https://github.com/Yonneh0/hasWeather)';

// NWS forecast period descriptions mapped to WMO weather codes
// Maps shortForecast keywords to WMO codes that drive existing SVG icons
function nwsForecastToWmo(shortForecast) {
  const text = (shortForecast || '').toLowerCase();

  // Clear/sky conditions
  if (/clear|sunny|fair/.test(text)) return 0;
  if (/mainly clear|mostly clear/.test(text)) return 1;
  if (/partly cloudy|partly sunny|mostly sunny/.test(text)) return 2;
  if (/overcast|cloudy/.test(text)) return 3;

  // Fog
  if (/fog|mist|haze/.test(text)) return 45;

  // Drizzle
  if (/drizzle/.test(text)) return 53;

  // Rain
  if (/rain/.test(text)) {
    if (/heavy|violent|intense/.test(text)) return 65;
    if (/moderate/.test(text)) return 63;
    return 61;
  }

  // Freezing rain
  if (/freezing rain|freezing drizzle/.test(text)) return 57;

  // Snow
  if (/snow/.test(text)) {
    if (/heavy|intense/.test(text)) return 75;
    if (/moderate/.test(text)) return 73;
    return 71;
  }

  // Snow grains
  if (/snow grains|snow pellets/.test(text)) return 77;

  // Showers
  if (/shower/.test(text)) {
    if (/heavy|violent|intense/.test(text)) return 82;
    if (/moderate/.test(text)) return 81;
    return 80;
  }

  // Thunderstorm
  if (/thunderstorm|thunder/.test(text)) return 95;

  // Default: overcast
  return 3;
}

// Map NWS weather array items to WMO codes
function nwsWeatherToWmo(weatherArray) {
  if (!weatherArray || !Array.isArray(weatherArray) || weatherArray.length === 0) return 0;

  // Find the most severe weather event
  const priority = [
    'tornado', 'severe thunderstorm', 'severe thunderstorms', 'tstm',
    'thunderstorm', 'thunder', 'hail', 'hail',
    'heavy rain', 'rain', 'heavy showers', 'showers',
    'freezing rain', 'freezing drizzle',
    'snow', 'heavy snow', 'snow showers',
    'drizzle',
    'fog', 'mist', 'haze',
  ];

  for (const condition of priority) {
    if (condition.includes(' ')) {
      // Multi-word condition
      for (const item of weatherArray) {
        const icon = (item.icon || '').toLowerCase();
        if (icon.includes(condition.toLowerCase())) {
          return nwsForecastToWmo(condition);
        }
      }
    }
  }

  // Fallback: check individual weather icon keywords
  for (const item of weatherArray) {
    const icon = (item.icon || '').toLowerCase();
    if (icon.includes('tornado')) return 99;
    if (icon.includes('thunderstorm')) return 95;
    if (icon.includes('rain')) return 63;
    if (icon.includes('snow')) return 73;
    if (icon.includes('drizzle')) return 53;
    if (icon.includes('fog')) return 45;
  }

  return 0;
}

// Build a NWS cache key for a point
function nwsPointCacheKey(lat, lon) {
  return `nws_point_${DataCache._roundCoord(lat)}_${DataCache._roundCoord(lon)}`;
}

// Build a NWS cache key for gridpoint data
function nwsGridCacheKey(wfo, x, y) {
  return `nws_grid_${wfo}_${x}_${y}`;
}

// ===== NWS RATE LIMITER =====
// NWS API limit: 1 request/second, burst of 3
const _nwsRateLimiter = {
  queue: [],
  lastRequestTime: 0,
  burstCount: 0,
  burstWindow: 0,
  maxBurst: 3,
  burstWindowMs: 1000,
  minIntervalMs: 1000,

  _checkBurst() {
    const now = Date.now();
    if (now - this.burstWindow > this.burstWindowMs) {
      this.burstCount = 0;
      this.burstWindow = now;
    }
    return this.burstCount < this.maxBurst;
  },

  _waitForBurst() {
    return new Promise(resolve => {
      const check = () => {
        if (this._checkBurst()) resolve();
        else setTimeout(check, 50);
      };
      check();
    });
  },

  async waitForSlot() {
    const now = Date.now();
    const timeSinceLast = now - this.lastRequestTime;

    // If we're within the burst window and at max burst, wait
    if (timeSinceLast < this.burstWindowMs && !this._checkBurst()) {
      await this._waitForBurst();
    }

    // Ensure minimum interval between requests
    if (timeSinceLast < this.minIntervalMs) {
      await new Promise(r => setTimeout(r, this.minIntervalMs - timeSinceLast));
    }

    this.burstCount++;
    this.burstWindow = Date.now();
    this.lastRequestTime = Date.now();
  },
};

// Fetch with User-Agent header, rate limiting, and retry logic
async function nwsFetch(url, maxRetries = 3) {
  // Rate limit: wait for available slot
  await _nwsRateLimiter.waitForSlot();

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000); // 10s timeout

  try {
    const response = await fetch(url, {
      headers: { 'User-Agent': NWS_USER_AGENT },
      signal: controller.signal,
    });

    // Handle 429 rate limiting with exponential backoff
    if (response.status === 429) {
      if (maxRetries <= 0) throw new Error('NWS API rate limited (429)');
      const waitMs = Math.pow(2, 3 - maxRetries) * 2000; // 16s, 8s, 4s
      console.log(`[NWS] Rate limited, waiting ${waitMs}ms before retry`);
      await new Promise(r => setTimeout(r, waitMs));
      return await nwsFetch(url, maxRetries - 1);
    }

    if (!response.ok) {
      throw new Error(`NWS API error: ${response.status}`);
    }
    return await response.json();
  } finally {
    clearTimeout(timeout);
  }
}

// Step 1: Resolve a lat/lon to a WFO grid
async function resolvePoint(lat, lon) {
  const cacheKey = nwsPointCacheKey(lat, lon);
  const cached = DataCache.get(cacheKey, 'nwsPoint');
  if (cached) return cached;

  const url = `${NWS_API}/points/${lat},${lon}`;
  const data = await nwsFetch(url);

  const props = data?.properties || {};
  const result = {
    wfo: props.gridId || props.cwa,
    gridX: props.gridX,
    gridY: props.gridY,
    forecastZone: props.forecastZone,
    county: props.county,
    fireWeatherZone: props.fireWeatherZone,
    timeZone: props.timeZone,
    radarStation: props.radarStation,
    observationStations: props.observationStations,
    forecast: props.forecast,
    forecastHourly: props.forecastHourly,
    forecastGridData: props.forecastGridData,
  };

  DataCache.set(cacheKey, result, 'nwsPoint');
  return result;
}

  const url = `${NWS_API}/gridpoints/${wfo}/${x},${y}/forecast?units=us`;

  const periods = (data?.properties?.periods || []).map(p => ({
    number: p.number,

    isDaytime: p.isDaytime,
    temperature: p.temperature,
    temperatureUnit: p.temperatureUnit,
    temperatureTrend: p.temperatureTrend,
    probabilityOfPrecipitation: p.probabilityOfPrecipitation?.value ?? null,
    // NWS returns dewpoint in Celsius even with units=us
    dewpoint: p.dewpoint?.value != null ? convertObsTempToF(p.dewpoint.value, p.dewpoint.unitCode) : null,
    dewpointUnit: p.dewpoint?.unitCode == null ? 'F' : p.dewpoint.unitCode,
    // windSpeed is a string like "10 mph" - parse to number
    windSpeed: parseWindSpeedString(p.windSpeed),
    windSpeedUnit: 'mph',
    // windGust is a string like "20 mph" - parse to number
    windGust: parseWindSpeedString(p.windGust),
